name: Veille éditoriale des apprentissages

on:
  schedule:
    - cron: "20 7 * * 1" # chaque lundi, 7 h 20 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "docs/rd-innovation-continue.md"
      - "docs/rd/**"
      - "outils/verifier-rd-continue.py"
      - ".github/ISSUE_TEMPLATE/proposition-rd.yml"
      - "docs/rd-parcours-apprentissage.md"
      - "docs/apprentissage/**"
      - "docs/rd-ia-usages-fraudes.md"
      - "transparence.html"
      - "anglais-aventure.html"
      - "ia-societe.html"
      - "outils/construire-apprentissages.py"
      - "apprendre.html"
      - "apprendre/fiches/**"
      - ".github/workflows/veille-apprentissages.yml"

permissions:
  contents: read
  issues: write

jobs:
  veille:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Contrôler les fiches, le plan des 1 000 et les pages locales
        id: verification
        continue-on-error: true
        run: |
          python3 -m py_compile outils/construire-apprentissages.py outils/verifier-site-statique.py
          python3 outils/construire-apprentissages.py --verifier --rapport "$RUNNER_TEMP/veille-apprentissages.md"
          python3 outils/verifier-site-statique.py

      - name: Vérifier le portefeuille et les skills R&D des agents
        id: verification-rd
        continue-on-error: true
        run: |
          python3 -m py_compile outils/verifier-rd-continue.py
          python3 outils/verifier-rd-continue.py --rapport "$RUNNER_TEMP/veille-rd-continue.md"

      - name: Ajouter les rapports au résumé de l’exécution
        if: always()
        run: |
          {
            echo "## Veille éditoriale des apprentissages"
            echo
            echo "Contrôle des métadonnées, sources, dates, couverture, sorties générées, portefeuille d'initiatives et skills réutilisables par les agents."
            echo
            echo "La veille automatique ne parcourt pas le Web et ne valide pas les connaissances. Elle signale les dates de revue et vérifie le passage de relais; les sources et contenus sensibles demandent une lecture humaine, au minimum tous les 90 jours pour les fiches de sécurité numérique."
            echo
            if [ "${{ steps.verification.outcome }}" = "success" ] && [ "${{ steps['verification-rd'].outcome }}" = "success" ]; then
              echo "**Résultat technique : contrôles structurels réussis; lire les éventuelles alertes d’échéance ci-dessous.**"
            else
              echo "**Résultat technique : contrôle en échec — vérifier les erreurs ci-dessous et le rapport.**"
            fi
            echo
            if [ -f "$RUNNER_TEMP/veille-apprentissages.md" ]; then
              cat "$RUNNER_TEMP/veille-apprentissages.md"
            else
              echo "Le rapport d’apprentissage n’a pas pu être créé. Vérifier la compilation et le générateur."
            fi
            echo
            echo "## Portefeuille R&D et skills des agents"
            if [ -f "$RUNNER_TEMP/veille-rd-continue.md" ]; then
              cat "$RUNNER_TEMP/veille-rd-continue.md"
            else
              echo "Le rapport R&D n’a pas pu être créé. Vérifier la compilation et le contrôle du portefeuille."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Créer ou actualiser l’issue unique de suivi
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Veille éditoriale des apprentissages — lacunes et révisions
        run: |
          set -euo pipefail
          rapport="$RUNNER_TEMP/veille-apprentissages-issue.md"
          {
            echo "<!-- Mise à jour automatique par .github/workflows/veille-apprentissages.yml -->"
            echo
            echo "Rapport généré le $(date -u +%F). [Consulter cette exécution]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [ "${{ steps.verification.outcome }}" = "success" ] && [ "${{ steps['verification-rd'].outcome }}" = "success" ]; then
              echo "**Contrôles structurels réussis.** Lire aussi les éventuelles alertes d’échéance dans le rapport; les lacunes sont des sujets de travail, pas un défaut de validation."
            else
              echo "**Le contrôle technique a échoué.** Corriger les erreurs de validation avant de traiter les évolutions éditoriales."
            fi
            echo
            echo "---"
            echo
            if [ -f "$RUNNER_TEMP/veille-apprentissages.md" ]; then
              cat "$RUNNER_TEMP/veille-apprentissages.md"
            else
              echo "Le rapport automatique d'apprentissage est indisponible ; consulter le journal du workflow."
            fi
            echo
            echo "---"
            echo
            if [ -f "$RUNNER_TEMP/veille-rd-continue.md" ]; then
              cat "$RUNNER_TEMP/veille-rd-continue.md"
            else
              echo "Le rapport du portefeuille R&D est indisponible ; consulter le journal du workflow."
            fi
          } > "$rapport"

          # Un dépôt sans issues activées ne peut pas recevoir l'issue de veille.
          # Ce n'est pas un défaut des contrôles, qui ont déjà tourné : le rapport reste dans le
          # résumé de l'exécution, et l'étape s'arrête proprement au lieu
          # d'échouer — une alerte toujours rouge finit par ne plus être lue.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)" != "true" ]; then
            {
              echo "### Issue de suivi non publiée"
              echo
              echo "Les issues sont désactivées sur \`$GITHUB_REPOSITORY\`. Le rapport ci-dessus reste dans le résumé de cette exécution ; réactiver les issues dans **Settings → General → Features** rétablira l'issue de suivi unique."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Issues désactivées : rapport non publié (conservé dans le résumé de l'exécution)."
            exit 0
          fi

          numero="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "Veille éditoriale des apprentissages"' \
            --json number,title \
            --limit 100 \
            | python3 -c 'import json, os, sys; title=os.environ["ISSUE_TITLE"]; items=json.load(sys.stdin); print(next((item["number"] for item in items if item["title"] == title), ""))')"

          if [ -n "$numero" ]; then
            gh issue edit "$numero" --repo "$GITHUB_REPOSITORY" --body-file "$rapport"
            echo "Issue de veille #$numero actualisée."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$rapport"
          fi

      - name: Échouer le workflow si la vérification a détecté un problème
        if: steps.verification.outcome == 'failure' || steps['verification-rd'].outcome == 'failure'
        run: exit 1
