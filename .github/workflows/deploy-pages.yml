name: Publish M.R.S.C site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for generated-page checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile the Python modules
        run: python3 -m py_compile simulateur/*.py api/*.py outils/*.py

      - name: Validate generated learning pages
        shell: bash
        run: |
          output="$RUNNER_TEMP/learning-pages-verification.log"
          if python3 outils/construire-apprentissages.py --verifier --rapport "$RUNNER_TEMP/veille-apprentissages.md" >"$output" 2>&1; then
            cat "$output"
          else
            status=$?
            cat "$output"
            tail -n 12 "$output" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error title=Learning-pages verification::%s\n' "$line"
            done
            exit "$status"
          fi

      - name: Validate the generated simulator page
        run: python3 outils/construire-simulateur.py --verifier

      - name: Validate the reusable R&D advances
        run: |
          python3 outils/test_avancees.py
          python3 outils/construire-avancees.py --verifier

      - name: Validate the R&D portfolio
        run: python3 outils/verifier-rd-continue.py

      - name: Validate the mechanical audit and the human review register
        run: |
          python3 outils/auditer-prototypes.py --verifier
          python3 outils/registre-relecture.py
          python3 outils/test_sources_refusees.py
          python3 outils/construire-sources-refusees.py --verifier

      # La fiche est publiée : ses chiffres le sont aussi. Le contrôle tourne donc
      # à la publication et pas seulement sur les pull requests, comme les
      # garde-fous d'affichage depuis le 25 octobre 2026.
      - name: Validate that dated rates carry their date
        run: |
          python3 outils/test_verifier_taux_dates.py
          python3 outils/verifier-taux-dates.py

      - name: Validate the editorial protocol
        run: python3 outils/test_protocole_editorial.py

      - name: Validate separation of personal content
        run: |
          python3 outils/test_separation_contenus.py
          python3 outils/verifier-separation-contenus.py

      - name: Validate static pages, links and scripts
        run: python3 outils/verifier-site-statique.py

      # Les garde-fous de format portent aussi l'attribution exigée par la
      # licence sur une copie imprimée (source, adresse, statut). Ils ne
      # tournaient que sur les pull requests : une fusion rapide ou une poussée
      # directe sur `main` pouvait publier une page qui ne la porte plus.
      # La publication vérifie donc ses propres règles, comme le reste.
      - name: Validate the display and printed-copy guards
        run: |
          python3 outils/verifier-affichages.py
          python3 outils/test_mutations_affichages.py

      - name: Validate the published file set
        run: python3 outils/verifier-publication-locale.py

      - name: Validate the recorded served-file measurement
        run: |
          python3 outils/test_fichiers_servis.py
          python3 outils/verifier-fichiers-servis.py

      # Le contrôle réseau du périmètre ne peut pas tourner hors ligne : ce test
      # vérifie qu'il mord, en simulant un hébergement qui publie la racine du
      # dépôt. Sans lui, une régression du contrôle lui-même passerait inaperçue.
      - name: Validate the publication-perimeter check
        run: python3 outils/test_verifier_publication.py

      - name: Validate image variants
        run: python3 outils/optimiser-images.py --verifier

      - name: Validate estimated page weight
        run: python3 outils/verifier-poids-pages.py

      - name: Validate security boundaries
        run: python3 outils/verifier-securite.py

      - name: Validate site and simulator integration
        run: python3 outils/verifier-integration.py

      # `enablement: true` crée le site Pages s'il n'existe pas encore.
      # Sans cette option, une publication sur un dépôt où Pages n'est pas
      # activé échoue au lieu de créer le site, et l'adresse publique répond
      # 404 « There isn't a GitHub Pages site here » (cas du 25 octobre 2026).
      # La source doit rester « GitHub Actions » : réglée sur « Deploy from a
      # branch », GitHub Pages publie la racine du dépôt — donc `docs/`,
      # `outils/`, `api/`, `README.md` et `AGENTS.md`, hors périmètre.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulateur _site/apprendre
          # Publier la présentation prudente d’ÉVA, explicitement identifiée comme proposition à relire.
          # favicon.ico est référencé par les 94 pages : sans lui, chaque page du site publié
          # demandait un fichier absent et l’onglet restait sans icône.
          cp index.html apprendre.html anglais-aventure.html ia-societe.html eva.html simulateur.html documents.html liens-utiles.html localisation.html nous-contacter.html transparence.html confidentialite.html 404.html sitemap.xml llms.txt favicon.ico _site/
          cp -R assets _site/assets
          # Fiches autonomes publiques ; les sources TOML restent dans docs/.
          cp -R apprendre/fiches _site/apprendre/fiches
          # Page publiée du simulateur (générée depuis le moteur) et sa provenance.
          # Les sources Python du moteur ne sont pas publiées sur les Pages.
          cp simulateur/index.html simulateur/PROVENANCE.json _site/simulateur/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
