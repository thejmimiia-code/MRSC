name: Publish M.R.S.C site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Python for generated-page checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generated pages, internal links and scripts
        run: |
          python3 -m py_compile outils/construire-apprentissages.py outils/construire-simulateur.py outils/verifier-site-statique.py
          python3 outils/construire-apprentissages.py --verifier
          python3 outils/construire-simulateur.py --verifier
          python3 outils/verifier-site-statique.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulateur _site/apprendre
          cp index.html apprendre.html ia-societe.html simulateur.html documents.html liens-utiles.html localisation.html nous-contacter.html transparence.html confidentialite.html 404.html sitemap.xml _site/
          cp -R assets _site/assets
          # Fiches autonomes publiques ; les sources TOML restent dans docs/.
          cp -R apprendre/fiches _site/apprendre/fiches
          # Page publiée du simulateur (générée depuis le moteur) et sa provenance.
          # Les sources Python du moteur ne sont pas publiées sur les Pages.
          cp simulateur/index.html simulateur/PROVENANCE.json _site/simulateur/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
