name: Publish M.R.S.C site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulateur
          cp index.html ia-societe.html simulateur.html documents.html liens-utiles.html localisation.html nous-contacter.html transparence.html 404.html _site/
          cp -R assets _site/assets
          # Page publiée du simulateur (générée depuis le moteur) et sa provenance.
          # Les sources Python du moteur ne sont pas publiées sur les Pages.
          cp simulateur/index.html simulateur/PROVENANCE.json _site/simulateur/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
