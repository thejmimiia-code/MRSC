name: Publish M.R.S.C site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for generated-page checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile the Python modules
        run: python3 -m py_compile simulateur/*.py api/*.py outils/*.py

      - name: Validate generated learning pages
        shell: bash
        run: |
          output="$RUNNER_TEMP/learning-pages-verification.log"
          if python3 outils/construire-apprentissages.py --verifier --rapport "$RUNNER_TEMP/veille-apprentissages.md" >"$output" 2>&1; then
            cat "$output"
          else
            status=$?
            cat "$output"
            tail -n 12 "$output" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error title=Learning-pages verification::%s\n' "$line"
            done
            exit "$status"
          fi

      - name: Validate the generated simulator page
        run: python3 outils/construire-simulateur.py --verifier

      - name: Validate the reusable R&D advances
        run: |
          python3 outils/test_avancees.py
          python3 outils/construire-avancees.py --verifier

      - name: Validate the R&D portfolio
        run: python3 outils/verifier-rd-continue.py

      - name: Validate the mechanical audit and the human review register
        run: |
          python3 outils/auditer-prototypes.py --verifier
          python3 outils/registre-relecture.py

      - name: Validate the editorial protocol
        run: python3 outils/test_protocole_editorial.py

      - name: Validate static pages, links and scripts
        run: python3 outils/verifier-site-statique.py

      - name: Validate the published file set
        run: python3 outils/verifier-publication-locale.py

      - name: Validate image variants
        run: python3 outils/optimiser-images.py --verifier

      - name: Validate estimated page weight
        run: python3 outils/verifier-poids-pages.py

      - name: Validate security boundaries
        run: python3 outils/verifier-securite.py

      - name: Validate site and simulator integration
        run: python3 outils/verifier-integration.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulateur _site/apprendre
          # Publier la présentation prudente d’ÉVA, explicitement identifiée comme proposition à relire.
          # favicon.ico est référencé par les 94 pages : sans lui, chaque page du site publié
          # demandait un fichier absent et l’onglet restait sans icône.
          cp index.html apprendre.html anglais-aventure.html ia-societe.html eva.html simulateur.html documents.html liens-utiles.html localisation.html nous-contacter.html transparence.html confidentialite.html 404.html sitemap.xml llms.txt favicon.ico _site/
          cp -R assets _site/assets
          # Fiches autonomes publiques ; les sources TOML restent dans docs/.
          cp -R apprendre/fiches _site/apprendre/fiches
          # Page publiée du simulateur (générée depuis le moteur) et sa provenance.
          # Les sources Python du moteur ne sont pas publiées sur les Pages.
          cp simulateur/index.html simulateur/PROVENANCE.json _site/simulateur/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
