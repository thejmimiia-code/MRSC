name: Publish M.R.S.C site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python for generated-page checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate generated pages, internal links and scripts
        run: |
          python3 -m py_compile simulateur/*.py api/*.py outils/*.py
          python3 outils/construire-apprentissages.py --verifier
          python3 outils/construire-simulateur.py --verifier
          python3 outils/verifier-rd-continue.py
          python3 outils/verifier-site-statique.py
          python3 outils/verifier-securite.py
          python3 outils/verifier-integration.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulateur _site/apprendre
          cp index.html apprendre.html anglais-aventure.html ia-societe.html simulateur.html documents.html liens-utiles.html localisation.html nous-contacter.html transparence.html confidentialite.html 404.html sitemap.xml _site/
          cp -R assets _site/assets
          # Fiches autonomes publiques ; les sources TOML restent dans docs/.
          cp -R apprendre/fiches _site/apprendre/fiches
          # Page publiée du simulateur (générée depuis le moteur) et sa provenance.
          # Les sources Python du moteur ne sont pas publiées sur les Pages.
          cp simulateur/index.html simulateur/PROVENANCE.json _site/simulateur/

      - name: Upload the static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
