name: Vérifier les en-têtes servis par l’hébergement

# Contrôle réseau volontairement séparé de la porte hors ligne :
# il interroge le site publié, relève type MIME, encodage et cache,
# et publie le tableau dans le résumé du run. Un échec signale un fichier
# manquant ou injoignable, pas une qualité de rendu.

on:
  # La lecture suit la publication : elle interroge la version réellement servie,
  # sans courir contre le déploiement. Chaque poussée sur `main` publie le site,
  # donc un changement du contrôleur ou de ses cibles relance bien la lecture.
  # (Un déclenchement sur `push` échouait à tort : il interrogeait l'ancienne
  # version du site pendant que la nouvelle se déployait.)
  workflow_run:
    workflows: ["Publish M.R.S.C site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base-url:
        description: "Racine publiée à contrôler (terminée par /)"
        required: false
        default: "https://thejmimiia-code.github.io/MRSC/"
        type: string
  # Quotidien plutôt que mensuel : une dépublication du site (source Pages
  # désactivée, site dépublié, dépôt repassé en privé) se voit alors en moins
  # d'un jour. Le 20 octobre 2026, le site a répondu 404 « There isn't a GitHub
  # Pages site here » sans qu'aucune mesure ne le signale avant une lecture
  # manuelle.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: verifier-publication
  cancel-in-progress: true

jobs:
  entetes:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile the checker
        run: python3 -m py_compile outils/verifier-publication.py

      - name: Read public headers
        shell: bash
        env:
          BASE_URL: ${{ inputs.base-url || 'https://thejmimiia-code.github.io/MRSC/' }}
        run: |
          set -uo pipefail
          rapport="$RUNNER_TEMP/entetes-publics.md"
          python3 outils/verifier-publication.py --base-url "$BASE_URL" --tentatives 3 --attente 20 | tee "$rapport"
          statut=${PIPESTATUS[0]}
          {
            echo "## En-têtes servis pour $BASE_URL"
            echo
            cat "$rapport"
            if [ "$statut" -ne 0 ]; then
              echo
              echo "> Contrôle incomplet : au moins un fichier ne répond pas 200. Relancer après vérification de la publication."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$statut"

      # Une seule issue de suivi, volontairement laissée ouverte : elle est
      # réécrite à chaque mesure au lieu d’être recréée. La fermer ne
      # l’archiverait pas, elle ferait ouvrir une nouvelle issue au passage
      # suivant. La date de chaque mesure reste notée en bas du corps, pour
      # qu’on puisse dire depuis quand un état est stable.
      - name: Publier le rapport dans une issue de suivi
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "En-têtes servis par l’hébergement — rapport"
          BASE_URL: ${{ inputs.base-url || 'https://thejmimiia-code.github.io/MRSC/' }}
        run: |
          set -euo pipefail
          rapport="$RUNNER_TEMP/entetes-publics.md"
          corps="$RUNNER_TEMP/entetes-issue.md"
          {
            echo "Rapport automatique du $(date -u '+%Y-%m-%d %H:%M UTC') pour <$BASE_URL>."
            echo
            if [ -f "$rapport" ]; then
              cat "$rapport"
            else
              echo "Le tableau est indisponible ; consulter le journal du run."
            fi
            echo
            echo "---"
            echo
            echo "Ce rapport constate des en-têtes (code, type MIME, encodage, cache). Il ne mesure ni le rendu, ni la performance, ni une empreinte carbone. La politique de cache \`max-age=600\` est imposée par GitHub Pages et n’est pas réglable depuis le dépôt : la relever ne suffit pas à la corriger."
            echo
            echo "Le relevé est conservé dans le dépôt (\`docs/rd/en-tetes-servis-AAAA-MM-JJ.toml\`) et revérifié hors ligne à chaque porte par \`outils/verifier-fichiers-servis.py\` : un binaire servi doit faire exactement la taille du fichier du dépôt, un texte servi doit arriver compressé plus petit."
          } > "$corps"

          numero="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "En-têtes servis par l’hébergement"' \
            --json number,title \
            --limit 100 \
            | python3 -c 'import json, os, sys; titre=os.environ["ISSUE_TITLE"]; items=json.load(sys.stdin); print(next((item["number"] for item in items if item["title"] == titre), ""))')"

          if [ -n "$numero" ]; then
            historique="$RUNNER_TEMP/entetes-historique.md"
            gh issue view "$numero" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
              | grep -o 'Rapport automatique du [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' \
              | sed 's/^Rapport automatique du //' \
              | sort -u | tail -n 11 > "$historique" || true
            if [ -s "$historique" ]; then
              {
                echo
                echo "<details><summary>Mesures déjà consignées dans cette issue</summary>"
                echo
                echo "Mesures précédentes, de la plus ancienne à la plus récente :"
                echo
                sed 's/^/- /' "$historique"
                echo
                echo "</details>"
              } >> "$corps"
            fi
            gh issue edit "$numero" --repo "$GITHUB_REPOSITORY" --body-file "$corps"
            echo "Issue #$numero actualisée (issue de suivi unique, laissée ouverte)."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$corps"
          fi
