name: Vérification du site M.R.S.C

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Vérifier la version du CSS de la page IA
        run: |
          python3 outils/test_version_css_ia.py
          python3 outils/versionner-css-ia.py --verifier

      - name: Compiler les modules Python
        run: python3 -m py_compile simulateur/*.py api/*.py outils/*.py

      - name: Vérifier les exemples de moyenne et médiane
        run: python3 outils/test_exemples_statistiques.py

      - name: Vérifier les fiches d’apprentissage générées
        shell: bash
        run: |
          sortie="$RUNNER_TEMP/verification-apprentissages.log"
          if python3 outils/construire-apprentissages.py --verifier --rapport "$RUNNER_TEMP/veille-apprentissages.md" >"$sortie" 2>&1; then
            cat "$sortie"
          else
            statut=$?
            cat "$sortie"
            tail -n 12 "$sortie" | while IFS= read -r ligne; do
              ligne="${ligne//'%'/'%25'}"
              ligne="${ligne//$'\r'/'%0D'}"
              printf '::error title=Vérification des fiches::%s\n' "$ligne"
            done
            exit "$statut"
          fi

      - name: Vérifier la page générée du simulateur
        run: python3 outils/construire-simulateur.py --verifier

      # `verifier-maj-amont.py` interroge le dépôt amont en réseau : il ne tourne
      # pas ici. Ce qui tourne, c'est sa décision — révision identique, révision
      # en retard, amont injoignable, sortie JSON — avec la sonde remplacée.
      - name: Vérifier la décision de la sentinelle du moteur embarqué
        run: python3 outils/test_verifier_maj_amont.py

      # Ce contrôle garde une règle de dépôt — « ne rien perdre en fusionnant » —
      # et n'avait aucun test. Le banc fabrique de petits dépôts git neufs et
      # casse une propriété à la fois (marqueur, `.orig`, ordre du journal, titre
      # en double, branche au contenu unique), sans jamais muter le vrai dépôt.
      - name: Vérifier qu'aucune fusion n'est restée inachevée
        run: |
          python3 outils/verifier-fusions.py
          python3 outils/test_mutations_fusions.py

      # La file de relecture est ce qu'une personne suivra pour les 59
      # prototypes : sa garde était la seule comparaison avec sa régénération.
      # Le banc la fait diverger, la supprime, l'édite à la main, et vérifie que
      # le tri par mots-clés classe encore une fiche sensible hors domaine.
      - name: Vérifier la file de relecture générée
        run: |
          python3 outils/file-relecture.py --verifier
          python3 outils/test_mutations_files_relecture.py

      - name: Vérifier les contrôles automatiques et le registre des relectures
        run: |
          python3 outils/test_audit_prototypes.py
          python3 outils/auditer-prototypes.py --verifier
          python3 outils/construire-paquets-relecture.py --verifier
          python3 outils/test_registre_relecture.py
          python3 outils/registre-relecture.py
          python3 outils/test_sources_refusees.py
          python3 outils/construire-sources-refusees.py --verifier
          python3 outils/test_confronter_sources.py
          python3 outils/confronter-sources.py --verifier

      # Le 28 octobre 2026, la carte `docs/rd/sujet-revenus-salaire-impots.md` a
      # fixé une règle : un taux daté n'entre pas dans une fiche. Ce contrôle la
      # rend exécutable. Il ne trouve rien aujourd'hui — c'est pourquoi son test
      # de mutation existe : sans lui, un contrôle préventif ne prouverait rien.
      - name: Vérifier qu'aucune règle chiffrée n'est écrite sans sa date
        run: |
          python3 outils/test_verifier_taux_dates.py
          python3 outils/verifier-taux-dates.py

      - name: Vérifier les avancées R&D consignées
        run: |
          python3 outils/test_avancees.py
          python3 outils/construire-avancees.py --verifier

      # La mémoire du projet — skills, portefeuille, avancées, sources refusées,
      # relectures, veille — n'était prouvée que par son propre vert. Le banc
      # casse une initiative, un skill, une ancre publique et l'horaire de la
      # veille, dans une copie complète du dépôt (5 s).
      - name: Vérifier le portefeuille et la continuité R&D
        run: |
          python3 outils/verifier-rd-continue.py
          python3 outils/test_mutations_rd_continue.py

      # 7 novembre 2026, seconde passe : la personne garde le rendu à l'oeil,
      # l'agent relit les contenus. La porte refuse une source non primaire ou
      # non datée, une chaîne publique non couverte, une correction WCAG qui
      # régresse et toute promotion en relecture humaine. Son banc plante les
      # fautes dans une copie pour prouver qu'elle mord.
      - name: Vérifier la relecture par agent et ses sources primaires
        run: |
          python3 outils/test_mutations_relecture_contenus.py
          python3 outils/verifier-relecture-contenus.py
          python3 outils/test_mutations_relire_contenus.py
          python3 outils/relire-contenus.py

      # Six apparences ajoutées le 7 novembre 2026. La porte refuse un jeton de
      # couleur oublié, un contraste sous le seuil, un nom d'oeuvre réapparu et
      # une animation qui contournerait prefers-reduced-motion. Douze fautes
      # sont plantées dans une copie du dépôt pour prouver qu'elle mord.
      - name: Vérifier les thèmes d'affichage et leurs contrastes
        run: |
          python3 outils/test_mutations_apparences.py
          python3 outils/verifier-apparences.py

      # Le 6 novembre 2026, les chiffres de prospective vieillissaient sans
      # garde : « dix-sept sujets sans fiche » dans le portefeuille contre six
      # dans la carte générée. Le relevé qualifié est désormais régénéré, son
      # bloc prospectif vérifié, et onze mutations prouvent que la porte refuse
      # une carte périmée, un statut embelli et un chiffre désynchronisé.
      - name: Vérifier la couverture qualifiée des sujets et le relevé prospectif
        run: |
          python3 outils/test_mutations_couverture_sujets.py
          python3 outils/construire-couverture-sujets.py --verifier

      # Le plan du projet recalcule le nombre de fichiers de chaque zone
      # depuis l'arbre réel, exige une action par initiative et refuse qu'une
      # porte humaine soit racontée comme franchie. Son banc plante douze
      # situations dans une copie complète, dont une zone retirée et un total
      # falsifié. Sans cette étape, la carte pourrait vieillir en silence.
      - name: Vérifier le plan complet du projet et son banc
        run: |
          python3 outils/test_mutations_plan_projet.py
          python3 outils/verifier-plan-projet.py

      # L'accueil refondu le 11 novembre 2026 ne doit pas recommencer à
      # rabâcher les mêmes informations. Cette garde recalcule les dix reprises
      # dans index.html, vérifie l'ordre des six sections et les quatre portes,
      # et refuse qu'une classe CSS de l'ancienne page ait disparu. Son banc
      # plante treize situations dans une copie complète du dépôt.
      - name: Vérifier le plan complet du site et son banc
        run: |
          python3 outils/test_mutations_plan_site.py
          python3 outils/verifier-plan-site.py

      # L'inventaire `docs/rd/inventaire-controles.md` répond, outil par outil,
      # à « qu'est-ce qui prouve que ce contrôle peut échouer ? ». Ce garde-là
      # empêche l'oubli ; son banc plante neuf fautes dans une copie du dépôt,
      # dont celle qui compte : un outil ajouté sans ligne dans l'inventaire — et, depuis
      # le 3 novembre 2026, un total de la prose qui ne correspond plus aux lignes.
      - name: Vérifier que l'inventaire des contrôles reste complet
        run: |
          python3 outils/test_verifier_inventaire_controles.py
          python3 outils/verifier-inventaire-controles.py
          python3 outils/test_annoncer_echec_graphismes.py

      # La règle du focus — seuil de 3:1, aveu des fonds en image, refus d'un
      # relevé vide, d'une page non mesurée ou d'une apparence non retrouvée —
      # est éprouvée sans navigateur : douze cas, instantanés. Le pouvoir de
      # mordre de la mesure elle-même est prouvé dans `graphismes`, où Chromium
      # est disponible.
      - name: Vérifier la règle de contraste de l'anneau de focus
        run: python3 outils/test_focus.py

      # Le 3 novembre 2026, un nom d'étape contenant « : » a rendu ce fichier
      # illisible : GitHub n'a lancé **aucun** job et a répondu « This run likely
      # failed because of a workflow file issue ». Rien dans le dépôt ne lisait
      # les workflows — un YAML cassé n'était pas une erreur, c'était un silence.
      # Le contrôle lit chaque fichier avec un vrai analyseur ; son banc plante
      # la faute exacte, et le refus « pas d'analyseur » (code 2).
      - name: Vérifier la lisibilité des workflows
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 outils/test_verifier_workflows.py
          python3 outils/verifier-workflows.py

      # Deux bancs du harnais des essais navigateur, et aucun des deux n'a besoin
      # de Chromium : l'attente nommée est éprouvée sur une page factice, et le
      # harnais lui-même sur le faux navigateur (il prouve qu'un essai qui échoue
      # ne peut pas être compté comme réussi). Ils vivaient hors de toute porte :
      # un `require` cassé dans le harnais n'aurait été vu qu'à la première
      # exécution réelle, soit neuf minutes plus tard.
      - name: Éprouver l'attente nommée et le harnais des essais navigateur
        run: |
          node outils/test_attente_navigateur.cjs
          node outils/test_test_experience.mjs

      - name: Vérifier les faits internes du brief prospectif
        run: |
          python3 outils/test_verifier_decision_prospective.py
          python3 outils/verifier-decision-prospective.py

      - name: Vérifier les garde-fous du vote distanciel
        run: |
          python3 outils/test_verifier_vote_distanciel.py
          python3 outils/verifier-vote-distanciel.py

      - name: Vérifier le protocole éditorial commun
        run: python3 outils/test_protocole_editorial.py

      - name: Vérifier la séparation des contenus personnels
        run: |
          python3 outils/test_separation_contenus.py
          python3 outils/verifier-separation-contenus.py

      - name: Vérifier les pages, liens et scripts statiques
        run: |
          python3 outils/verifier-site-statique.py
          python3 outils/test_mutations_site_statique.py

      # Le défaut d'origine : un favicon présent dans le dépôt, demandé par les
      # pages, et absent de la liste de copie du workflow — donc introuvable sur
      # le site. Le banc retire un fichier de cette liste, oublie une page,
      # casse un lien, élargit puis rétrécit l'aperçu local et déplace une
      # adresse du sitemap, dans une copie complète du dépôt.
      - name: Vérifier que le site publié ne manque d’aucun fichier
        run: |
          python3 outils/verifier-publication-locale.py
          python3 outils/test_mutations_publication_locale.py

      # Le relevé d’en-têtes est fait en réseau, hors de cette porte : ici on
      # confronte seulement ce relevé aux fichiers du dépôt. Un binaire dont la
      # taille ne correspond plus signale une mesure devenue fausse, à refaire.
      - name: Vérifier le relevé des fichiers réellement servis
        run: |
          python3 outils/test_fichiers_servis.py
          python3 outils/verifier-fichiers-servis.py

      # Le contrôle réseau du périmètre ne peut pas tourner hors ligne : ce test
      # vérifie qu'il détecte un hébergement qui publie la racine du dépôt, cas
      # survenu le 25 octobre 2026 avec une source Pages « Deploy from a branch ».
      - name: Vérifier le contrôle du périmètre de publication
        run: python3 outils/test_verifier_publication.py

      # Le contrôle de la feuille servie interroge le site publié : hors de cette
      # porte, c'est sa décision qu'on éprouve sur un serveur local (feuille
      # périmée, absente, compressée). Le 5 novembre 2026, une feuille périmée
      # est restée servie après quatre déploiements échoués sans qu'aucun
      # contrôle ne le dise.
      - name: Vérifier le contrôle de la feuille servie
        run: python3 outils/test_verifier_feuille_servie.py

      # Le script écrit ses refus sur la sortie d’erreur : sans ce relais, un
      # échec n’affichait que « exit code 1 » dans l’onglet des vérifications,
      # ce qui interdisait de savoir quel fichier ou quelle largeur posait
      # problème. Chaque ligne fautive est donc remontée en annotation.
      - name: Vérifier le manifeste des variantes d’images
        shell: bash
        run: |
          python3 outils/test_manifeste_sans_imagemagick.py
          sortie="$RUNNER_TEMP/manifeste-images.log"
          if python3 outils/optimiser-images.py --verifier >"$sortie" 2>&1; then
            cat "$sortie"
          else
            statut=$?
            cat "$sortie"
            tail -n 12 "$sortie" | while IFS= read -r ligne; do
              ligne="${ligne//'%'/'%25'}"
              ligne="${ligne//$'\r'/'%0D'}"
              printf '::error title=Manifeste des variantes::%s\n' "$ligne"
            done
            exit "$statut"
          fi

      # Le site annonce des budgets de poids : 300 Kio mobile, 450 Kio grand
      # écran. Rien ne prouvait que le contrôle qui les applique sache refuser.
      # Le banc ajoute une image de 400 Kio, une ressource absente, un <picture>
      # sans repli, et abaisse le budget à 1 Kio sur une copie intacte (22 s).
      - name: Vérifier le poids estimé des pages
        run: |
          python3 outils/verifier-poids-pages.py
          python3 outils/test_mutations_poids_pages.py

      # Ce contrôle garde 12 planches, 203 liens d'image et 343 empreintes
      # d'archive : beaucoup de surface, aucune preuve qu'il refuse. Le banc
      # casse une planche, une référence, un lien, deux fois le manifeste, suit
      # un PNG, et retire le dépôt git — car un `git ls-files` en échec rendait
      # autrefois « aucun PNG suivi » au lieu d'un doute. Copie complète, 1,3 s.
      - name: Vérifier les planches des statuts et leur archive
        run: |
          python3 outils/verifier-planches-statuts.py
          python3 outils/test_mutations_planches_statuts.py

      - name: Installer Node.js pour le banc de l'auditeur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Cet auditeur mesure trois critères WCAG dans un vrai Chromium, et son
      # banc tourne ici plutôt que dans `graphismes` : il ne mesure rien. Deux
      # faux paquets (`outils/faux-navigateur/`) remplacent `puppeteer-core` et
      # `@sparticuz/chromium`, et le vrai script est lancé tel quel. Ce qui est
      # éprouvé, c'est le contrat de sortie — un chargement en échec ne se lit
      # pas « 0 défaut », et une cible à corriger garde la largeur de fenêtre à
      # côté de la sienne. Coût : 4 s, aucun binaire à télécharger.
      - name: Éprouver l'auditeur des critères WCAG 2.2 sans navigateur
        run: node outils/test_auditer_criteres_22.mjs

      # `verifier-fiches-statistiques.cjs` promène deux fiches dans 288
      # configurations et écrit un relevé JSON. Son pire défaut serait un relevé
      # absent ou vide qui se lit « zéro échec ». Le banc le lance quatre fois
      # avec le faux navigateur : nominal, géométrie fautive, statut absent,
      # chargement impossible (code 2, aucun relevé écrit) — et vérifie que le
      # relevé commité de `docs/rd/` n'a pas bougé. 5 cas, 0,3 s.
      - name: Éprouver la géométrie des fiches de statistiques
        run: node outils/test_verifier_fiches_statistiques.mjs

      # Le balayage axe-core visite 12 pages et une vingtaine d'états
      # interactifs (menu, panneau, contraste, lecture à voix haute, filtres,
      # aides dépliées, mission des Mondes, commandes du simulateur). Le faux
      # navigateur rejoue les mêmes parcours sans Chromium, en 40 s — le script
      # attend ses états comme en vrai, d'où le coût. Ce qui est éprouvé : une
      # violation sort en code 1 et reste attachée à son état, un chargement
      # impossible sort en code 2 sans écrire de rapport, et chaque exécution
      # annoncée a bien son verdict.
      - name: Éprouver le balayage d'accessibilité
        run: node outils/test_verifier_accessibilite.mjs

      # `test-cache-css-ia.cjs` simule un CSS périmé servi sous l'ancienne URL :
      # il intercepte la requête de la feuille et sert lui-même deux CSS. Sa
      # panne discrète n'est pas un écart de géométrie, c'est de ne plus servir
      # l'ancienne feuille — le test afficherait alors un bilan vert sans rien
      # reproduire. Le banc rejoue les cinq cas avec le faux navigateur (le faux
      # rejoue l'interception et tire l'écart du CSS réellement servi) : nominal,
      # version périmée, attente inversée, interception retirée, ancien CSS
      # identique au courant. 0,5 s, aucun binaire à télécharger.
      - name: Éprouver le test du cache CSS
        run: node outils/test_test_cache_css_ia.mjs

      # `auditer-affichages.mjs` mesure 13 pages dans 19 formats et 10 modes :
      # 2 470 mesures, chacune suivie d'une pause de 120 ms dans le script, soit
      # dix minutes par exécution. Le banc réduit donc le périmètre à une page,
      # un format et deux modes **dans une copie jetable**, et il le dit dans son
      # en-tête : ce qu'il éprouve est le traitement d'une mesure et le code de
      # sortie, pas la couverture des formats. 3 cas, 2,7 s.
      - name: Éprouver la mesure d'affichage
        run: node outils/test_auditer_affichages.mjs

      # `etat-rd.py` imprime le tableau que le brief de décision prospective cite
      # comme pièce justificative. Son pire défaut n'était pas de se tromper mais
      # de se taire : une source absente retirait ses lignes, et le tableau
      # gardait l'air complet. Le banc retire chaque source dans une copie et
      # exige que le manque soit nommé, avec un code non nul. 7 cas, 1,2 s.
      - name: Éprouver l'état de la R&D
        run: |
          python3 outils/etat-rd.py > /dev/null
          python3 outils/test_etat_rd.py

      # Dernier contrôle sans preuve. `verifier-source-distante.py` interroge la
      # version en ligne du simulateur ; son banc ne simule pas HTTP, il le fait :
      # un serveur local servant les réponses voulues, et le script lancé en
      # sous-processus avec l'exception `SIMULATEUR_SOURCE_DISTANTE_TEST_LOCALE`.
      # Sont donc réellement exercés la liste d'hôtes autorisés, urllib, les
      # marqueurs de page, la lecture du JSON, l'ordre des routes et le code de
      # sortie. 9 cas, 4,5 s, aucun octet sortant hors de la boucle locale.
      - name: Éprouver la vérification de la source distante
        run: python3 outils/test_verifier_source_distante.py

      # Cette porte garde les frontières HTTP et WSGI, la provenance navigateur,
      # la liste statique et l'épinglage des actions : elle n'avait aucun test
      # jusqu'au 28 octobre 2026. Le banc plante six fautes réelles dans une
      # copie du dépôt — en-tête retiré, limite Vercel abaissée, action
      # dé-épinglée, runner mouvant, liste statique élargie, plafond de source
      # supprimé — et exige l'échec avec le message attendu.
      - name: Vérifier les frontières de sécurité
        run: |
          python3 outils/verifier-securite.py
          python3 outils/test_mutations_securite.py

      # La dernière porte à forte conséquence qui ne fût vérifiée que par
      # elle-même. Son banc coûte 67 s — la porte lance quatre outils et monte
      # un serveur à chaque exécution —, ce qui le réserve aux pull requests :
      # rejouer les mêmes trois fautes à chaque publication n'apprendrait rien
      # de neuf et doublerait la durée du travail de mise en ligne.
      - name: Vérifier l’intégration des routes et du site
        run: |
          python3 outils/verifier-integration.py
          python3 outils/test_mutations_integration.py

      # Nés de la panne du 22 octobre 2026 : deux sorties commitées portaient la
      # date du jour de leur génération et faisaient échouer cette porte, puis la
      # publication du site, dès le lendemain. Le premier contrôle rejoue toutes
      # les portes qui comparent un fichier généré avec une horloge déplacée de
      # +37 et +400 jours ; le second mesure ce qu’aucun test ne voyait — la
      # longueur des titres de page et le rendu étroit du H1 de l’accueil.
      - name: Vérifier la reproductibilité des sorties générées
        run: python3 outils/test_reproductibilite_artefacts.py

      # Ces budgets existent parce qu'aucun test ne voyait un titre tronqué ni un
      # H1 qui s'allonge : leur propre pouvoir de mordre est éprouvé juste après.
      - name: Vérifier les budgets d’affichage des titres et du H1
        run: |
          python3 outils/verifier-budgets-visuels.py
          python3 outils/test_mutations_budgets_visuels.py

      # Les appuis de la mesure d'affichage (planchers de texte et de cible,
      # plafonds d'image par densité, mesure de lecture) : la mesure complète
      # demande un navigateur, ces règles-ci se vérifient partout.
      - name: Vérifier les garde-fous des formats d’affichage
        run: |
          python3 outils/verifier-affichages.py
          python3 outils/test_mutations_affichages.py

      # Le panneau « Personnalisation » n'est plus ancré par un point de rupture :
      # il est placé à la mesure dans `site.js` (largeur bornée à la fenêtre,
      # bord droit aligné sur le bouton puis rabattu, hauteur bornée sous
      # l'en-tête). Ce banc extrait la vraie fonction et l'exécute sans
      # navigateur sur 3 600 positions — toutes les largeurs de 240 à 2 560 px
      # croisées avec cinq hauteurs et trois boutons. Il a trouvé, avant tout
      # Chromium, qu'une fenêtre de 320 px avec un en-tête de 180 laissait
      # dépasser le panneau de 8 px.
      - name: Vérifier le placement mesuré du panneau de personnalisation
        run: node outils/test_placement_panneau.mjs

      # Depuis le 30 octobre 2026, la règle est écrite : l'agencement ne repose
      # plus sur des valeurs fixes de fenêtre. Une règle pareille se perd un
      # palier à la fois — d'où ce compte. Il relève chaque `@media` de
      # `assets/css/site.css`, distingue les conditions de format (largeur,
      # hauteur, orientation) des préférences de la personne, et exige pour
      # chaque condition de format une raison écrite et une décision dans
      # `docs/rd/paliers-affichage.toml`. Le 31 octobre 2026 : 17 conditions de
      # format, 45 blocs, 15 en dette. Le banc plante 19 fautes, dont trois
      # sources illisibles qui doivent sortir en code 2 plutôt qu'en vert.
      - name: Compter les paliers d’affichage
        run: |
          python3 outils/compter-paliers.py --releve
          python3 outils/test_paliers_affichage.py

      # Compter les paliers ne dit pas *comment* en sortir. `modele-grilles.py`
      # lit la cascade réelle d'une grille — règle de base, puis chaque `@media`
      # qui la reprend, dans l'ordre du fichier — et calcule le nombre de
      # colonnes à chaque largeur de fenêtre, pour l'ancienne écriture comme pour
      # `auto-fit`. Quatre grilles sont converties le 31 octobre 2026 ; le
      # contrôle vérifie que leur minimum de piste est celui que la règle donne
      # (pas un chiffre choisi) et qu'aucun `@media` ne leur réimpose un nombre
      # de colonnes. Depuis le 1er novembre 2026, il refuse aussi toute piste
      # écrite en pixels nus : une colonne d'icône en `px` ne suit pas le réglage
      # de taille de texte, une colonne en `rem` si. Trois sources lues — les deux
      # feuilles du site et le générateur du simulateur ; la feuille du moteur
      # embarqué vient de l'amont et n'est pas de ce contrôle. Le banc compte
      # 48 cas, dont deux sources illisibles qui doivent sortir en code 2.
      - name: Vérifier le modèle des grilles
        run: |
          python3 outils/modele-grilles.py --verifier
          python3 outils/test_modele_grilles.py

      # La mémoire d'ÉVA n'a qu'une preuve possible : elle se vérifie elle-même,
      # et son plan se laisse contredire. Quatre fautes sont refusées ici plutôt
      # que promises ailleurs — un statut « fait » sans banc, un « hors-portée »
      # sans condition de révision, une branche du portefeuille que le plan ne
      # sert pas, un index qui n'est plus le rendu de ses sources. Le banc de la
      # mémoire écrit dans une **vraie** copie : une copie faite de liens
      # symboliques a déjà mutilé le plan du dépôt le 1er novembre 2026.
      - name: Vérifier la mémoire et le plan d’ÉVA
        run: |
          python3 outils/memoire-eva.py --verifier
          python3 outils/memoire-eva.py --evaluer
          python3 outils/verifier-plan-eva.py
          python3 outils/test_memoire_eva.py
          python3 outils/test_verifier_plan_eva.py

      # Le rapporteur confronte la prédiction du modèle au relevé d'un
      # navigateur. Il tourne dans `graphismes`, où le Chromium existe ; son banc
      # n'a besoin de rien : il fabrique une prédiction et un relevé, et regarde
      # ce que le rapporteur en dit. Le 1er novembre 2026, le modèle se
      # contredisait tout seul — trois grilles changeaient de colonnes à 761 px
      # sans que rien ne le voie. Un contrôle qui ne se confronte qu'à sa propre
      # arithmétique ne prouve que sa cohérence.
      - name: Éprouver le rapporteur de la mesure des colonnes
        run: python3 outils/test_rapporter_mesure_grilles.py

      # Le 1er novembre 2026, le modèle annonçait quatre grilles « proportion »
      # restantes ; deux d'entre elles n'existaient que dans la feuille, et le
      # relevé proposait donc des conversions sans objet. Une grille que
      # personne n'ouvre n'a pas de repli à reproduire. Ce contrôle cherche
      # chaque classe de `assets/css` dans les sources qui peuvent produire une
      # instance (pages, scripts, générateurs, données) et refuse celles qui
      # n'y figurent nulle part — sauf si une source les construit à
      # l'exécution (`adventure-learning-world-${n}`), cas qu'il avoue
      # indécidable au lieu de le déclarer mort. Le banc plante sept fautes dans
      # une vraie copie, dont une feuille absente et un corpus vidé, qui doivent
      # sortir en code 2.
      - name: Relever les classes que personne n’ouvre
        run: |
          python3 outils/auditer-selecteurs-morts.py --verifier
          python3 outils/test_auditer_selecteurs_morts.py

  graphismes:
    runs-on: ubuntu-24.04
    # 20 minutes ne suffisaient plus depuis le contrôle des cadrages (5 min 02
    # mesurées en local, 480 combinaisons) : le plafond est relevé plutôt que le
    # banc raccourci, et la raison est écrite ici. Le 3 novembre 2026, c'est
    # l'**installation du navigateur** qui a mangé le plafond — 1 797 s — et non
    # une mesure : elle est désormais mise en cache, et le plafond reste à 30
    # minutes pour que ce soit une mesure trop lente qui le franchisse, jamais
    # un téléchargement.
    timeout-minutes: 30
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Le 3 novembre 2026, cette installation a pris **1 797 s** — trente
      # minutes à elle seule — et le job a été coupé avant la première mesure.
      # Le réseau du runner n'est pas une dépendance qu'on peut tenir pour
      # acquise : les deux paquets sont donc mis en cache, et le cache n'est
      # écrit que si l'installation réussit.
      - name: Restaurer le navigateur de mesure
        id: cache-navigateur
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mrsc-browser
          key: mrsc-browser-puppeteer-core-25.16.0-sparticuz-chromium-153.0.0
      - name: Installer le navigateur de mesure
        if: steps.cache-navigateur.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/mrsc-browser" puppeteer-core@25.16.0 @sparticuz/chromium@153.0.0
      - name: Mesurer les trois visuels dans les modes couverts
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_GRAPHISMES_JSON: ${{ runner.temp }}/graphismes/releve.json
          MRSC_CAPTURES: ${{ runner.temp }}/graphismes/captures
        run: |
          python3 -m http.server 4181 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-graphismes.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          # Une étape qui échoue doit dire ce qu'elle a vu : les journaux et les
          # artefacts vivent sur un stockage que l'atelier n'atteint pas, et le
          # 31 octobre 2026 ce job est tombé en rouge sans qu'aucune annotation
          # ne nomme la mesure refusée. Les constats sont donc réémis en
          # annotations, lisibles par l'API.
          echec=0
          set +e
          MRSC_FICHES_JSON="$RUNNER_TEMP/graphismes/fiches-statistiques.json" node outils/verifier-fiches-statistiques.cjs
          [ $? -ne 0 ] && echec=1
          node outils/test-cache-css-ia.cjs
          [ $? -ne 0 ] && echec=1
          node outils/verifier-graphismes.cjs
          [ $? -ne 0 ] && echec=1
          # Le code de sortie ne dit pas *pourquoi* la mesure a échoué : une
          # mutation qui ferait céder le contrôle pour une panne sans rapport
          # laisserait la CI verte. Chaque passe mutée doit donc constater
          # l'erreur qu'elle est censée provoquer — c'est le rôle de
          # `verifier-mutation-graphismes.py`, testé hors navigateur (6 cas).
          for mutation in distorsion densite ancre; do
            MRSC_MUTATION="$mutation" MRSC_GRAPHISMES_JSON="$RUNNER_TEMP/graphismes/mutation-$mutation.json" node outils/verifier-graphismes.cjs
            [ $? -eq 1 ] || echec=1
            python3 outils/verifier-mutation-graphismes.py "$RUNNER_TEMP/graphismes/mutation-$mutation.json" "$mutation"
            [ $? -ne 0 ] && echec=1
          done
          set -e
          if [ "$echec" -ne 0 ]; then
            python3 outils/annoncer-echec-graphismes.py "$RUNNER_TEMP/graphismes" || true
            exit 1
          fi
      # Le modèle des grilles annonce, largeur par largeur et taille de texte par
      # taille de texte, le nombre de colonnes de 34 grilles. Il ne s'est jamais
      # confronté à un navigateur : le 1er novembre 2026, trois grilles
      # converties la veille changeaient de colonnes à 761 px, et c'était le
      # modèle qui validait le modèle. Ici, un vrai Chromium compte les colonnes
      # — rangées d'un `flex-wrap`, pistes non nulles d'une grille — et le
      # rapporteur dit où les deux divergent.
      #
      # Cette étape est un **contrôle** depuis que les 35 divergences du 1er
      # novembre 2026 sont expliquées : quatre grilles n'occupaient pas le
      # conteneur mais ce que leurs ancêtres leur laissaient — un parent `flex`
      # qui partage sa largeur, un parent `grid` à colonne de 300 px, le
      # remplissage et la bordure d'un parent bloc. Modélisées, elles passent.
      # Ce qui reste est à moins d'un pixel du point de bascule (0,20 à 0,78 px) :
      # c'est nommé, compté, et sans effet sur le nombre de colonnes d'une largeur
      # voisine — le contrôle accepte ce qui ne peut pas être décidé, mais refuse
      # toute divergence franche. Il échoue aussi si une mesure n'a pas eu lieu
      # (code 2 sans navigateur, page ou sélecteur introuvable) : un contrôle
      # incomplet ne vaut pas un contrôle vide, il vaut un échec.
      - name: Confronter les colonnes annoncées aux colonnes réelles
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_TEST_URL: http://127.0.0.1:4183/
        run: |
          mkdir -p "$RUNNER_TEMP/graphismes/colonnes"
          python3 outils/modele-grilles.py --releve-json "$RUNNER_TEMP/graphismes/colonnes/releve.json"
          python3 -m http.server 4183 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-colonnes.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          sleep 1
          set +e
          node outils/mesurer-grilles.cjs \
            "$RUNNER_TEMP/graphismes/colonnes/releve.json" \
            "$RUNNER_TEMP/graphismes/colonnes/rapport.json" \
            >"$RUNNER_TEMP/graphismes/colonnes/mesure.log" 2>&1
          mesure=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/colonnes/mesure.log"
          if [ "$mesure" -ne 0 ]; then
            grep -E '^(  !|Environnement)' "$RUNNER_TEMP/graphismes/colonnes/mesure.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Mesure des colonnes::$ligne"
            done
            exit "$mesure"
          fi
          set +e
          python3 outils/rapporter-mesure-grilles.py \
            --releve "$RUNNER_TEMP/graphismes/colonnes/releve.json" \
            --rapport "$RUNNER_TEMP/graphismes/colonnes/rapport.json" --controler \
            | tee "$RUNNER_TEMP/graphismes/colonnes/comparaison.log"
          comparaison=${PIPESTATUS[0]}
          set -e
          # Les journaux et l'artefact vivent sur un stockage que l'atelier
          # n'atteint pas : sans annotation, « le relevé a tourné » serait tout
          # ce qu'on saurait, et les nombres mesurés resteraient invisibles. Une
          # annotation se lit par l'API, elle. Les divergences sont donc publiées
          # en `warning` même quand l'étape réussit — une divergence au seuil
          # n'est pas une panne, et la ligne de synthèse l'est toujours. Une
          # divergence franche, elle, sort en `error` plus bas.
          grep -E '^(RELEVÉ|CONTRÔLE)' "$RUNNER_TEMP/graphismes/colonnes/comparaison.log" \
            | head -n 1 | cut -c1-900 | while IFS= read -r ligne; do
            echo "::warning title=Colonnes des grilles::$ligne"
          done
          python3 outils/rapporter-mesure-grilles.py \
            --releve "$RUNNER_TEMP/graphismes/colonnes/releve.json" \
            --rapport "$RUNNER_TEMP/graphismes/colonnes/rapport.json" --resume \
            >"$RUNNER_TEMP/graphismes/colonnes/resume.log" 2>&1 || true
          cat "$RUNNER_TEMP/graphismes/colonnes/resume.log"
          # GitHub ne garde qu'une dizaine d'annotations par étape : la synthèse
          # et le total passent donc avant le détail, sinon le nombre de grilles
          # divergentes serait coupé sans que rien ne le dise.
          grep -E '^RESUME TOTAL' "$RUNNER_TEMP/graphismes/colonnes/resume.log" \
            | head -n 1 | cut -c1-900 | while IFS= read -r ligne; do
            echo "::warning title=Colonnes des grilles::$ligne"
          done
          grep -E '^RESUME ' "$RUNNER_TEMP/graphismes/colonnes/resume.log" \
            | grep -v '^RESUME TOTAL' | head -n 7 | cut -c1-900 | while IFS= read -r ligne; do
            echo "::warning title=Colonnes des grilles::$ligne"
          done
          nombre=$(grep -c '^RESUME ' "$RUNNER_TEMP/graphismes/colonnes/resume.log" || true)
          nombre=$((nombre > 0 ? nombre - 1 : 0))
          if [ "$nombre" -gt 7 ]; then
            echo "::warning title=Colonnes des grilles::… $nombre grilles divergentes au total, 7 nommées ici (plafond d'annotations) — détail dans l'artefact mesures-graphismes"
          fi
          if [ "$comparaison" -ne 0 ]; then
            grep -E '^(Refusé|Impossible)' "$RUNNER_TEMP/graphismes/colonnes/comparaison.log" \
              | head -n 5 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Colonnes des grilles::$ligne"
            done
            exit "$comparaison"
          fi

      # Le contrôle des colonnes ne regarde qu'un cadrage : présentation par
      # défaut, trois tailles de texte. Le panneau de personnalisation en propose
      # six et cinq crans, et `--content` comme les gouttières changent avec eux.
      # Cette étape confronte donc les **treize pages publiées** — six
      # présentations là où une grille est déclarée, la présentation par défaut
      # ailleurs, soit 1 060 cadrages. Elle refuse un débordement horizontal
      # au-delà de 0,5 px, un écart de colonnes, un mot coupé par une zone de
      # découpe, deux cartes superposées et un contraste sous le seuil WCAG.
      # Les pages sont lues sur le disque : neuf d'entre elles échappaient à
      # tout cadrage avant le 3 novembre 2026. Coût mesuré : 405 s en local,
      # d'où le plafond de 30 minutes sur ce job — un banc lent vaut mieux qu'un
      # banc absent, à condition de dire ce qu'il coûte.
      - name: Confronter chaque cadrage personnalisé — géométrie, mots, cartes et contraste
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_TEST_URL: http://127.0.0.1:4185/
        run: |
          mkdir -p "$RUNNER_TEMP/graphismes/cadrages"
          python3 outils/cadrages.py --releve-json "$RUNNER_TEMP/graphismes/cadrages/plan.json"
          python3 -m http.server 4185 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-cadrages.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          sleep 1
          set +e
          node outils/mesurer-cadrages.cjs \
            "$RUNNER_TEMP/graphismes/cadrages/plan.json" \
            "$RUNNER_TEMP/graphismes/cadrages/rapport.json" \
            >"$RUNNER_TEMP/graphismes/cadrages/mesure.log" 2>&1
          mesure=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/cadrages/mesure.log"
          if [ "$mesure" -ne 0 ]; then
            grep -E '^(  !|Environnement)' "$RUNNER_TEMP/graphismes/cadrages/mesure.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Cadrages personnalisés::$ligne"
            done
            exit "$mesure"
          fi
          set +e
          python3 outils/cadrages.py --controler \
            "$RUNNER_TEMP/graphismes/cadrages/plan.json" \
            "$RUNNER_TEMP/graphismes/cadrages/rapport.json" \
            >"$RUNNER_TEMP/graphismes/cadrages/controle.log" 2>&1
          controle=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/cadrages/controle.log"
          if [ "$controle" -eq 0 ]; then
            grep -E '^Cadrages' "$RUNNER_TEMP/graphismes/cadrages/controle.log" \
              | head -n 1 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::notice title=Cadrages personnalisés::$ligne"
            done
          else
            grep -E '^(  -|Refusé|Lecture)' "$RUNNER_TEMP/graphismes/cadrages/controle.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Cadrages personnalisés::$ligne"
            done
          fi
          # Une dernière rangée incomplète n'est pas une faute : c'est un fait de
          # dessin, chiffré ici pour qu'une décision se prenne sur des nombres et
          # non sur une impression. Le diagnostic ne fait jamais échouer l'étape ;
          # s'il n'a pas pu lire une grille, il le dit, et l'annotation aussi.
          set +e
          python3 outils/cadrages.py --orphelins \
            "$RUNNER_TEMP/graphismes/cadrages/plan.json" \
            "$RUNNER_TEMP/graphismes/cadrages/rapport.json" \
            >"$RUNNER_TEMP/graphismes/cadrages/orphelins.log" 2>&1
          set -e
          head -n 12 "$RUNNER_TEMP/graphismes/cadrages/orphelins.log" \
            | cut -c1-900 | while IFS= read -r ligne; do
            echo "::notice title=Rangées incomplètes::$ligne"
          done
          # L'annotation est plafonnée : neuf couples sur seize s'y voyaient le
          # 4 novembre 2026, et sept vides restaient invisibles. Le résumé de
          # l'étape n'a pas ce plafond — c'est là que la liste entière est
          # publiée, motifs compris, pour qu'une décision se prenne sur les seize.
          # Un vide assumé sans motif est une dérogation en blanc : la décision
          # A2 du 4 novembre 2026 le refuse. Ces lignes vivent sur la sortie
          # d'erreur, avec le chiffre de chaque vide — un motif écrit sans son
          # nombre s'écrit de mémoire. Les seize sont écrits depuis le
          # 4 novembre 2026 : cette boucle ne doit plus rien afficher, et le
          # jour où elle affichera quelque chose, ce sera un vide neuf.
          # (L'annotation est plafonnée : ces lignes tombent après `head -n 12`.)
          grep '^  ! ' "$RUNNER_TEMP/graphismes/cadrages/orphelins.log" \
            | cut -c1-900 | while IFS= read -r ligne; do
            echo "::warning title=Vides assumés sans motif::$ligne"
          done || true
          {
            echo "### Rangées incomplètes — liste entière"
            echo
            echo '```'
            cat "$RUNNER_TEMP/graphismes/cadrages/orphelins.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # Ce que le contraste écarte — décoratif déclaré, fond en image — est
          # nommé ici : une exemption qui ne se nomme jamais devient un angle mort.
          python3 outils/cadrages.py --ecartes "$RUNNER_TEMP/graphismes/cadrages/rapport.json" \
            >"$RUNNER_TEMP/graphismes/cadrages/ecartes.log" 2>&1 || true
          head -n 12 "$RUNNER_TEMP/graphismes/cadrages/ecartes.log" \
            | cut -c1-900 | while IFS= read -r ligne; do
            echo "::notice title=Écartés du contraste::$ligne"
          done
          exit "$controle"

      # Un dégradé **radial** dont le centre ou le rayon n'est pas lisible est
      # jugé contre la plage entière : majorant assumé depuis le 3 novembre
      # 2026, et jamais chiffré — un majorant qu'on ne chiffre pas se lit comme
      # une mesure. Ce diagnostic le compte sur **tous** les textes (ses
      # compteurs ne sont pas plafonnés) et chiffre, sur l'échantillon joint,
      # combien de verdicts tiennent à lui seul. Il ne refuse rien : si le relevé
      # ne porte pas les compteurs, il le dit et sort en code 2 — jamais zéro.
      #
      # Il vit dans **sa propre étape** parce que l'annotation est plafonnée à dix
      # lignes par étape : laissé dans l'étape des cadrages, il tombait après les
      # neuf rangées incomplètes et n'apparaissait jamais. C'est le troisième
      # plafond d'annotation rencontré depuis le 4 novembre 2026.
      - name: Chiffrer le majorant radial — ce qui est jugé sans être situé
        run: |
          set +e
          python3 outils/cadrages.py --radiaux \
            "$RUNNER_TEMP/graphismes/cadrages/rapport.json" \
            >"$RUNNER_TEMP/graphismes/cadrages/radiaux.log" 2>&1
          radiaux=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/cadrages/radiaux.log"
          if [ "$radiaux" -eq 0 ]; then
            head -n 8 "$RUNNER_TEMP/graphismes/cadrages/radiaux.log" \
              | cut -c1-900 | while IFS= read -r ligne; do
              echo "::notice title=Majorant radial::$ligne"
            done
          else
            # Il n'a pas pu lire sa source : il le dit, et l'annotation aussi.
            head -n 4 "$RUNNER_TEMP/graphismes/cadrages/radiaux.log" \
              | cut -c1-900 | while IFS= read -r ligne; do
              echo "::warning title=Majorant radial non chiffré::$ligne"
            done
          fi
          {
            echo "### Majorant radial — ce qui est jugé sans être situé"
            echo
            echo '```'
            cat "$RUNNER_TEMP/graphismes/cadrages/radiaux.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Le contraste du texte était mesuré depuis la veille ; l'anneau de focus ne
      # l'était pas. Une page peut être parfaitement lisible et impraticable au
      # clavier : sur la surface marine de `.creator-note`, le bleu du site donnait
      # 1,76:1, sous les 3:1 de WCAG 2.2 AA (1.4.11) — quarante liens mesurés
      # ainsi, puis corrigés par le jeton `--focus-ring`.
      - name: Mesurer l'anneau de focus, puis prouver que la mesure mord
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_TEST_URL: http://127.0.0.1:4186/
        run: |
          mkdir -p "$RUNNER_TEMP/graphismes/focus"
          # Le plafond par défaut (60 par page et par largeur) sert à un essai
          # rapide ; la porte mesure la page entière — 2 620 éléments, 45 s —
          # parce qu'un échantillon qui s'arrête au plafond ne dit rien des
          # 1 400 cibles qu'il n'a pas vues.
          python3 outils/focus.py --plan "$RUNNER_TEMP/graphismes/focus/plan.json" --limite 500
          python3 -m http.server 4186 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-focus.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          sleep 1
          set +e
          node outils/mesurer-focus.cjs \
            "$RUNNER_TEMP/graphismes/focus/plan.json" \
            "$RUNNER_TEMP/graphismes/focus/rapport.json" \
            >"$RUNNER_TEMP/graphismes/focus/mesure.log" 2>&1
          mesure=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/focus/mesure.log"
          if [ "$mesure" -ne 0 ]; then
            grep -E '^(  -|Environnement)' "$RUNNER_TEMP/graphismes/focus/mesure.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Focus au clavier::$ligne"
            done
            exit "$mesure"
          fi
          set +e
          python3 outils/focus.py --controler \
            "$RUNNER_TEMP/graphismes/focus/plan.json" \
            "$RUNNER_TEMP/graphismes/focus/rapport.json" \
            >"$RUNNER_TEMP/graphismes/focus/controle.log" 2>&1
          controle=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/focus/controle.log"
          if [ "$controle" -eq 0 ]; then
            grep -E '^Focus' "$RUNNER_TEMP/graphismes/focus/controle.log" \
              | head -n 1 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::notice title=Focus au clavier::$ligne"
            done
          else
            grep -E '^(  -|Refusé|Lecture)' "$RUNNER_TEMP/graphismes/focus/controle.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Focus au clavier::$ligne"
            done
          fi
          exit "$controle"

      # Une mesure qui ne trouve plus rien est ce qu'on obtient d'une mesure qui
      # ne regarde plus. Ce banc retire la correction dans une copie et exige le
      # retour du refus à 1,76:1, puis efface l'anneau et exige le refus pour
      # absence d'indicateur. Trois cas, huit secondes, navigateur compris.
      - name: Éprouver que la mesure du focus refuse un anneau invisible
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
        run: python3 outils/test_mutations_focus.py

      # Le banc précédent mesure ; celui-ci prouve que la mesure mord. Il rejoue
      # sur une copie jetable les deux mutations qui ont été faites à la main le
      # 2 novembre 2026 : un mot rogné par une zone de découpe, deux cartes
      # superposées. Sans navigateur, il sort en code 2 et le dit — jamais vert.
      # Coût mesuré : 13 s pour trois cas (dont la copie intacte qui doit passer).
      - name: Éprouver que le contrôle des cadrages refuse un mot coupé et deux cartes superposées
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
        run: python3 outils/test_mutations_cadrages.py

      # Et ce banc-ci éprouve la lecture elle-même : un dégradé doit sortir comme
      # une couche à deux arrêts (la découpe d'expression régulière en faisait
      # deux calques, et publiait des rapports calculés sur des aplats qui
      # n'existent nulle part), et un texte posé à droite d'un dégradé horizontal
      # doit être jugé contre la fin de la plage, pas contre son début.
      # Trois cas, deux secondes — dont la zone radiale, sans laquelle un halo
      # de 100 px serait jugé comme s'il colorait toute la page. Sans
      # navigateur : code 2.
      # Le 4 novembre 2026, ce banc est devenu rouge sans que l'annotation dise
      # pourquoi : le journal n'est pas lisible depuis cette session, et
      # « exit code 1 » ne nomme rien. Une CI rouge doit dire ce qu'elle a vu —
      # l'étape capture donc ses échecs et les publie en annotations.
      - name: Éprouver que la lecture d'un dégradé garde ses arrêts et la zone du texte
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
        run: |
          set +e
          python3 outils/test_contraste-degrade.py >"$RUNNER_TEMP/degrade.log" 2>&1
          statut=$?
          set -e
          cat "$RUNNER_TEMP/degrade.log"
          if [ "$statut" -ne 0 ]; then
            grep -E -A6 '^(FAIL|ERROR|AssertionError)' "$RUNNER_TEMP/degrade.log" \
              | head -n 40 | cut -c1-900 | grep -v '^--$' | while IFS= read -r ligne; do
              echo "::error title=Banc du contraste des dégradés::$ligne"
            done
            exit "$statut"
          fi

      # Les contrôles précédents disent qu'une mutation produit l'erreur
      # annoncée. Aucun ne dit que la géométrie relevée est la bonne : un
      # `getBoundingClientRect` mal lu, une densité calculée à l'envers,
      # resteraient verts, puisque les mutations sont plantées par le script
      # lui-même. Ce banc mesure donc une page de contrôle générée ici — image
      # 600 × 300 dans une boîte 200 × 100, puis déformée, puis en basse
      # résolution — et confronte les nombres du rapport à l'arithmétique.
      # Trois cas, quatre relevés chacun, périmètre réduit déclaré.
      - name: Éprouver la mesure des graphismes sur une page de contrôle
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
        run: |
          set +e
          node outils/test_mesure_graphismes.mjs >"$RUNNER_TEMP/mesure-graphismes.log" 2>&1
          statut=$?
          set -e
          cat "$RUNNER_TEMP/mesure-graphismes.log"
          if [ "$statut" -ne 0 ]; then
            grep -E '^(ÉCHEC|Environnement|Error|.*Error:)' "$RUNNER_TEMP/mesure-graphismes.log" | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Mesure des graphismes::$ligne"
            done
            exit "$statut"
          fi

      # Neuf essais interactifs (panneau, clavier, en-tête compact, stockage
      # bloqué, guide, lecture à voix haute, iframe synchronisée). Le script
      # existait depuis le 14 octobre et **aucun workflow ne le lançait** : il
      # n'était exercé qu'à la main, sur une machine avec Chromium. Ce job est le
      # seul à installer Chromium, d'où sa place ici.
      #
      # Les essais passent par `outils/serveur-local.py`, que le script démarre
      # lui-même : c'est écrit dans sa documentation, et c'est nécessaire. La
      # page `simulateur/` attend son API (`chargerContexte`, `chargerLexique`)
      # avant d'ouvrir le guide ; servie par un simple `http.server`, elle reçoit
      # des 404 et n'ouvre jamais `#overlay.visible`. Quatre des neuf essais
      # tombent alors en `TimeoutError` — constaté le 29 octobre, lisible dans
      # les annotations de l'exécution 40971214478.
      #
      # Les échecs sont aussi publiés en annotations : les journaux complets de
      # GitHub Actions ne sont pas joignables depuis l'atelier qui tient ce
      # dépôt, alors qu'une annotation se lit par l'API. Sans cela, « le job est
      # rouge » serait tout ce qu'on saurait — et on ne saurait pas réparer.
      - name: Éprouver les essais navigateur du panneau et du menu
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
        run: |
          set +e
          node outils/test-experience.cjs >"$RUNNER_TEMP/essais.log" 2>&1
          statut=$?
          set -e
          cat "$RUNNER_TEMP/essais.log"
          if [ "$statut" -ne 0 ]; then
            # Trois lignes de contexte après chaque échec : la première dit
            # qu'un essai a échoué, les suivantes nomment l'assertion et sa
            # ligne. Sans elles, une annotation ne permet pas de réparer.
            # Huit lignes de contexte, et pas trois : le 31 octobre 2026, la
            # cause d'un `TimeoutError` vivait au cinquième cadre, et l'annotation
            # n'avait gardé que les trois premiers — tous internes à Puppeteer.
            grep -E -A8 '^(ÉCHEC|Error|.*AssertionError|.*Error:|.*test-experience\.cjs:)' "$RUNNER_TEMP/essais.log" \
              | head -n 80 | cut -c1-900 | grep -v '^--$' | while IFS= read -r ligne; do
              echo "::error title=Essais navigateur::$ligne"
            done
            exit "$statut"
          fi

      # Le dépôt mesurait les contrastes, le focus, la taille des cibles et
      # l'espacement du texte. Aucune de ces mesures ne dit ce qu'un lecteur
      # d'écran reçoit : le 13 novembre 2026, 397 listes du site n'étaient plus
      # annoncées comme des listes dans WebKit, faute de `role="list"`, et rien
      # ne le voyait. Ce relevé lit l'arbre d'accessibilité de Chromium — rôles,
      # noms, niveaux de titres, repères, zones vivantes, cadres — sur les 122
      # pages publiées, puis le refuse s'il manque une information.
      #
      # Il vit ici pour la même raison que les essais navigateur : ce job est le
      # seul à installer Chromium. Les échecs sont publiés en annotations, le
      # journal complet de l'exécution n'étant pas lisible depuis l'atelier.
      - name: Mesurer l’arbre d’accessibilité et refuser ce qui y manque
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_TEST_URL: http://127.0.0.1:4186/
        run: |
          mkdir -p "$RUNNER_TEMP/graphismes/arbre"
          python3 outils/arbre-accessibilite.py --plan "$RUNNER_TEMP/graphismes/arbre/plan.json"
          python3 outils/test_arbre_accessibilite.py
          python3 -m http.server 4186 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-arbre.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          sleep 1
          set +e
          node outils/mesurer-arbre-accessibilite.cjs \
            "$RUNNER_TEMP/graphismes/arbre/plan.json" \
            "$RUNNER_TEMP/graphismes/arbre/rapport.json" \
            >"$RUNNER_TEMP/graphismes/arbre/mesure.log" 2>&1
          mesure=$?
          set -e
          cat "$RUNNER_TEMP/graphismes/arbre/mesure.log"
          if [ "$mesure" -ne 0 ]; then
            grep -E '^(  -|Environnement)' "$RUNNER_TEMP/graphismes/arbre/mesure.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Arbre d’accessibilité::$ligne"
            done
            exit "$mesure"
          fi
          set +e
          python3 outils/arbre-accessibilite.py --controler \
            "$RUNNER_TEMP/graphismes/arbre/rapport.json" \
            >"$RUNNER_TEMP/graphismes/arbre/controle.log" 2>&1
          controle=$?
          set -e
          head -n 6 "$RUNNER_TEMP/graphismes/arbre/controle.log" | cut -c1-900 | while IFS= read -r ligne; do
            echo "::notice title=Arbre d’accessibilité::$ligne"
          done
          if [ "$controle" -ne 0 ]; then
            grep -E '^  !' "$RUNNER_TEMP/graphismes/arbre/controle.log" \
              | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Arbre d’accessibilité::$ligne"
            done
            exit "$controle"
          fi

      - name: Conserver les mesures et captures même en échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesures-graphismes
          path: ${{ runner.temp }}/graphismes
          retention-days: 14
