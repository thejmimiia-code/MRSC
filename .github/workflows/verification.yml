name: Vérification du site M.R.S.C

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Vérifier la version du CSS de la page IA
        run: |
          python3 outils/test_version_css_ia.py
          python3 outils/versionner-css-ia.py --verifier

      - name: Compiler les modules Python
        run: python3 -m py_compile simulateur/*.py api/*.py outils/*.py

      - name: Vérifier les exemples de moyenne et médiane
        run: python3 outils/test_exemples_statistiques.py

      - name: Vérifier les fiches d’apprentissage générées
        shell: bash
        run: |
          sortie="$RUNNER_TEMP/verification-apprentissages.log"
          if python3 outils/construire-apprentissages.py --verifier --rapport "$RUNNER_TEMP/veille-apprentissages.md" >"$sortie" 2>&1; then
            cat "$sortie"
          else
            statut=$?
            cat "$sortie"
            tail -n 12 "$sortie" | while IFS= read -r ligne; do
              ligne="${ligne//'%'/'%25'}"
              ligne="${ligne//$'\r'/'%0D'}"
              printf '::error title=Vérification des fiches::%s\n' "$ligne"
            done
            exit "$statut"
          fi

      - name: Vérifier la page générée du simulateur
        run: python3 outils/construire-simulateur.py --verifier

      # `verifier-maj-amont.py` interroge le dépôt amont en réseau : il ne tourne
      # pas ici. Ce qui tourne, c'est sa décision — révision identique, révision
      # en retard, amont injoignable, sortie JSON — avec la sonde remplacée.
      - name: Vérifier la décision de la sentinelle du moteur embarqué
        run: python3 outils/test_verifier_maj_amont.py

      # Ce contrôle garde une règle de dépôt — « ne rien perdre en fusionnant » —
      # et n'avait aucun test. Le banc fabrique de petits dépôts git neufs et
      # casse une propriété à la fois (marqueur, `.orig`, ordre du journal, titre
      # en double, branche au contenu unique), sans jamais muter le vrai dépôt.
      - name: Vérifier qu'aucune fusion n'est restée inachevée
        run: |
          python3 outils/verifier-fusions.py
          python3 outils/test_mutations_fusions.py

      # La file de relecture est ce qu'une personne suivra pour les 59
      # prototypes : sa garde était la seule comparaison avec sa régénération.
      # Le banc la fait diverger, la supprime, l'édite à la main, et vérifie que
      # le tri par mots-clés classe encore une fiche sensible hors domaine.
      - name: Vérifier la file de relecture générée
        run: |
          python3 outils/file-relecture.py --verifier
          python3 outils/test_mutations_files_relecture.py

      - name: Vérifier les contrôles automatiques et le registre des relectures
        run: |
          python3 outils/test_audit_prototypes.py
          python3 outils/auditer-prototypes.py --verifier
          python3 outils/construire-paquets-relecture.py --verifier
          python3 outils/test_registre_relecture.py
          python3 outils/registre-relecture.py
          python3 outils/test_sources_refusees.py
          python3 outils/construire-sources-refusees.py --verifier
          python3 outils/test_confronter_sources.py
          python3 outils/confronter-sources.py --verifier

      # Le 28 octobre 2026, la carte `docs/rd/sujet-revenus-salaire-impots.md` a
      # fixé une règle : un taux daté n'entre pas dans une fiche. Ce contrôle la
      # rend exécutable. Il ne trouve rien aujourd'hui — c'est pourquoi son test
      # de mutation existe : sans lui, un contrôle préventif ne prouverait rien.
      - name: Vérifier qu'aucune règle chiffrée n'est écrite sans sa date
        run: |
          python3 outils/test_verifier_taux_dates.py
          python3 outils/verifier-taux-dates.py

      - name: Vérifier les avancées R&D consignées
        run: |
          python3 outils/test_avancees.py
          python3 outils/construire-avancees.py --verifier

      # La mémoire du projet — skills, portefeuille, avancées, sources refusées,
      # relectures, veille — n'était prouvée que par son propre vert. Le banc
      # casse une initiative, un skill, une ancre publique et l'horaire de la
      # veille, dans une copie complète du dépôt (5 s).
      - name: Vérifier le portefeuille et la continuité R&D
        run: |
          python3 outils/verifier-rd-continue.py
          python3 outils/test_mutations_rd_continue.py

      # L'inventaire `docs/rd/inventaire-controles.md` répond, outil par outil,
      # à « qu'est-ce qui prouve que ce contrôle peut échouer ? ». Ce garde-là
      # empêche l'oubli ; son banc plante cinq fautes dans une copie du dépôt,
      # dont celle qui compte : un outil ajouté sans ligne dans l'inventaire.
      - name: Vérifier que l'inventaire des contrôles reste complet
        run: |
          python3 outils/test_verifier_inventaire_controles.py
          python3 outils/verifier-inventaire-controles.py

      - name: Vérifier les faits internes du brief prospectif
        run: |
          python3 outils/test_verifier_decision_prospective.py
          python3 outils/verifier-decision-prospective.py

      - name: Vérifier les garde-fous du vote distanciel
        run: |
          python3 outils/test_verifier_vote_distanciel.py
          python3 outils/verifier-vote-distanciel.py

      - name: Vérifier le protocole éditorial commun
        run: python3 outils/test_protocole_editorial.py

      - name: Vérifier la séparation des contenus personnels
        run: |
          python3 outils/test_separation_contenus.py
          python3 outils/verifier-separation-contenus.py

      - name: Vérifier les pages, liens et scripts statiques
        run: |
          python3 outils/verifier-site-statique.py
          python3 outils/test_mutations_site_statique.py

      # Le défaut d'origine : un favicon présent dans le dépôt, demandé par les
      # pages, et absent de la liste de copie du workflow — donc introuvable sur
      # le site. Le banc retire un fichier de cette liste, oublie une page,
      # casse un lien, élargit puis rétrécit l'aperçu local et déplace une
      # adresse du sitemap, dans une copie complète du dépôt.
      - name: Vérifier que le site publié ne manque d’aucun fichier
        run: |
          python3 outils/verifier-publication-locale.py
          python3 outils/test_mutations_publication_locale.py

      # Le relevé d’en-têtes est fait en réseau, hors de cette porte : ici on
      # confronte seulement ce relevé aux fichiers du dépôt. Un binaire dont la
      # taille ne correspond plus signale une mesure devenue fausse, à refaire.
      - name: Vérifier le relevé des fichiers réellement servis
        run: |
          python3 outils/test_fichiers_servis.py
          python3 outils/verifier-fichiers-servis.py

      # Le contrôle réseau du périmètre ne peut pas tourner hors ligne : ce test
      # vérifie qu'il détecte un hébergement qui publie la racine du dépôt, cas
      # survenu le 25 octobre 2026 avec une source Pages « Deploy from a branch ».
      - name: Vérifier le contrôle du périmètre de publication
        run: python3 outils/test_verifier_publication.py

      # Le script écrit ses refus sur la sortie d’erreur : sans ce relais, un
      # échec n’affichait que « exit code 1 » dans l’onglet des vérifications,
      # ce qui interdisait de savoir quel fichier ou quelle largeur posait
      # problème. Chaque ligne fautive est donc remontée en annotation.
      - name: Vérifier le manifeste des variantes d’images
        shell: bash
        run: |
          python3 outils/test_manifeste_sans_imagemagick.py
          sortie="$RUNNER_TEMP/manifeste-images.log"
          if python3 outils/optimiser-images.py --verifier >"$sortie" 2>&1; then
            cat "$sortie"
          else
            statut=$?
            cat "$sortie"
            tail -n 12 "$sortie" | while IFS= read -r ligne; do
              ligne="${ligne//'%'/'%25'}"
              ligne="${ligne//$'\r'/'%0D'}"
              printf '::error title=Manifeste des variantes::%s\n' "$ligne"
            done
            exit "$statut"
          fi

      # Le site annonce des budgets de poids : 300 Kio mobile, 450 Kio grand
      # écran. Rien ne prouvait que le contrôle qui les applique sache refuser.
      # Le banc ajoute une image de 400 Kio, une ressource absente, un <picture>
      # sans repli, et abaisse le budget à 1 Kio sur une copie intacte (22 s).
      - name: Vérifier le poids estimé des pages
        run: |
          python3 outils/verifier-poids-pages.py
          python3 outils/test_mutations_poids_pages.py

      # Ce contrôle garde 12 planches, 203 liens d'image et 343 empreintes
      # d'archive : beaucoup de surface, aucune preuve qu'il refuse. Le banc
      # casse une planche, une référence, un lien, deux fois le manifeste, suit
      # un PNG, et retire le dépôt git — car un `git ls-files` en échec rendait
      # autrefois « aucun PNG suivi » au lieu d'un doute. Copie complète, 1,3 s.
      - name: Vérifier les planches des statuts et leur archive
        run: |
          python3 outils/verifier-planches-statuts.py
          python3 outils/test_mutations_planches_statuts.py

      - name: Installer Node.js pour le banc de l'auditeur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Cet auditeur mesure trois critères WCAG dans un vrai Chromium, et son
      # banc tourne ici plutôt que dans `graphismes` : il ne mesure rien. Deux
      # faux paquets (`outils/faux-navigateur/`) remplacent `puppeteer-core` et
      # `@sparticuz/chromium`, et le vrai script est lancé tel quel. Ce qui est
      # éprouvé, c'est le contrat de sortie — un chargement en échec ne se lit
      # pas « 0 défaut », et une cible à corriger garde la largeur de fenêtre à
      # côté de la sienne. Coût : 4 s, aucun binaire à télécharger.
      - name: Éprouver l'auditeur des critères WCAG 2.2 sans navigateur
        run: node outils/test_auditer_criteres_22.mjs

      # `verifier-fiches-statistiques.cjs` promène deux fiches dans 288
      # configurations et écrit un relevé JSON. Son pire défaut serait un relevé
      # absent ou vide qui se lit « zéro échec ». Le banc le lance quatre fois
      # avec le faux navigateur : nominal, géométrie fautive, statut absent,
      # chargement impossible (code 2, aucun relevé écrit) — et vérifie que le
      # relevé commité de `docs/rd/` n'a pas bougé. 5 cas, 0,3 s.
      - name: Éprouver la géométrie des fiches de statistiques
        run: node outils/test_verifier_fiches_statistiques.mjs

      # Le balayage axe-core visite 12 pages et une vingtaine d'états
      # interactifs (menu, panneau, contraste, lecture à voix haute, filtres,
      # aides dépliées, mission des Mondes, commandes du simulateur). Le faux
      # navigateur rejoue les mêmes parcours sans Chromium, en 40 s — le script
      # attend ses états comme en vrai, d'où le coût. Ce qui est éprouvé : une
      # violation sort en code 1 et reste attachée à son état, un chargement
      # impossible sort en code 2 sans écrire de rapport, et chaque exécution
      # annoncée a bien son verdict.
      - name: Éprouver le balayage d'accessibilité
        run: node outils/test_verifier_accessibilite.mjs

      # `test-cache-css-ia.cjs` simule un CSS périmé servi sous l'ancienne URL :
      # il intercepte la requête de la feuille et sert lui-même deux CSS. Sa
      # panne discrète n'est pas un écart de géométrie, c'est de ne plus servir
      # l'ancienne feuille — le test afficherait alors un bilan vert sans rien
      # reproduire. Le banc rejoue les cinq cas avec le faux navigateur (le faux
      # rejoue l'interception et tire l'écart du CSS réellement servi) : nominal,
      # version périmée, attente inversée, interception retirée, ancien CSS
      # identique au courant. 0,5 s, aucun binaire à télécharger.
      - name: Éprouver le test du cache CSS
        run: node outils/test_test_cache_css_ia.mjs

      # `auditer-affichages.mjs` mesure 13 pages dans 19 formats et 10 modes :
      # 2 470 mesures, chacune suivie d'une pause de 120 ms dans le script, soit
      # dix minutes par exécution. Le banc réduit donc le périmètre à une page,
      # un format et deux modes **dans une copie jetable**, et il le dit dans son
      # en-tête : ce qu'il éprouve est le traitement d'une mesure et le code de
      # sortie, pas la couverture des formats. 3 cas, 2,7 s.
      - name: Éprouver la mesure d'affichage
        run: node outils/test_auditer_affichages.mjs

      # `etat-rd.py` imprime le tableau que le brief de décision prospective cite
      # comme pièce justificative. Son pire défaut n'était pas de se tromper mais
      # de se taire : une source absente retirait ses lignes, et le tableau
      # gardait l'air complet. Le banc retire chaque source dans une copie et
      # exige que le manque soit nommé, avec un code non nul. 7 cas, 1,2 s.
      - name: Éprouver l'état de la R&D
        run: |
          python3 outils/etat-rd.py > /dev/null
          python3 outils/test_etat_rd.py

      # Dernier contrôle sans preuve. `verifier-source-distante.py` interroge la
      # version en ligne du simulateur ; son banc ne simule pas HTTP, il le fait :
      # un serveur local servant les réponses voulues, et le script lancé en
      # sous-processus avec l'exception `SIMULATEUR_SOURCE_DISTANTE_TEST_LOCALE`.
      # Sont donc réellement exercés la liste d'hôtes autorisés, urllib, les
      # marqueurs de page, la lecture du JSON, l'ordre des routes et le code de
      # sortie. 9 cas, 4,5 s, aucun octet sortant hors de la boucle locale.
      - name: Éprouver la vérification de la source distante
        run: python3 outils/test_verifier_source_distante.py

      # Cette porte garde les frontières HTTP et WSGI, la provenance navigateur,
      # la liste statique et l'épinglage des actions : elle n'avait aucun test
      # jusqu'au 28 octobre 2026. Le banc plante six fautes réelles dans une
      # copie du dépôt — en-tête retiré, limite Vercel abaissée, action
      # dé-épinglée, runner mouvant, liste statique élargie, plafond de source
      # supprimé — et exige l'échec avec le message attendu.
      - name: Vérifier les frontières de sécurité
        run: |
          python3 outils/verifier-securite.py
          python3 outils/test_mutations_securite.py

      # La dernière porte à forte conséquence qui ne fût vérifiée que par
      # elle-même. Son banc coûte 67 s — la porte lance quatre outils et monte
      # un serveur à chaque exécution —, ce qui le réserve aux pull requests :
      # rejouer les mêmes trois fautes à chaque publication n'apprendrait rien
      # de neuf et doublerait la durée du travail de mise en ligne.
      - name: Vérifier l’intégration des routes et du site
        run: |
          python3 outils/verifier-integration.py
          python3 outils/test_mutations_integration.py

      # Nés de la panne du 22 octobre 2026 : deux sorties commitées portaient la
      # date du jour de leur génération et faisaient échouer cette porte, puis la
      # publication du site, dès le lendemain. Le premier contrôle rejoue toutes
      # les portes qui comparent un fichier généré avec une horloge déplacée de
      # +37 et +400 jours ; le second mesure ce qu’aucun test ne voyait — la
      # longueur des titres de page et le rendu étroit du H1 de l’accueil.
      - name: Vérifier la reproductibilité des sorties générées
        run: python3 outils/test_reproductibilite_artefacts.py

      # Ces budgets existent parce qu'aucun test ne voyait un titre tronqué ni un
      # H1 qui s'allonge : leur propre pouvoir de mordre est éprouvé juste après.
      - name: Vérifier les budgets d’affichage des titres et du H1
        run: |
          python3 outils/verifier-budgets-visuels.py
          python3 outils/test_mutations_budgets_visuels.py

      # Les appuis de la mesure d'affichage (planchers de texte et de cible,
      # plafonds d'image par densité, mesure de lecture) : la mesure complète
      # demande un navigateur, ces règles-ci se vérifient partout.
      - name: Vérifier les garde-fous des formats d’affichage
        run: |
          python3 outils/verifier-affichages.py
          python3 outils/test_mutations_affichages.py

  graphismes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Installer le navigateur de mesure
        run: npm install --prefix "$RUNNER_TEMP/mrsc-browser" puppeteer-core@25.16.0 @sparticuz/chromium@153.0.0
      - name: Mesurer les trois visuels dans les modes couverts
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_GRAPHISMES_JSON: ${{ runner.temp }}/graphismes/releve.json
          MRSC_CAPTURES: ${{ runner.temp }}/graphismes/captures
        run: |
          python3 -m http.server 4181 --bind 0.0.0.0 >"$RUNNER_TEMP/serveur-graphismes.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur"' EXIT
          MRSC_FICHES_JSON="$RUNNER_TEMP/graphismes/fiches-statistiques.json" node outils/verifier-fiches-statistiques.cjs
          node outils/test-cache-css-ia.cjs
          node outils/verifier-graphismes.cjs
          # Le code de sortie ne dit pas *pourquoi* la mesure a échoué : une
          # mutation qui ferait céder le contrôle pour une panne sans rapport
          # laisserait la CI verte. Chaque passe mutée doit donc constater
          # l'erreur qu'elle est censée provoquer — c'est le rôle de
          # `verifier-mutation-graphismes.py`, testé hors navigateur (6 cas).
          for mutation in distorsion densite ancre; do
            set +e
            MRSC_MUTATION="$mutation" MRSC_GRAPHISMES_JSON="$RUNNER_TEMP/graphismes/mutation-$mutation.json" node outils/verifier-graphismes.cjs
            statut=$?
            set -e
            test "$statut" -eq 1
            python3 outils/verifier-mutation-graphismes.py "$RUNNER_TEMP/graphismes/mutation-$mutation.json" "$mutation"
          done
      # Neuf essais interactifs (panneau, clavier, en-tête compact, stockage
      # bloqué, guide, lecture à voix haute, iframe synchronisée). Le script
      # existait depuis le 14 octobre et **aucun workflow ne le lançait** : il
      # n'était exercé qu'à la main, sur une machine avec Chromium. Ce job est le
      # seul à installer Chromium, d'où sa place ici.
      #
      # Les échecs sont aussi publiés en annotations : les journaux complets de
      # GitHub Actions ne sont pas joignables depuis l'atelier qui tient ce
      # dépôt, alors qu'une annotation se lit par l'API. Sans cela, « le job est
      # rouge » serait tout ce qu'on saurait — et on ne saurait pas réparer.
      - name: Éprouver les essais navigateur du panneau et du menu
        env:
          MRSC_BROWSER_NODE_MODULES: ${{ runner.temp }}/mrsc-browser/node_modules
          MRSC_TEST_URL: http://127.0.0.1:4181/
        run: |
          python3 -m http.server 4181 --bind 127.0.0.1 >"$RUNNER_TEMP/serveur-essais.log" 2>&1 &
          serveur=$!
          trap 'kill "$serveur" 2>/dev/null || true' EXIT
          set +e
          node outils/test-experience.cjs >"$RUNNER_TEMP/essais.log" 2>&1
          statut=$?
          set -e
          cat "$RUNNER_TEMP/essais.log"
          if [ "$statut" -ne 0 ]; then
            grep -E '^(ÉCHEC|Error|.*AssertionError|.*Error:)' "$RUNNER_TEMP/essais.log" | head -n 10 | cut -c1-900 | while IFS= read -r ligne; do
              echo "::error title=Essais navigateur::$ligne"
            done
            exit "$statut"
          fi

      - name: Conserver les mesures et captures même en échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesures-graphismes
          path: ${{ runner.temp }}/graphismes
          retention-days: 14
