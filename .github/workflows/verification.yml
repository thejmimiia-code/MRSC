name: Vérification du site M.R.S.C

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compiler les modules Python
        run: python3 -m py_compile simulateur/*.py api/*.py outils/*.py

      - name: Vérifier les contenus, pages et pratiques R&D
        run: |
          python3 outils/construire-apprentissages.py --verifier
          python3 outils/construire-simulateur.py --verifier
          python3 outils/verifier-rd-continue.py
          python3 outils/verifier-site-statique.py

      - name: Vérifier les frontières de sécurité
        run: python3 outils/verifier-securite.py

      - name: Vérifier l’intégration des routes et du site
        run: python3 outils/verifier-integration.py
