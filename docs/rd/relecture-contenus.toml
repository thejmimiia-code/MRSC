limites = "Un appel de contrôle sur une ligne ne prouve pas la stabilité du schéma : un champ renommé ferait refuser la collecte, pas produire un chiffre faux, mais l’outil ne teste que le champ département. Les prix absents (`null`) ne sont pas distingués d’un carburant non vendu par la station."
