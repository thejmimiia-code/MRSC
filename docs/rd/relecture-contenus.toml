[[source]]
id = "data-gouv-dvf"
extrait = "docs/rd/sources-primaires/data-gouv-dvf.txt"
editeur = "DGFiP (Ministères économiques et financiers), via data.gouv.fr"
titre = "Demandes de valeurs foncières (DVF)"
url = "https://www.data.gouv.fr/datasets/demandes-de-valeurs-foncieres"
consulte_le = 2026-11-14
ancre = "mise à jour semestrielle"
permet = "Établir que le fichier est produit par la DGFiP, semestriel, sous Licence Ouverte 2.0, qu’il exclut l’Alsace, la Moselle et Mayotte, et que sa réutilisation interdit la ré-identification et l’indexation."
limites = "La fiche décrit le fichier, elle ne dit rien de la qualité des prix, ni des ventes non enregistrées, ni des écarts entre communes. Elle ne prouve pas que le fichier téléchargé est intact : c’est l’empreinte SHA-1 de la ressource qui le dira. Les fichiers antérieurs sont supprimés à chaque mise à jour, donc un chiffre publié n’est reproductible qu’avec l’archive du jour."

