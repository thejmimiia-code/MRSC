# Registre de relecture PAR AGENT, distinct du registre des relectures humaines.
#
# Le 7 novembre 2026, la personne a explicitement confié à l'agent la relecture
# de contenu et la vérification des sources, en gardant pour elle la validation
# du rendu à l'oeil (placement, style, construction). Ce fichier consigne cette
# relecture d'agent : elle n'écrit PAS dans docs/apprentissage/relectures.toml,
# ne promeut aucune fiche et ne se présente jamais comme une validation humaine,
# une expertise de domaine, un avis juridique ni un essai auprès de personnes.
#
# Chaque [[affirmation]] rattache une chaîne publique ou une affirmation de
# méthode à des sources primaires datées ou à une mesure interne reproductible.
# outils/verifier-relecture-contenus.py éprouve ce registre et sa couverture.

[meta]
version = 1
date_relecture = 2026-11-07
dates_lots = [2026-11-07, 2026-11-12, 2026-11-14]
auteur = "agent"
lot = "apparences-du-7-novembre-2026-et-declaration-fraudes-du-12-novembre-2026-et-cout-de-la-vie-du-14-novembre-2026"
statut = "relu-par-agent-sources-confrontees"
regle = "La personne valide le rendu à l'oeil ; l'agent relit les contenus, confronte chaque fait à une source primaire datée et consigne les limites. Aucune chaîne publique du lot sans entrée ici."
rapport = "docs/rd/relecture-apparences-2026-11-07.md"


[portee]
regle = "Le 9 novembre 2026, la relecture de contenu et la vérification des sources sûres sont rendues automatiques à toutes les éditions : l'agent relit, la personne garde le rendu à l'oeil."
declencheurs = [".github/workflows/relecture-contenus.yml", ".github/workflows/verification.yml", ".githooks/pre-commit"]
manifeste = "docs/rd/empreintes-contenus.toml"
editions = "docs/rd/editions-relecture.toml"
extraits = "docs/rd/sources-primaires"
limite = "L'automatisation vérifie des empreintes, des liens, des extraits datés et des sources primaires ; elle ne juge pas la vérité d'une phrase, ne fabrique aucune expertise humaine et n'écrit jamais dans docs/apprentissage/relectures.toml. Le corpus existant reste une dette de relecture de fond consignée, pas un contenu déclaré validé."

[[source]]
id = "mdn-color-scheme"
extrait = "docs/rd/sources-primaires/mdn-color-scheme.txt"
editeur = "MDN Web Docs (Mozilla)"
titre = "color-scheme CSS property"
url = "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/color-scheme"
consulte_le = 2026-11-07
ancre = "\"light\" and \"dark\""
permet = "Confirmer que light et dark sont les deux schémas de couleur courants des systèmes, que color-scheme les déclare et qu'une balise meta placée avant le CSS aide à éviter un éclair de thème au chargement."
limites = "Page de référence maintenue par Mozilla, documentation et non texte normatif ; elle décrit les schémas du système d'exploitation, pas la fréquence des réglages proposés par les sites Web. Elle ne fournit aucune statistique d'usage et ne valide aucun choix éditorial du M.R.S.C."

[[source]]
id = "mdn-prefers-color-scheme"
extrait = "docs/rd/sources-primaires/mdn-prefers-color-scheme.txt"
editeur = "MDN Web Docs (Mozilla)"
titre = "prefers-color-scheme CSS media feature"
url = "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-color-scheme"
consulte_le = 2026-11-07
ancre = "light or dark color themes"
permet = "Confirmer que la préférence clair/sombre est exprimée par un réglage du système ou du navigateur, et que la valeur light couvre aussi l'absence de préférence active."
limites = "Documentation de référence, non spécification normative ; le comportement exact dépend du navigateur et du système. Elle n'atteste pas que le script du site suit effectivement cette préférence : cette vérification-là est une mesure interne."

[[source]]
id = "mdn-forced-colors"
extrait = "docs/rd/sources-primaires/mdn-forced-colors.txt"
editeur = "MDN Web Docs (Mozilla)"
titre = "forced-colors CSS media feature"
url = "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/forced-colors"
consulte_le = 2026-11-07
ancre = "forced to 'none'"
permet = "Confirmer qu'en mode couleurs forcées le navigateur remplace les couleurs auteur et force background-image à none pour les valeurs non-URL, et que la fonction sert à de petits ajustements, pas à un second design."
limites = "Le comportement varie selon le navigateur et la plateforme ; MDN recommande de ne pas créer un design séparé. La règle du dépôt qui neutralise les décors reste donc un ajustement prudent, pas une garantie de conformité."

[[source]]
id = "mdn-prefers-reduced-motion"
extrait = "docs/rd/sources-primaires/mdn-prefers-reduced-motion.txt"
editeur = "MDN Web Docs (Mozilla)"
titre = "prefers-reduced-motion CSS media feature"
url = "https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-reduced-motion"
consulte_le = 2026-11-07
ancre = "non-essential motion"
permet = "Confirmer que reduce demande à réduire ou remplacer les animations non essentielles, et qu'aucune animation ajoutée est la réponse la plus sûre."
limites = "La page documente la préférence, pas son application dans ce dépôt ; l'absence d'animation dans les décors est vérifiée séparément par une porte locale. Elle ne dit rien des transitions déjà présentes sur le site."

[[source]]
id = "mdn-theme-color"
extrait = "docs/rd/sources-primaires/mdn-theme-color.txt"
editeur = "MDN Web Docs (Mozilla)"
titre = "meta name=theme-color"
url = "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/theme-color"
consulte_le = 2026-11-07
ancre = "a suggested color"
permet = "Confirmer que theme-color est une couleur suggérée à l'agent utilisateur pour l'interface autour de la page, définie par l'attribut content."
limites = "MDN classe cette fonctionnalité en disponibilité limitée : Firefox bureau et plusieurs navigateurs ne la prennent pas en charge. La mise à jour de la balise par le script est donc une suggestion, jamais un rendu garanti."

[[source]]
id = "w3c-contrast-minimum"
extrait = "docs/rd/sources-primaires/w3c-contrast-minimum.txt"
editeur = "W3C / Web Accessibility Initiative"
titre = "Understanding SC 1.4.3 Contrast (Minimum), WCAG 2.2"
url = "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html"
consulte_le = 2026-11-07
ancre = "at least 4.5:1"
permet = "Confirmer le seuil de 4,5:1 pour le texte normal, 3:1 pour le grand texte, l'absence d'arrondi des seuils (4,499:1 échoue) et l'usage des couleurs déclarées plutôt que du rendu à l'écran."
limites = "Document d'accompagnement (Understanding), non texte normatif ; il ne couvre pas les états de survol, de focus, les dégradés ni les combinaisons particulières du site. Le contrôle local mesure des paires de jetons déclarées."

[[source]]
id = "w3c-non-text-contrast"
extrait = "docs/rd/sources-primaires/w3c-non-text-contrast.txt"
editeur = "W3C / Web Accessibility Initiative"
titre = "Understanding SC 1.4.11 Non-text Contrast, WCAG 2.2"
url = "https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html"
consulte_le = 2026-11-07
ancre = "at least 3:1"
permet = "Confirmer le seuil de 3:1 pour les composants d'interface et les objets graphiques porteurs d'information, là aussi sans arrondi."
limites = "Le document précise que le seuil porte sur les couleurs adjacentes et que certains éléments (composants inactifs, décoration) en sont exclus ; appliquer 3:1 à une paire de jetons ne prouve pas la conformité de tous les états d'interface."

[[source]]
id = "w3c-luminance"
extrait = "docs/rd/sources-primaires/w3c-luminance.txt"
editeur = "W3C / groupe de travail WCAG (dépôt w3c/wcag)"
titre = "Définition de relative luminance, WCAG 2.2"
url = "https://github.com/w3c/wcag/blob/main/guidelines/terms/20/relative-luminance.html"
consulte_le = 2026-11-07
ancre = "0.04045"
permet = "Confirmer la formule L = 0,2126 R + 0,7152 G + 0,0722 B et le seuil de linéarisation 0,04045, qui remplace 0,03928 depuis mai 2021."
limites = "Fichier source du glossaire WCAG lu le 7 novembre 2026 ; la note du W3C précise que le changement de seuil n'a pas d'effet pratique sur les calculs dans le contexte de ces règles. La correction faite ici aligne la porte sur la définition actuelle, elle ne change aucun résultat mesuré."

