# Lot « coût de la vie » : les carburants, fiche de licence et flux réellement appelé.

[[source]]
id = "data-gouv-carburants"
extrait = "docs/rd/sources-primaires/data-gouv-carburants.txt"
editeur = "DGCCRF (Ministères économiques et financiers), via data.gouv.fr"
titre = "Prix des carburants en France, flux instantané (v2 améliorée)"
url = "https://www.data.gouv.fr/datasets/prix-des-carburants-en-france-flux-instantane-v2-amelioree"
consulte_le = 2026-11-14
ancre = "toutes les 10 minutes"
permet = "Établir que les prix à la pompe sont publiés par la DGCCRF sous Licence Ouverte, station par station, avec leur date de mise à jour — donc qu’une médiane départementale peut être calculée sur des prix réellement affichés."
limites = "La fiche décrit le dispositif, pas les prix : elle ne dit ni combien de stations répondent, ni si toutes déclarent, ni si un prix affiché est un prix pratiqué. Elle ne dit rien du prix payé (promotions, lavage, cartes de fidélité), et une station peut manquer sans que rien ne le signale."

