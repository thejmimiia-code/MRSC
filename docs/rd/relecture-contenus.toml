[[source]]
id = "service-public-hameconnage"
extrait = "docs/rd/sources-primaires/service-public-hameconnage.txt"
editeur = "Service-Public.gouv.fr (DILA)"
titre = "Hameçonnage (phishing ou vishing)"
url = "https://www.service-public.gouv.fr/particuliers/vosdroits/F34800"
consulte_le = 2026-11-12
ancre = "pas une plainte"
permet = "Confirmer que le hameçonnage est qualifié de délit, que le signalement n'est pas une plainte, que la plainte reste ouverte à la victime et que les services en ligne associés sont ceux cités."
limites = "Page d'information administrative, pas un texte de loi : elle résume la qualification et les voies de plainte sans les rédiger. Elle ne dit rien du délai de traitement d'une plainte, ni du remboursement effectif par une banque, ni des cas où la qualification retenue serait différente. Elle ne remplace ni un avis juridique ni l'accompagnement d'une victime."

[[source]]
id = "service-public-arnaques-internet"
extrait = "docs/rd/sources-primaires/service-public-arnaques-internet.txt"
editeur = "Service-Public.gouv.fr (DILA)"
titre = "Arnaques sur internet (THESEE, Pharos ...)"
url = "https://www.service-public.gouv.fr/particuliers/vosdroits/N31138"
consulte_le = 2026-11-12
ancre = "cybercriminalité"
permet = "Situer les familles d'escroqueries en ligne que l'administration distingue — rançongiciel, compte piraté, hameçonnage, achat, location, sentiments — et vérifier le renvoi vers Perceval et vers Pharos."
limites = "Page d'aiguillage : elle liste des situations mais ne décrit aucune procédure complète et ne donne aucun chiffre. Les situations qu'elle omet ne sont pas inexistantes ; l'ordre de ses entrées n'indique ni fréquence ni gravité. Elle ne prouve pas qu'une situation donnée relève de la catégorie où on la range."

[[source]]
id = "service-public-perceval"
extrait = "docs/rd/sources-primaires/service-public-perceval.txt"
editeur = "Service-Public.gouv.fr (DILA)"
titre = "Fraude à la carte bancaire"
url = "https://www.service-public.gouv.fr/particuliers/vosdroits/F31324"
consulte_le = 2026-11-12
ancre = "opposition à ma carte"
permet = "Vérifier l'ordre des démarches après une fraude à la carte : opposition d'abord, puis déclaration en ligne avec FranceConnect, récépissé délivré, traitement par la gendarmerie nationale."
limites = "Page d'information administrative, vérifiée le 13 février 2026 : elle décrit le parcours tel qu'il est publié à cette date, sans garantir que le service reste disponible ni que le remboursement soit obtenu. Elle ne dit pas quel délai s'applique à chaque banque et ne traite pas les cartes perdues ou volées, qui relèvent d'une autre démarche."

[[source]]
id = "service-public-pharos"
extrait = "docs/rd/sources-primaires/service-public-pharos.txt"
editeur = "Service-Public.gouv.fr (DILA)"
titre = "Signaler un contenu internet illégal (internet-signalement : Pharos)"
url = "https://www.service-public.gouv.fr/particuliers/vosdroits/R17674"
consulte_le = 2026-11-12
ancre = "visualisé et sauvegardé"
permet = "Confirmer que Pharos reçoit un signalement de contenu illicite, que le signalement est visualisé et sauvegardé, et qu'il peut être orienté vers un service d'enquête."
limites = "Fiche de démarche : elle décrit cinq étapes sans dire ce que devient un signalement non retenu, ni les délais, ni les suites possibles pour la personne qui signale. Pharos n'est pas un canal de plainte et ne remplace pas le dépôt de plainte. Aucun formulaire, aucun libellé de champ et aucune capture ne sont reproduits."

[[source]]
id = "cybermalveillance-deposer-plainte"
extrait = "docs/rd/sources-primaires/cybermalveillance-deposer-plainte.txt"
editeur = "Cybermalveillance.gouv.fr (GIP ACYMA)"
titre = "Déposer plainte après une cybermalveillance"
url = "https://www.cybermalveillance.gouv.fr/tous-nos-contenus/page/deposer-plainte-cybermalveillance"
consulte_le = 2026-11-12
ancre = "déposer plainte en ligne"
permet = "Confirmer les trois voies de plainte — commissariat ou brigade, courrier au procureur, pré-plainte THESEE pour les cybermalveillances financières — et l'accompagnement gratuit par France Victimes au 116 006."
limites = "Page d'orientation, pas une autorité judiciaire : elle indique où déposer plainte sans qualifier les faits ni promettre de suite. Les horaires et le numéro du 116 006 sont ceux publiés au 12 novembre 2026 et peuvent changer. Elle ne couvre pas les situations d'urgence immédiate ni les procédures propres aux mineurs."

[[source]]
id = "cybermalveillance-hameconnage-victime"
extrait = "docs/rd/sources-primaires/cybermalveillance-hameconnage-victime.txt"
editeur = "Cybermalveillance.gouv.fr (GIP ACYMA)"
titre = "Que faire en cas de phishing ou hameçonnage ?"
url = "https://www.cybermalveillance.gouv.fr/tous-nos-contenus/fiches-reflexes/hameconnage-phishing"
consulte_le = 2026-11-12
ancre = "Conservez les preuves"
permet = "Vérifier la suite de gestes après une victime d'hameçonnage : opposition immédiate, conservation des preuves, dépôt de plainte, et le renvoi vers Signal Spam, le 33700, Phishing Initiative et Info Escroqueries."
limites = "Fiche réflexe destinée au grand public : elle conseille sans instruire et ne remplace aucune démarche auprès d'une banque, d'une police ou d'un tribunal. Le numéro d'Info Escroqueries et ses horaires sont ceux publiés au 12 novembre 2026. Elle ne mesure ni l'efficacité des signalements ni le taux de remboursement, et ne dit rien des fraudes qui ne passent pas par le courriel ou le SMS."

[[source]]
id = "signal-spam-accueil"
extrait = "docs/rd/sources-primaires/signal-spam-accueil.txt"
editeur = "Signal Spam (association loi 1901)"
titre = "Signal Spam — plateforme nationale de signalement de courriels indésirables"
url = "https://www.signal-spam.fr/"
consulte_le = 2026-11-12
ancre = "Je m’inscris"
permet = "Confirmer que le signalement d'un courriel indésirable passe par un compte puis un module de messagerie, et que les signalements sont partagés avec les acteurs compétents."
limites = "Page d'accueil d'une association, pas d'une administration : elle décrit le parcours d'inscription et l'usage des signalements, sans publier de statistiques de résultat. Elle ne dit pas ce qui est fait d'un signalement isolé, ni en combien de temps. Le module à installer impose un environnement de messagerie compatible, que la page ne détaille pas."

[[source]]
id = "33700-accueil"
extrait = "docs/rd/sources-primaires/33700-accueil.txt"
editeur = "33700 — opérateurs mobiles et associations professionnelles"
titre = "33700 — plateforme de lutte contre les SMS et appels indésirables"
url = "https://www.33700.fr/"
consulte_le = 2026-11-12
ancre = "opérateurs de télécommunication"
permet = "Confirmer que le 33700 reçoit un signalement par formulaire ou capture d'écran et que les signalements sont transmis quotidiennement aux opérateurs de télécommunication."
limites = "Page d'accueil d'une plateforme opérée par les opérateurs : elle dit que les signalements partent chaque jour vers les opérateurs, sans publier de suites ni de délais. Elle traite les SMS et appels indésirables, pas les courriels ni les sites. Elle ne remplace ni une plainte ni une opposition bancaire."


