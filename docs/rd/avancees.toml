]
controle = "python3 outils/test_sources_refusees.py && python3 outils/construire-sources-refusees.py --verifier"
limite = "Ce registre ne recense que les pages effectivement tentées puis écartées par un agent ou une personne : il ne prouve ni l'exhaustivité des recherches documentaires, ni la validité de la source de remplacement."
suite = "Consigner chaque nouveau refus (403, accès payant, page retirée ou hors sujet après lecture) dans ce registre au moment où il survient."
initiatives = ["sources-fermees-et-registre-des-refus", "relire-les-44-prototypes", "veille-savoirs-evolutifs"]

[[avancee]]
id = "indice-de-confrontation-non-certifiant"
date = 2026-10-20
titre = "Confronter une affirmation par ancres donne un indice et ses angles morts, jamais une validation"
constat = "Chercher des mots-clés d'une fiche dans sa page source détecte utilement la présence des termes attendus, mais échoue dès qu'une négation inverse le sens (mentions interdites sur Service-Public F2451) ou qu'un PDF coupe un mot dans une formule (« dur é e »)."
changement = "Le prototype `docs/rd/confrontations-sources.toml` borne chaque ancre à cinq mots sans recopier d'extrait sous droits, interdit tout état de validation, exige l'écriture explicite d'un faux positif et d'un faux négatif par fiche, et reste hors de la porte de publication."
preuves = [
  "docs/rd/confrontations-sources.toml",
  "docs/rd/confrontations-sources.md",
  "outils/confronter-sources.py",
  "outils/test_confronter_sources.py",
]
controle = "python3 outils/test_confronter_sources.py && python3 outils/confronter-sources.py --verifier"
limite = "Un indice concordant ne prouve jamais que la fiche dit vrai ni qu'elle respecte la portée de la source ; un constat d'ancre absente ou de page inaccessible ne prouve jamais que la fiche est fausse."
suite = "Mesurer les faux positifs et faux négatifs avec une personne relectrice avant d'envisager d'étendre l'échantillon au-delà des neuf fiches du prototype."
initiatives = ["confronter-une-affirmation-a-sa-source", "relire-les-44-prototypes", "prospective-apprentissages-2030"]

