limite = """Ce n’est ni une validation humaine du texte ni du rendu, ni une expertise de domaine, ni un avis juridique, ni un essai avec des personnes. Les repères restants viennent des copies locales des statuts ; leur validité juridique actuelle n’a pas été vérifiée auprès d’une source externe, et la page renvoie au texte statutaire. Le retrait du siège ne dit pas que l’information est fausse : il dit qu’elle n’est plus affichée à la demande de la personne. Un seul moteur de rendu, aucun lecteur d’écran. La dette de relecture de fond du corpus reste consignée, `relectures.toml` reste vide. Le jugement du rendu publié reste à l’œil."""
suite = "Après fusion, suivre le déploiement Pages, relire les octets servis avec un paramètre de cache, régénérer les captures et laisser la personne juger le rendu ; ne pas étendre le retrait à d’autres pages sans demande."
