[[avancee]]
id = "un-petit-depot-cobaye-pour-les-controles-git"
date = 2026-10-28
titre = "Un contrôle qui lit l'historique git se teste sur un dépôt neuf, jamais sur le vrai"
constat = "`outils/verifier-fusions.py` garde la règle « ne rien perdre en fusionnant » : état de fusion, marqueurs de conflit, fichiers de sauvegarde, ordre et unicité du journal, et avec `--branches` l'atteignabilité des blobs d'une branche distante. Deux régimes très différents, aucun test. L'éprouver en mutant le dépôt réel était exclu : y fabriquer une branche perdue ou un dossier `MERGE_HEAD` serait une faute, pas un test, et le banc doit pouvoir tourner sur une copie sans historique."
changement = "`outils/test_mutations_fusions.py` fabrique à chaque cas un **petit dépôt git neuf** (deux entrées de journal, deux pages, un commit) et y casse une seule propriété : marqueur de conflit commité, `.orig` suivi, entrées de journal inversées, titres en double, branche distante portant un fichier présent nulle part ailleurs. Deux cas honnêtes restent verts et le prouvent : une branche déjà contenue dans `main` est dite telle avant toute comparaison d'objets, et une branche **recopiée** — contenu identique, commits distincts, donc pas un ancêtre — doit rester « supprimable sans perte », sinon le contrôle crierait au vol à chaque fusion par recopie. Huit tests, 0,5 s. `verifier-fusions.py` lit sa racine par `MRSC_RACINE`."
preuves = [
  "outils/verifier-fusions.py",
  "outils/test_mutations_fusions.py",
  "docs/rd/inventaire-controles.md",
  "AGENTS.md",
]
controle = "python3 outils/test_mutations_fusions.py && python3 outils/verifier-fusions.py && python3 outils/verifier-inventaire-controles.py"
limite = "Les dépôts d'essai comptent trois fichiers : le banc prouve que le contrôle réagit aux fautes plantées, pas qu'il tient sur un dépôt de 436 fichiers suivis ni sur un vrai historique de 137 entrées de journal. Le cas `MERGE_HEAD` et l'index non fusionné ne sont pas couverts, faute de pouvoir créer proprement un index conflictuel sans toucher à un dépôt réel. Enfin la suppression effective d'une branche reste une décision humaine : le contrôle dit « supprimable sans perte », il ne supprime rien."
suite = "Éprouver les deux portes de publication (`verifier-publication-locale.py`, `verifier-integration.py`), puis `auditer-criteres-22.mjs` et son « 0 élément masqué » publié sans avoir rien pu charger."
initiatives = ["optimisation-du-site", "coordination-de-tous-les-agents"]

[[avancee]]
id = "onze-verifications-internes-jamais-vues-en-echec"
date = 2026-10-28
titre = "Un outil qui contient onze vérifications n'est pas un outil vérifié"
constat = "`outils/verifier-securite.py` exécutait onze fonctions de contrôle — en-têtes Vercel, épinglage des actions, limites WSGI, provenance navigateur, liste statique — et l'inventaire du 28 octobre 2026 le classait `aucun-test`. Le classement était exact et contre-intuitif : l'outil contient des assertions, mais rien dans le dépôt ne prouvait qu'une seule d'entre elles savait échouer. Un `verifier(...)` qui ne peut pas mordre est un commentaire qui s'imprime « OK »."
changement = "`outils/test_mutations_securite.py` plante six fautes réelles dans une copie complète du dépôt et exige l'échec avec le message attendu : en-tête `X-Frame-Options` retiré de `vercel.json`, `maxDuration` abaissé de 60 à 30 (la CSP restant intacte), action GitHub dé-épinglée sur `@v4`, runner repassé à `ubuntu-latest`, liste statique élargie à tout fichier de la racine, plafond de lecture d'une source distante supprimé du moteur. Sept tests, 3,3 s. `verifier-securite.py` lit désormais sa racine par `MRSC_RACINE`, y compris pour importer `simulateur/` : c'est la copie mutée qui est éprouvée, jamais l'original."
preuves = [
  "outils/verifier-securite.py",
  "outils/test_mutations_securite.py",
  "outils/banc_mutations.py",
  "docs/rd/inventaire-controles.md",
  "vercel.json",
]
controle = "python3 outils/test_mutations_securite.py && python3 outils/verifier-securite.py && python3 outils/verifier-inventaire-controles.py"
limite = "Six mutations épuisent ce que le banc sait voir, pas ce que la porte devrait couvrir : les contrôles de provenance navigateur, de cache partagé, de redirections et de limite WSGI ne sont éprouvés par aucune faute plantée, et deux d'entre eux reposent sur des objets simulés à l'intérieur de l'outil — un faux opener peut mentir sur le comportement réel d'urllib. Le banc ne dit rien non plus des frontières qui n'ont pas encore de contrôle du tout."
suite = "Éprouver de la même façon les contrôles de provenance navigateur et de redirections (faux opener remplacé par un serveur local qui répond réellement), puis passer à `verifier-fusions.py`, qui garde la règle « ne rien perdre en fusionnant » sur un journal de 137 entrées."
initiatives = ["optimisation-du-site", "cartographier-les-lacunes"]

[[avancee]]
id = "inventaire-des-controles-tenu-par-un-garde"
date = 2026-10-28
titre = "Un inventaire des contrôles ne vaut que s'il échoue quand on l'oublie"
constat = "Le 28 octobre 2026, l'inventaire écrit des outils du dépôt a rendu un chiffre désagréable : sur 37 contrôles, 17 seulement s'appuient sur un test capable d'échouer. Mais un inventaire tenu à la main devient faux au premier outil ajouté, et rien dans la CI ne l'aurait signalé : le document aurait décrit un dépôt qui n'existe plus, en donnant l'impression que le sujet était traité."
changement = "`outils/verifier-inventaire-controles.py` lit le tableau de `docs/rd/inventaire-controles.md` et échoue si un fichier d'`outils/` n'y figure pas, si une ligne désigne un outil absent, si un statut sort des six admis ou si le fichier de test annoncé n'existe pas. Il ne juge pas les statuts — il empêche seulement l'inventaire de mentir par omission. Son propre banc, `outils/test_verifier_inventaire_controles.py`, plante cinq fautes dans une copie complète du dépôt, dont celle qui compte : un outil ajouté sans ligne. Les deux tournent dans `verification.yml` et dans `deploy-pages.yml`, et `AGENTS.md` exige la ligne dans le même commit que l'outil."
preuves = [
  "outils/verifier-inventaire-controles.py",
  "outils/test_verifier_inventaire_controles.py",
  "docs/rd/inventaire-controles.md",
  "AGENTS.md",
  "outils/banc_mutations.py",
]
controle = "python3 outils/test_verifier_inventaire_controles.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le garde vérifie la forme de l'inventaire, jamais la justesse d'un statut : une ligne qui déclare `banc` en citant un test existant mais sans rapport passerait. La couverture repose sur une convention de nommage (`test_*`, `__*` exclus) : un outil rangé ailleurs, ou un fichier d'aide nommé comme un contrôle, fausse le compte sans être vu. Enfin l'inventaire lui-même n'a été rempli qu'en lisant les tests, sans exécuter chaque mutation possible — c'est un jugement daté, pas une mesure."
suite = "Prendre les contrôles par ordre de rentabilité écrite dans l'inventaire : `verifier-securite.py` n'a aucun test, puis `verifier-fusions.py`, puis les deux portes de publication, puis `auditer-criteres-22.mjs` et son « 0 élément masqué » publié sans avoir rien pu charger. Chaque nouveau banc met à jour la ligne correspondante dans le même commit."
initiatives = ["optimisation-du-site", "cartographier-les-lacunes"]

[[avancee]]
id = "controle-preventif-qui-prouve-qu-il-mord"
date = 2026-10-28
titre = "Un contrôle préventif qui ne trouve rien doit prouver qu'il mord"
constat = "Le contrôle `outils/verifier-taux-dates.py`, écrit le 28 octobre 2026 pour empêcher qu'une fiche recopie un taux de cotisation sans sa date, rend « 85 fiches contrôlées, 0 défaut » : le catalogue est propre, et un contrôle qui ne signale jamais rien est indiscernable d'un contrôle cassé. C'est le même piège que le relevé WCAG publiant « 0 élément masqué » quand il n'avait rien pu charger."
changement = "Le contrôle est livré avec `outils/test_verifier_taux_dates.py`, qui plante dans une copie du catalogue les quatre fautes qu'il doit voir — taux sans année, montant légal sans année, règle datée sans source datée, phrase dans une liste — et qui rejoue l'outil par sous-processus pour vérifier que la sortie en erreur est bien celle du programme, pas seulement d'une fonction. Chaque ligne verte du dépôt vaut donc pour ce qu'elle prouve : une phrase acceptée est une phrase dont la forme est datée, pas une phrase exacte."
preuves = [
  "outils/verifier-taux-dates.py",
  "outils/test_verifier_taux_dates.py",
  "docs/rd/sujet-revenus-salaire-impots.md",
]
controle = "python3 outils/test_verifier_taux_dates.py && python3 outils/verifier-taux-dates.py && python3 outils/verifier-rd-continue.py"
limite = "Le contrôle ne lit que des chiffres écrits en pourcentage ou en euros et qu'un vocabulaire fermé de droit, de fiscalité et de protection sociale : une règle écrite en toutes lettres (« le dixième du brut ») ou un taux cité sans le mot attendu lui échappent, et il ne compare aucun barème à sa date. Ses quatorze tests disent qu'il détecte les cas plantés, pas qu'il couvre les cas réels. Il ne remplace ni la relecture compétente du domaine ni l'ouverture de la source officielle."
suite = "Deux portes sont désormais éprouvées par mutation (`verifier-affichages.py`, `verifier-site-statique.py`, dix fautes plantées au total, aides partagées dans `outils/banc_mutations.py`). L'inventaire écrit des outils a depuis été livré et tenu par un garde : `docs/rd/inventaire-controles.md` et `outils/verifier-inventaire-controles.py` (45 fichiers, 37 contrôles, 17 appuyés sur un test capable d'échouer). `verifier-securite.py`, le premier de cette liste, a depuis reçu son banc (six fautes, `test_mutations_securite.py`) : 27 contrôles sur 37 ont désormais une preuve d'échec."
initiatives = ["cartographier-les-lacunes", "relire-les-44-prototypes"]

[[avancee]]
id = "taux-date-hors-de-la-fiche"
date = 2026-10-28
titre = "Un taux daté n'entre pas dans une fiche : on enseigne la vérification, pas le chiffre"
constat = "La fiche F2302 de Service-Public, vérifiée le 1er janvier 2026, publie des taux et des plafonds de cotisations salariales (assurance vieillesse, CSG dont une part non déductible, CRDS, retraites complémentaires) qui changent en tout ou partie à chaque exercice. Une fiche qui écrirait « la CSG est de 9,2 % » deviendrait fausse sans qu'aucun contrôle du dépôt ne le voie : ni `auditer-prototypes.py`, qui juge la forme et les sources, ni le prototype de confrontation, qui cherche des ancres lexicales, ne comparent un barème à sa date."
changement = "La carte `docs/rd/sujet-revenus-salaire-impots.md` borne le sujet à ce qui ne vieillit pas : l'ordre de lecture d'un bulletin fictif, les deux soustractions à refaire, et la distinction des trois montants appelés « net » (à payer, imposable, social). Les taux et plafonds sont cités une fois, avec la date de vérification de l'éditeur, puis renvoyés à la source officielle ; la fiche à venir ne doit en recopier aucun."
preuves = [
  "docs/rd/sujet-revenus-salaire-impots.md",
  "docs/rd/carte-lacunes.md",
  "docs/rd/portefeuille.toml",
]
controle = "python3 outils/construire-carte-lacunes.py --verifier && python3 outils/construire-avancees.py --verifier && python3 outils/verifier-rd-continue.py"
limite = "Cette règle n'est pas automatisée : rien ne détecte aujourd'hui un pourcentage ou un plafond en euros écrit dans une fiche sans date, et la carte n'est pas une fiche. Aucune relecture par une personne compétente en paie ou en droit du travail n'a eu lieu, aucun essai avec des personnes non plus, et les quatre pages ont été lues une seule fois, le 28 octobre 2026 : une réforme peut les changer avant la première fiche."
suite = "Lors de la rédaction du prototype, vérifier qu'aucun taux ni plafond ne figure hors d'un encadré daté, puis examiner un contrôle qui signalerait dans une fiche d'économie un pourcentage présenté comme une connaissance stable."
initiatives = ["cartographier-les-lacunes", "relire-les-44-prototypes"]

[[avancee]]
id = "un-total-sans-son-manque"
date = 2026-10-24
titre = "Un total de mesure doit dire ce qu'il n'a pas mesuré"
constat = "Le relevé WCAG 2.2 publiait « 825 éléments testés, 0 entièrement masqué » alors que le site compte 8 856 cibles atteignables : le plafond de 60 par page et les huit pages de l'échantillon coupaient la passe sans que le chiffre le dise. `anglais-aventure.html` en compte 448, dont 60 seulement étaient portées au focus. Le même outil, lancé sans serveur local, rendait « 0 cible, 0 masquée » — indiscernable d'une page parfaite."
changement = "Le plafond passe à 500, au-delà du maximum observé, le focus est mesuré sur les 98 pages aux deux largeurs, le bilan publie les pages coupées et les cibles non testées, et un chargement en échec est compté comme un échec — avec sortie en erreur si toutes les pages échouent. Résultat du 24 octobre 2026 : 8 856 éléments testés sur 8 856 atteignables, 0 masqué, 0 page coupée ; relevé conservé dans `docs/rd/audit-criteres-22-2026-10-24.json`."
preuves = [
  "outils/auditer-criteres-22.mjs",
  "docs/rd/audit-criteres-22-2026-10-24.json",
  "docs/rd/inclusion-criteres-wcag-22.md",
]
controle = "node outils/auditer-criteres-22.mjs --sans-focus && python3 outils/verifier-rd-continue.py"
limite = "Le chiffre est plus honnête, pas plus concluant : cinq points par élément ne disent rien de la lisibilité du contour de focus, le recouvrement n'est testé qu'après un défilement que la mesure provoque elle-même, et un bandeau qui apparaît au clavier réel n'est pas reproduit. Aucun lecteur d'écran ni appareil réel n'a servi à cette passe."
suite = "Appliquer la même règle aux autres mesures du dépôt : tout script qui publie un total doit publier aussi ce qu'il a écarté, et refuser de rendre « zéro » quand il n'a rien pu charger."
initiatives = ["optimisation-du-site", "ecouter-la-page"]

[[avancee]]
id = "un-trace-remplace-une-photo-de-logo"
date = 2026-10-24
titre = "Restaurer une identité refusée plutôt que défendre son remplacement"
constat = "Les tracés SVG introduits le 24 octobre ont été rejetés : leur netteté ne justifiait pas une réinterprétation de l'identité. Sur la page IA, des règles mobiles déplaçaient les pastilles mais pas les extrémités des rayons."
changement = "Les images antérieures de l'accueil et d'Apprendre sont restaurées avec leurs variantes et proportions. L'accueil est plafonné à 700 CSS px pour sa source de 1400 px à densité 2. La constellation utilise des ancres identiques sur téléphone et bureau, vérifiées dans un navigateur."
preuves = ["assets/images/accueil-logo-mrsc-3d.jpg", "assets/images/mondes-savoirs-hero.jpg", "outils/verifier-graphismes.cjs", "docs/rd/ligne-graphique.md", "docs/rd/audit-graphismes-2026-10-24.json"]
controle = "python3 outils/verifier-affichages.py && node outils/verifier-graphismes.cjs"
limite = "Trois visuels seulement, Chromium, densités 1 et 2 : ni validation de tout le site, ni contraste mesuré sur les pixels des images, ni avis humain sur téléphone. Les illustrations restaurées ne sont pas des photographies documentaires."
suite = "Étendre le contrôle aux autres visuels et aux densités supérieures, mesurer le contraste et faire relire la direction photographique."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "trois-etats-de-controle"
date = 2026-10-20
titre = "Un contrôle automatique a trois états, pas deux"
constat = "Un même contrôle peut rencontrer trois situations distinctes : le fait est conforme, le fait est faux et réparable sans jugement, ou le fait est exact mais la machine ne sait pas s'il est acceptable. Traiter la troisième comme un échec fabrique de faux défauts ; la traiter comme un vert efface un reste réel."
changement = "L'audit automatique des prototypes ne compte plus seulement échecs et réussites : il nomme des constats, hors échecs et hors verts, et chaque interface qui reprend l'audit (paquets de relecture, phrase publique) reprend les trois états."
preuves = [
  "outils/auditer-prototypes.py",
  "outils/test_audit_prototypes.py",
  "docs/apprentissage/audit-automatique.md",
]
controle = "python3 outils/test_audit_prototypes.py && python3 outils/auditer-prototypes.py --verifier"
limite = "Ce partage ne dit rien de la valeur d'une fiche : il déplace seulement la frontière entre ce qu'un script tranche et ce qu'une personne doit trancher. Un constat nommé n'est ni une relecture ni une validation."
suite = "Éprouver le même partage sur d'autres contrôles à venir : avant d'ajouter un contrôle, se demander s'il peut produire un constat plutôt qu'un échec."
initiatives = ["relire-les-44-prototypes"]

[[avancee]]
id = "portail-declare-ou-erreur"
date = 2026-10-20
titre = "Une source-racine doit s'annoncer comme portail"
constat = "Une fiche qui ne cite que la racine d'un site n'offre aucune page à confronter. Ce n'est pas mécaniquement faux, mais une racine présentée comme une page consultée laisse croire à une vérification qui n'a pas eu lieu."
changement = "Le contrôle de précision des sources distingue deux cas : racine annoncée par écrit comme portail, point d'entrée ou page d'accueil — constat ; racine présentée comme une page lue — échec. La discipline est vérifiable, pas déclarative."
preuves = [
  "outils/auditer-prototypes.py",
  "outils/test_audit_prototypes.py",
  "docs/apprentissage/catalogue.toml",
]
controle = "python3 outils/auditer-prototypes.py --verifier"
limite = "La machine vérifie la présence de la phrase, pas sa sincérité ni la pertinence du portail. Elle ne dit pas si le portail suffit à étayer l'affirmation de la fiche."
suite = "Quand une page précise remplace un portail, consigner ce qu'elle étaye et ce qu'elle n'étaye pas, comme pour les douze fiches déjà traitées."
initiatives = ["relire-les-44-prototypes", "veille-savoirs-evolutifs"]

[[avancee]]
id = "page-ouverte-avant-citation"
date = 2026-10-20
titre = "Aucune page n'est citée sans avoir été ouverte"
constat = "Chercher une page qui « a l'air » de répondre ne suffit pas : il faut l'ouvrir, y lire la phrase qui étaye l'affirmation, et noter ce qu'elle n'étaye pas. Vingt-deux fiches ont été traitées ainsi ; sept pages ont été refusées après tentative ou lecture."
changement = "Le catalogue porte, pour chaque page ajoutée, la date de consultation et une phrase qui sépare ce que la page étaye de ce qu'elle n'étaye pas — par exemple un document sur les changements d'état qui ne parle pas de dissolution."
preuves = [
  "docs/apprentissage/catalogue.toml",
  "docs/apprentissage/audit-automatique.md",
  "docs/apprentissage/paquets-relecture.md",
]
controle = "python3 outils/auditer-prototypes.py --verifier && python3 outils/construire-paquets-relecture.py --verifier"
limite = "Une page qui étaye une phrase ne vaut ni expertise de domaine, ni contrôle des droits, ni essai d'usage réel ; le registre des relectures humaines reste vide."
suite = "Poursuivre fiche par fiche sur le constat restant (`arts-composer-formes`), en préférant une page réellement lue à un portail de plus."
initiatives = ["relire-les-44-prototypes"]

[[avancee]]
id = "refus-de-source-illisible"
date = 2026-10-20
titre = "Une source illisible se refuse et se consigne"
constat = "Certaines pages utiles en apparence ne peuvent pas être lues : une page de l'IGN sur la lecture de carte répond 403, une page de présentation de HAL décrivait une fonctionnalité au lieu du mécanisme cherché. Les citer aurait fait baisser un compteur sans rien prouver."
changement = "Le refus devient une information du projet : la page écartée et sa raison sont écrites, et une autre page est cherchée quand elle existe. Un chiffre qui baisse sans explication est désormais un signal d'alerte, pas un progrès."
preuves = [
  "docs/rd/journal.md",
  "docs/apprentissage/audit-automatique.md",
]
controle = "python3 outils/verifier-rd-continue.py"
limite = "Un refus consigné ne vaut pas preuve d'exhaustivité : d'autres pages accessibles peuvent exister et n'ont pas été cherchées."
suite = "Tenir une liste des sources refusées et de leur motif, pour éviter de les rechercher deux fois et pour documenter les angles morts."
initiatives = ["veille-savoirs-evolutifs", "relire-les-44-prototypes"]

[[avancee]]
id = "phrase-publique-recalculee"
date = 2026-10-20
titre = "La phrase publique se recalcule, elle ne se recopie pas"
constat = "Une phrase écrite à la main dans une page publique vieillit au premier changement de mesure. Les nombres de l'audit ont changé trois fois en une journée."
changement = "La porte de vérification recalcule l'état depuis le catalogue et exige que la page de transparence contienne exactement la phrase dérivée : échecs, constats, nombre de contrôles et nombre de relectures consignées."
preuves = [
  "outils/verifier-rd-continue.py",
  "transparence.html",
  "docs/apprentissage/audit-automatique.md",
]
controle = "python3 outils/verifier-rd-continue.py"
limite = "La phrase reste vraie sur ce que la machine mesure ; elle ne dit rien de la qualité des fiches et ne remplace aucune relecture."
suite = "Étendre le même principe à toute affirmation publique qui reprend un chiffre du dépôt."
initiatives = ["coherence-textes-publics", "coordination-de-tous-les-agents"]

[[avancee]]
id = "registre-des-avancees-verifie"
date = 2026-10-20
titre = "Une avancée sans preuve, contrôle et limite n'est pas une avancée"
constat = "Les leçons d'un lot se perdent entre deux agents : elles restent dans un journal daté, mêlées à la chronologie, sans contrôle qui empêche de les déformer plus tard."
changement = "Ce registre est généré et vérifié : chaque entrée exige une preuve locale qui existe, un contrôle exécutable, une limite écrite, une suite et une initiative du portefeuille. Le fichier publié est comparé à la source par la porte de vérification."
