[[avancee]]
id = "un-code-de-sortie-ne-dit-pas-pourquoi"
date = 2026-10-29
titre = "Un code de sortie ne dit pas pourquoi : une mutation doit constater ce qu'elle plante"
constat = "`verifier-graphismes.cjs` rejoue trois fautes internes — `distorsion`, `densite`, `ancre` — et la CI exigeait seulement que le contrôle sorte en erreur (code 1). Or un échec peut venir d'une panne sans rapport avec la mutation : un serveur absent, une page renommée, une exception dans une mesure. La CI aurait été verte avec un contrôle qui ne voit plus ce qu'il prétend voir, ce qui est exactement le défaut que la série de bancs cherchait à éliminer ailleurs."
changement = "`outils/verifier-mutation-graphismes.py` lit le rapport JSON de chaque passe mutée et exige que l'erreur attendue y figure : « distorsion » pour `distorsion`, « densité insuffisante » pour `densite`, « ancre » pour `ancre`. Un rapport absent ou illisible est un refus, pas un silence. Le job `graphismes` appelle ce contrôle après chaque mutation, à côté du test du code de sortie. `outils/test_verifier_mutation_graphismes.py` couvre six cas hors ligne, dont un qui **relit les messages attendus dans le script** : une reformulation de `verifier-graphismes.cjs` fait échouer le test au lieu de le rendre faux."
preuves = [
  "outils/verifier-mutation-graphismes.py",
  "outils/test_verifier_mutation_graphismes.py",
  "outils/verifier-graphismes.cjs",
  ".github/workflows/verification.yml",
  "docs/rd/audit-graphismes-2026-10-24.json",
]
controle = "python3 outils/test_verifier_mutation_graphismes.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le contrôle dit qu'une erreur attendue a été constatée, jamais qu'elle a été constatée **pour la bonne raison** : la chaîne cherchée est un fragment, et un rapport qui la contiendrait par accident passerait. Il ne voit pas non plus une mutation qui n'échouerait sur aucune page, si le rapport contient par ailleurs l'erreur cherchée sur un autre relevé. Enfin, la liste des messages attendus reste une convention écrite à deux endroits — le script et le contrôle — et seule la relecture du test relie les deux."
suite = "Éprouver les trois scripts qui sont eux-mêmes des tests (`test-experience.cjs`, `test-cache-css-ia.cjs`, `verifier-graphismes.cjs`), en commençant par vérifier que leurs mutations portent sur ce qu'ils mesurent."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-test-de-cache-qui-ne-sert-plus-rien-reste-vert"
date = 2026-10-29
titre = "Un test de cache qui ne sert plus rien reste vert"
constat = "`test-cache-css-ia.cjs` simule un téléphone qui aurait gardé l'ancienne feuille de style : il intercepte la requête du CSS et sert lui-même deux feuilles, puis exige que les pastilles de la constellation soient décalées avec l'ancienne et alignées avec la versionnée. Rien ne prouvait que ce test mord encore. Sa panne la plus discrète n'est pas un écart de géométrie : c'est de **ne plus servir l'ancienne feuille**. Si l'interception disparaît, ou si les deux cas servent la même feuille, le test continue d'afficher un bilan vert sans rien reproduire du tout."
changement = "`outils/test_test_cache_css_ia.mjs` lance le vrai script dans une racine factice (ses deux fichiers d'entrée et les faux paquets) et éprouve cinq cas : nominal — douze essais, les deux URL demandées, et le nombre annoncé relu dans la sortie puis confronté au relevé ; version de CSS périmée dans la page — code 1, message nommé, aucun relevé écrit ; attente des deux cas inversée dans une copie du script — code 1 ; `setRequestInterception` retiré — code 1 ; CSS courant servi comme « ancien » — code 1. Le faux `puppeteer-core` rejoue l'interception et tire la distance pastille/point du CSS **réellement servi**."
preuves = [
  "outils/test_test_cache_css_ia.mjs",
  "outils/test-cache-css-ia.cjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  ".github/workflows/verification.yml",
  "docs/rd/inventaire-controles.md",
]
controle = "node outils/test_test_cache_css_ia.mjs"
limite = "Le faux navigateur ne mesure rien : il encode la seule règle « l'ancien CSS décale les pastilles », et le banc prouve donc la plomberie du test — qu'il sert bien deux feuilles, qu'il les distingue, que ses assertions mordent — jamais que le CSS de f3c4ddf décalait réellement de 12 px sur un téléphone. Les trois cas mutés portent sur des copies jetables ; la racine factice ne contient que le CSS, la page et le script, si bien qu'une dépendance nouvelle du script à un autre fichier du dépôt ferait échouer le cas nominal — c'est voulu, mais ce n'est pas dit par le script lui-même."
suite = "Éprouver `test-experience.cjs`, dernier script qui est lui-même un test, en commençant par ce qui est faisable sans navigateur : le compte d'essais annoncé et l'existence d'au moins une assertion par essai."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-test-que-personne-ne-lancait"
date = 2026-10-29
titre = "Un test que personne ne lançait : neuf essais navigateur hors de toute CI"
constat = "`test-experience.cjs` contient neuf essais interactifs — choix immédiat, clavier et retour du focus, en-tête compact, panneaux à 320 et 1 440 px, contraste et espacement, stockage bloqué, guide, lecture à voix haute, iframe synchronisée — et **aucun workflow ne le lançait**. Il n'était exercé qu'à la main, sur une machine équipée de Chromium. L'inventaire le classait `test-en-soi`, statut dont la définition dit « lancé par la CI » : la définition était fausse pour lui. Un test que rien ne lance ne protège rien, même quand il passe."
changement = "Deux corrections. Le job `graphismes` — le seul qui installe Chromium — lance désormais `node outils/test-experience.cjs` contre le serveur du site qu'il a déjà démarré. Et `outils/test_test_experience.mjs` éprouve le **harnais** : avec le faux navigateur en échec total, les neuf essais doivent être comptés une fois, nommés, le bilan annoncé doit être `0/9`, et le code de sortie 1. Trois mutations sont rejetées par ce verdict — `process.exitCode` effacé, succès enregistré malgré l'exception, essai renommé — et deux invariants sont lus dans la source : aucune assertion absente d'un essai, aucun nom en double."
preuves = [
  "outils/test_test_experience.mjs",
  "outils/test-experience.cjs",
  ".github/workflows/verification.yml",
  "docs/rd/inventaire-controles.md",
]
controle = "node outils/test_test_experience.mjs"
limite = "Le banc ne rejoue aucun essai : le faux navigateur ne clique pas et ne mesure pas. Il prouve que le harnais ne peut pas raconter un succès qui n'a pas eu lieu — comptage, nommage, bilan, code de sortie — jamais que les neuf essais mesurent ce qu'ils annoncent. Ce second point est tenu par le job `graphismes` et un vrai Chromium : observé vert le 29 octobre (exécution 40972858034). Il a d'abord échoué, et c'est instructif — servi par `python3 -m http.server`, `simulateur/` reçoit des 404 sur son API, n'ouvre jamais `#overlay.visible`, et quatre essais tombent en `TimeoutError`. Le script doit donc démarrer `outils/serveur-local.py`, comme sa documentation le dit. Rien de tout cela ne prouve que les neuf essais couvrent ce qu'ils prétendent couvrir : ils sont verts, pas exhaustifs."
suite = "Éprouver la mesure de `verifier-graphismes.cjs`, dernier contrôle sans second témoin."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "la-mesure-se-confrontait-a-sa-propre-mutation"
date = 2026-10-29
titre = "La mesure des graphismes se confrontait à sa propre mutation"
constat = "Les trois mutations internes de `verifier-graphismes.cjs` (`distorsion`, `densite`, `ancre`) étaient rejouées en CI et leurs rapports contrôlés : une mutation qui n'aurait pas produit l'erreur attendue faisait échouer le job. Mais les mutations sont plantées **par le script lui-même** : un `getBoundingClientRect` mal lu, une densité calculée à l'envers, une dimension native recopiée de `naturalWidth` au lieu du bitmap décodé auraient produit les mêmes messages, sur les mêmes pages, et le contrôle serait resté vert. Personne n'avait jamais confronté les nombres relevés à une géométrie connue d'avance."
changement = "`outils/test_mesure_graphismes.mjs` génère une page de contrôle dans un dossier temporaire — un PNG unicolore écrit octet par octet, une boîte en pixels écrite dans la feuille de style — et la fait mesurer par un vrai Chromium en périmètre réduit (`MRSC_PERIMETRE_REDUIT=1`, déclaré dans le rapport). Trois cas : image 600 × 300 dans une boîte 200 × 100 (aucune erreur, densité 3) ; la même image étirée dans une boîte 200 × 200 (« distorsion » et « ratio de boîte différent de la source ») ; une image 60 × 30 dans une boîte 200 × 100 (« densité insuffisante » aux deux densités d'écran). Les dimensions natives, la boîte rendue, la densité et la distorsion sont recalculées à partir du relevé et comparées à l'arithmétique, jamais à des constantes recopiées."
preuves = [
  "outils/test_mesure_graphismes.mjs",
  "outils/verifier-graphismes.cjs",
  ".github/workflows/verification.yml",
  "docs/rd/inventaire-controles.md",
]
controle = "node outils/test_mesure_graphismes.mjs"
limite = "Premier passage réel en CI le 29 octobre, vert à l'exécution 41032306541 (le banc sort en code 2 sans navigateur, donc un vert signifie qu'il a mesuré). La page de contrôle est une image PNG simple, à une disposition, une taille de texte et un mode de contraste : les trois pages réelles, les `srcset` et la constellation ne sont pas couverts. Le banc ne dit pas non plus que les seuils (distorsion > 0,01, écart d'ancre > 2 px) sont les bons — seulement que la mesure qui les alimente est juste. Il demande Chromium : sans les paquets navigateur il sort en code 2 et le dit, ce qui n'est pas un succès."
suite = "Étendre les pages de contrôle aux autres mesures navigateur qui n'ont jamais été confrontées à une géométrie connue d'avance."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "la-hauteur-n-aurait-jamais-du-entrer-dans-la-requete"
date = 2026-10-30
titre = "Le panneau ressortait par la gauche sur un téléphone en aperçu ordinateur"
constat = "Retour d'usage : « en mode réduit sur aperçu ordinateur depuis un smartphone le menu est logé à gauche à moitié visible », capture à l'appui — le panneau « Personnalisation » sortait par la gauche, libellés rognés. La règle du 28 octobre qui l'ouvre vers la droite portait un second garde, `min-height: 561px`. Un téléphone en aperçu ordinateur n'annonce pas une petite fenêtre mais une fenêtre **large et basse** (980 × 4xx) : elle dépasse 761 px de large sans atteindre 561 px de haut, la règle ne s'appliquait pas, et le panneau retombait sur `right: 0`, ancré à droite d'un bouton placé au début de la barre. Le défaut corrigé le 28 revenait par un format que la mesure du 28 n'avait pas visité."
changement = "La question n'est pas la hauteur, c'est la largeur : au-delà de 920 px, le format « paysage court » n'existe plus, donc le panneau a la place de s'ouvrir à droite. La requête devient `@media (min-width: 921px), (min-width: 761px) and (min-height: 561px)` — les deux cas en ou, aucun autre format touché. `test-experience.cjs` porte un dixième essai mesuré, « Aperçu ordinateur depuis un téléphone : 980 × 440 », qui visite quatre formats (980 × 440, 1 024 × 500, 1 440 × 1 000, 800 × 500 en paysage court), réduit l'en-tête comme le fait l'utilisateur, puis exige que le panneau et chacune de ses lignes restent dans la fenêtre. Le garde-fou statique `verifier-affichages.py` exige désormais les deux branches de la requête."
preuves = [
  "assets/css/site.css",
  "outils/verifier-affichages.py",
  "outils/test-experience.cjs",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py"
limite = "L'essai a été vu mordre : avec la requête d'avant remise en place, il tombe en CI et nomme le défaut mesuré — à 980 × 440, panneau à gauche = −43 px, cinq lignes à −35 px. La correction est déduite des dimensions annoncées par le mode « aperçu ordinateur » (980 px de large, moins de 561 px de haut) et de la feuille de style : aucun navigateur ne tourne dans l'atelier où elle a été écrite, donc elle n'a pas été re-mesurée là. L'essai qui la mesure existe mais son premier passage réel sera celui de la CI. Rien ne prouve non plus que 980 × 4xx soient les dimensions exactes du téléphone de la capture : ce sont celles du mode, pas celles de l'appareil."
suite = "Lire le premier passage en CI de l'essai « Aperçu ordinateur », et vérifier sur le site publié qu'un téléphone en mode bureau ne rogne plus le panneau."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "des-points-de-rupture-aux-mesures"
date = 2026-10-30
titre = "Le panneau se place à la mesure au lieu d'obéir à des points de rupture"
constat = "Trois règles successives ont ancré le panneau « Personnalisation » : `right: 0`, puis `min-width: 761px and min-height: 561px`, puis l'ajout de `min-width: 921px`. Chacune était juste pour le format signalé et fausse pour le suivant — la dernière laissait passer 980 × 4xx. Empiler des points de rupture pour suivre des fenêtres qu'on redimensionne, qu'on zoome et qu'on tourne à longueur de journée est une course perdue : il y aura toujours un format qu'on n'a pas imaginé."
changement = "`placerPanneauPersonnalisation()` dans `site.js` remplace les trois règles : elle mesure la fenêtre (`visualViewport` quand il existe), le bouton et l'en-tête, borne la largeur à la fenêtre moins deux marges, aligne le bord droit du panneau sur celui du bouton puis le rabat à gauche s'il déborde, borne la position aux marges et la hauteur pour laisser 160 px visibles. Le calcul est refait à chaque ouverture, à chaque `resize`, `orientationchange`, changement de fenêtre visuelle (barre d'adresse, clavier) et de hauteur d'en-tête. `outils/test_placement_panneau.mjs` extrait la fonction livrée et l'exécute sans navigateur sur 3 600 positions ; il a trouvé avant tout Chromium un dépassement de 8 px par le bas dans une fenêtre de 320 px avec un en-tête de 180. `verifier-affichages.py` vérifie désormais le calcul et refuse tout retour d'un ancrage par `@media`, et `test-experience.cjs` mesure huit formats puis quatre redimensionnements panneau ouvert dans un vrai navigateur."
preuves = [
  "assets/js/site.js",
  "assets/css/site.css",
  "outils/test_placement_panneau.mjs",
  "outils/verifier-affichages.py",
  "outils/test_mutations_affichages.py",
  "outils/test-experience.cjs",
  "docs/rd/formats-affichage.md",
]
controle = "node outils/test_placement_panneau.mjs && python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py"
limite = "Trois défauts ont été trouvés avant la fusion, et aucun ne se voyait à la lecture : une borne de hauteur qui ne réservait pas la marge du bas (banc sans navigateur), un panneau qui gardait les coordonnées de l'en-tête agrandi après réduction, et un panneau restauré ouvert par Chromium après `load` sans aucun événement `toggle` (les deux derniers par la CI). Le banc sans navigateur éprouve l'arithmétique, pas le rendu : un `visualViewport` réel, un zoom de page, un clavier virtuel ou un `backdrop-filter` qui déplace le référentiel peuvent se comporter autrement ; l'essai navigateur tranche, et il est vert depuis l'exécution 41195802262. Le placement dépend aussi d'un script : sans JavaScript, le panneau reste lisible mais pas nécessairement bien placé, et c'est écrit dans la feuille de style comme un repli assumé."
suite = "Lire le premier passage en CI de l'essai à huit formats et quatre redimensionnements ; s'il tombe, savoir lequel des deux niveaux se trompe — le calcul sans navigateur ou le rendu."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

