[[avancee]]
id = "une-sentinelle-reseau-se-teste-sans-reseau"
date = 2026-10-28
titre = "Une sentinelle réseau se teste sans réseau, en substituant sa sonde et non sa décision"
constat = "`outils/verifier-maj-amont.py` compare la révision embarquée dans `simulateur/PROVENANCE.json` à celle de la branche `main` du dépôt amont, et sort en erreur quand une mise à jour est disponible. Ce code 1 est son signal utile : `maj-simulateur.yml` en fait une alerte. Rien ne prouvait pourtant qu'il distinguait trois états très différents — à jour, en retard, amont injoignable — et une panne réseau qui se lirait « rien à signaler » serait le pire des défauts, parce qu'il ressemble à une bonne nouvelle."
changement = "`outils/test_verifier_maj_amont.py` charge l'outil en mémoire, remplace `revision_amont` par une valeur fixe ou par une fonction qui échoue, et lit la provenance d'une copie du dépôt : quatre cas — amont identique (code 0, « à jour »), amont plus récent (code 1, « Mise à jour disponible » et la commande à lancer), amont injoignable (arrêt non nul, jamais le mot « à jour »), sortie `--json` (`a_jour: false`, révisions présentes). Quatre tests, 0,2 s, sans aucun accès réseau."
preuves = [
  "outils/verifier-maj-amont.py",
  "outils/test_verifier_maj_amont.py",
  "simulateur/PROVENANCE.json",
  ".github/workflows/maj-simulateur.yml",
]
controle = "python3 outils/test_verifier_maj_amont.py && python3 outils/verifier-inventaire-controles.py"
limite = "La sonde `git ls-remote` n'est jamais exercée : le test remplace la fonction qui l'appelle, donc il prouve la décision et pas la lecture du réseau — d'où le classement en `faute-en-memoire`, pas en `banc`. Un changement de format de sortie de `git ls-remote` lui échapperait. Le test ne dit rien non plus de la mise à jour elle-même, qui reste une opération relue et validée par une personne."
suite = "Éprouver `verifier-planches-statuts.py`, puis attaquer les quatre contrôles navigateur depuis le job `graphismes`."
initiatives = ["documentation-rd-eva", "veille-savoirs-evolutifs"]

[[avancee]]
id = "la-file-de-relecture-prouve-son-tri"
date = 2026-10-28
titre = "Une file de relecture doit prouver son tri, pas seulement sa fraîcheur"
constat = "`outils/file-relecture.py` et `outils/construire-paquets-relecture.py` fabriquent la file de travail qu'une personne suivra pour les 59 prototypes : ordre de priorité, domaines à relecture spécialisée, mots-clés sensibles. Leur seule garde était `--verifier`, c'est-à-dire la comparaison du fichier commité avec sa régénération. Cette comparaison prouve que le fichier est frais, jamais que le tri classe encore : un classement silencieusement cassé resterait vert, et la file paraîtrait simplement plus courte."
changement = "`outils/test_mutations_files_relecture.py` éprouve cinq cas dans une copie complète : le catalogue change sans régénération (les deux outils refusent), la file est supprimée, la file est éditée à la main, et — le cas qui compte — une fiche porteuse du mot « vaccin » est ajoutée dans un domaine neutre : elle doit apparaître avec le motif « santé : vaccin » et être rangée « hors domaine sensible, signalé par mots-clés » dans les paquets. Cinq tests, 3,7 s, un seul banc pour les deux outils qui partagent le même module de tri."
preuves = [
  "outils/file-relecture.py",
  "outils/construire-paquets-relecture.py",
  "outils/test_mutations_files_relecture.py",
  "docs/apprentissage/file-relecture.md",
]
controle = "python3 outils/test_mutations_files_relecture.py && python3 outils/file-relecture.py --verifier && python3 outils/construire-paquets-relecture.py --verifier"
limite = "Le banc vérifie qu'un mot-clé connu est repéré, pas que la liste de mots-clés couvre les sujets sensibles : une fiche qui parle de santé sans employer aucun terme listé reste invisible, et c'est une limite de la méthode, pas du banc. `construire-paquets-relecture.py` emprunte en outre `auditer-prototypes.py`, qui ne lit pas `MRSC_RACINE` : ses états automatiques viennent toujours du dépôt réel, ce qui interdit de muter cette partie-là dans la copie. Enfin, classer n'est pas relire : la file reste une liste de travail, jamais une validation."
suite = "Éprouver `verifier-maj-amont.py`, qui garde la fraîcheur du moteur embarqué, puis attaquer les contrôles navigateur (`auditer-criteres-22.mjs`, `auditer-affichages.mjs`, `verifier-accessibilite.cjs`, `verifier-fiches-statistiques.cjs`) depuis le job `graphismes`."
initiatives = ["relire-les-44-prototypes", "co-conception-et-essais"]

