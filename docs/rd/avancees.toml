changement = "`outils/test_verifier_accessibilite.mjs` remplace `puppeteer-core`, `@sparticuz/chromium` et `axe-core` par trois faux, lance le vrai script — sans serveur local, via `MRSC_A11Y_BASE` — et vérifie trois cas : nominal (code 0, chaque exécution annoncée a sa ligne de verdict, les états interactifs sont relevés séparément), violations (code 1, deux règles nommées avec nœud, état et largeur, message rappelant qu'une mesure n'est pas un audit), chargement impossible (code 2, aucun rapport écrit). Le nombre d'états n'est pas recopié dans le banc : il est confronté au décompte publié par le script. 3 cas, 40 s."
