]
controle = "node outils/test_verifier_fiches_statistiques.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc ne mesure aucune géométrie : il vérifie ce que le script fait du résultat qu'on lui donne, pas si un élément est réellement hors écran. Le faux reconnaît la fonction de géométrie à son texte (elle ne prend aucun argument et cherche `Prototype à relire`) : si le script était reformulé, le faux rendrait une valeur neutre et les cas d'échec ne mordraient plus — c'est le point fragile, écrit dans le code source du faux. Rien ne dit non plus que les 288 configurations soient les bonnes : c'est le choix de l'outil, pas une mesure."
suite = "Éprouver `verifier-accessibilite.cjs` et `auditer-affichages.mjs` de la même façon, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
