]
controle = "node outils/test_verifier_accessibilite.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Aucune règle axe n'est évaluée : le faux rend les violations qu'on lui demande, donc le banc prouve le traitement d'un résultat, jamais sa détection. Un axe-core cassé ou mal chargé ne serait pas vu, et aucune page réelle n'est ouverte. Les 40 secondes viennent des attentes d'interface du script lui-même, ce qui en fait le banc le plus coûteux de la série ; il tourne malgré tout dans `qualite`, sans navigateur."
suite = "Éprouver `auditer-affichages.mjs`, dernier script navigateur sans banc, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
