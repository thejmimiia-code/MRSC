]
controle = "python3 outils/construire-carte-lacunes.py --verifier && python3 outils/auditer-prototypes.py --verifier"
limite = "Une carte de sujet et une fiche prototype conforme aux contrôles mécaniques ne remplacent ni la relecture par une personne compétente du domaine, ni l'essai avec des personnes apprenantes."
