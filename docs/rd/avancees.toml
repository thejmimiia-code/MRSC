limite = """Cette passe n’ouvre pas les 89 adresses uniques de source restantes, ne juge pas la vérité du monde et ne remplace pas une expertise compétente sur les 14 fiches de domaines sensibles. Elle n’est ni un avis juridique, ni un essai avec des personnes, ni une validation du rendu à l’œil, ni une promotion de statut : `docs/apprentissage/relectures.toml` reste vide et les 81 fiches gardent « Prototype à relire ». Le verdict `relue-sans-ecart` ne signifie pas « conforme ». Les 20 calculs portent sur des égalités simples ; 32 chaînes de réécriture et expressions algébriques en ont été écartées. La dette de relecture de fond des 391 autres unités reste consignée. Les chiffres sont un instantané du 10 novembre 2026."""
suite = "Poursuivre la relecture de contenu par agent sur les adresses non ouvertes, puis laisser l’association trancher une seule décision : revue du 2026-11-19 ou décision prospective avant le 31 janvier 2027. Ne demander à la personne ni de relire ce texte ni de valider ce registre."
