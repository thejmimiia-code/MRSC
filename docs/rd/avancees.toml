# Registre des avancées réutilisables de la R&D.
#
# Une « avancée » est un apprentissage du projet qui change durablement la façon
# de travailler — pas une fonctionnalité, pas un chiffre de communication. Chaque
# entrée dit ce qui a été constaté, ce que cela change, comment cela reste vrai
# (preuves locales + contrôle exécutable), ce que cela ne prouve pas, et ce qui
# reste à faire.
#
# Ce registre ne certifie rien : il rend une décision réutilisable par un autre
# agent. Une avancée sans limite écrite n'est pas une avancée, c'est une croyance.

[[avancee]]
id = "un-conteneur-flex-ne-lit-pas-les-declarations-de-grille"
date = 2026-10-31
titre = "Un conteneur flex ne lit pas les déclarations de grille — et le compteur les comptait"
constat = "Le palier `@media (min-width: 761px)` de `.english-promo-panel` portait deux déclarations : le plafond de l'illustration, indispensable à sa déclaration `sizes`, et `justify-items: start` sur la grille. Une fois la grille convertie en `flex-wrap`, la seconde ne décide plus rien — mais elle reste une règle, elle continue de compter dans la dette, et aucun contrôle ne la voyait. C'est la même classe d'erreur que la déclaration morte déjà refusée pour les colonnes, étendue à toute la famille des propriétés de grille."
changement = "`.english-promo-panel` passe en `flex-wrap` (280 px de base par panneau) : 13 largeurs sur 233 changent de nombre de colonnes, 14 px (5 %) d'écart de largeur au plus ; le palier de 760 px et le `justify-items` du palier de 761 px disparaissent. `--verifier` refuse désormais, sur une grille déclarée en `flex-wrap`, toute règle qui lui applique `grid-template-columns`, `grid-template-rows`, `grid-auto-flow` ou `justify-items`. `.participation-grid` (28 px, 9,9 % d'écart) est mesurée, retenue, et son chiffre écrit plutôt que décidé au jugé. Paliers : 192 règles (214 en début de journée)."
preuves = [
  "assets/css/site.css",
  "docs/rd/grilles-dynamiques.toml",
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py"
limite = "Le rendu reste non vérifié localement : Chromium est indisponible en sandbox, et seuls les calculs de repli et de largeur de colonne sont faits. Six grilles gardent une colonne à plafond en pixels, qu'un `flex` ne reproduit pas sans `max-width` — et aucun contrôle de `max-width` n'existe encore. Un banc a échoué en cours de route parce qu'il mutait un fragment réécrit par la conversion : quand l'écriture est partagée par plusieurs conversions, le banc doit viser une condition stable."
suite = "Convertir `.participation-grid` si sa mesure se confirme après suppression de ses paliers, puis traiter les six grilles « borne » en écrivant d'abord le contrôle de `max-width` qui manque."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "la-premiere-grille-a-pistes-inegales-quitte-son-palier"
date = 2026-10-31
titre = "La première grille à pistes inégales quitte son palier, et une présentation ne se replie plus dans le vide"
constat = "`.ai-hero-grid` portait un palier à 760 px qui la repliait d'un coup. La mesure de la veille autorisait la conversion (2 largeurs sur 233 changent de nombre de colonnes, 4,9 % d'écart de largeur au plus). Deux lectures étaient fausses : huit grilles portaient un écart lu comme 16 px là où la feuille écrit `clamp(2rem, 5vw, 4.5rem)` — parfois tronqué en `clamp(2rem,` — et six grilles étaient classées « proportion » alors qu'une de leurs colonnes a un **plafond** en pixels, que `flex` ne sait pas reproduire. Surtout, le modèle ne voyait pas que la présentation « Lecture » repliait `.ai-hero-grid` par `grid-template-columns` : sur un conteneur flex, cette déclaration n'a aucun effet."
changement = "L'écart entre colonnes est lu comme une expression et évalué à chaque largeur (`ecart_a`), une expression illisible rendant `None` au lieu de 16 ; les colonnes à plafond forment une famille « borne » (6 grilles). `.ai-hero-grid` passe en `display: flex; flex-wrap: wrap`, chaque panneau portant `flex: <fr> 1 330px` et `min-width: 0`. La présentation « Lecture » replie par `flex-basis: 100%`, et `--verifier` refuse désormais toute présentation qui impose `grid-template-columns` à une grille convertie. Le registre garde la grille d'avant et le contrôle **recalcule** l'écart au lieu de croire le total écrit. Paliers : 194 règles (214 en début de journée)."
preuves = [
  "assets/css/site.css",
  "docs/rd/grilles-dynamiques.toml",
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py && python3 outils/test_paliers_affichage.py"
limite = "Le rendu n'a pas été vérifié : Chromium reste indisponible en sandbox. Le repli et la largeur des colonnes sont calculés, la position du texte ne l'est pas. À 760 px de fenêtre l'écart passe de 32 à 38 px et le repli tombe vers 745 px au lieu de 760. Les treize grilles « proportion » restantes ne sont pas converties : plusieurs dépassent 9 % d'écart de largeur, et aucune n'a été vue à l'écran."
suite = "Convertir `.english-promo-panel` (13 largeurs, 4,3 % d'écart) puis `.participation-grid` (9,0 %), en vérifiant à chaque fois qu'aucune présentation ne les replie par `grid-template-columns`."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "mesurer-avant-d-ecrire-ce-qu-un-flex-wrap-ferait-des-pistes-inegales"
date = 2026-10-31
titre = "Mesurer avant d'écrire : ce qu'un `flex-wrap` ferait des pistes inégales"
constat = "Les 30 grilles à pistes inégales gardent leurs paliers. Était-ce un raccommodage, ou la seule façon de tenir deux colonnes de largeurs différentes ? Sans mesure, la réponse aurait été une opinion — et convertir à l'aveugle aurait redessiné des panneaux dont le rapport entre colonnes porte le sens (texte large + colonne étroite)."
changement = "`modele-grilles.py --pistes` classe les 30 grilles inégales en 14 « contenu » (une piste `auto` ou `max-content` fait dépendre le repli du texte : aucun modèle ne le tranche sans navigateur), 15 « proportion » (un `flex: <g> 1 <plancher>px` reproduirait le rapport, avec un écart calculable) et 1 « motif » (`repeat(…)` imbriquée). Écarts mesurés sur 233 largeurs : 4 pour `.ai-hero-grid`, 13 à 18 pour six grilles, 24 à 32 pour trois autres, 179 à 221 pour trois panneaux. Onze grilles changent de colonnes sur moins d'un huitième du balayage : elles seules seraient remplaçables sans redessiner. Rien n'a été écrit dans la feuille."
preuves = [
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/modele-grilles.py --pistes && python3 outils/test_modele_grilles.py"
limite = "Le calcul suppose que le contenu se comporte comme une piste de largeur fixe : un titre long, une image à ratio ou une hauteur imposée ne s'y voient pas. Un écart de quatre largeurs sur 233 reste un écart, et seul un navigateur dirait si quelqu'un le voit — Chromium reste indisponible en sandbox. Deux erreurs de calcul ont été corrigées avant publication (comparer à `colonnes_anciennes`, qui répond toujours « 1 » pour une grille inégale, et oublier la borne par la capacité mesurée) : ce sont les deux mêmes qui avaient coûté deux journées sur les grilles égales."
suite = "Convertir les grilles « proportion » dont l'écart tient sous 18 largeurs, une par une et relevé en main, en commençant par `.ai-hero-grid` (4 largeurs), puis vérifier dans un navigateur que le rapport entre colonnes est conservé."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "une-ecriture-n-est-pas-un-dessin-et-ce-qui-doit-rester-fixe-se-declare"
date = 2026-10-31
titre = "Une écriture n'est pas un dessin : ce qui doit rester fixe se déclare"
constat = "Le modèle ne reconnaissait les colonnes égales qu'écrites `repeat(k, minmax(…))`. `repeat(3, 1fr)` et `1fr 1fr` tombaient donc dans « pistes inégales », et le rapport annonçait 34 grilles inégales là où quatre étaient seulement écrites autrement. La correction a mis au jour cinq vignettes du panneau Personnalisation (`.layout-choice-preview`) dont la forme 3 × 2 **est** l'information : le modèle n'avait aucun moyen de le savoir et leur proposait une conversion qui aurait détruit ce qu'elles montrent."
changement = "`REPEAT_FR` et `FR_EGALES` classent `repeat(k, 1fr)` et `N × 1fr` comme colonnes égales : 36 grilles à pistes égales, 30 inégales. Le registre gagne une section `[[grille_fixe]]` (sélecteur, nombre de colonnes, raison) : `--verifier` refuse une grille déclarée fixe qui disparaît, passe en largeur de piste ou change de nombre de colonnes, et `--regle` ne leur propose plus de conversion. Trois cas de banc ajoutés (24 au total)."
preuves = [
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/grilles-dynamiques.toml",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py"
limite = "Le classement reste textuel : `minmax(120px,1fr) minmax(160px,1fr)` n'est pas reconnu comme égal, et `.map-info` (`1fr 1fr` sous 920 px) n'entre dans aucune liste parce que sa règle de base n'existe pas — le modèle ne lit que la règle de base d'une grille. La liste des grilles fixes est une déclaration humaine : rien n'empêche d'y inscrire une grille qui devrait bouger."
suite = "Mesurer, sans toucher à la feuille, ce qu'un `flex-wrap` exprimerait des 30 grilles à pistes inégales — et ce qu'il ne saurait pas décider sans navigateur."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "aucune-grille-a-pistes-egales-ne-depend-plus-d-une-largeur-d-ecran"
date = 2026-10-31
titre = "Aucune grille à pistes égales ne dépend plus d'une largeur d'écran"
constat = "Vingt-deux grilles dessinées à colonnes égales décidaient encore de leur nombre de colonnes par un `@media` de largeur. La dernière, `.ai-path-steps`, imposait `repeat(3, …)` sous 520 px et recentrait sa cinquième étape par `grid-column: 2` : deux règles qui se répondaient pour rattraper une mise en page, et des cartes de 59 px de large à 240 px de fenêtre."
changement = "La grille porte une largeur de piste (`minmax(min(220px, 100%), 1fr)`) et les deux règles du palier disparaissent. Le nombre de colonnes suit la place disponible : cinq au conteneur maximal, puis quatre, trois, deux, une. Mesure avant conversion : 94 largeurs sur 233 changeaient de nombre de colonnes, écart maximal 3 — un changement visible, dit comme tel. État : 22 grilles dynamiques, aucune grille à pistes égales sous palier de largeur, 34 grilles à pistes inégales assumées non convertibles, 195 règles sous condition de largeur (214 avant les trois lots du 31 octobre)."
preuves = [
  "assets/css/site.css",
  "docs/rd/grilles-dynamiques.toml",
  "docs/rd/paliers-affichage.toml",
  "docs/rd/formats-affichage.md",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/compter-paliers.py && python3 outils/test_paliers_affichage.py && python3 outils/test_modele_grilles.py"
limite = "Le rendu réel n'est pas vérifié : Chromium reste indisponible en sandbox et un banc navigateur sort en code 2. Le modèle suppose le conteneur `min(1160, W − 48)` et ne dit rien d'un cercle de 44 px dans une piste de 220 px ni d'un libellé long sur deux lignes. Ce qui reste sous condition de largeur n'est plus une grille mais des paliers de mise en page et les présentations choisies par l'utilisateur (compacte, lecture, panorama, vitrine), dont le statut reste à décider."
suite = "Décider, mesure en main, si les présentations choisies par l'utilisateur relèvent de la même règle dynamique ou d'un choix explicite qui a le droit d'être fixe."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "un-modele-de-grille-doit-savoir-ce-qu-on-y-met"
date = 2026-10-31
titre = "Un modèle de grille qui ignore ce qu'on y met ajoute des colonnes que personne n'a dessinées"
constat = "La règle des deux colonnes donnait 350 px pour les neuf grilles restantes. Appliquée telle quelle, `.document-grid` — quatre cartes de documents, dessinées en deux colonnes — aurait affiché trois colonnes dès 1 130 px de conteneur et laissé la quatrième carte seule sur sa ligne ; `.simulateur-passeport` aurait coupé ses paires `dt`/`dd` en trois. Le modèle calculait des largeurs de piste sans jamais regarder combien d'éléments les pages mettent dans la grille. Et deux bugs de lecture muets se sont révélés en chemin : `gap: .75rem 1.1rem` était lu comme 12 px alors que l'écart **entre colonnes** est 17,6 px ; et un `@media` vide — trois blocs laissés sans règle après conversion — faisait attribuer les règles suivantes à cette condition, si bien que le rapport est passé de 33 grilles à 16 sans un mot, huit conversions comprises."
changement = "`modele-grilles.py` lit désormais les pages (`lire_capacites` : enfants directs, balises `dl` reconnues comme listes de paires), et la règle à deux colonnes a trois branches : repli là où la cascade renonçait ; minimum relevé juste assez pour interdire une troisième colonne quand la grille reçoit plus de deux éléments ; minimum inchangé quand `auto-fit` ne peut pas remplir une piste vide. Le registre déclare `items` et le contrôle le remesure dans le HTML — une capacité fausse est refusée. L'analyseur CSS referme les blocs vides sur les accolades et refuse une accolade orpheline, et `auto_fit` borne son résultat par la capacité mesurée. Ce lot : neuf grilles converties (21 au total), 197 règles sous condition de largeur (205 avant, 214 avant le lot précédent), une seule grille égale encore sous palier."
preuves = [
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/grilles-dynamiques.toml",
  "docs/rd/paliers-affichage.toml",
  "assets/css/site.css",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py && python3 outils/test_paliers_affichage.py"
limite = "La capacité se mesure sur le HTML statique : une grille remplie par script échapperait au compte, et aucune ne l'est aujourd'hui. Le modèle ne mesure pas les préférences d'affichage (compacte, lecture, panorama, vitrine), qui réimposent des nombres de colonnes, ni la lisibilité : une carte de 350 px peut encore casser un titre long, et seul un navigateur le dirait. Enfin, l'analyseur reste pauvre : `@supports` est traversé sans être interprété, et une condition de largeur exprimée en `em` serait refusée plutôt que devinée."
suite = "Traiter `.ai-path-steps`, dernière grille égale sous palier : sa cascade passe de 5 à 3 colonnes à 520 px, un cas que la règle « une seule largeur de piste » n'exprime pas encore."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "un-rapport-ne-porte-pas-deux-recommandations-sous-un-mot"
date = 2026-10-31
titre = "Un rapport ne porte pas deux recommandations sous le même mot, et un compteur qui ne voit pas le travail le nie"
constat = "Deux défauts de mesure trouvés le même jour, tous deux invisibles dans le résultat. 1) `modele-grilles.py` calculait deux minima différents pour la même grille : l'un par ajustement à l'ancienne cascade (`meilleur_minimum`), l'autre par la règle de conception (`minimum_pour_k`). Le rapport les appelait tous deux « le minimum recommandé » ; huit grilles ont été converties avec le premier (230, 280, 310 px) alors que la règle demandait l'autre (270, 370). 2) `compter-paliers.py` comptait les **blocs** `@media` et non les règles qu'ils décident : douze grilles ont quitté leurs paliers et le relevé annonçait toujours « 41 blocs, dette inchangée ». Un compteur qui ne voit pas le travail le nie, et décourage exactement ce qu'il prétend mesurer."
changement = "`meilleur_minimum` n'est plus qu'un diagnostic et n'apparaît plus comme consigne ; la recommandation a une seule source, `minimum_recommande`, avec deux cas explicités (trois colonnes et plus : plus large minimum qui garde `k` colonnes au conteneur maximal ; deux colonnes : minimum qui replace le repli là où la cascade le plaçait, sans quoi `.document-grid` se serait replié à 1 027 px au lieu de 760). `compter-paliers.py` compte désormais les **règles** de chaque bloc, les inscrit au registre (`regles = N`) et refuse aussi bien leur augmentation que leur baisse non datée. Ce lot : 12 grilles dynamiques, 214 → 205 règles sous condition de largeur, 34 grilles à pistes inégales explicitement déclarées non convertibles au lieu d'être comptées à tort."
preuves = [
  "outils/modele-grilles.py",
  "outils/compter-paliers.py",
  "outils/test_modele_grilles.py",
  "outils/test_paliers_affichage.py",
  "docs/rd/grilles-dynamiques.toml",
  "docs/rd/paliers-affichage.toml",
  "assets/css/site.css",
]
controle = "python3 outils/compter-paliers.py && python3 outils/modele-grilles.py --verifier && python3 outils/test_paliers_affichage.py && python3 outils/test_modele_grilles.py"
limite = "Le compte des règles ne voit pas une règle qui perd un sélecteur : `.contact-grid` figurait dans un bloc de 760 px pour y imposer une seule colonne à une grille déjà à une colonne, et le compte n'a pas bougé quand le sélecteur a été retiré. Il ne voit pas non plus ce que la règle décide réellement — une règle qui redéclare la valeur de base compte autant qu'une règle qui change tout. Et la correction des huit minima est passée par la comparaison du registre au CSS, pas par un test : sans registre, rien n'aurait signalé l'écart."
suite = "Étendre le compte aux sélecteurs morts à l'intérieur d'une règle vivante, et convertir la famille des grilles à deux colonnes (seuil 760 px, minimum 350 px) avant de vérifier dans un navigateur ce que ni l'un ni l'autre des compteurs ne peut dire : le rendu réel d'une carte de 350 px."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "une-largeur-de-piste-se-calcule-pas-se-choisit"
date = 2026-10-31
titre = "Une grille dynamique n'a pas besoin de palier : sa largeur de piste se calcule"
constat = "Comptée le 31 octobre 2026, la dette d'affichage restait de 15 paliers, et la prochaine action écrite était de la « résorber ». Compter ne dit pas comment. Les grilles en montraient la raison : `.principle-grid` passait de 4 colonnes à **2** sous 1 000 px, sans jamais passer par 3 — la cascade sautait une étape. À 952 px de conteneur, deux cartes de 468 px occupaient la place de trois cartes de 306. Aucun de ces nombres n'était écrit nulle part : ils se déduisaient du CSS, à la main, grille par grille."
changement = "`outils/modele-grilles.py` reconstitue la cascade réelle d'un sélecteur (règle de base, puis chaque `@media`, dans l'ordre du fichier) et calcule le nombre de colonnes à 233 largeurs, de 240 à 2 560 px, pour l'ancienne écriture comme pour `auto-fit`. La règle de conversion est unique et calculée : le **plus large** minimum de piste qui laisse encore `k` colonnes au conteneur maximal. Quatre grilles sont converties (`.principle-grid`, `.ai-fraud-grid`, `.ai-fraud-steps`, `.home-voice-grid`), quatre blocs `@media` disparaissent, et `docs/rd/grilles-dynamiques.toml` engage chaque grille sur trois points vérifiés : `auto-fit` dans la règle de base, minimum égal à celui que la règle donne, aucun `@media` qui réimpose un nombre de colonnes. Le compteur de paliers est passé de 45 à 41 blocs de format et a refusé la baisse jusqu'à ce qu'elle soit datée."
preuves = [
  "outils/modele-grilles.py",
  "outils/test_modele_grilles.py",
  "docs/rd/grilles-dynamiques.toml",
  "docs/rd/paliers-affichage.toml",
  "assets/css/site.css",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py"
limite = "Le modèle ne lit que la présentation par défaut (`--content: 1160px`) : Panorama, Vitrine, Lecture, Compacte et Mosaïque fixent d'autres largeurs de conteneur et gardent leurs paliers. Il ne modélise pas les conditions de hauteur, réduit un bloc `(orientation: landscape) and (max-height: 560px)` à sa largeur maximale, suppose le conteneur `min(1160, W − 48)` et ignore toute grille hors de `.container`. Il calcule des largeurs de piste, pas la lisibilité d'une carte : un titre long dans 270 px peut encore casser sur trois lignes."
suite = "Convertir les 32 grilles restantes qui fixent encore leur nombre de colonnes, en commençant par celles dont le bloc `@media` ne tient que par la largeur, puis vérifier dans un navigateur ce que le modèle ne peut pas voir : la lisibilité réelle d'une carte de 270 px à 1 024 px de fenêtre."
initiatives = ["optimisation-du-site", "coordination-de-tous-les-agents"]

[[avancee]]
id = "une-copie-de-banc-ne-se-mute-pas-par-ses-liens"
date = 2026-10-31
titre = "Une copie de banc faite de liens ne se mute qu'après matérialisation du chemin"
constat = "Les bancs de ce dépôt travaillent sur une copie jetable remplie de liens symboliques (`outils/banc_mutations.py`) : `copie/assets` pointe vers `assets` du dépôt. Un banc écrit le 31 octobre 2026 a appelé `(copie / 'assets/css/site.css').unlink()` et `(copie / 'docs/rd/paliers-affichage.toml').unlink()` pour éprouver les cas « source absente ». Le chemin traverse un lien : ce sont la feuille de style réelle — 5 255 lignes — et le registre réel qui ont été supprimés. Le banc était vert sur tout le reste et rien ne le signalait : il éprouvait une copie qu'il venait de détruire à la place de l'original."
changement = "`banc_mutations.cible(dossier, relatif)` matérialise le chemin — défait le lien, copie le fichier — puis vérifie que le chemin résolu reste **dans la copie**, et lève une erreur explicite sinon (`le chemin résolu sort de la copie`). `outils/test_paliers_affichage.py` ne touche plus aucun fichier autrement, et un de ses cas éprouve la garde elle-même. Le même lot ajoute une garde symétrique côté outil : `compter-paliers.py --mettre-a-jour` refuse d'écrire un registre qui résout hors de la racine qu'il a reçu l'ordre de lire (code 2, « pointe hors de la racine lue »). Le 31 octobre, cette seconde garde a été écrite **parce que** la première ne suffisait pas : la régénération du registre écrivait encore dans le vrai fichier à travers le lien."
preuves = [
  "outils/banc_mutations.py",
  "outils/test_paliers_affichage.py",
  "outils/compter-paliers.py",
  "docs/rd/paliers-affichage.toml",
]
controle = "python3 outils/test_paliers_affichage.py"
limite = "La garde protège les écritures qui passent par `cible` ; un banc futur peut encore écrire par un chemin brut. Elle ne dit rien des suppressions faites par un outil externe, ni des liens que le banc créerait lui-même vers l'extérieur. Le dégât a été réparable (`git checkout` pour la feuille, réécriture pour un registre non encore versionné) ; un fichier non versionné, lui, serait perdu sans trace."
suite = "Faire lire ce cas par tout nouveau banc : la copie n'est pas un bac à sable, c'est une arborescence de liens. Étendre `cible` aux bancs existants lors de leur prochaine retouche."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "une-dette-d-affichage-se-compte-ou-se-perd"
date = 2026-10-31
titre = "Une règle d'affichage dynamique qui n'est pas comptée se perd un palier à la fois"
constat = "La règle écrite le 30 octobre 2026 — pas de valeurs fixes de fenêtre, l'agencement mesure l'espace disponible — ne portait que sur un panneau. La feuille `assets/css/site.css` contenait 66 blocs `@media` et personne ne savait combien reposaient sur une taille d'écran supposée. Deux écritures différentes d'une même condition y vivaient même côte à côte (`(max-width:760px)` à côté de `(max-width: 760px)`, `(forced-colors:active)` à côté de `(forced-colors: active)`) : un comptage naïf aurait annoncé un palier de plus qu'il n'en existait."
changement = "`outils/compter-paliers.py` relève chaque `@media`, canonise la condition, la classe (`format` si elle dépend d'une largeur, d'une hauteur ou de l'orientation ; `preference` si elle suit un réglage de la personne) et la confronte à `docs/rd/paliers-affichage.toml`, qui exige pour chaque condition de format une raison écrite, une décision (`dette` ou `assume`) et un compte exact. Une augmentation échoue — « un palier de plus est un écran de plus que le site présume » —, une diminution aussi, avec un autre message : c'est une avancée à dater. `--mettre-a-jour` inscrit les paliers inconnus avec une raison **vide**, que la vérification refuse ensuite : le script ne peut pas blanchir ce qu'il vient de découvrir. Banc de 19 cas, dont trois sources illisibles qui doivent sortir en code 2."
preuves = [
  "outils/compter-paliers.py",
  "outils/test_paliers_affichage.py",
  "docs/rd/paliers-affichage.toml",
  "assets/css/site.css",
  "docs/rd/formats-affichage.md",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/compter-paliers.py --releve && python3 outils/test_paliers_affichage.py"
limite = "Le contrôle compte les `@media` d'une seule feuille (`assets/css/site.css`) ; la feuille de l'aventure et celle du simulateur embarqué ne sont pas relevées, et une condition écrite sous `@supports` échapperait au compte. Il ne juge pas les raisons : une phrase de quarante caractères passe, même fausse. Enfin, le relevé du 31 octobre 2026 — 17 conditions de format, 45 blocs, 15 en dette — est un compte de **déclarations**, pas une mesure de ce que les gens voient : il ne dit pas quel écran réel tombe de quel côté d'un palier."
suite = "Résorber la dette par ordre de rentabilité : les trois paliers de grilles (1000, 981, 601 px, treize blocs) s'obtiennent en `auto-fit`/`minmax` sans condition ; puis le seuil 1260/1261 px, tenu à la main en deux endroits ; puis le cas paysage court, qui suppose qu'un écran bas est forcément étroit. Étendre le relevé à `anglais-aventure.css` et à l'habillage du simulateur."
initiatives = ["optimisation-du-site", "coordination-de-tous-les-agents"]

[[avancee]]
id = "un-controle-qui-n-a-pas-pu-chercher-ne-doit-pas-rassurer"
date = 2026-10-28
titre = "Un contrôle qui n'a pas pu chercher doit le dire, pas annoncer qu'il n'a rien trouvé"
constat = "`outils/verifier-planches-statuts.py` garde 12 planches citées, 203 liens d'image, 343 empreintes d'archive et l'absence de PNG suivi dans `docs/rd/statuts-animation/`. Il n'avait aucun test. En écrivant son banc, le cas « copie sans dépôt git » a révélé un défaut réel : `git ls-files` en échec renvoie une sortie vide, `splitlines()` rend une liste vide, et le contrôle annonçait « aucun PNG suivi » — il affirmait le résultat d'une recherche qu'il n'avait jamais pu faire. Le défaut ne se voyait pas dans le dépôt, où la commande réussit toujours."
changement = "Le banc `outils/test_mutations_planches_statuts.py` plante sept situations dans une copie complète du dépôt : planche citée supprimée, référence `statuts-animation/…` sans fichier ni archive, lien d'image non résolu, manifeste à 342 empreintes, manifeste de 344 empreintes dont deux homonymes, PNG réellement suivi par `git add`, et copie privée de dépôt git. Huit tests, 1,3 s. `verifier-planches-statuts.py` honore `MRSC_RACINE` et lève une erreur explicite quand `git ls-files` échoue, au lieu de rendre un silence complice. Inventaire : `banc`, et le total passe à 28 contrôles sur 37."
preuves = [
  "outils/verifier-planches-statuts.py",
  "outils/test_mutations_planches_statuts.py",
  "outils/banc_mutations.py",
  "docs/rd/plan-statuts-animation.md",
  "docs/rd/statuts-animation/ARCHIVE-film-associatif.sha256",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/test_mutations_planches_statuts.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc prouve que le contrôle refuse ces sept situations, pas qu'il voit toutes les façons de casser une archive : une empreinte fausse pour un fichier présent, une planche citée depuis un fichier binaire ou un `.gitignore` trop large lui échappent. Le manifeste est vérifié en nombre, en unicité de noms et en forme de ligne, jamais en contenu : un fichier modifié sous une empreinte recopiée passerait. Et `git ls-files` reste la seule autorité sur les PNG suivis : le banc en simule l'absence de dépôt, pas une sortie incohérente."
suite = "Vérifier aussi les empreintes elles-mêmes (`sha256sum -c` sur l'archive), puis attaquer les quatre contrôles navigateur depuis le job `graphismes`."
initiatives = ["documentation-rd-eva", "optimisation-du-site"]

[[avancee]]
id = "un-faux-navigateur-prouve-le-contrat-pas-la-mesure"
date = 2026-10-28
titre = "Un faux navigateur prouve le contrat de sortie, et il a trouvé un vrai défaut de rapport"
constat = "`outils/auditer-criteres-22.mjs` mesure trois critères WCAG dans un vrai Chromium et n'avait aucun test. Sa géométrie ne se teste pas sans navigateur, mais son contrat de sortie si — et c'est là qu'il a menti une fois : sans serveur local, il rendait « 0 cible, 0 élément testé », c'est-à-dire une page parfaite. En écrivant le banc, un second défaut est apparu, latent : la ligne des cibles à corriger poussait `{ page, largeur, ...cible }`, et la cible portait elle aussi une clé `largeur`. La largeur de fenêtre était donc écrasée par la largeur de la cible, dans le compte rendu comme dans le JSON — mais seulement quand il y avait quelque chose à corriger. Le relevé du 24 octobre 2026, qui en comptait zéro, était juste par accident."
changement = "Deux faux paquets (`outils/faux-navigateur/puppeteer-core` et `@sparticuz/chromium`) sont copiés dans un `node_modules` jetable, et `outils/test_auditer_criteres_22.mjs` lance **le vrai script** quatre fois : nominal, échec total (code 1, « Toutes les pages ont échoué », aucune ligne de bilan), échec partiel (le doute est écrit, la page en échec est nommée), défauts (cible trop petite, débordement, rognage, focus masqué, passe coupée par le plafond). 4 cas, 4 s, aucun binaire. Le rapport nomme désormais `largeurCible` et `hauteurCible` à côté de `largeur`, la fenêtre."
preuves = [
  "outils/auditer-criteres-22.mjs",
  "outils/test_auditer_criteres_22.mjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  "outils/faux-navigateur/@sparticuz/chromium/index.js",
  "outils/verifier-inventaire-controles.py",
  ".github/workflows/verification.yml",
]
controle = "node outils/test_auditer_criteres_22.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc ne mesure rien : il regarde ce que le script fait de mesures qu'on lui donne. La justesse de la géométrie — taille réelle d'une cible, recouvrement réel d'un bandeau, rognage réel d'un texte — reste hors de sa portée, et c'est pourquoi l'inventaire le classe `faute-en-memoire` et non `banc`. Le faux onglet départage la description d'une cible de ses points par le rang d'appel, ce qui casse si le script change l'ordre de ses appels ; et aucun banc ne couvre encore `verifier-accessibilite.cjs` ni `verifier-fiches-statistiques.cjs`, qui demandent, eux, un vrai Chromium."
suite = "Éprouver les deux contrôles navigateur restants dans le job `graphismes` (le banc y a sa place : il lui faut un vrai Chromium), puis `etat-rd.py`."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-etat-qui-perd-une-source-garde-l-air-complet"
date = 2026-10-29
titre = "Un rapport d'état qui perd une source sans le dire garde l'air complet"
constat = "`outils/etat-rd.py` imprime le tableau que le brief de décision prospective cite comme pièce justificative — initiatives, fiches, prototypes, revues, poids maximal. Il n'avait aucun test, et son défaut n'était pas de se tromper : il était de **se taire**. Un `poids-pages.md` absent ou reformaté faisait disparaître trois lignes du tableau, un journal sans entrée datée en retirait une autre, un portefeuille absent levait une trace d'exception, et une fiche dont `revue_le` ne se lisait pas était écartée du compte des revues échues — une date mal écrite rendait la fiche **moins** suivie. Dans les trois premiers cas, le tableau restait lisible, donc rassurant."
changement = "`etat-rd.py` honore `MRSC_RACINE`, traduit toute source absente ou illisible en `SourceIllisible` et l'inscrit comme une ligne « **non lu** — cause » au lieu de la supprimer ; les fiches à date illisible sont comptées et nommées dans une ligne « Revues non calculables » ; une sortie incomplète porte un code non nul et un avertissement explicite (« ce tableau ne doit pas servir de pièce jointe en l'état »). `outils/test_etat_rd.py` couvre sept cas dans une copie complète du dépôt : copie intacte, relevé de poids supprimé, relevé reformaté à trois colonnes, journal sans entrée datée, fiche au `revue_le` illisible, portefeuille absent, échéance calculée depuis `--date`. 1,2 s."
preuves = [
  "outils/etat-rd.py",
  "outils/test_etat_rd.py",
  "outils/banc_mutations.py",
  "docs/rd/poids-pages.md",
  "docs/rd/portefeuille.toml",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/test_etat_rd.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc prouve que l'outil nomme ce qu'il n'a pas pu lire, pas que ce qu'il lit est juste : une valeur fausse dans un fichier bien formé passerait sans être vue. La lecture du tableau de poids reste liée à sa forme — quatre colonnes, nom entre accents graves — et un futur relevé correctement rempli mais autrement formaté serait refusé, ce qui est le comportement voulu mais coûtera une correction. Rien ne vérifie non plus que les chiffres publiés correspondent à ce qu'un humain considérerait comme l'état de la R&D : c'est un compte, pas un jugement."
suite = "Éprouver `verifier-fiches-statistiques.cjs`, `verifier-accessibilite.cjs` et `auditer-affichages.mjs` avec le faux navigateur, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
initiatives = ["documentation-rd-eva", "veille-savoirs-evolutifs"]

[[avancee]]
id = "un-releve-qui-n-existe-pas-ne-dit-pas-zero-defaut"
