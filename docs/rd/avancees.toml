[[avancee]]
id = "sortie-commitee-sans-horloge"
date = 2026-10-22
titre = "Une sortie commitée ne se date pas avec l'horloge"
constat = "Deux fichiers générés et commités portaient la date du jour de leur génération. Comparés octet par octet par une porte CI, ils divergeaient dès le lendemain sans qu'aucun contenu ait changé : la porte « qualite » et la publication du site échouaient, et régénérer réparait le jour même en re-cassant le suivant."
changement = "L'horodatage des sorties vient désormais des registres — `meta.derniere_revue` pour les avancées, la plus récente `revue_le` du catalogue pour l'audit — et non de `date.today()`. La validation, elle, continue de juger les dates au jour réel. Un contrôle rejoue toutes les portes CI qui comparent un fichier généré avec une horloge déplacée de +37 et +400 jours, et prouve par mutation qu'il détecte bien un générateur fautif."
preuves = [
  "outils/construire-avancees.py",
  "outils/auditer-prototypes.py",
  "outils/test_reproductibilite_artefacts.py",
  "docs/rd/avancees.md",
  "docs/apprentissage/audit-automatique.md",
]
controle = "python3 outils/test_reproductibilite_artefacts.py && python3 outils/verifier-rd-continue.py"
limite = "Le contrôle prouve qu'une sortie est stable, jamais qu'une date est juste : la véracité d'une date de revue reste une relecture humaine. Il ne couvre pas non plus les scripts d'un futur lot, ni les rapports non commités de la veille, qui restent hors du périmètre comparé."
suite = "Étendre la règle au prochain générateur ajouté : si sa sortie est commitée puis comparée, son horodatage doit venir d'une donnée du dépôt et une entrée doit être ajoutée aux portes rejouées."
initiatives = ["optimisation-du-site", "coordination-de-tous-les-agents"]

[[avancee]]
id = "ecouter-sans-promettre-une-conformite"
date = 2026-10-23
titre = "Une aide d'inclusion se mesure sur ce qu'elle n'envoie pas, pas sur ce qu'elle déclare"
constat = "Une lecture à voix haute pouvait sembler une simple fonctionnalité de confort. Trois vérifications en ont fait une décision de conception : le texte lu ne doit jamais quitter l'appareil, la commande ne doit pas exister sur un appareil sans voix, et le résultat ne doit jamais être présenté comme une conformité. Un service public a d'ailleurs été mis en demeure en juin 2026 pour avoir déclaré « totalement conforme » un espace mesuré à 42,11 %."
changement = "Toute aide d'accessibilité ajoutée au site est désormais instruite comme une option comparée de la note prospective, avec sa source externe, son coût, son repli et ses limites publiées à côté de la commande. Trois garanties sont vérifiables dans le code plutôt que dans une intention : aucune création de la commande sans moteur de synthèse, aucun envoi réseau dans le module, et langue de chaque bloc respectée. Le contrôle statique refuse un `fetch`, un appel à un service de synthèse et une commande construite mais jamais ajoutée au panneau."
preuves = [
  "docs/rd/inclusion-lecture-vocale.md",
  "assets/js/site.js",
  "outils/verifier-affichages.py",
  "outils/test-experience.cjs",
  "outils/verifier-accessibilite.cjs",
]
controle = "python3 outils/verifier-affichages.py && node outils/test-experience.cjs && node outils/verifier-accessibilite.cjs"
limite = "Aucune voix réelle n'a été écoutée, aucun lecteur d'écran n'a été utilisé et aucune personne n'a essayé la commande : le banc remplace `speechSynthesis` par un double qui enregistre les énoncés. La limite affichée sous le bouton dit seulement ce que le dispositif ne peut pas garantir ; elle ne prouve aucune amélioration de compréhension, et les chiffres d'effet cités viennent d'études scolaires anglophones."
suite = "Faire écouter la fonction à une personne qui lit difficilement et à une personne utilisant un lecteur d'écran, puis consigner les mots mal prononcés et le cran de vitesse qui lui convient ; retirer le lot si la voix perd le fil ou si un bloc est lu deux fois."
initiatives = ["ecouter-la-page"]

[[avancee]]
id = "boite-non-nulle-nest-pas-affichee"
date = 2026-10-23
titre = "Une boîte non nulle ne prouve pas qu'un élément est affiché"
constat = "Un balayage de la taille des cibles a signalé 50 liens de 15 px sur `apprendre.html`. Ils étaient dans des `<details>` refermés : Chromium leur donne une boîte non nulle, un texte vide et une position, alors que personne ne les voit et qu'aucun clavier ne les atteint. Le même angle mort menaçait la lecture à voix haute livrée la veille, dont le filtre reposait sur `getClientRects` seul."
changement = "Quatre cas ont été mesurés et séparés : `display:none` donne un texte mais pas de boîte, `visibility:hidden` et un `<details>` refermé donnent une boîte mais pas de texte, `aria-hidden` est visible pour l'œil et doit être écarté à part. Toute liste d'éléments « affichés » du dépôt — lecture à voix haute, audit des cibles, échantillon de focus — vérifie désormais `checkVisibility({ checkVisibilityCSS: true, contentVisibilityAuto: true })`, garde `getClientRects` et `innerText` en secours, et écarte `details:not([open])` explicitement."
preuves = [
  "assets/js/site.js",
  "outils/auditer-criteres-22.mjs",
  "outils/verifier-affichages.py",
  "outils/test-experience.cjs",
  "docs/rd/inclusion-criteres-wcag-22.md",
]
controle = "python3 outils/verifier-affichages.py && node outils/test-experience.cjs"
limite = "Ces trois signaux décrivent un rendu dans Chromium, pas la perception : un contenu à contraste insuffisant, hors cadre après défilement ou recouvert par un bandeau reste « affiché » pour la mesure. Le cas d'un contenu animé, d'un iframe ou d'un canvas n'est pas couvert, et aucun de ces tests ne remplace une passe au clavier avec un lecteur d'écran."
suite = "Reprendre ce filtre pour tout futur balayage d'éléments interactifs, et vérifier qu'aucun script du dépôt ne conclut « visible » à partir d'une seule mesure de boîte."
initiatives = ["optimisation-du-site", "ecouter-la-page"]

[[avancee]]
id = "un-espacement-impose-casse-la-page"
date = 2026-10-24
titre = "Un espacement imposé casse la page avant de la rendre lisible"
constat = "Le critère WCAG 1.4.12 ne demande pas d'afficher un texte espacé, mais de supporter qu'une personne impose interligne 1,5, interlettrage 0,12 em, espacement des mots 0,16 em et 2 em après chaque paragraphe. Appliqué aux 98 pages, il a sorti la barre de navigation du cadre de 47 à 56 px entre 1 261 et 1 366 px — « Nous contacter » finissait hors de la fenêtre — et fait déborder les 84 fiches de 22 px à 1 280 px. Aucun des deux défauts ne se voyait sans imposer cet espacement."
changement = "`outils/auditer-criteres-22.mjs` applique les quatre valeurs du critère en `!important`, puis cherche deux pertes : une page qui se met à défiler horizontalement et un texte rogné par un ancêtre en `overflow: hidden` ou `clip`, nœud de texte par nœud de texte. Deux corrections sont livrées : `flex-wrap: wrap` sur `.nav-links`, qui laisse la ligne unique tant qu'elle tient, et `white-space: normal` sur le seul bouton de la colonne latérale d'une fiche. Un seizième contrôle de `verifier-affichages.py` refuse le retour en arrière."
preuves = [
  "outils/auditer-criteres-22.mjs",
  "outils/verifier-affichages.py",
  "assets/css/site.css",
  "docs/rd/formats-affichage.md",
  "docs/rd/inclusion-criteres-wcag-22.md",
  "docs/rd/audit-criteres-22-2026-10-24.json",
  "transparence.html",
]
controle = "python3 outils/verifier-affichages.py && node outils/auditer-criteres-22.mjs"
limite = "La mesure voit un débordement et un rognage, pas une perte de sens : un chevauchement partiel, une coupure de mot, un texte masqué par un `clip-path` sans `overflow` ou déplacé hors du champ visible sans déborder lui échappent. Aucune personne n'a relu ce critère, et rien ne prouve qu'une personne qui a besoin de cet espacement lit mieux la page : c'est une géométrie, pas un usage."
suite = "Faire lire la page à une personne qui agrandit l'interlettrage, puis étendre la mesure au zoom 200 % et au critère 1.4.10 (redistribution du contenu), qui n'ont jamais été éprouvés ici."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "reponse-chiffree-reliee-au-test"
date = 2026-10-24
titre = "Vérifier le résultat écrit dans la fiche, pas seulement un calcul parallèle"
constat = "Un test peut recalculer une moyenne exacte sans repérer une réponse fausse écrite dans le catalogue. L'ajout d'une fiche faisait aussi croître les totaux attendus d'anciens relevés axe, comme si une nouvelle page avait été mesurée automatiquement."
changement = "Les exemples du lot moyenne/médiane sont reliés à leurs passages de correction dans le catalogue. Deux mutations des réponses doivent échouer. Les compteurs courants sont distingués des anciens relevés d'accessibilité, conservés à leur périmètre daté."
preuves = ["outils/test_exemples_statistiques.py", "docs/apprentissage/catalogue.toml", "docs/rd/lot-statistiques-2026-10-24.md", "outils/verifier-site-statique.py"]
controle = "python3 outils/test_exemples_statistiques.py && python3 outils/verifier-site-statique.py"
limite = "Les contrôles portent sur des passages identifiés et des calculs finis : ils ne comprennent pas la totalité du texte, ne prouvent pas l'efficacité d'une analogie et ne remplacent aucune relecture mathématique ou pédagogique indépendante."
suite = "Faire relire les deux fiches et leurs tâches candidates, puis étendre les assertions aux prochains exemples sans transformer une correction automatique en promesse de compréhension."
initiatives = ["relire-les-44-prototypes", "co-conception-et-essais"]

[[avancee]]
id = "bande-de-changement-des-grilles"
date = 2026-10-31
titre = "Lire où une conversion change les colonnes, pas seulement combien de largeurs"
constat = "Le relevé des grilles à pistes inégales donnait un compte de largeurs (« 29 sur 233 diffèrent de la cascade ») sans dire lesquelles. Deux grilles au compte voisin, .participation-grid (13) et .ai-path-panel (29), cachaient donc des conséquences opposées : la seconde passait d'une à deux colonnes sur toute la plage 720–1 000 px, la première restait à deux colonnes et ne changeait que des largeurs."
changement = "modele-grilles.py --pistes imprime la bande de largeurs où le nombre de colonnes change, et de combien, en réutilisant la règle de calcul du nombre de colonnes en flex (extraite en colonnes_en_flex, une seule fois). La décision de convertir .ai-path-panel et de retenir .participation-grid est écrite, avec sa bande, dans le journal et dans formats-affichage.md § 20."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/journal.md", "docs/rd/formats-affichage.md", "docs/rd/grilles-dynamiques.toml"]
controle = "python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --verifier && python3 outils/compter-paliers.py"
limite = "La bande est calculée sur la présentation par défaut (contenu de 1 160 px) ; en Lecture (940 px) et en Panorama (1 480 px) elle se décale, et le modèle ne mesure pas ces présentations. Elle suppose aussi un contenu de largeur fixe : un titre long ou une image à ratio peuvent changer le repli réel, ce qu'aucun calcul hors navigateur ne tranche."
suite = "Mesurer dans le navigateur le rendu de .ai-path-panel dans la bande 720–1 000 px, puis traiter .home-share-panel dont la bande traverse le palier de 760 px, ce qui demande de savoir ce que ce palier porte encore."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "plage-de-deux-colonnes-assumee"
date = 2026-10-31
titre = "Accepter une plage de deux colonnes quand le palier contredisait la grille"
constat = ".home-share-panel demandait minmax(260px,.8fr) : deux colonnes tiennent dès 592 px de fenêtre, mais un palier de 760 px en imposait une seule. La valeur fixe refusait ce que l'arithmétique de la grille autorisait, et le compteur de paliers la comptait comme une dette sans dire qu'elle contredisait le contenu."
changement = "Le panneau passe en flex-wrap (260 px de base, rapport 1 / 0,8). Entre 600 et 760 px, il montre deux colonnes de 264 px : la seule plage qui change, assumée et bornée par trois vérifications écrites (flex-wrap ne déborde pas, les boutons tiennent dans 264 px, le texte est plafonné à 60ch). Le registre des paliers passe de 191 à 190 règles."
preuves = ["assets/css/site.css", "docs/rd/grilles-dynamiques.toml", "docs/rd/paliers-affichage.toml", "docs/rd/formats-affichage.md", "outils/test_modele_grilles.py"]
controle = "python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --verifier && python3 outils/compter-paliers.py"
limite = "Aucune mesure navigateur n'a été faite à 600 px : l'arithmétique prouve l'absence de débordement, pas la lisibilité de deux colonnes de 264 px. C'est la raison pour laquelle .participation-grid, dont le contenu est typographiquement plus lourd, reste retenu."
suite = "Mesurer le panneau à 600 et 700 px dans un navigateur avant de convertir .hero-grid et .mission-grid, dont l'écart de largeur est trois fois plus grand (59 et 91 px)."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "base-flex-en-em"
date = 2026-10-31
titre = "Faire suivre le repli d'une grille à la taille du texte, pas à celle de la fenêtre"
constat = "Les conversions en flex-wrap gardaient le minimum déclaré comme base, ce qui créait une plage où deux colonnes apparaissaient sous 760 px, et laissait le repli dépendre uniquement de la largeur de la fenêtre. Une base en pixels ignore totalement le réglage de taille de texte, alors que le contenu, lui, grandit avec elle."
changement = "modele-grilles.py --pistes propose désormais un plancher de compromis : la plus petite base qui reproduit le nombre de colonnes de la cascade à toutes les largeurs mesurées (325,64 px pour .hero-grid). .hero-grid est converti avec une base en em (20.4em), choisie au centième supérieur, et le registre déclare l'écriture et sa valeur en pixels pour que le contrôle recoupe les deux. À 130 %, la base passe de 326 à 424 px et le repli avance sans qu'aucune condition de largeur d'écran n'intervienne."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "assets/css/site.css", "docs/rd/formats-affichage.md"]
controle = "python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --verifier && python3 outils/compter-paliers.py"
limite = "La reproduction est arithmétique : elle garantit le même nombre de colonnes, pas le même dessin — une colonne peut varier de 68,7 px (24,3 %) au lieu de 58,9 px (20,9 %). Le compromis est calculé sur la présentation par défaut (contenu 1 160 px) ; en Lecture, à 940 px, le repli avance et le modèle ne mesure pas cette présentation. Aucun rendu n'a été observé dans un navigateur."
suite = "Appliquer la même méthode à .mission-grid (compromis 20.9em) et .learning-work-panel (21.3em), puis traiter à part .ai-feature-panel et .simulateur-promo-panel, pour lesquels aucune base ne reproduit la cascade — le relevé le dit désormais."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "repli-avant-verifie"
date = 2026-10-31
titre = "Vérifier qu'une base de flex reproduit le repli qu'elle prétend remplacer"
constat = "Le lot précédent affirmait que la base de .hero-grid reproduisait exactement l'ancien repli, mais la règle de palier ayant disparu avec la conversion, aucun contrôle ne pouvait refaire le calcul. Une promesse qu'on ne peut pas vérifier ne vaut pas mieux qu'une valeur fixe non mesurée."
changement = "Le registre des grilles flex gagne repli_avant_px : la largeur sous laquelle la cascade d'avant imposait une colonne. --verifier reconstruit cette cascade, applique la base déclarée et refuse si le nombre de colonnes diffère à une seule des 233 largeurs, en nommant la plage fautive. .mission-grid (20.85em) et .learning-work-panel (21.29em) sont converties avec cette garantie ; un cas de banc remet la base d'origine et exige le refus."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "docs/rd/formats-affichage.md", "assets/css/site.css"]
controle = "python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --verifier"
limite = "Le contrôle suppose une seule condition de repli sous la largeur déclarée : une grille dont le palier changeait deux fois demanderait un champ par condition. Et la reproduction reste arithmétique : même nombre de colonnes, pas même dessin — .mission-grid conserve 116,8 px (44,7 %) d'écart de largeur de colonne, le plus élevé du fil, à cause de son rapport 1,35 / 0,65 très dissymétrique."
suite = "Étendre le champ aux grilles à plusieurs conditions de repli, puis traiter les quatre grilles « proportion » sans compromis calculable (.ai-feature-panel, .learning-coverage-topic, .simulateur-promo-panel) par une autre méthode, en le disant."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "attente-navigateur-nommee"
date = 2026-10-31
titre = "Nommer la condition qu'une attente de navigateur attendait"
constat = "La CI est tombée sur un TimeoutError de Puppeteer qui ne nommait ni la condition, ni la ligne du script ; les journaux du job étant inatteignables depuis l'atelier et l'annotation bornée à trois lignes de contexte, diagnostiquer a demandé deux relances et une lecture de source pour une information que le script possédait."
changement = "Le module outils/attente-navigateur.cjs enveloppe page.waitForFunction : à l'expiration, le message recopie la source de la condition, le délai appliqué et la cause d'origine avec son type (TimeoutError et TypeError ne se réparent pas pareil). Les 53 attentes de test-experience.cjs passent par lui. L'annotation du workflow garde huit lignes de contexte et filtre les cadres du script. Deux bancs entrent dans qualite : test_attente_navigateur.cjs (4 cas, page factice) et test_test_experience.mjs, qui existait depuis le 14 octobre sans tourner dans aucune porte."
preuves = ["outils/attente-navigateur.cjs", "outils/test_attente_navigateur.cjs", "outils/test-experience.cjs", "outils/test_test_experience.mjs", ".github/workflows/verification.yml", "docs/rd/inventaire-controles.md"]
controle = "node outils/test_attente_navigateur.cjs && node outils/test_test_experience.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc éprouve le message d'échec sur une page factice, pas le comportement de Puppeteer : il ne dit pas si trente secondes suffisent à un vrai navigateur, ni pourquoi le job est tombé le 31 octobre 2026 — cette cause reste inconnue, et un vert ultérieur ne la prouverait pas."
suite = "Relire la prochaine annotation, qui nomme la condition, et traiter la cause réelle du TimeoutError au lieu de la deviner."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "compteur-paliers-avoue"
date = 2026-10-31
titre = "Reconnaître que le compteur de paliers ne mesure plus l'avancement"
constat = "Trois grilles ont quitté leur palier le même jour, et le compteur n'a baissé que de 189 à 188 : .ai-questions-layout et .learning-hero-grid occupaient des règles à plusieurs sélecteurs, et retirer un sélecteur d'une règle ne change ni le nombre de blocs ni celui des règles. Le chiffre restait juste, mais il ne disait plus ce qu'on croyait y lire."
changement = "Le registre des paliers écrit la limite en clair — il compte des règles et des blocs, pas des décisions — et les deux seuls chiffres d'avancement retenus sont désormais le nombre de grilles en flex-wrap (11) et le nombre de grilles « proportion » restantes (4). Le même jour, .ai-questions-layout (20.85em), .learning-hero-grid (21.09em) et .participation-grid (21.29em) sont converties avec une base de compromis qui reproduit exactement leur repli d'avant."
preuves = ["docs/rd/paliers-affichage.toml", "docs/rd/grilles-dynamiques.toml", "outils/compter-paliers.py", "outils/modele-grilles.py", "docs/rd/formats-affichage.md"]
controle = "python3 outils/compter-paliers.py && python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py"
limite = "Le compteur reste utile comme garde-fou d'augmentation (un palier de plus est un écran de plus présumé) ; c'est comme mesure d'avancement qu'il ne vaut rien. Et les bases de compromis sont calculées sur la présentation par défaut (contenu 1 160 px), pas en Lecture ni en Panorama."
suite = "Traiter les quatre grilles « proportion » restantes, dont trois n'ont aucune base qui reproduit leur repli : la méthode doit être dite, pas improvisée."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "classes-mortes-relevees"
date = 2026-11-01
titre = "Mesurer les grilles que personne n'ouvre, avant de les convertir"
constat = "Le relevé annonçait quatre grilles « proportion » restantes et proposait pour deux d'entre elles (.ai-feature-panel, .simulateur-promo-panel) des conversions, dont un compromis chiffré à 28,54em. Ces deux grilles n'étaient ouvertes par aucune page : toute une famille ai-feature-* (13 classes) et simulateur-promo-* (2) dormait dans la feuille, avec 25 classes mortes au total. Un modèle arithmétique ne sait pas distinguer une grille d'un nom dans une feuille."
changement = "Un nouveau contrôle, outils/auditer-selecteurs-morts.py, lit chaque sélecteur de assets/css et cherche le nom de classe dans les sources capables d'en produire une instance (pages, scripts, générateurs, données). Trois verdicts : lue, dynamique (construite à l'exécution, donc indécidable : adventure-learning-world-${n}) ou morte. Les 25 classes mortes sont retirées de la feuille, branche par branche dans les listes et les :is(...), et un composé entièrement mort condamne le sélecteur. Compteurs : 20 → 17 grilles à pistes inégales, 4 → 2 « proportion », 37 → 36 blocs de format, 188 → 176 règles de palier."
preuves = ["outils/auditer-selecteurs-morts.py", "outils/test_auditer_selecteurs_morts.py", "assets/css/site.css", "docs/rd/paliers-affichage.toml", "docs/rd/formats-affichage.md", ".github/workflows/verification.yml"]
controle = "python3 outils/auditer-selecteurs-morts.py --verifier && python3 outils/test_auditer_selecteurs_morts.py && python3 outils/compter-paliers.py && python3 outils/modele-grilles.py --verifier"
limite = "Le relevé ne voit pas une classe construite par une source qu'il ne lit pas, et il ne dit rien de l'utilité d'une classe qu'il trouve : une règle peut viser une classe présente et n'avoir aucun effet. Les six classes d'anglais-aventure.css construites à l'exécution restent indécidables, comptées mais non jugées. Les deux « proportion » qui restent ne sont pas converties : .learning-coverage-topic est une composition avec un enfant placé (grid-column:2), et .map-layout coûterait 212,9 px (78,8 %) d'écart de largeur de colonne."
suite = "Instruire les six grilles « borne » — un plafond en pixels n'a pas d'équivalent direct en flex — puis les huit « contenu », dont le repli dépend du texte et qu'aucun modèle ne tranche sans navigateur."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "badges-en-rem"
date = 2026-11-01
titre = "Séparer une colonne d'icône d'un plafond, et la faire suivre la taille du texte"
constat = "Le relevé classait six grilles « borne » — le mot d'un plafond. Cinq n'en avaient aucun : des colonnes de numéro ou d'icône à zéro palier, qui ne se replient jamais et n'avaient donc rien à convertir. Leur défaut réel était ailleurs : quatre étaient écrites en pixels nus, donc insensibles au réglage de taille de texte du site, alors que le numéro qu'elles portent, lui, grandit."
changement = "Le relevé distingue désormais badge, plafond, proportion, contenu et motif, et dit pour chaque badge son nombre de paliers et l'unité de ses pistes. Huit pistes en pixels ont été réécrites en rem à longueur égale (44/38/20/54/18/40 px côté site, 42/36 px dans la feuille de l'aventure, 20/54 px dans le panneau du simulateur) : rendu identique à 100 %, suivent le texte à 115 % et 130 %. --verifier refuse toute piste en pixels nus dans les trois sources qui sont de nous. Le seul vrai plafond, .learning-article-layout, est refusé avec sa mesure : la piste vaut 300 px sur les 180 largeurs à deux colonnes, la borne de 230 px n'est jamais atteinte, et flex ne sait pas rendre ce panneau pleine largeur quand il est seul sur sa ligne."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "assets/css/site.css", "assets/css/anglais-aventure.css", "outils/construire-simulateur.py", "docs/rd/grilles-dynamiques.toml", "docs/rd/formats-affichage.md"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/verifier-integration.py"
limite = "Aucun de ces changements n'a été regardé à 130 % dans un navigateur : la preuve est arithmétique. La feuille du moteur embarqué du simulateur vient de l'amont et n'est pas lue : ses pistes restent en pixels. Et la vérification ne lit que le texte des déclarations, pas une piste calculée en JavaScript."
suite = "Traiter les huit grilles « contenu », dont le repli dépend du texte : la CI dispose d'un Chromium, l'atelier non — mesurer là-bas, ou écrire pourquoi on ne mesure pas."
initiatives = ["optimisation-du-site"]
