[[avancee]]
id = "remesurer-avant-de-conclure-quun-defaut-est-la"
date = 2026-11-06
titre = "Un relevé qui ne reproduit pas un défaut ne prouve pas qu'il a été corrigé"
constat = """Le 6 novembre 2026, la page Transparence avait été publiée sans navigateur : un relevé A/B y notait un débordement horizontal préexistant de 24 px à `320-130`, attribué à `.section-heading` et `.licence-callout`, et la trace demandait de remesurer les six configurations. Chromium 153 a été rétabli hors du dépôt (`@sparticuz/chromium` 153.0.0, `puppeteer-core` 25.16.0, bibliothèques `al2023.tar.br`)."""
changement = """Trois relevés datés, sans aucune modification du site : 2 470 mesures de `outils/auditer-affichages.mjs` (10 modes × 13 pages × 19 formats), 272 mesures ciblées à 320 px avec 100/130 % de texte, six présentations, contraste et espacement renforcés, et 144 mesures d'A/B entre `transparence.html` d'avant #281 (45 759 o, récupérée par l'API GitHub) et d'après (50 876 o) avec les mêmes CSS/JS. Défilement horizontal maximal 0 px, zéro élément hors cadre, zéro texte rogné, zéro cible sous 24 px ; `outils/test-experience.cjs` repasse 13/13 avec `serveur-local.py`. Le débordement de 24 px n'est reproduit nulle part. Le relevé est consigné dans `docs/rd/releve-affichages-2026-11-06.md` et son résumé machine, et les entrées plus anciennes gardent leur date : aucune conclusion « corrigé » n'est tirée, puisqu'aucune règle CSS n'a changé et que le réglage exact du harnais A/B d'origine n'a pas été reconstitué."""
preuves = ["docs/rd/releve-affichages-2026-11-06.md", "docs/rd/releve-affichages-2026-11-06.json", "outils/auditer-affichages.mjs", "outils/test-experience.cjs", "docs/rd/journal.md"]
controle = "python3 outils/verifier-rd-continue.py && python3 outils/verifier-integration.py && node outils/test_auditer_affichages.mjs && python3 outils/construire-avancees.py --verifier && python3 outils/memoire-eva.py --verifier"
limite = """La mesure a aussi révélé deux limites qu'elle ne résout pas. L'auditeur sort en code 1 sur les 2 470 mesures à cause d'un faux positif : `span.customize-settings-chevron`, décor `aria-hidden` dessiné par masque avec `font-size: 0`, est compté comme « texte sous 12 px » ; le banc actuel remplace le navigateur par un faux qui renvoie directement les compteurs et ne peut donc pas éprouver un filtre. Dix mesures réelles montrent l'emblème bitmap de l'accueil agrandi 1,50× à 844 px en densité 3× (2 094 pixels d'appareil pour 1 400 de source), tandis qu'un commentaire CSS le dit encore « vectoriel » ; réintroduire un plafond de densité est un arbitrage de dessin laissé à l'association. Un seul navigateur, aucun lecteur d'écran, aucune personne, aucun zoom natif, aucune mesure de contraste : ces compteurs ne disent rien de la lisibilité réelle ni de la fidélité visuelle des deux commandes de l'en-tête."""
suite = "Corriger la sonde en écartant les décors `aria-hidden` à corps nul, avec un banc qui exécute réellement le filtre ; soumettre à l'association l'arbitrage netteté / taille de l'emblème avant toute règle de densité ; conserver la mesure `320-130` comme relevé daté sans la présenter comme un défaut constaté sur la version publiée."
initiatives = ["optimisation-du-site", "poids-et-sobriete-numerique", "coherence-textes-publics"]

[[avancee]]
id = "un-theme-est-une-promesse-sur-toutes-les-surfaces"
date = 2026-11-07
titre = "Un thème n'est pas un accent : promettre toutes les surfaces à la fois"
constat = """Le 7 novembre 2026, la demande était de proposer plusieurs apparences dans « Personnalisation », en commençant par les réglages les plus courants puis en ajoutant des palettes inspirées d'ambiances de série, de rétro-futurisme et d'arcade, mais nommées différemment. Le dépôt avait 108 jetons de couleur dans `:root` et un panneau construit une seule fois par `site.js` pour les 13 pages et les fiches."""
changement = """Six thèmes livrés : « Suivre l'appareil », « Papier clair », « Nuit sobre », puis « Bobine nocturne », « Cap horizon » et « Salle d'arcade ». Deux attributs sur `<html>` séparent le choix nominal (accents, décor) du fond résolu ; un seul bloc de 108 jetons sombres porte les quatre variantes foncées, généré depuis `:root` pour qu'aucune surface ne reste claire sous un texte clair. Les décors sont des dégradés statiques : aucune animation, donc rien à contourner avec `prefers-reduced-motion`. Préférence locale avec repli sans stockage, synchronisation entre onglets et vers l'iframe, bouton de retour, `theme-color` mis à jour. Aucun nom d'œuvre ni de marque dans le produit ; « les plus utilisés sur le net » est repris de la demande sans être présenté comme une statistique."""
preuves = ["docs/rd/apparences-themes.md", "docs/rd/releve-apparences-2026-11-07.md", "assets/css/site.css", "assets/js/site.js", "outils/verifier-apparences.py", "outils/test_mutations_apparences.py"]
controle = "python3 outils/test_mutations_apparences.py && python3 outils/verifier-apparences.py && python3 outils/versionner-css-ia.py --verifier && python3 outils/verifier-inventaire-controles.py"
limite = """Le premier relevé navigateur a mesuré 1,48:1 à 2,03:1 sur le texte des boutons en fond sombre : le bloc de jetons généré réécrivait `--on-accent` en blanc après la surcharge. Corrigé puis remesuré à 9,20:1 – 12,64:1 ; le minimum de toutes les paires mesurées est 6,97:1. La porte vérifie les paires de jetons déclarées et le relevé quelques styles calculés sur l'accueil, pas les 13 pages dans tous leurs états. Un seul navigateur, aucun lecteur d'écran, aucune personne : les noms, palettes et libellés restent une proposition d'agent à faire relire. L'iframe du simulateur garde sa feuille générée, et `site.js` en `defer` laisse un bref rendu clair avant un thème sombre mémorisé. La charte de l'association et la décision sur la citation signée restent deux choix distincts, toujours ouverts."""
suite = "Faire relire les six choix par l'association ; étendre les thèmes au simulateur via son générateur si le choix est retenu ; arbitrer un script de démarrage en en-tête ; corriger la sonde d'affichage avec un banc qui exécute réellement le filtre des décors."
initiatives = ["direction-artistique-motion", "optimisation-du-site"]

[[avancee]]
id = "la-relecture-de-contenu-est-une-etape-executable-pas-une-lecture-a-faire-valider"
date = 2026-11-07
titre = "Relire n'est pas faire valider : l'étape de vérification change de main"
constat = """Le 7 novembre 2026, après la publication des six apparences, la consigne a été explicite : la relecture doit être faite par l'agent dans une nouvelle étape de vérification avec des sources sûres, parce que la personne ne va pas « se cogner la lecture de millier de lignes » ; elle peut en revanche valider à l'oeil un placement, un style, une construction. Le dépôt savait compter les contrôles et refuser un jeton de couleur oublié, mais rien n'y prenait en charge la lecture de contenu : `outils/registre-relecture.py` ne relit rien, ne note rien, ne valide rien, et `outils/confronter-sources.py` restait un prototype hors porte de publication, avec un taux d'erreur non mesuré."""
changement = """Création d'une étape exécutable distincte : `outils/verifier-relecture-contenus.py` câblé en CI, `outils/test_mutations_relecture_contenus.py` (19 fautes plantées, copie intacte verte), un registre daté `docs/rd/relecture-contenus.toml` et un rapport `docs/rd/relecture-apparences-2026-11-07.md`. Huit sources primaires consultées le 7 novembre 2026 (MDN color-scheme, prefers-color-scheme, forced-colors, prefers-reduced-motion, theme-color ; W3C/WAI 1.4.3 et 1.4.11 ; définition W3C de la luminance relative) ; 25 affirmations rattachées ; les 20 chaînes publiques du lot couvertes une à une et confrontées littéralement au fichier cité. Trois natures : fait-source, mesure-interne, proposition — cette dernière doit dire « aucun fait externe ». La confrontation a produit trois corrections réelles, pas une relecture décorative : seuil de luminance 0,03928 → 0,04045 (WCAG 2.2, mai 2021), tolérance de 0,01 sur les seuils de contraste → comparaison sans arrondi (4,499:1 échoue), et retrait de l'allégation de fréquence « les plus utilisés sur le net » que MDN ne permet pas d'affirmer. Le protocole éditorial reçoit une section sur la frontière : la personne garde le rendu à l'oeil, l'agent porte la lecture, et `relectures.toml` reste vide."""
preuves = ["docs/rd/relecture-contenus.toml", "docs/rd/relecture-apparences-2026-11-07.md", "outils/verifier-relecture-contenus.py", "outils/test_mutations_relecture_contenus.py", "outils/verifier-apparences.py", "docs/protocole-editorial.md", ".github/workflows/verification.yml"]
controle = "python3 outils/verifier-relecture-contenus.py && python3 outils/test_mutations_relecture_contenus.py && python3 outils/verifier-apparences.py && python3 outils/verifier-inventaire-controles.py && python3 outils/registre-relecture.py"
limite = """La porte éprouve la discipline de la relecture et la couverture des chaînes, pas la vérité du Web : la lecture effective est consignée dans un rapport daté, et un domaine non primaire, une date absente, une limite trop courte ou une chaîne non couverte font échouer la CI. Le périmètre est le seul lot des apparences : les 107 fiches, les 81 prototypes, le fond de `transparence.html`, la prospective et la citation signée ne sont pas relus, et aucune fiche n'est promue. Ce n'est ni une validation humaine, ni une expertise de domaine, ni un avis juridique : trois recherches Web sur les noms inventés ne remplacent pas une consultation INPI/EUIPO. Aucun lecteur d'écran, aucun autre navigateur que Chromium 153, aucun essai avec des personnes et aucune validation visuelle nouvelle. La porte ne vérifie pas non plus que la source n'a pas changé depuis le 7 novembre 2026."""
suite = "Étendre le même mécanisme à un prochain lot de contenu en ajoutant ses affirmations au registre, sans jamais le pré-remplir au nom d'une personne ; garder les sources primaires datées et réévaluer leur fraîcheur lors d'une revue ; laisser la personne valider à l'oeil le placement, le style et la construction si elle le souhaite, sans lui demander de lire les registres."
initiatives = ["coherence-textes-publics", "coordination-de-tous-les-agents", "direction-artistique-motion"]

[[avancee]]
id = "une-edition-non-relue-ne-peut-plus-etre-publiee"
date = 2026-11-09
titre = "Une édition non relue ne peut plus être publiée"
constat = """Le 7 novembre 2026, la relecture de contenu était devenue une étape exécutable, mais elle restait bornée au seul lot des six apparences : `outils/verifier-relecture-contenus.py` vérifiait 8 sources et 25 affirmations, sans rien savoir d’une modification apportée ailleurs. Le 9 novembre, la consigne a été de rendre la chose « automatiquement lors de toutes éditions », pour « avoir toujours du contenu qui soit propre, pro et sourcé sans erreurs ». Un programme ne peut pas décider qu’une phrase est vraie ; il peut empêcher qu’une phrase change sans passer par la lecture de l’agent."""
changement = """Sentinelle `outils/relire-contenus.py` : SHA-256 des 494 fichiers texte du dépôt dans `docs/rd/empreintes-contenus.toml`, `[[edition]]` datée et attribuée à l’agent dans `docs/rd/editions-relecture.toml`, et `--appliquer` qui refuse de signer si une URL externe nouvelle n’est pas couverte par une source primaire enregistrée, si une apostrophe droite apparaît ou si une autre porte est en faute. Trois déclencheurs : workflow dédié sur chaque push de toutes les branches et chaque proposition, étape ajoutée à la CI principale, crochet `pre-commit` activé. Huit extraits de sources primaires déposés dans `docs/rd/sources-primaires/` avec URL, date et empreinte du corps : à chaque lancement, l’ancre du registre est confrontée au texte réel, un extrait modifié est refusé et une consultation de plus de 366 jours est signalée. Batterie rejouée sur tout le corpus : ancres et liens locaux des 122 pages HTML, TOML lisibles, brouillons, conflits, typographie, câblage, registre humain vide et porte du lot. `outils/test_mutations_relire_contenus.py` plante 17 fautes et exige leur refus nommé."""
preuves = ["docs/rd/relecture-automatique.md", "docs/rd/empreintes-contenus.toml", "docs/rd/editions-relecture.toml", "docs/rd/relecture-contenus.toml", "outils/relire-contenus.py", "outils/test_mutations_relire_contenus.py", ".github/workflows/relecture-contenus.yml", ".githooks/pre-commit", "docs/protocole-editorial.md"]
controle = "python3 outils/relire-contenus.py && python3 outils/test_mutations_relire_contenus.py && python3 outils/verifier-relecture-contenus.py && python3 outils/verifier-inventaire-controles.py && python3 outils/verifier-workflows.py && python3 outils/verifier-fusions.py"
limite = """L’automatisation ne juge pas la vérité d’une phrase, ne fabrique ni relecture humaine, ni expertise de domaine, ni avis juridique, ni essai avec des personnes, ni validation visuelle. Les 494 empreintes du 9 novembre sont une référence de départ : `limite_reference` consigne que la relecture de fond du corpus existant (107 fiches, 81 prototypes, fond de `transparence.html`, prospective, citation signée) reste une dette visible, pas un contenu déclaré validé. Le crochet local est contournable par `--no-verify` ; la CI ne l’est pas. `relectures.toml` reste vide et `confronter-sources.py` reste hors porte de publication. Une URL seule ne suffisait plus : huit extraits sont vérifiés, mais une page source peut changer après sa consultation, et la fraîcheur ne remplace pas une nouvelle lecture."""
suite = "À chaque édition, relire le delta, confronter les faits aux sources primaires datées, consigner la `[[edition]]` avec ses limites, puis laisser la personne juger le rendu à l’oeil ; réévaluer la fraîcheur des extraits en revue ; résorber la dette de relecture de fond par lots, sans promouvoir de statut."
initiatives = ["coherence-textes-publics", "coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "un-collage-a-la-copie-est-un-defaut-de-rendu-pas-une-coquille"
date = 2026-11-09
titre = "Un collage à la copie est un défaut de rendu, pas une coquille"
constat = """Le 9 novembre 2026, la présentation de l’ouverture de l’accueil a été jugée « pas vraiment profesionnel », avec trois collages cités : « compréhensibles.Ce », « différent :**des fiches**pour » et « publique.Vous ». Le réflexe aurait été de corriger le HTML. La mesure dans Chromium 153 a montré trois causes distinctes : `main p > strong:first-child { display: block; }` s’applique aussi quand une phrase commence par du texte avant son gras ; le découpage en `<span class="phrase">` de `site.js` remplace les paragraphes sans conserver l’espace entre phrases ; et une grille `auto-fit` à 190 px laisse le troisième repère chiffré seul dans une demi-carte. S’y ajoutaient un H1 sur six lignes (80 px, `max-width: 20ch`), une colonne de 1 791 px et des graisses `550`/`650` arrondies en gras par la police système."""
changement = """L’ouverture est reprise : association loi 1901 en introduction courte, trois ressources en liste aérée, documents officiels et contact en phrases distinctes, label « Repères recalculés depuis les registres », H2 « Trois ressources et un chantier en cours. » (quatre entrées conservées dans l’encadré). Le titre passe à `26ch` et `clamp(2.2rem, 3.8vw, 3.5rem)` : 542 → 247 px de haut, six → quatre lignes réelles. Le gras est remis dans la ligne pour le seul hero, les graisses redescendent à 400, l’encadré s’aligne en haut et les trois repères forment une bande `flex-wrap` sans carte orpheline, avec une règle explicite pour le mode « Lecture ». `site.js` exempte `.home-hero-civic` du découpage en phrases, sans toucher au reste du site. Un 19e garde-fou dans `verifier-affichages.py` tient les trois corrections et trois mutations de plus dans son banc prouvent qu’il mord. Quatre unités sont signées par la sentinelle de relecture, nature `mesure-interne`."""
preuves = ["index.html", "assets/css/site.css", "assets/js/site.js", "outils/verifier-affichages.py", "outils/test_mutations_affichages.py", "docs/rd/editions-relecture.toml", "docs/rd/journal.md"]
controle = "python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py && python3 outils/verifier-integration.py && python3 outils/verifier-site-statique.py && python3 outils/verifier-budgets-visuels.py && python3 outils/relire-contenus.py"
limite = """Ce n’est ni une validation humaine du texte ni du rendu, ni une expertise de domaine, ni un avis juridique, ni un essai avec des personnes : la personne s’est réservé le jugement du rendu à l’oeil. Les mesures couvrent cinq largeurs et huit réglages sur Chromium 153 seulement ; aucun autre navigateur, aucun lecteur d’écran. Les faits (107 fiches, 15 domaines, 26 + 81, 100+ leviers, 5 échelons, 20 domaines, zéro compte) sont recalculés depuis les registres, pas relus dans leur fond ; la dette de relecture initiale du corpus reste consignée. Le grand visuel garde son plafond de 700 px contrôlé par la porte d’affichage, et un vide subsiste sous l’encadré à droite : deux choix de composition non tranchés. Rien n’est publié : la branche de travail et sa proposition de contrôle ne modifient pas le site en ligne."""
suite = "Laisser la personne juger le rendu à l’oeil ; si elle le demande, arbitrer la place du grand visuel et le vide sous l’encadré, puis seulement publier. Ne pas étendre l’exemption du découpage en phrases à d’autres pages sans mesure préalable."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "la-presentation-de-lassociation-devient-un-parcours"
date = 2026-11-09
titre = "La présentation de l’association devient un parcours"
constat = """Le 9 novembre 2026, la section « L’association » de l’accueil restait un bloc de neuf paragraphes : 1 215 px de haut à 1 440 px, 1 944 px à 390 px, dix phrases découpées en blocs par `site.js` et trois cartes sans aucun lien. La page Documents, pourtant destination du bouton « Découvrir l’association », répétait deux fois la même notice et n’expliquait aucune de ses quatre pièces. Le défaut était de composition et de hiérarchie, pas une coquille."""
changement = """L’accueil présente désormais une introduction courte, un lien explicite vers les statuts, quatre repères vérifiables (régime loi 1901, version des statuts, siège, accès sans compte) et trois portes d’entrée réellement liées vers les fiches, le dossier IA et le simulateur. La page Documents reçoit un bandeau « L’association en bref », quatre notices distinctes fondées sur les statuts et les bulletins du dépôt, et une section « Par où continuer ? ». `site.js` exempte ce parcours du découpage en phrases. Un 20e garde-fou dans `verifier-affichages.py` tient les repères, les liens, l’exemption et l’unicité des notices ; quatre mutations supplémentaires (31 au total) prouvent qu’il mord."""
preuves = ["index.html", "documents.html", "assets/css/site.css", "assets/js/site.js", "outils/verifier-affichages.py", "outils/test_mutations_affichages.py", "docs/rd/journal.md"]
controle = "python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py && python3 outils/verifier-integration.py && python3 outils/relire-contenus.py"
limite = """Ce n’est ni une validation humaine du texte ou du rendu, ni une expertise de domaine, ni un avis juridique, ni un essai avec des personnes. Les repères sont repris des statuts et des bulletins conservés dans le dépôt ; leur validité juridique actuelle n’a pas été vérifiée auprès d’une source externe, et la page renvoie au texte statutaire. Le garde-fou est statique : il vérifie des chaînes et une structure, pas la vérité des faits ni l’esthétique. Mesures sur Chromium 153 uniquement ; un seul moteur. La dette de relecture de fond du corpus reste consignée et `relectures.toml` reste vide."""
suite = "Laisser la personne juger le rendu publié ; ne pas étendre l’exemption du découpage en phrases à d’autres pages sans mesure préalable ; résorber la dette de relecture par lots datés."
