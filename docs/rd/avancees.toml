[[avancee]]
id = "bande-d-un-pixel"
date = 2026-11-01
titre = "Une promesse vérifiée au pas de 10 px ne vaut rien : la fenêtre d'une base flex fait un demi-pixel"
constat = "Six grilles converties en flex-wrap portaient au registre la phrase « aucune largeur ne change de nombre de colonnes », vérifiée aux largeurs multiples de 10 px. Le même balayage au pixel (2 321 largeurs de 240 à 2 560) a montré que trois d'entre elles changeaient de colonnes à 761 px — une bande d'un seul pixel. Pour un repli voulu à 760 px, les bases qui le reproduisent forment une fenêtre de 0,46 px de large ; 20.4em (326,40 px) tombait 0,34 px au-dessus de la fenêtre de .hero-grid (325,60 à 326,06 px), et 21.29em (340,64 px) au-dessus de celle de .learning-work-panel et .participation-grid (340,00 à 340,50 px). La veille avait validé trois grilles que son pas n'avait pas vues."
changement = "Les trois bases sont réécrites (20.37em, 21.28em, 21.28em) et le calcul est corrigé à la racine : la base en em est arrondie vers le bas puis vérifiée au pixel (arrondir vers le haut sort de la fenêtre et rouvre la bande), et la tolérance du registre passe de 0,5 px à 0,01 px — plus large que la fenêtre, elle ne contrôlait rien. .simulateur-intro est convertie (base 28.53em, repli 1 000 px, 0 bande) et son palier supprimé. Deux formes sont nommées au lieu d'être forcées : sans-plancher (.footer-grid, deux marches 4 → 2 → 1, aucune base unique) et decor. Le relevé compte 16 grilles à pistes inégales, les paliers 17 conditions / 35 blocs / 175 règles."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "assets/css/site.css", "docs/rd/grilles-dynamiques.toml", "docs/rd/paliers-affichage.toml"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/compter-paliers.py && python3 outils/verifier-integration.py"
limite = "La promesse est tenue au pixel, mais sur la présentation par défaut (contenu 1 160 px) et avec une racine à 16 px : à 115 % et 130 % la base en em avance le repli, ce qui est voulu et non mesuré. « Aucune bande » ne veut pas dire « mêmes largeurs » : le coût de conversion reste réel (68,6 px, 24,3 % pour .hero-grid). Le balayage au pixel coûte du temps (test_modele_grilles.py passe de 19 s à 61 s). Et un refus faux a été trouvé en réparant les bancs : un modèle peut répondre « aucune base » sans avoir mesuré, quand il ne reconnaît pas la forme d'écriture d'une règle de palier."
suite = "Traiter les deux grilles « proportion » restantes et les cinq « contenu », puis mesurer le repli des bases en em à 115 % et 130 % — la CI a un Chromium, l'atelier non."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "modele-confronte-au-navigateur"
date = 2026-11-01
titre = "Un modèle qui se valide lui-même ne prouve que sa cohérence"
constat = "La promesse « aucune largeur ne change de nombre de colonnes », portée par six grilles converties, n'était vérifiée que par le modèle lui-même : modele-grilles.py calculait les colonnes de sa propre formule et se déclarait d'accord. Le 1er novembre 2026, un balayage plus fin a trouvé trois bandes d'un pixel dans ces grilles — et rien, dans le dépôt, ne pouvait les contredire. Un contrôle qui ne se compare qu'à sa propre arithmétique ne prouve que sa cohérence."
changement = "Une chaîne de trois pièces séparées. modele-grilles.py --releve-json écrit la prédiction pour 34 grilles : les largeurs qui encadrent chaque rupture annoncée, plus treize largeurs de repère, aux trois tailles de texte pour une base en em (100, 115, 130 %) et à 100 % seulement pour une base en pixels, ce que le relevé écrit. mesurer-grilles.cjs compte dans un vrai Chromium : rangées d'un flex-wrap repérées par la position horizontale (le haut serait faux en align-items: center), pistes non nulles d'une grille (auto-fit replie une piste vide à 0 px), et fenêtre élargie de la largeur de l'ascenseur pour que clientWidth vaille la largeur demandée. rapporter-mesure-grilles.py compare et nomme : largeur, échelle, valeur annoncée, valeur vue, et largeur réelle de l'élément à côté du conteneur présumé. Codes de sortie écrits avant la première mesure : 2 sans navigateur, 1 si une page ou un sélecteur échappe à la mesure, et un point annoncé sans mesure est compté non mesuré."
preuves = ["outils/modele-grilles.py", "outils/mesurer-grilles.cjs", "outils/rapporter-mesure-grilles.py", "outils/test_rapporter_mesure_grilles.py", "outils/test_modele_grilles.py", ".github/workflows/verification.yml", "docs/rd/formats-affichage.md"]
controle = "python3 outils/test_rapporter_mesure_grilles.py && python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --releve-json /tmp/releve.json"
limite = "L'atelier n'a pas de Chromium : la première mesure réelle n'a lieu que dans le job graphismes, et tant qu'elle n'a pas tourné, ce lot livre l'instrument, pas la preuve. Le relevé ne couvre que la présentation par défaut — les cinq autres replient plusieurs de ces grilles par d'autres règles — et un seul point par couple page/grille, sur la page où la grille reçoit le plus d'éléments. Il compte des colonnes : il ne dit rien de la lisibilité. Le mode --controler existe mais n'est pas encore celui de la CI : le premier passage publie, il ne juge pas."
suite = "Lire le relevé de la première exécution, puis passer l'étape en --controler : soit le modèle est confirmé, soit ses divergences sont nommées, et la première cause à écarter est le remplissage des panneaux que conteneur() ne modélise pas."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "conteneur-jamais-mesure"
date = 2026-11-01
titre = "Le conteneur du modèle était une constante, et le navigateur l'a dit"
constat = "Le modèle des grilles ne calcule pas des colonnes dans l'abstrait : il les calcule dans un conteneur, et ce conteneur valait min(1160, largeur - 48) — 48 px de marge, partout, toujours. La première confrontation à un vrai navigateur (34 grilles, 743 points) a trouvé 70 points divergents sur 673 confirmés, dans 23 grilles sur 34, et les largeurs d'éléments imprimées désignent trois causes : la feuille réduit la gouttière à 2rem sous 760 px (le conteneur réel est 16 px plus large que le modèle), la gouttière est en rem et suit donc la taille du texte (7,2 puis 14,4 px d'écart à 115 et 130 %), et une grille qui porte son propre remplissage donne moins que le conteneur à ses enfants (.learning-work-panel : 652 px de contenu pour 713 px d'élément à 761 px)."
changement = "La promesse « aucune largeur ne change de nombre de colonnes », portée par six grilles converties, est réfutée dans un navigateur. Pour les grilles dont le palier tombait à 760 px, elle est même démontrée irréalisable : à 760 px le conteneur vaut 728 px et exige une base supérieure à 333,6 px, à 761 px il vaut 713 px et exige une base inférieure à 326,06 px — l'intersection est vide, parce que le conteneur rétrécit de 15 px quand la fenêtre grandit d'un pixel. Aucun flex-basis ne peut produire un repli quand la place augmente. La promesse sera donc retirée du registre, pas adoucie, et le conteneur deviendra une fonction de la largeur et de la taille du texte, lue dans la feuille. Le relevé navigateur, lui, reste un relevé jusqu'à cette correction : il publie, il ne juge pas, et le dit."
preuves = ["outils/modele-grilles.py", "outils/mesurer-grilles.cjs", "outils/rapporter-mesure-grilles.py", "docs/rd/formats-affichage.md", ".github/workflows/verification.yml"]
controle = "python3 outils/modele-grilles.py --releve-json /tmp/releve.json et node outils/mesurer-grilles.cjs, puis python3 outils/rapporter-mesure-grilles.py --resume"
limite = "La mesure est celle d'un navigateur sans personne devant : elle compte des colonnes, elle ne dit rien de la lisibilité. Elle ne couvre que la présentation par défaut, pas les cinq autres où --content vaut 940 ou 1 480 px. Et les annotations de CI sont plafonnées à une dizaine par étape : le total est donc imprimé avant le détail et le workflow avoue le nombre de grilles coupées."
suite = "Modéliser le conteneur (gouttière 3rem au-dessus de 760 px, 2rem à 760 et moins, multipliée par la taille du texte), puis retirer repli_avant_px des six grilles dont le palier était à 760 px : une promesse irréalisable se retire, elle ne s'adoucit pas. Le relevé ne devient un contrôle qu'après, et son premier passage en --controler devra donner zéro divergence."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "gouttiere-lue-pas-supposee"
date = 2026-11-01
titre = "Le conteneur cesse d'être un chiffre : la gouttière est lue dans la feuille"
constat = "Le modèle des grilles calculait les colonnes dans un conteneur qu'il ne lisait pas : min(1160, largeur - 48), 48 px de gouttière partout. La feuille écrit calc(100% - 3rem) et, sous 760 px, calc(100% - 2rem). À 760 px le conteneur réel vaut 728 px et le modèle en présumait 712. Conséquence non vue depuis le premier jour : le conteneur rétrécit de 16 px quand la fenêtre grandit d'un pixel, si bien que la promesse « le repli ne bouge pas » des six grilles converties sur un palier de 760 px était géométriquement irréalisable — reproduire ce repli exige une base supérieure à 333,6 px d'un côté du seuil et inférieure à 326,06 px de l'autre, et l'intersection est vide."
changement = "Trois lectures remplacent trois suppositions. La gouttière est lue dans la règle .container (3rem au-dessus de 760 px, 2rem à 760 et moins) et une lecture impossible fait sortir l'outil en code 2 au lieu de retomber sur 48 px. La taille du texte devient un paramètre : 1rem vaut 16 px × 1,15 ou × 1,3, donc la gouttière grandit et le conteneur rétrécit quand quelqu'un agrandit, tandis que vw ne suit pas le texte. Le remplissage du conteneur est lu aussi (padding de la règle de base), parce qu'une grille qui en porte un ne donne pas sa largeur à ses enfants. La promesse irréalisable est retirée, pas adoucie : six grilles déclarent repli_refuse_px et le contrôle recalcule la fenêtre des bases qui y arriveraient, en refusant si elle n'est pas vide. À la place, un invariant qui survivra aux prochaines conversions : une grille ne perd jamais une colonne en gagnant de la place, vérifié aux trois tailles de texte. Le relevé navigateur ne recalcule plus aucune largeur : la largeur présumée est écrite point par point dans la prédiction."
preuves = ["outils/modele-grilles.py", "docs/rd/grilles-dynamiques.toml", "outils/test_modele_grilles.py", "outils/rapporter-mesure-grilles.py", "docs/rd/formats-affichage.md"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/test_rapporter_mesure_grilles.py && python3 outils/modele-grilles.py --releve-json /tmp/releve.json"
limite = "Après correction, la mesure est passée de 70 divergences dans 23 grilles à 39 dans 8, dont 4 à moins d'un pixel de la bascule (comptées, tolérance déclarée à 1 px, plus petite qu'une colonne). Les 35 autres viennent de quatre grilles posées dans une colonne, dont le parent est plus étroit que le conteneur : .simulateur-chiffres mesure 521,44 px là où le modèle en présume 1 112, .learning-code-grid 615,84 contre 956. La chaîne des ancêtres n'est pas modélisée, et l'étape reste un relevé tant que ces 35 divergences ne sont pas expliquées par le modèle. Seule la présentation par défaut et la gouttière de .container sont lues : un conteneur qui écrirait sa largeur autrement (max-width, pourcentage imbriqué) sort en code 2 plutôt que d'être deviné. Ni le décalage de défilement, ni les marges d'un parent plus étroit que .container, ni les grilles posées dans une colonne ne sont modélisés. Le relevé navigateur ne dit toujours rien de la lisibilité, et son passage en contrôle attend que la mesure corrigée montre zéro divergence."
suite = "Donner au modèle la chaîne des ancêtres : une grille posée dans une piste de .learning-article-layout ou de .simulateur-duo ne reçoit pas le conteneur entier, et largeurs_pistes sait déjà calculer la piste du parent. Ces 35 divergences tomberont alors, et l'étape pourra passer en --controler."
initiatives = ["optimisation-du-site"]

[[avancee]]
id = "memoire-a-trois-horizons"
date = 2026-11-01
titre = "Une mémoire à trois horizons, avec un pointeur par fait"
constat = "Le projet savait mesurer ses grilles et vérifier ses contrôles, mais rien ne répondait à la question la plus simple : où est écrit ce que je sais ? Un dépôt de 78 documents, un journal de plusieurs dizaines de décisions et 65 avancées ne se relisent pas à chaque tour — et les relire coûte exactement ce que ce projet reproche ailleurs : charger beaucoup pour peu. La demande d'origine parlait de mémoire humaine à court, moyen et long terme, sans qu'aucun endroit du dépôt ne la porte."
changement = "outils/memoire-eva.py construit 404 entrées à trois horizons : 11 de court terme (trois dernières décisions, trois dernières avancées, phases en cours, recalculées donc jamais périmées), 350 de moyen terme (journal daté, avancées, 19 branches du portefeuille), 43 de long terme (documents de fond). Chaque entrée porte un titre, un résumé de 160 caractères au plus et un pointeur fichier:ligne — aucune ne recopie un document. L'index pèse 159 294 octets pour un corpus de 1 508 189, soit 10,6 %, et une recherche imprime ses cinq pointeurs avec le poids lu. Le graphe est dérivé et non saisi : graphe.md (Mermaid, lisible dans Obsidian ou Graphify) et graphe.dot (221 nœuds, 428 arêtes). Le contrôle refuse un pointeur mort, une ligne hors fichier, un résumé trop long, un fait écrit deux fois, un renvoi qui ne résout plus, et un index qui n'est plus le rendu de ses sources."
preuves = ["outils/memoire-eva.py", "outils/test_memoire_eva.py", "docs/rd/eva/memoire.json", "docs/rd/eva/graphe.md", "docs/rd/eva/graphe.dot"]
controle = "python3 outils/memoire-eva.py --verifier && python3 outils/memoire-eva.py --evaluer && python3 outils/test_memoire_eva.py"
limite = "L'index retrouve des mots, pas un sens : une question mal formulée ne trouve rien. Le résumé est la première phrase de la source, pas un résumé écrit pour le sujet. Le graphe ne porte aucune information qui ne soit déjà écrite ailleurs. La médiane de rappel mesurée (19,78 ms) est celle de l'index, pas celle d'une pensée, et aucune comparaison avec un temps de réponse humain n'est revendiquée."
suite = "Brancher la mémoire sur les fiches d'apprentissage (phase apprentissages-et-relecture) dès qu'une personne accepte un rôle de relecture, et donner au modèle des grilles la chaîne des ancêtres."
initiatives = ["documentation-rd-eva", "coordination-de-tous-les-agents", "veille-savoirs-evolutifs"]

[[avancee]]
id = "plan-eva-qui-se-laisse-contredire"
date = 2026-11-01
titre = "Un plan de 12 phases qui refuse de présenter une intention comme un résultat"
constat = "Une demande de plan complet sur un projet d'assistant — mémoire, temps de réponse, conscience, corps, exosquelette — se traduit d'ordinaire en promesses datées. Le dépôt avait déjà la bonne règle en prose (eva.html ne prétend pas que toutes les fonctions existent) mais rien ne l'exécutait : aucune mécanique n'empêchait une phase de passer faite sans preuve, ni un refus de devenir un abandon déguisé."
changement = "docs/rd/eva/plan.toml porte 12 phases et plan.md en est le rendu régénéré. outils/verifier-plan-eva.py refuse sept fautes : une phase faite sans preuve, sans banc ou sans citation au journal ; une phase en-cours sans test ; un hors-portée ou en-attente sans condition de révision d'au moins 40 caractères ; une dépendance inconnue ; un cycle ; une date future ; une branche du portefeuille servie par aucune phase ; et une phase déclarée faite alors que ce dont elle dépend ne l'est pas. Trois phases sont hors de portée (conscience et corps, parité de délai avec un humain) avec la condition exacte qui les ferait changer de statut : définition falsifiable, mesure indépendante reproduite, revue de sûreté, décision associative — les quatre, pas l'une des quatre. Le prénom et l'année 1980 sont écrits comme fiction de conception, dans un champ que le rendu affiche avant les phases."
preuves = ["docs/rd/eva/plan.toml", "docs/rd/eva/plan.md", "outils/verifier-plan-eva.py", "outils/test_verifier_plan_eva.py"]
controle = "python3 outils/verifier-plan-eva.py && python3 outils/test_verifier_plan_eva.py"
limite = "Le contrôle vérifie qu'un test existe, pas qu'il prouve ce que la phase prétend : la lecture du test reste humaine, et l'inventaire des contrôles le dit. Couvrir une branche prouve qu'elle est nommée, pas qu'elle avance — c'est le statut de la phase qui dit où l'on en est. Aucun de ces textes n'a été relu par une personne extérieure au dépôt."
suite = "Faire relire le plan et la page publique par une personne de l'association, et traiter les deux phases en-attente qui dépendent d'elles (apprentissages-et-relecture, voix-et-ecoute)."
initiatives = ["documentation-rd-eva", "coherence-textes-publics", "cartographier-les-lacunes"]

[[avancee]]
id = "grilles-chaine-des-ancetres"
date = 2026-11-02
titre = "La grille n'occupe pas le conteneur : la chaîne des ancêtres, et le relevé devenu contrôle"
constat = "Le modèle des grilles présumait que chaque grille occupait `.container` entier. Vrai pour trente grilles, faux pour quatre : `.simulateur-chiffres` mesurait 521,44 px là où le modèle en présumait 1 112, `.learning-code-grid` 615,84 contre 956, `.ai-fraud-steps` 505,13 contre 554, `.ai-path-steps` 394,02 contre 448,4. Ces quatre grilles vivent dans une colonne : un parent flex qui partage sa largeur entre deux enfants, un parent grid à colonne de 300 px, le remplissage et la bordure d'un parent bloc. Le modèle ne connaissait pas leurs ancêtres, et c'est ce qui interdisait de transformer le relevé navigateur en contrôle."
changement = "`outils/modele-grilles.py` lit la page et la feuille par classe : `chaine_d_ancetres` retrouve l'élément et ses parents, `definir_feuille` indexe les règles, et `largeur_de_la_chaine` calcule ce que la chaîne laisse — bloc, flex en ligne (grow, shrink, base, repli) ou grid à pistes évaluables, remplissage, bordures et marges compris. Ce qui n'est pas lisible rend `None` et le relevé l'écrit (`conteneur_source`) : base `flex: auto`, piste `auto`, bordure sans épaisseur. La gouttière du conteneur devient une suite de paliers lue en entier — `3rem` partout, `2rem` sous 760 px, `1.35rem` sous 520 px — là où le modèle n'en connaissait que deux et présumait 448 px à 480 de fenêtre au lieu des 458,39 mesurés. Résultat mesuré sur 756 points : 39 divergences dans 8 grilles deviennent 4 dans 4 grilles, toutes à moins d'un pixel du point de bascule (0,20 · 0,28 · 0,60 · 0,78 px), 752 points confirmés, 0 non mesuré. L'étape de CI passe en `--controler` : une divergence franche échoue en nommant la grille, la largeur et les deux largeurs d'élément ; une divergence au seuil est comptée, jamais absorbée."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "outils/mesurer-grilles.cjs", "outils/rapporter-mesure-grilles.py", ".github/workflows/verification.yml"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && MRSC_BROWSER_NODE_MODULES=… node outils/mesurer-grilles.cjs … && python3 outils/rapporter-mesure-grilles.py --releve … --rapport … --controler"
limite = "La chaîne est lue sur la page où la grille apparaît le plus souvent, et sur le premier élément portant la classe : une grille posée dans deux contextes n'a qu'une prédiction. Les `min()` et `repeat()` d'un `grid-template-columns` parent ne sont pas modélisés. Les minima de piste recommandés raisonnent encore dans le conteneur entier, donc à tort pour une grille large d'une demi-colonne : c'est le défaut suivant, écrit au journal, pas un acquis. Le relevé ne mesure que la présentation par défaut."
suite = "Faire entrer la chaîne des ancêtres dans le calcul des minima recommandés, puis étendre le balayage aux autres présentations."
initiatives = ["optimisation-du-site", "poids-et-sobriete-numerique", "coherence-textes-publics"]

[[avancee]]
id = "grilles-dessins-jamais-atteints"
date = 2026-11-02
titre = "Trois dessins que le registre justifiait et que la page n'a jamais montrés"
constat = "Le registre des grilles dynamiques justifie chaque minimum de piste par un nombre de colonnes « au conteneur maximal ». Trois grilles ne reçoivent jamais ce conteneur, parce que leur parent le partage : `.learning-code-grid` demande 956 px pour deux pistes de 470 alors que sa place la plus large vaut 812 ; `.ai-fraud-steps` demande 1 120,8 px pour quatre pistes de 270 contre 1 087,6 disponibles, 33 px trop court ; `.ai-path-steps` demande 1 132 px pour cinq pistes de 220 contre 669,6. Trois dessins justifiés par un raisonnement, jamais vérifiés contre ce que la page affiche."
changement = "`pistes_jamais_atteintes` mesure pour chaque grille déclarée la plus large place qu'elle occupe sur tout le balayage, chaîne d'ancêtres comprise, et refuse un minimum dont `k` colonnes ne tiennent nulle part. La dérogation écrite (`piste_jamais_atteinte` + `motif`) est contrôlée dans les deux sens : sans motif de 40 caractères elle est refusée, et si deux pistes tiennent de nouveau elle est refusée aussi — une exemption qui ne se démontre plus redevient un oubli. Les trois dérogations sont nommées à chaque passage réussi, avec leur mesure. Aucun minimum n'a été changé : les trois décisions sont écrites, chiffrées et laissées à une personne, y compris les valeurs qui les rendraient vraies (390 ou 298 px pour `.learning-code-grid`, 260 px pour `.ai-fraud-steps`, 127 px pour `.ai-path-steps`). Le commentaire de la feuille qui annonçait « cinq étapes au conteneur maximal » porte désormais la mesure : deux colonnes au plus."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "assets/css/site.css"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py"
limite = "La règle de recommandation (`minimum_recommande`, `minimum_pour_k`) raisonne encore dans le conteneur entier : la brancher sur la chaîne demanderait 370 px à `.ai-fraud-steps` au lieu de 270 et ferait changer quatre grilles d'un coup, sur une décision qui n'a pas été prise. Le contrôle porte donc la mesure sans réécrire les minima par la petite porte. Les valeurs proposées pour rendre les dessins vrais ne sont pas mesurées dans un navigateur : elles sont des candidats, pas des corrections."
suite = "Reprendre `minimum_recommande` sur la place réelle, puis re-dériver les vingt-deux minima d'un seul lot en mesurant chaque dessin avant et après dans un navigateur."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "grilles-place-reelle-proposee"
date = 2026-11-02
titre = "Sept minima calculés dans une largeur que la grille n'occupe pas"
constat = "La règle qui dérive les minima de piste (`minimum_recommande`) raisonne dans le conteneur entier. Or sept grilles sur vingt-deux ne le reçoivent pas : `.learning-code-grid` n'occupe que 812 px au plus large, `.ai-fraud-steps` 1 087,6 px, `.ai-path-steps` 669,6 px, `.simulateur-chiffres` 952 px, et trois grilles n'ont que 728 px au seuil de 760. La première tentative de brancher la chaîne des ancêtres sur la règle a produit six faux écarts, parce que `colonnes_de_conception` déduisait le nombre de colonnes du minimum en vigueur : dans la place réelle la paire ne tenait pas, le modèle concluait « une colonne » et proposait de ratifier l'échec."
changement = "L'intention vient désormais du registre (`colonnes`, `seuil_une_colonne`) et la place de la chaîne d'ancêtres. `minimum_propose`, appuyé sur `minimum_pour_place` et `minimum_au_seuil`, mesure ce que la règle dirait dans la place réelle ; il ne l'applique pas. `ecarts_de_place` refuse le silence : chaque écart est nommé avec sa place, sa proposition et le minimum adopté, et exige un `motif_ecart` d'au moins 40 caractères, re-vérifié dans les deux sens — un motif qui ne recouvre plus aucun écart est refusé. Sept motifs sont écrits, chacun disant l'effet du changement et le fait que rien n'est adopté. Résultat mesuré : quinze grilles d'accord, sept écarts — `.learning-code-grid` 470 → 300 px, `.ai-fraud-steps` 270 → 260 px, `.simulateur-chiffres` 380 → 360 px, `.eva-listes-grid`, `.simulateur-duo` et `.ai-balance-grid` 350 → 360 px, `.ai-path-steps` sans proposition possible sous le plancher de 180 px. Les deux premières propositions répareraient exactement les deux dérogations de piste jamais atteinte encore en place. Aucune valeur de la feuille n'a changé."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "docs/rd/journal.md"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py"
limite = "La règle adoptée n'a pas bougé : `minimum_recommande` raisonne toujours dans le conteneur, et les sept propositions ne sont ni mesurées dans un navigateur ni approuvées. Un fait gênant est écrit plutôt que contourné : à 350 px, la paire de `.eva-listes-grid`, `.simulateur-duo` et `.ai-balance-grid` tient encore à 760 px de fenêtre (719,2 px dans 728) là où leur palier supprimé n'en montrait qu'une — la proposition de 360 px replace ce repli sans le décider. `.ai-path-steps` n'a aucune proposition : cinq étapes dans 669,6 px demandent 127 px par étape, sous le plancher de 180 px du modèle."
suite = "Adopter, refuser ou borner chacune des sept propositions dans un même lot, en mesurant le dessin avant et après dans un navigateur, en commençant par `.learning-code-grid` et `.ai-fraud-steps`, où l'adoption ferait tomber deux des trois dérogations."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "grilles-comparaison-largeur-par-largeur"
date = 2026-11-02
titre = "Ce que l'adoption d'un minimum changerait : une grille clignote, trois perdraient leur paire"
constat = "Un minimum de piste adopté ne dit rien de ce que la page montre. Les sept propositions du lot précédent étaient des nombres ; décider lequel adopter demandait de savoir, largeur par largeur, combien de colonnes la grille affiche avec l'un et avec l'autre."
changement = "`--comparer` mesure, pour chaque grille où la proposition diffère du minimum adopté, le nombre de colonnes aux 233 largeurs de fenêtre balayées, avec la place réelle et la capacité mesurée, et nomme les largeurs où le dessin change. Trois résultats renversent la lecture du lot précédent : pour `.eva-listes-grid`, `.simulateur-duo` et `.ai-balance-grid`, les 350 px adoptés montrent déjà deux colonnes de 750 à 780 px, donc la proposition de 360 px retirerait une paire existante ; `.learning-code-grid` à 300 px clignote (deux colonnes de 650 à 760 px, une seule jusqu'à 1 000, deux dès 1 010) parce que la gouttière du conteneur rétrécit la place à 761 px ; `.ai-path-steps` ne dépasse pas deux colonnes dans les 669,6 px reçus, ce qui confirme sa dérogation. Deux phrases du lot précédent sont corrigées avec les bandes mesurées, pas effacées."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "docs/rd/journal.md"]
controle = "python3 outils/modele-grilles.py --comparer && python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py"
limite = "La comparaison est celle du modèle, pas du navigateur : elle ne dit rien d'une carte trop étroite pour son contenu ni d'un texte qui déborde, et elle ne couvre que la présentation par défaut. Aucun minimum n'a été adopté, et la feuille n'a pas changé d'un pixel."
suite = "Trancher les sept propositions une par une avec ce tableau : refuser celles qui retireraient une paire, ou décider explicitement que le repli de 760 px vaut mieux que la paire de 750 à 780 px, puis mesurer le dessin retenu dans un navigateur."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "grilles-plancher-de-lecture-retire"
date = 2026-11-02
titre = "Un plancher de lisibilité que personne ne lisait, et une carte annoncée dans un conteneur que la grille n'a pas"
constat = "`CARTE_MINIMALE = 220` déclarait, en commentaire, la largeur « en dessous de laquelle une grille tasse son contenu ». Le dépôt ne la lisait nulle part. Mesurée, elle est fausse pour les vingt-deux grilles : à 240 px de fenêtre, la carte unique de chaque grille vaut 218,4 px, sous le seuil qu'elle prétendait défendre. Et `carte_minimale`, qui calcule la carte la plus étroite réellement affichée, la calculait dans le conteneur : un rapport faux dès qu'une grille vit dans une colonne."
changement = "La constante est retirée, avec la raison écrite à sa place : un chiffre rond qui ne sert à rien et que la feuille contredit est un chiffre inventé. `carte_minimale` se lit désormais dans la place réelle avec `colonnes_avec`, et le chiffre change de nature : `.ai-fraud-steps` 174,8 px, `.ai-path-steps` 164 px, contre 218,4 px pour les vingt autres grilles — deux grilles de la page IA montrent donc déjà des cartes plus étroites que le plancher imaginaire. Les deux colonnes de `--regle` (« pire carte avant → après ») se lisent dans la même place. Donner la chaîne à `--regle` a été essayé puis écarté : deux régimes mélangés dans un même rapport produisent `.ai-path-steps : 2 col. — aucune piste ne tient`, un chiffre qui n'appartient à aucun ; `--regle` reste la règle du conteneur, `--comparer` porte la place réelle."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/journal.md"]
controle = "python3 outils/modele-grilles.py --regle && python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py"
limite = "La carte la plus étroite reste un calcul de modèle : elle ne dit rien du texte qui déborde ni de la hauteur d'une carte, et elle ne couvre que la présentation par défaut. Aucun seuil de lisibilité n'est déclaré à la place de la constante retirée — le modèle dit ce qu'il mesure, il ne fixe pas une limite de confort."
suite = "Prendre la carte la plus étroite comme critère des décisions ouvertes sur les tracés, puis trancher les sept propositions avec les bandes mesurées."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "grilles-qualite-tracés-tranches"
date = 2026-11-02
titre = "Qualité d'abord : quatre tracés corrigés, deux promesses retirées, la règle réunifiée"
constat = "Sept propositions de minima restaient ouvertes, et trois grilles portaient un minimum justifié par un dessin qui n'existe nulle part. La consigne reçue — qualité et professionnalisme dans tous les cas — a permis de trancher sur la mesure plutôt que sur un chiffre rond."
changement = "Deux grilles sortent du `auto-fit` et sont déclarées fixes à une colonne : `.learning-code-grid` (jamais plus de 812 px de place ; à 300 px la paire apparaîtrait, disparaîtrait jusqu'à 1 004 px et reviendrait, et ses blocs `white-space:pre` défileraient dans une piste étroite) et `.ai-path-steps` (aucun minimum ne donne un nombre de colonnes monotone, parce que le panneau `flex` lui retire la moitié de sa largeur dès 783 px ; les cinq étapes s'empilent). Deux minima sont adoptés : `.ai-fraud-steps` 270 → 360 px avec 2 colonnes déclarées au lieu de 4 — 270 px montrait trois colonnes dès 958 px, donc la quatrième étape seule, et 260 px aurait donné quatre cartes de 261,7 px de prose ; `.simulateur-chiffres` 380 → 360 px, la paire passant de 823 à 783 px sans changer le haut de la plage. Trois minima restent à 350 px (`.eva-listes-grid`, `.simulateur-duo`, `.ai-balance-grid`) avec un motif réécrit sur la bande exacte : paire de 752 à 760 px, effacée de 761 à 767, revenue dès 768, là où 360 px la repousserait à 788 et la retirerait à une tablette de 768 px. Enfin la règle est réunifiée : `verifier()` confronte la feuille au registre, et `ecarts_de_place` confronte le registre à la règle dans la place réelle, motif à l'appui. Les trois dérogations `piste_jamais_atteinte` disparaissent faute d'objet."
preuves = ["assets/css/site.css", "docs/rd/formats-affichage.md", "docs/rd/grilles-dynamiques.toml", "outils/modele-grilles.py", "outils/test_modele_grilles.py", "ia-societe.html"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/test_modele_grilles.py && python3 outils/modele-grilles.py --releve-json … && node outils/mesurer-grilles.cjs … && python3 outils/rapporter-mesure-grilles.py --controler"
limite = "Aucun de ces quatre tracés n'a été regardé par un œil humain : le modèle et le navigateur comptent des colonnes, ils ne disent pas si une carte de 537 px est agréable à lire ni si cinq étapes empilées valent mieux qu'une rangée impossible. Une carte seule sur la dernière rangée n'est pas toujours évitable — `auto-fit` traverse tous les nombres de colonnes avant d'atteindre le plus grand — et quatre grilles restent dans ce cas, mesurées mais non corrigées : `.ai-metric-grid`, `.ai-forms-grid`, `.learning-level-grid`, `.learning-ecosystem-grid` (4 éléments, 1 160 px de place) et `.home-voice-grid` (3 éléments, deux colonnes de 804 à 1 189 px)."
suite = "Faire relire les quatre tracés sur les pages réelles, puis décider pour chaque grille à carte orpheline entre un autre nombre de colonnes déclaré et une orpheline assumée avec son motif."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "memoire-index-regenerer-en-dernier"
date = 2026-11-02
titre = "Une CI rouge qui disait « code 1 » et rien d'autre, reproduite en local"
constat = "La PR #259 est tombée sur l'étape « Vérifier la mémoire et le plan d'ÉVA », avec pour seule annotation « Process completed with exit code 1 » — les journaux du job sont illisibles depuis cet atelier. L'échec venait de l'ordre des gestes : l'index de mémoire avait été régénéré, puis une ligne vide de fin de fichier retirée dans `docs/rd/formats-affichage.md`. Un octet de moins dans le corpus, et l'index ne correspondait plus."
changement = "L'étape a été rejouée en local commande par commande, l'échec s'est reproduit immédiatement sur `memoire-eva.py --verifier`, et l'index a été régénéré après la correction de forme (418 entrées, 233 nœuds, 483 arêtes, index de 165 331 octets pour un corpus de 1 577 489, soit 10,5 %). La règle de méthode est écrite au journal : `--regenerer` se lance en dernier, après toute retouche de texte, y compris une fin de fichier."
preuves = ["outils/memoire-eva.py", "docs/rd/eva/memoire.json", "docs/rd/journal.md"]
controle = "python3 outils/memoire-eva.py --verifier && python3 outils/memoire-eva.py --evaluer && python3 outils/verifier-plan-eva.py && python3 outils/test_memoire_eva.py && python3 outils/test_verifier_plan_eva.py"
limite = "Le contrôle attrape l'index périmé, mais la CI ne dit pas pourquoi : son unique annotation est un code de sortie, et les journaux du job restent inaccessibles depuis cet atelier. La reproduction locale est donc le seul moyen d'apprendre la cause — une limite d'outillage, pas de méthode."
suite = "Reproduire localement chaque étape qui tombe, plutôt que relancer la CI à l'aveugle, et relancer `--regenerer` en dernier geste de chaque lot qui touche un document."
initiatives = ["documentation-rd-eva", "coherence-textes-publics", "cartographier-les-lacunes"]

[[avancee]]
id = "grilles-presentations-declarees"
date = 2026-11-02
titre = "Les cinq autres présentations réimposaient des colonnes que personne ne vérifiait"
constat = "Le modèle des grilles et le relevé navigateur ne connaissent que la présentation par défaut. Or cinq autres réimposent des colonnes aux grilles déclarées : panorama 260 px, vitrine 340 px, compacte 215 px, lecture une colonne, mosaïque 2 puis 4 colonnes sous condition de largeur — 106 couples grille × présentation, choisis à la main le 18 octobre 2026, dont aucun n'était dérivé ni mesuré. `decouper` conserve un `:is(…)` comme un seul sélecteur : ces règles n'étaient donc rattachées à aucune grille et échappaient à tous les contrôles."
changement = '''`presentations_lues` relit les règles portées par `html[data-layout='…']`, et `presentations_declarees` exige qu'une présentation qui touche une grille déclarée porte un régime : `auto-fit` avec son minimum, `fixe` avec ses nombres de colonnes, ou `colonne-unique`. Le régime est confronté à la feuille dans les deux sens — une valeur qui a changé est refusée, un régime qui ne porte plus aucune règle aussi. Cinq entrées du registre remplacent ce qui aurait été 106 lignes. `--presentations` imprime la matrice et dit, à chaque ligne, que la présentation n'est pas mesurée. Effet constaté : en vitrine, toutes les grilles concernées tombent à trois colonnes au conteneur maximal, alors que le registre en déclare quatre, trois ou deux selon les grilles.'''
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/grilles-dynamiques.toml", "docs/rd/journal.md"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/modele-grilles.py --presentations && python3 outils/test_modele_grilles.py"
limite = "Aucun de ces minima n'est dérivé : le calcul exigerait la place réelle dans chaque présentation, où `--content` passe de 1 160 à 940, 1 240, 1 380 et 1 480 px, et où la chaîne des ancêtres serait à recalculer. Les présentations restent non mesurées par un navigateur : le relevé ne couvre que la présentation par défaut, et `--presentations` l'écrit à chaque ligne."
suite = "Dériver les minima par présentation en commençant par vitrine — 340 px pour toutes les grilles, alors que le registre en déclare quatre, trois ou deux — puis apprendre au relevé navigateur à mesurer une autre présentation que celle par défaut."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "grilles-presentations-contradictions"
date = 2026-11-02
titre = "Vitrine promet les plus grandes tuiles et en donne de plus petites"
constat = "Une fois la matrice imprimée grille par grille, deux faits apparaissent qu'aucun document ne disait : en « Vitrine », toutes les grilles tombent à trois colonnes quel que soit leur dessin déclaré (quatre, trois ou deux), et pour les cinq grilles déclarées à deux colonnes cela veut dire plus de colonnes que par défaut — donc des tuiles plus petites dans la présentation dont la feuille annonce « rythme lent, grandes zones et une idée à la fois ». Second fait, dans l'autre sens : en « Compacte » et « Panorama », `.ai-fraud-steps` repasse à quatre colonnes, les quatre cartes de prose que le lot précédent avait écartées."
changement = "`contradictions_d_ordre` mesure l'intention inscrite dans le nom des présentations — Compacte et Panorama au moins autant de colonnes que par défaut, Vitrine moins — et `--verifier` nomme les cinq grilles à chaque passage réussi, sans faire échouer ; `--presentations` imprime la matrice complète (20 grilles × 4 présentations) avec les contradictions signalées. Rien n'est corrigé : porter le minimum de Vitrine à 410 px supprimerait la troisième colonne, mais aucun navigateur ne mesure cette présentation, et changer une valeur que rien ne vérifie est précisément le geste refusé depuis le 1er novembre 2026."
preuves = ["outils/modele-grilles.py", "outils/test_modele_grilles.py", "docs/rd/journal.md", "docs/rd/grilles-dynamiques.toml"]
controle = "python3 outils/modele-grilles.py --verifier && python3 outils/modele-grilles.py --presentations && python3 outils/test_modele_grilles.py"
limite = "La matrice est calculée dans le conteneur de chaque présentation, sans chaîne d'ancêtres et sans navigateur : elle dit l'ordre des nombres, pas ce que la page affiche. Aucune de ces valeurs n'est dérivée, et le relevé navigateur ne sait toujours mesurer que la présentation par défaut."
suite = "Apprendre au relevé navigateur à mesurer une autre présentation que celle par défaut, puis trancher les cinq contradictions de Vitrine et le retour de `.ai-fraud-steps` à quatre colonnes en Compacte et Panorama."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "cadrages-personnalises-au-pixel"
date = 2026-11-02
titre = "Le cadrage personnalisé entre dans le contrôle, au demi-pixel près"
constat = "La promesse « la mise en page suit l'espace disponible » n'était vérifiée que dans un cadrage : présentation par défaut, trois tailles de texte. Le panneau en propose six présentations et cinq crans de 75 à 130 %, et `--content` comme les gouttières changent avec eux : une grille n'a pas la même place dans 940 px qu'en 1 480. Aucun contrôle ne confrontait donc la feuille à ce qu'elle affiche réellement dans les cadrages que le visiteur peut choisir."
changement = "`outils/cadrages.py` construit un plan de 480 combinaisons (6 présentations × 5 crans × 4 largeurs × 4 pages), `outils/mesurer-cadrages.cjs` le mesure dans un vrai Chromium — débordement horizontal et nombre de colonnes de chaque grille déclarée — et `--controler` refuse tout écart au-delà de 0,5 px, le plus petit écart qu'un navigateur puisse produire en arrondissant une longueur. Une combinaison non mesurée est une erreur : un contrôle incomplet ne vaut pas un contrôle vide. Trois fautes du modèle ont été trouvées par cette mesure : la cascade des présentations retenait la première règle applicable au lieu de la dernière (96 écarts faux), la règle d'une présentation était appliquée à des grilles qu'elle ne nomme pas, et le cache des largeurs ignorait `--content`. Après correction : 480 combinaisons mesurées, 0 débordement, 0 écart de colonnes. La garde est elle-même éprouvée sur une copie jetable : `min-width: 900px` sur `.home-share-panel` en Vitrine fait refuser les cinq crans, avec l'élément et la mesure exacte (588,09 px à 75 %)."
preuves = ["outils/cadrages.py", "outils/mesurer-cadrages.cjs", "outils/test_cadrages.py", "docs/rd/cadrages.toml", ".github/workflows/verification.yml", "docs/rd/inventaire-controles.md", "docs/rd/journal.md"]
controle = "python3 outils/cadrages.py --releve-json /tmp/plan.json && node outils/mesurer-cadrages.cjs /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --controler /tmp/plan.json /tmp/rapport.json && python3 outils/test_cadrages.py"
limite = "Le contrôle mesure le débordement horizontal et le nombre de colonnes : il ne dit rien de la hauteur, du contraste ni de la lisibilité d'une carte étroite, et une page sans grille déclarée n'est pas visitée. Les chevauchements de cartes, d'abord hors de portée, sont couverts depuis l'avancée « ni mot coupé, ni carte superposée ». La mutation qui prouve la garde est faite à la main sur une copie jetable, elle n'est pas automatisée. Coût mesuré : 5 min 02 pour 480 combinaisons, ce qui a fait relever le plafond du job graphismes de 20 à 30 minutes."
suite = "Couvrir la hauteur des blocs et le contraste, puis automatiser la mutation qui prouve la garde."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "ni-mot-coupe-ni-carte-superposee"
date = 2026-11-02
titre = "Ni mot coupé, ni carte superposée : ce que le visiteur lit entre dans la mesure"
constat = "Le contrôle des cadrages mesurait le débordement horizontal et le nombre de colonnes. Il ne regardait pas ce que le visiteur lit : un mot rogné par une zone de découpe, ou deux cartes dessinées l'une sur l'autre, ne changent ni la largeur du document ni le nombre de colonnes. Le site pouvait donc passer vert en perdant du texte."
changement = "Le relevé navigateur compte désormais, à chaque cadrage, les **mots coupés** et les **cartes qui se recouvrent** dans une grille déclarée ; `--controler` refuse les deux, nomme l'élément, la mesure en pixels et l'extrait du mot perdu. Le texte se compte sur les nœuds de texte, jamais sur `scrollHeight` : le 2 novembre 2026, la mesure grossière accusait 51 fois — fonds décoratifs, badges, flèches qui débordent d'un conteneur en `overflow: hidden` — pour **zéro mot réellement perdu**. La version précise garde la promesse et ne dénonce pas un dessin qui la tient. Résultat sur les 480 combinaisons : **0 mot coupé, 0 chevauchement**. La garde est éprouvée dans les deux sens sur une copie jetable : `max-height: 40px` avec `overflow: hidden` sur `.home-action-card` fait refuser **8 mots coupés** (« article.home-action-card coupe un mot de 303,8 px »), et `top: -70px` sur une carte sur deux de `.home-action-grid` fait refuser **2 chevauchements** de 368,39 × 32,75 px. Un relevé d'avant ce contrôle est refusé : les deux clés absentes valent « non mesuré », pas accord. Ces deux mutations ne sont plus une preuve manuelle : `outils/test_mutations_cadrages.py` les rejoue seul sur une copie jetable servie par un port libre, deux cadrages par cas, et exige que la copie **intacte** passe — sans quoi un contrôle qui refuserait tout paraîtrait infaillible. Trois cas, 13 s, code 2 sans navigateur."
preuves = ["outils/mesurer-cadrages.cjs", "outils/cadrages.py", "outils/test_cadrages.py", "outils/test_mutations_cadrages.py", "docs/rd/cadrages.toml", "docs/rd/journal.md"]
controle = "python3 outils/cadrages.py --releve-json /tmp/plan.json && node outils/mesurer-cadrages.cjs /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --controler /tmp/plan.json /tmp/rapport.json && python3 outils/test_cadrages.py && python3 outils/test_mutations_cadrages.py"
limite = "Le contrôle ne dit rien de la hauteur totale de la page, du contraste, ni de la lisibilité d'une carte étroite — une carte peut rester lisible à 300 px et devenir illisible à 260. Il ne voit les chevauchements qu'entre enfants directs d'une grille déclarée : une superposition entre deux sections, ou avec un élément en position fixe, lui échappe. Il ne mesure que le visible à l'instant du relevé : un mot coupé qui n'apparaît qu'au survol ou dans un panneau ouvert n'est pas vu. Coût : 275 s pour 480 combinaisons."
suite = "Confronter la hauteur des blocs à une grille typographique et le contraste à un seuil mesuré."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]

[[avancee]]
id = "rangees-incompletes-chiffrees"
date = 2026-11-02
titre = "Les rangées incomplètes passent du ressenti au chiffre"
constat = "Les cinq grilles à carte orpheline étaient connues par leur nom, pas par leur ampleur. Nul ne savait dans quels cadrages le défaut apparaît, ni combien de place il laisse vide : à 100 % sur un téléphone une rangée incomplète se voit à peine, à 75 % sur 1 440 px elle peut vider un tiers de la page."
changement = "`cadrages.py --orphelins` lit le relevé navigateur et nomme, page par grille, le nombre de cadrages où la dernière rangée laisse plus de 0,5 px libres — le même seuil que le débordement, pour la même raison. Le relevé navigateur compte désormais, par grille, les cartes, les rangées, les cartes de la dernière rangée et la place qui reste, gouttières déduites. **16 couples page/grille** sont concernés : le pire est `apprendre.html · .learning-catalogue-grid` (35 cadrages, **1 176,50 px** libres en « Compacte » à 75 % sur 1 440 px, une carte sur six colonnes), suivi de `ia-societe.html · .ai-fraud-lesson-list` et `liens-utiles.html · .link-grid` (35 cadrages, 1 048,19 px chacun). Le nombre est passé de 13 à 16 le 3 novembre 2026, quand le contrôle a cessé de ne visiter que quatre pages. Le diagnostic ne refuse rien : il chiffre, et l'étape de CI l'imprime en annotation à chaque passage. Une grille dont la rangée n'a pas été relevée est nommée au lieu d'être passée sous silence."
preuves = ["outils/cadrages.py", "outils/mesurer-cadrages.cjs", "outils/test_cadrages.py", "docs/rd/cadrages.toml", ".github/workflows/verification.yml", "docs/rd/journal.md"]
controle = "python3 outils/cadrages.py --releve-json /tmp/plan.json && node outils/mesurer-cadrages.cjs /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --controler /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --orphelins /tmp/plan.json /tmp/rapport.json && python3 outils/test_cadrages.py"
limite = "Le diagnostic mesure un vide géométrique, pas une gêne : une rangée incomplète peut être le dessin voulu, et une rangée pleine peut rester laide. Il ne voit que les enfants directs d'une grille déclarée, à l'instant du relevé, et ne regardait que le **premier exemplaire** d'un sélecteur qui en nomme plusieurs — limite levée le 3 novembre 2026 par `contraste-et-pages-oubliees`, qui relève chaque exemplaire et applique la capacité aux grilles qui replient. La décision de corriger reste humaine et n'est pas prise : aucune règle n'a été changée."
suite = "Trancher, grille par grille, entre assumer la rangée incomplète et changer le dessin — sans ajouter de palier, et en re-mesurant après chaque décision."
initiatives = ["optimisation-du-site", "coherence-textes-publics", "poids-et-sobriete-numerique"]


[[avancee]]
id = "contraste-et-pages-oubliees"
date = 2026-11-03
titre = "Toutes les pages, chaque exemplaire, et ce qu'on peut y lire : contraste mesuré"
constat = """Trois angles morts se répondaient. Le contrôle ne visitait que quatre pages : `404`, `anglais-aventure`, `confidentialite`, `documents`, `eva`, `liens-utiles`, `localisation`, `nous-contacter` et `transparence` n'étaient confrontées à aucun cadrage, et le registre l'écrivait noir sur blanc. Il ne mesurait ensuite qu'**un exemplaire** par sélecteur, alors qu'un même sélecteur nomme plusieurs grilles dans une page — `liens-utiles.html` en porte sept, `transparence.html` deux — et que le registre déclarait déjà des listes de tailles possibles (`items = [1, …, 7]`) : la preuve était écrite, le banc ne la lisait pas. Enfin il ne mesurait que la géométrie : une page peut tenir exactement dans la fenêtre et afficher un texte que personne ne lit."""
changement = """Les pages sont lues sur le disque (`pages_publiees`) : les **13 pages publiées** entrent dans le plan, les huit qui portent une grille déclarée dans les six présentations, les cinq autres dans la présentation par défaut. **1 060 combinaisons**, et **chaque exemplaire** d'une grille est relevé à part (plafond de 12, nommé quand il est atteint). Le plan annonce une **capacité**, le contrôle applique à chaque exemplaire le nombre de cartes réellement lu — et seulement quand la grille **replie** ses pistes (`auto-fit`) : un `repeat(4, …)` garde quatre colonnes avec une seule carte. Le relevé calcule en plus le **contraste WCAG** de chaque texte sur fond uni ; `cadrages.py` décide seul du seuil (4,5:1, ou 3:1 à partir de 24 px, ou 18,66 px en gras) et refuse en nommant le rapport, le seuil, la taille et l'extrait. Le décoratif déclaré (`aria-hidden`) et le texte posé sur une image sont écartés **et nommés** par `--ecartes`. Résultat : **1 060 cadrages mesurés, 0 débordement, 0 mot coupé, 0 chevauchement, 0 écart de colonnes, 0 refus de contraste** sur **375 520 textes** posés sur un fond uni ; 27 700 textes sur fond d'image et 3 460 textes décoratifs sont hors de portée et comptés. Cinq fautes de la sonde ont été trouvées et corrigées avant de conclure : `font-size: 0` jugé illisible, `script`/`style` jugés comme du texte, décor confondu avec le contenu, texte réservé aux lecteurs d'écran compté comme coupé (**160** faux refus à 1 px près), et exemplaire unique supposé (**44** faux écarts au total, 14 puis 30)."""
preuves = ["outils/mesurer-cadrages.cjs", "outils/cadrages.py", "outils/test_cadrages.py", "docs/rd/cadrages.toml", ".github/workflows/verification.yml", "docs/rd/journal.md"]
controle = "python3 outils/cadrages.py --releve-json /tmp/plan.json && node outils/mesurer-cadrages.cjs /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --controler /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --ecartes /tmp/rapport.json && python3 outils/test_cadrages.py"
limite = """Le contraste n'est mesuré que sur un fond de couleur unie : 27 700 textes posés sur une image sont comptés, pas mesurés, et les états de survol, de focus ou révélés par script ne le sont pas non plus. Le seuil de 3:1 pour un grand texte est celui de WCAG 2.2 AA ; le RGAA 5, aligné dessus, n'est pas encore publié. Douze exemplaires au plus par sélecteur sont inspectés. La matrice statique (`modele-grilles.py --presentations`) borne, elle, son calcul par le plus grand nombre de cartes déclaré : c'est un outil de conception, pas le contrôle, et les deux nombres peuvent différer sans que l'un mente. Rien de tout cela ne remplace une relecture humaine."""
suite = "Étendre la mesure aux états interactifs et aux fonds en image, en disant ce que la méthode coûte — la capture d'écran a été chiffrée à 690 ms par élément et n'a pas été retenue."
initiatives = ["optimisation-du-site", "ecouter-la-page", "coherence-textes-publics"]

[[avancee]]
id = "un-yaml-casse-n-etait-pas-une-erreur"
date = 2026-11-03
titre = "Un workflow illisible n'était pas une erreur : c'était un silence, et il ressemblait à un succès"
constat = """Un nom d'étape écrit « Confronter chaque cadrage personnalisé : géométrie, mots, cartes et contraste » a suffi. Dans un scalaire YAML non cité, « : » suivi d'une espace ouvre une table : le fichier n'était plus lisible. GitHub a répondu « This run likely failed because of a workflow file issue » et n'a lancé **aucun** job — ni `qualite`, ni `graphismes`. Pendant ce temps, rien dans le dépôt ne lisait les workflows : un contrôle absent ne pouvait pas échouer, donc tout était vert. C'est la forme la plus dangereuse du défaut, celle qui ressemble à une réussite."""
changement = """`outils/verifier-workflows.py` lit chaque fichier de `.github/workflows/` avec un vrai analyseur YAML, puis vérifie la forme attendue : clé `jobs` non vide, `runs-on` par job, `name` et exactement un de `run`/`uses` par étape. Sans analyseur disponible, il sort en **code 2** en le disant — jamais en code 0 comme si les six fichiers avaient été lus. Son banc, `outils/test_verifier_workflows.py`, plante la faute exacte du 3 novembre dans une copie jetable et **huit** cas au total, dont le refus « aucun workflow », qui empêche un dossier vide de passer pour un dépôt vérifié. L'étape est entrante dans le job `qualite`, avant les autres contrôles : un workflow illisible rend les suivants inutiles. Deux étapes du job `graphismes` n'avaient pas de nom — elles en ont un, sans quoi la règle n'aurait pas pu être tenue."""
preuves = ["outils/verifier-workflows.py", "outils/test_verifier_workflows.py", ".github/workflows/verification.yml", "docs/rd/inventaire-controles.md", "docs/rd/journal.md"]
controle = "python3 outils/test_verifier_workflows.py && python3 outils/verifier-workflows.py"
limite = """Le contrôle juge la **forme**, pas le sens : un workflow lisible peut appeler une action obsolète, demander des droits excessifs ou lancer un banc qui ne mesure rien. Il ne remplace pas une exécution — il garantit seulement que GitHub peut démarrer les jobs. Il exige PyYAML : la CI l'installe explicitement dans l'étape, et hors CI l'absence du module est un refus, pas un silence. Le nom obligatoire par étape est une règle du dépôt, pas de GitHub : elle coûte deux lignes et rend les annotations d'échec lisibles."""
suite = "Vérifier la validité des workflows dans les autres dépôts du projet, et étendre la garde aux déclencheurs (`on:`) et aux versions d'actions épinglées, que `verifier-securite.py` couvre en partie."
initiatives = ["coordination-de-tous-les-agents", "optimisation-du-site"]

[[avancee]]
id = "un-anneau-de-focus-se-mesure-comme-un-texte"
date = 2026-11-03
titre = "Un anneau de focus se mesure : quarante liens invisibles au clavier"
constat = """Le contraste du texte était mesuré cadrage par cadrage depuis la veille ; l'indicateur de focus ne l'était pas. Or une page peut passer tous les contrôles de lisibilité et rester impraticable au clavier : si l'anneau de focus a la couleur du fond, la personne qui avance à la touche Tab ne sait plus où elle est. Le dépôt mesurait le focus **non masqué** (WCAG 2.2, 2.4.11) — l'élément n'est pas caché derrière un bandeau — jamais le focus **visible** (2.4.7) ni le contraste de son indicateur (1.4.11)."""
changement = """`outils/mesurer-focus.cjs` presse réellement la touche Tab — `element.focus()` ne déclenche pas `:focus-visible` de façon fiable, et juger un style qui ne s'applique pas serait une faute de sonde déguisée en conformité. Le repos d'un élément n'est **jamais** obtenu en le défocalisant : la touche Tab suivante le relâche d'elle-même, et son apparence à ce moment-là sert de référence — une première version qui défocalisait a échoué en intégration continue sur `documents.html`, et le garde a refusé de conclure plutôt que de rendre un chiffre faux dans le sens rassurant. Pour chaque élément atteint, il relève ce qui change (contour, ombre, fond, bordure, texte), la couleur de l'indicateur, le **fond réellement vu** derrière lui — les couches sont composées du bas vers le haut — et le rapport WCAG. `outils/focus.py` pose le seuil : **3:1** (WCAG 2.2 AA, 1.4.11), **3,0:1 passe, 2,99:1 est refusé**. Premier passage : **40 liens sous le seuil**, tous sur la surface marine de `.creator-note`, où le bleu du site donne **1,76:1**. Corrigé par le jeton `--focus-ring` (bleu par défaut, blanc sur les cinq surfaces sombres) plutôt que par un `outline-color` répété par composant. Résultat : **26 relevés, 2 621 éléments portés au focus, 2 497 indicateurs jugés, 0 sous le seuil, 0 sans indicateur**, 124 sur fond d'image comptés à part, 0 relevé arrêté au plafond, en 38 s."""
preuves = ["outils/mesurer-focus.cjs", "outils/focus.py", "outils/test_focus.py", "outils/test_mutations_focus.py", "assets/css/site.css", "docs/rd/formats-affichage.md", "docs/rd/cadrages.toml", ".github/workflows/verification.yml", "docs/rd/journal.md"]
controle = "python3 outils/focus.py --plan /tmp/focus-plan.json && node outils/mesurer-focus.cjs /tmp/focus-plan.json /tmp/focus-rapport.json && python3 outils/focus.py --controler /tmp/focus-plan.json /tmp/focus-rapport.json && python3 outils/test_focus.py && python3 outils/test_mutations_focus.py"
limite = """Deux largeurs (390 et 1 440 px) : un anneau de focus ne dépend pas de la place, mais deux largeurs ne prouvent pas l'absence de cas propres aux intermédiaires. Les états de survol, de focus programmatique et de focus dans une iframe ne sont pas mesurés ; 124 éléments posés sur une image restent hors de portée et sont comptés. La traversée s'arrête au premier élément déjà vu et dit si elle a buté sur le plafond, pas ce qu'elle n'a pas atteint. Le seuil de 3:1 est celui de WCAG 2.2 AA ; le RGAA 5, aligné dessus, n'est pas encore publié. Enfin, un indicateur conforme à 3:1 peut rester peu visible sur un écran de téléphone en plein soleil : la mesure donne un chiffre, elle ne remplace pas une traversée au clavier par une personne."""
suite = "Mesurer les états intermédiaires (768 px) et les éléments révélés par script — panneaux ouverts, menus déployés — en disant d'abord combien d'éléments cela ajoute et ce que la mesure coûte."
initiatives = ["ecouter-la-page", "optimisation-du-site", "coherence-textes-publics"]

[[avancee]]
id = "un-degrade-est-une-plage-de-contraste"
date = 2026-11-03
titre = "Un texte sur un dégradé n'est pas un texte sans fond : la plage a un pire point, sous le texte"
constat = """27 700 textes étaient posés sur un « fond d'image » et **comptés, jamais jugés** : la méthode ne lisait que des couleurs unies, et un dégradé n'en est pas une. Le classement était pourtant faux dès le départ — le site ne pose aucune image en fond de texte, il pose des dégradés : bandeaux, panneaux d'appel, héros, cartes teintées. Un fond qu'on ne sait pas lire n'est pas un fond conforme, mais ce n'était pas une raison pour le déclarer illisible : c'était une raison de le lire."""
changement = """Le relevé lit les **arrêts** de chaque couche — Chromium les normalise en `rgb(…)`, la lecture est donc exacte — et retient la **boîte** de la couche. `cadrages.py` projette la boîte du texte sur l'axe du dégradé, n'échantillonne que la **portion réellement sous le texte** (neuf points régulièrement espacés, plus chaque arrêt qui y tombe), compose les couches avec leurs transparences sur le fond opaque le plus proche et retient le **pire** rapport, nommé avec son point : « small contraste 4.444:1 sur un dégradé, seuil 4.5:1 pour 12 px — pire point rgb(237, 242, 250) ». Trois fautes corrigées en chemin. La remontée s'arrête au premier fond **opaque** (un bouton plein sur un bandeau dégradé était jugé contre le bandeau qu'il recouvre : 24 faux refus à 1,06:1). Le classement « image » tombe à **0**. Et la découpe des couches, faite d'abord sur une expression régulière, confondait la virgule entre deux **arrêts** et celle entre deux **couches** : chaque arrêt devenait un calque, la plage portait sur des aplats qui n'existent nulle part. La découpe se fait maintenant sur la **profondeur des parenthèses**, et un banc la rejoue. Résultat mesuré sur 1 060 cadrages : **385 810** textes sur fond uni, **17 500** sur dégradé, pire rapport **4,782:1**, aucun refus. La géométrie resserre le majorant — 16 515 verdicts plus permissifs, 985 identiques, **aucun** plus sévère. Avec l'ancienne valeur du jeton `--muted` (`#647086`), le même relevé refuserait **732 textes** sur **cinq** sélecteurs (pire : 4,444:1) : assombri à `#5f6b81`, le pire remonte à 4,782:1 et **0 refus** subsiste."""
preuves = ["outils/mesurer-cadrages.cjs", "outils/cadrages.py", "outils/test_cadrages.py", "outils/test_contraste-degrade.py", "assets/css/site.css", "docs/rd/formats-affichage.md", "docs/rd/cadrages.toml", "docs/rd/inventaire-couleurs-jetons.md", "docs/rd/journal.md"]
controle = "MRSC_BROWSER_NODE_MODULES=… node outils/mesurer-cadrages.cjs /tmp/plan.json /tmp/rapport.json && python3 outils/cadrages.py --controler /tmp/plan.json /tmp/rapport.json && python3 outils/test_cadrages.py && MRSC_BROWSER_NODE_MODULES=… python3 outils/test_contraste-degrade.py"
limite = """La mesure suit la géométrie du dégradé, pas celle du glyphe : la zone est celle de la boîte du texte, ligne à ligne non. Un dégradé **radial** n'est situé que si son centre est écrit en pourcentage et son rayon en pixels ; sinon la zone vaut la plage entière, majorant assumé et non silence. Une image `url(...)`, un `conic-gradient`, un `repeating-*` ou une `color-mix()` restent comptés et nommés, jamais jugés (le site n'en pose aucun). L'interpolation suivie est celle de sRGB ; la boîte du dégradé est prise au `border-box`, qu'une bordure épaisse décalerait. Le banc couvre un dégradé linéaire à arrêts en pourcentage et un halo circulaire à arrêt en pixels ; les formes `ellipse`, les tailles en mots-clés et les arrêts radiaux en pourcentage retombent sur la plage entière, sans cas qui le chiffre. La capture de pixels, qui lèverait la limite de géométrie, a été chiffrée à 690 ms par élément : hors budget pour 17 500 textes."""
suite = "Chiffrer ce que coûte l'absence de zone pour les formes `ellipse` et les arrêts radiaux en pourcentage — combien de textes sont jugés contre une plage qu'ils ne voient pas — puis descendre à la ligne de texte plutôt qu'à la boîte."
initiatives = ["coherence-textes-publics", "optimisation-du-site", "ecouter-la-page"]

[[avancee]]
id = "une-planche-qui-repond-lit-le-registre"
date = 2026-11-04
titre = "Une planche qui répond lit le registre — sinon l'image et le contrôle finissent par se contredire"
constat = "Le 4 novembre 2026, les trois planches déposées au Drive ont été rouvertes pour la personne responsable, et la question est revenue : « il semblerait que ce soit exactement les mêmes demandes ». Elle avait raison, et ce n'était pas une question de contenu : **A2, B1 et C1 étaient tranchées**, écrites dans le registre, appliquées par le code, vertes en CI. C'était la pièce qui mentait — `Planche-3-decisions-en-attente.png` annonce « Trois décisions qui t'attendent — rien n'est tranché ici » —, et une image dans un dossier de preuves qui pose une question déjà répondue fait croire qu'on redemande."
changement = "Une quatrième planche, **`Planche-4-les-trois-reponses.png`**, reprend les trois cas avec leur réponse, ce que le code en fait et la condition qui les réviserait. Elle ne recopie rien : `planches-rd.py` **lit** `docs/rd/cadrages.toml` — les seize motifs, le sélecteur, la couleur et le rapport du glyphe, la liste et le seuil des écarts — au lieu de les écrire en dur. Un verdict retiré du registre la fait basculer en « EN ATTENTE » ; une décision sans condition de révision est nommée « RESTE OUVERT, faute de condition de révision » ; un registre illisible ne produit aucune planche et sort en code 2 plutôt que d'inventer une réponse. La planche 3 reste **telle qu'elle a été montrée**, et ses empreintes comme celles des planches 1 et 2 sont **inchangées** (`e409eb67…`, `dbe2228…`, `5518357…`) : une pièce datée ne se réécrit pas après coup, elle reçoit sa réponse à côté. La lecture a révélé une asymétrie : B1 et C1 portaient une `condition_de_revision` écrite, **A2 non** — elle a été écrite dans `[rangees]` comme conséquence mécanique (un motif vaut pour un nombre de cartes et un nombre de colonnes mesurés), pas comme une décision nouvelle."
preuves = ["outils/planches-rd.py", "docs/rd/cadrages.toml", "docs/rd/journal.md", "docs/rd/inventaire-controles.md"]
controle = "python3 outils/planches-rd.py --sortie /tmp/planches && md5sum /tmp/planches/*.png && python3 outils/test_cadrages.py"
limite = "La planche des réponses ne peut pas tourner en CI : elle exige Pillow et les polices DejaVu, absents de l'image de vérification, et elle reste donc `hors-portee` dans l'inventaire. Sa reproductibilité est vérifiée à la main, deux exécutions donnant la même empreinte, et ses nombres viennent du registre — mais rien n'empêche mécaniquement un futur lot de recopier une valeur en dur dans le dessin. Elle ne juge pas non plus la qualité de la décision : elle en montre l'état."
suite = "Faire lire au dessin la liste nominative des seize motifs plutôt que leur seul nombre, pour qu'un couple ajouté au registre apparaisse sur la planche sans retoucher le code."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "un-majorant-qu-on-ne-chiffre-pas-se-lit-comme-une-mesure"
date = 2026-11-04
titre = "Un majorant radial cesse d'être tu : 600 textes jugés sans être situés, et aucun verdict qui en dépende"
constat = "Depuis le 3 novembre 2026, les limites du registre disaient qu'un dégradé **radial** n'est situé que si son centre est écrit en pourcentage et son rayon en pixels — sinon la zone vaut la plage entière. C'était un majorant assumé, écrit avec honnêteté, et **jamais chiffré**. Un majorant qu'on ne chiffre pas se lit comme une mesure : personne ne savait s'il touchait trois textes ou trois mille, ni s'il faisait refuser quelqu'un."
changement = "Le relevé dit maintenant, couche par couche, si la zone est située et sinon **pourquoi** ; il compte les textes concernés sur **tous** les textes mesurés, et non sur l'échantillon plafonné joint au rapport ; `cadrages.py --radiaux` publie le compte, la répartition des motifs et, sur l'échantillon, combien de **verdicts** tiennent au majorant seul. Un rapport d'avant ce chiffrage est refusé (code 2) plutôt que lu comme zéro. Le banc a ensuite appris, en sortant rouge, que **Chromium n'écrit pas `at 50% 50%`** — c'est le centre par défaut du CSS : ces halos étaient comptés « centre absent » alors que leur centre est connu. Corrigé, et le motif `centre-absent` a disparu. Résultat mesuré sur 1 060 cadrages : **17 500** textes sur un dégradé, dont **6 400** sur un radial ; **600** jugés contre une plage qu'ils ne voient pas, tous par absence de rayon en pixels ; **600** portent un halo au centre implicite, situés depuis la correction. Sur l'échantillon joint, les 600 voient leur pire rapport changer si l'on retire la couche ambiguë — tous de plus d'un point, le pire de **3,267** points (`span.ai-node`, 12,367:1 avec la couche, 15,634:1 sans) — mais **aucun verdict ne tient au majorant** : la ligne « verdicts en jeu » n'apparaît que s'il y en a, et elle n'est pas apparue."
preuves = ["outils/mesurer-cadrages.cjs", "outils/cadrages.py", "outils/test_cadrages.py", "outils/test_contraste-degrade.py", ".github/workflows/verification.yml", "docs/rd/cadrages.toml", "docs/rd/formats-affichage.md", "docs/rd/journal.md"]
controle = "python3 outils/test_cadrages.py && python3 outils/cadrages.py --radiaux RAPPORT.json"
limite = "Le chiffrage mesure un **écart** entre deux bornes, pas la vraie zone : celle d'un halo à arrêt en pourcentage reste entre les deux, et le diagnostic ne refuse ni ne corrige rien. Les formes `ellipse`, les tailles en mots-clés et les centres écrits en pixels retombent encore sur la plage entière — le site n'en pose pas aujourd'hui (aucun `centre-non-lu` relevé), mais le cas n'est pas chiffré séparément. Le croisement « non situé et centre implicite » n'est pas compté : les deux nombres sont indépendants et ne disent pas qu'il s'agit des mêmes textes."
suite = "Laisser la géométrie en l'état tant qu'aucun refus n'en dépend ; le jour où un refus en dépendrait, `ellipse` et le rayon en pourcentage deviendront le sujet — et « verdicts en jeu » le dira avant qu'on le suppose."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "un-vide-assume-porte-son-motif"
date = 2026-11-04
titre = "Un vide assumé porte son motif écrit — et un vide sans motif n'est pas assumé"
constat = """Seize couples page/grille laissent un vide dans leur dernière rangée, et **sept de ces vides étaient invisibles** : l'annotation de CI est plafonnée à douze lignes, donc neuf couples s'y montraient. Un diagnostic qui n'imprime qu'une partie de sa liste ne vaut pas mieux qu'un diagnostic muet — celui qui décide croit avoir tout vu."""
changement = """Trois décisions du 4 novembre 2026, prises par une personne sur une planche visuelle, et **rendues exécutoires**. **A2** : le vide reste, et son motif s'écrit dans `docs/rd/cadrages.toml` (`[rangees.motifs]`), à côté de son chiffre ; `--orphelins` lit ces motifs et imprime `SANS MOTIF ÉCRIT` pour tout vide qui n'en a pas — une dérogation en blanc n'est plus comptée comme assumée. **Les seize motifs sont écrits et chiffrés** (le plus fort : 85 fiches en six colonnes, 1 176,50 px, arithmétique et non réglable). Les sept derniers ont exigé deux corrections du diagnostic lui-même : les noms manquants tombaient après le plafond de l'annotation, puis sortaient sans leur chiffre — un motif écrit sans son nombre s'écrit de mémoire. Chaque vide sans motif sort désormais sur sa propre ligne avec ses cadrages, son vide maximal et son cadrage, et la liste entière part dans le **résumé d'étape**, qui n'a pas ce plafond. L'écriture a révélé que cinq des sept ont la même forme arithmétique et que deux tiennent à un écart entre le registre et la cascade (`.document-grid` 2 déclarées → 3 reçues, `.ai-metric-grid` 4 → 3). **B1** : le glyphe ✦ de « Les Mondes » reste à 2,66:1 — décoratif déclaré (`aria-hidden`), hors du champ de WCAG 1.4.11 — et un cas de `test_cadrages.py` refuse la suite si la déclaration disparaît ou si la couleur change : la décision a une condition de révision qui se vérifie. **C1** : les quatre écarts de colonnes inférieurs au pixel restent comptés, parce qu'absorber un écart le rendrait indistinguable d'un écart absent."""
preuves = ["docs/rd/cadrages.toml", "outils/cadrages.py", "outils/test_cadrages.py", ".github/workflows/verification.yml", "docs/rd/formats-affichage.md", "docs/rd/journal.md", "outils/planches-rd.py"]
controle = "python3 outils/cadrages.py --orphelins /tmp/plan.json /tmp/rapport.json && python3 outils/test_cadrages.py"
limite = """Les seize motifs décrivent ce que la mesure permet de dire : le nombre de cartes vient du registre des grilles, le nombre de colonnes du relevé. Pour `.link-grid`, qui déclare de 1 à 7 liens, le motif couvre la plage entière et pas un cas. Deux couples portent un motif qui pointe un **désaccord** entre registre et cascade plutôt qu'un choix de dessin : c'est un fait relevé, pas une justification — si la cascade changeait, ces deux motifs seraient à réécrire. Les motifs s'appuient sur le nombre de cartes du registre des grilles ; pour `.link-grid`, qui déclare de 1 à 7 liens, le motif couvre la plage entière et pas un cas. Pour B1, la décision ne tient que si le glyphe reste sans signification : le contrôle vérifie `aria-hidden`, pas l'intention — un futur lot qui lui donnerait un sens devrait relire l'entrée. Pour C1, quatre divergences font quatre lignes de bruit par rapport ; au-delà de six, la décision sera réexaminée."""
suite = "Écrire les sept motifs restants sur la liste entière du résumé d'étape, puis vérifier que l'annotation et le résumé ne divergent jamais : deux listes qui se contredisent valent moins qu'une seule."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "onze-champs-iscdf-ouverts"
date = 2026-11-05
titre = "Onze champs ISCED-F ouverts : le domaine le mieux planifié était le plus vide"
constat = "Le domaine « études supérieures, spécialités et recherche » comptait quatre fiches, et ses onze sujets ISCED-F (`iscdf-00-generique` à `iscdf-10-services`) en comptaient zéro, tous marqués `a-creer`. Le plan de travail lui alloue pourtant 75 fiches et l’objectif de 1 000 entrées le décrivait comme la porte des études supérieures. Les domaines les plus minces en nombre — santé, méthodes, démarches, deux fiches chacun — attiraient l’œil ; le trou le plus large était ailleurs : un domaine qui existait, avec sa carte complète, et aucun contenu derrière ses onze entrées déclarées."
changement = "Onze fiches ont été rédigées, une par champ ISCED-F, chacune prolongée par une situation concrète et un geste vérifiable : lire une fiche RNCP et repérer certificateur, niveau et période d’enregistrement ; se tester au lieu de relire ; relier les métiers d’un générique de film aux choix visibles ; vérifier un chiffre public par son périmètre, son unité et son producteur ; lire un devis de travaux ligne par ligne ; convertir un cumul de pluie en litres ; préparer une sauvegarde que l’on sait restaurer ; distinguer R et U sur une fiche d’isolation ; séparer AOP, IGP, STG et Label rouge ; décrire un dépistage organisé sans en faire une ordonnance ; préparer un trajet entre horaires théoriques et temps réel. Chaque fiche déclare une source institutionnelle précise, ouverte le 5 novembre 2026, et une note de statut datée ; les onze sujets du référentiel passent de `a-creer` à `partiel`, avec leur fiche nommée. Le catalogue passe de 85 à 96 fiches et de 59 à 70 prototypes. La page `objectif-1000.md`, la carte des lacunes, l’audit automatique, la file de relecture et les paquets sont régénérés depuis les sources, jamais recopiés. Le registre des grilles déclarait 85 cartes pour `.learning-catalogue-grid` : la capacité suit désormais le catalogue, et le motif de rangée incomplète a été réécrit avec le chiffre mesuré par la CI — 1 136,16 px sur 9 cadrages, contre 1 176,50 px auparavant, parce que 96 = 19 × 5 + 1 ne laisse pas le vide au même cadrage."
preuves = ["docs/apprentissage/catalogue.toml", "docs/apprentissage/referentiel.toml", "docs/apprentissage/audit-automatique.md", "docs/rd/carte-lacunes.md", "apprendre.html", "docs/rd/journal.md", "outils/test_mutations_integration.py"]
controle = "python3 outils/auditer-prototypes.py --verifier && python3 outils/construire-carte-lacunes.py --verifier && python3 outils/modele-grilles.py --verifier && python3 outils/test_cadrages.py && python3 outils/verifier-site-statique.py && python3 outils/verifier-integration.py && python3 outils/test_mutations_integration.py"
limite = "Une fiche par champ ISCED-F ouvre un point d’entrée, elle ne couvre pas une discipline : les onze sujets restent `partiel`, et le domaine garde 71 fiches d’écart sur sa cible de 75. Les sources ont été lues le 5 novembre 2026 et peuvent changer — cahiers des charges, programmes, recommandations de dépistage. Aucune relecture spécialisée n’a eu lieu, et les fiches de santé, de droit de la consommation et de sécurité informatique gardent un statut de prototype explicite. La page du portail EESR a répondu 503 deux fois : elle n’est citée nulle part et le sujet 00 s’appuie sur le vademecum de France Compétences. Les trois domaines les plus minces en nombre de fiches n’ont pas été servis par ce lot : le vide le plus large n’était pas le plus visible."
suite = "Ouvrir un deuxième lot par domaine mince plutôt que par champ disciplinaire, en commençant par santé, méthodes et démarches ; vérifier au passage si le nombre d’entrées par champ ISCED-F mérite un quota propre dans `plan-1000.toml`."
initiatives = ["cartographier-les-lacunes", "veille-savoirs-evolutifs", "coherence-textes-publics"]

[[avancee]]
id = "cinq-domaines-points-entree"
date = 2026-11-05
titre = "Cinq domaines sans point d’entrée reçoivent leur première fiche"
constat = "Le lot précédent avait servi le domaine le mieux planifié, pas les plus minces : géographie, histoire, citoyenneté et santé comptaient quatre fiches chacune, les démarches deux, et aucune de ces fiches n’ouvrait les thèmes qui manquaient — projection cartographique, cote d’archive, lecture d’un sondage, prévention des chutes à domicile, acte d’état civil. Un domaine qui n’a pas de point d’entrée n’est pas servi, quel que soit son compteur."
changement = "Cinq fiches ont été rédigées, une par domaine, chacune avec une situation concrète, une démarche en six ou sept gestes, un exercice corrigé, une analogie et sa limite, une source institutionnelle précise ouverte le 5 novembre 2026 et une note de statut datée : lire une projection et savoir ce qu’elle déforme ; décomposer une cote d’archive avant de commander ; vérifier les huit mentions obligatoires d’un sondage avant de retenir le chiffre ; aménager un logement pour limiter les chutes sans se substituer au médecin traitant ; demander un acte de naissance à la bonne mairie, dans la bonne forme. Cinq sujets du référentiel sont créés en `partiel` et nomment leur fiche ; le catalogue passe de 99 à 104 fiches, dont 26 du corpus initial et 78 prototypes. Le registre des grilles suit dans le même changement, et le motif de rangée incomplète du catalogue est réécrit avec le chiffre du relevé de CI — 941,20 px sur 29 cadrages, au cadrage « Compacte » à 75 % sur 1 440 px avec six colonnes — après qu’une déduction de 284,04 px, écrite avant la mesure, s’est révélée fausse de cadrage."
preuves = ["docs/apprentissage/catalogue.toml", "docs/apprentissage/referentiel.toml", "docs/apprentissage/audit-automatique.md", "docs/rd/carte-lacunes.md", "docs/rd/grilles-dynamiques.toml", "docs/rd/cadrages.toml", "docs/rd/journal.md"]
controle = "python3 outils/auditer-prototypes.py --verifier && python3 outils/construire-carte-lacunes.py --verifier && python3 outils/modele-grilles.py --verifier && python3 outils/test_cadrages.py && python3 outils/verifier-site-statique.py && python3 outils/verifier-integration.py"
limite = "Une fiche ouvre un point d’entrée, elle ne couvre pas un domaine : cinq domaines restent à quatre ou cinq fiches sur des cibles de plusieurs dizaines. Les sources ont été lues le 5 novembre 2026 et peuvent changer — résolution onusienne, loi, recommandation de prévention. Aucune relecture humaine n’est consignée, et la fiche sur les chutes dit explicitement qu’elle ne pose aucun diagnostic. Le chiffre du motif vient du relevé de CI du 5 novembre 2026 ; une déduction antérieure l’avait manqué de cadrage, et le banc lit désormais le total dans le catalogue au lieu de recopier une mesure. Le classement du plus grand vide (1 136,16 px) reste celui de ce relevé : un catalogue qui bouge le déplacera."
suite = "Lire l’annotation de cadrages de la CI, y remplacer la déduction par la mesure et le classement par le relevé, puis ouvrir un lot sur les domaines encore à quatre fiches en commençant par les arts et les langues."
initiatives = ["cartographier-les-lacunes", "veille-savoirs-evolutifs", "coherence-textes-publics"]

[[avancee]]
id = "un-choix-nest-pas-un-defaut-recalculable"
date = 2026-11-05
titre = "Un choix explicite n'est pas un défaut recalculable — le mode réduit sautait au clic dans le menu"
constat = """Retour d'usage : « le mode réduit saute au moment où l'on clic sur un élément du menu » en vue ordinateur. Mesuré en Chromium headless sur l'aperçu local : à 1 440 × 900, l'en-tête passe de 198 px à 49 px quand la personne clique « Réduire », reste à 49 px le menu ouvert, puis repasse à **198 px** sur la page chargée par l'entrée du menu ; à 980 × 440 (aperçu ordinateur d'un smartphone), 194 → 49 → **194 px**. Le libellé, `aria-expanded` et `html.entete-compacte` repartent tous en arrière. La cause n'est ni le panneau ni la cascade CSS : `setHeaderCompact(Boolean(compactViewport?.matches))` était la seule vérité au chargement, et chaque entrée du menu est un lien vers une autre page. Une décision du 16 octobre (« ne persiste pas de préférence ») protégeait le compactage automatique sans distinguer le **défaut**, recalculable, du **choix**, qui ne l'est pas."""
changement = """La préférence `mrsc-entete-compacte` (`oui` / `non`) rejoint les réglages locaux : lue au chargement, écrite par la bascule « Réduire » / « Agrandir », suivie d'un onglet à l'autre par `storage`, et **prioritaire** sur les changements de format — une rotation ou la barre d'adresse d'un téléphone ne doivent pas défaire un choix. Sans préférence écrite, le format redevient le seul décideur : l'automaticité d'octobre est conservée pour une première visite. `setHeaderCompact` reste l'unique endroit qui pose les classes, le libellé, le focus et le replacement des panneaux. Le douzième essai navigateur rejoue le geste aux deux formats et dans les deux sens de la bascule ; `verifier-affichages.py` gagne un dix-septième garde-fou et trois mutations du banc retirent séparément la lecture, l'écriture et l'application à la page d'arrivée."""
preuves = ["assets/js/site.js", "outils/test-experience.cjs", "outils/verifier-affichages.py", "outils/test_mutations_affichages.py", "docs/rd/formats-affichage.md", "docs/rd/journal.md"]
controle = "python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py && python3 outils/verifier-integration.py && node outils/test_test_experience.mjs && node outils/test-experience.cjs"
limite = """La préférence est locale à l'appareil et au navigateur : un stockage effacé ou bloqué reprend le format de fenêtre, et la bascule ne reste alors utilisable que pendant la visite — l'essai navigateur avec stockage bloqué le vérifie, mais la page suivante y perd encore le mode réduit. `site.js` est chargé avec `defer` : la classe est posée à 74,8 ms pour une première peinture à 448,6 ms sur ce Chromium et ce réseau local, donc pas d'éclair d'en-tête agrandi ici, mais un réseau très lent pourrait peindre avant lui ; une garantie absolue demanderait un script en ligne dans les 117 pages. Aucune vérification humaine sur l'appareil de la personne n'a eu lieu, et la correction n'a pas été publiée à ce stade."""
suite = "Confirmer à l'écran, sur le site publié, le clic dans le menu à 1 440 px et en aperçu ordinateur ; puis relire le relevé `graphismes` de la CI. Si un éclair d'en-tête agrandi est vu sur un réseau lent, mesurer la première peinture avant d'envisager un script en ligne."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "unifier-les-panneaux-ne-rend-pas-les-boutons-identiques"
date = 2026-11-05
titre = "Unifier les panneaux ne rend pas les boutons identiques — les styles calculés l'ont dit"
constat = """Le retour d'usage « le comportement du bouton menu n'était pas Fidel en terme de rendu ni visuels par rapport au comportement du menu du bouton personnalisation » restait ouvert après trois lots : géométrie commune, habillage commun des panneaux, puis déploiement et fraîcheur des octets servis. Chaque lot répondait à une partie du signal, et les garde-fous étaient verts. Un relevé de `getComputedStyle` dans Chromium, sur cinq configurations (390 × 844, 980 × 440, 1 440 × 900 à 130 %, mouvement normal et réduit) et quatre états, a montré pourquoi : les deux **commandes** n'avaient jamais été comparées. À 100 % de texte, « Menu » avait 14 px de police, 16,8 px d'interligne, 10,4 px de gouttière, `white-space: nowrap`, `min-width: auto` et une transition de 0,18 s ; « Personnalisation » avait 12,8 px, 15,36 px, 10 px, `normal`, 44 px et 0,15 s. À 130 % et en en-tête compact, deux paliers asymétriques ajoutaient 18 px contre 16,64 px et `min-width: 0` contre 44 px."""
changement = """Une seule règle `.nav-toggle, .customize-settings > summary` porte les vingt propriétés communes, et une seule règle l'allumage au survol comme à l'ouverture ; les règles propres ne gardent que `display`/`flex` et `list-style`. Trois paliers qui ne nommaient qu'un bouton sont alignés. Le nouveau garde-fou n'impose aucune valeur : il refuse qu'une règle propre reprenne une propriété commune — un dessin peut changer librement, mais pas d'un seul côté. Trois mutations rejouent les trois façons de refaire diverger, et un treizième essai navigateur relit 27 styles calculés, fermé à fermé puis ouvert à ouvert, parce qu'un seul panneau peut être ouvert à la fois. `versionner-css-ia.py` suit le changement de feuille."""
preuves = ["assets/css/site.css", "outils/verifier-affichages.py", "outils/test_mutations_affichages.py", "outils/test-experience.cjs", "outils/verifier-integration.py", "docs/rd/formats-affichage.md", "docs/rd/journal.md"]
controle = "python3 outils/verifier-affichages.py && python3 outils/test_mutations_affichages.py && python3 outils/verifier-integration.py && python3 outils/versionner-css-ia.py --verifier && node outils/test_test_experience.mjs && node outils/test-experience.cjs"
limite = """Le relevé compare des styles calculés, pas une perception : aucune validation humaine côte à côte n'a eu lieu. Les lignes à l'intérieur des deux panneaux gardent des écarts mesurés (`min-width`, `line-height`, allumages au focus et sur la page courante) et l'icône hamburger reste un SVG de 20 px quand le chevron est un masque de 13 px — ce lot ne les unifie pas et ne le prétend pas. Trois couleurs relevées pendant la transition de 150 ms et une opacité d'animation restent des artefacts de mon propre banc, pas des divergences de source. Surtout, la feuille corrigée n'est pas publiée : le site en ligne sert encore l'ancienne empreinte, donc la fidélité visuelle publiée n'est pas établie."""
suite = "Publier la feuille, relire les octets servis, puis décider si les lignes et les icônes doivent converger aussi ; une comparaison humaine des états fermé, ouvert, survol, focus, actif et page courante reste à faire."
initiatives = ["coherence-textes-publics", "optimisation-du-site"]

[[avancee]]
id = "une-formule-ancienne-nest-pas-une-explication"
date = 2026-11-06
titre = "Une formule ancienne n'est pas une explication — la page Transparence parle aux citoyennes et aux citoyens"
constat = """Retour d'usage sur la page « Transparence, sources & licence » : « il faudrait changer "Un outil du peuple, pour le peuple" pour plus de clarté et d'ancrage dans la réalité de la société, parler de citoyennes et citoyens au lieu de reprendre de vieilles paroles qui portaient en leur temps mais qui ne font que poser des questions aux gens qui lisent ces lignes ». Le titre n'était pas seul : l'encadré mis en avant citait « par le peuple et pour le peuple » sous la signature « par la voix de son fondateur », et la note de traçabilité de la page attribuait elle aussi la prise de parole à cette voix. Trois endroits disaient la même formule, et aucun contrôle du dépôt ne la lisait."""
changement = """Le titre devient « Un outil au service des citoyennes et des citoyens ». Une phrase courte ouvre la section sur ce que les gens voient réellement — un loyer, un trajet, une feuille de soins — avant de dire à quoi sert la page : chaque chiffre a une source que l'on peut vérifier. L'encadré n'est plus une citation entre guillemets : « Pas de formule à reprendre : des faits sourcés, des méthodes lisibles et des résultats à vérifier, discuter et corriger. » La signature devient collective, « — L'association M.R.S.C », parce qu'on ne peut pas laisser une citation signée sur des mots réécrits ; la note de traçabilité dit la révision du 6 novembre 2026. Un garde-fou de `verifier-integration.py` exige le titre, l'ancrage et les citoyennes et citoyens, et refuse le retour des trois anciennes formulations. Trois mutations du banc d'intégration plantent séparément l'ancien titre, la formule citée et la disparition de l'ancrage : les 7 cas du banc passent. Mesure Chromium sur six configurations, de 320 à 1 440 px et jusqu'à 130 % de texte : l'encadré et ses six enfants ne débordent jamais, et les deux nouveaux textes sont raccourcis après une première passe qui ajoutait 11 lignes à un bloc déjà long à 320 px. À 320 px et 130 %, la page garde un débordement horizontal de 24 px — identique avant et après, comparé en A/B sur la version `main` : il vient de `.section-heading` et `.licence-callout`, pas de ce lot."""
preuves = ["transparence.html", "outils/verifier-integration.py", "outils/test_mutations_integration.py", "docs/rd/inventaire-controles.md", "docs/rd/journal.md", "outils/verifier-budgets-visuels.py"]
controle = "python3 outils/verifier-integration.py && python3 outils/test_mutations_integration.py && python3 outils/verifier-inventaire-controles.py && python3 outils/verifier-site-statique.py && python3 outils/test_protocole_editorial.py"
limite = """Le garde-fou lit des mots, pas une compréhension : il ne prouve ni que la nouvelle formulation est claire pour une personne, ni qu'elle est accessible à toutes et tous, ni qu'elle colle à ce que vivent les gens aujourd'hui. La formule reste dans l'adresse du dépôt tiers du simulateur (`D-mocratie-et-politique-du-peuple-pour-le-peuple-par-le-peuple`), dans le titre du simulateur et dans `README.md` : ce sont des noms propres et des citations, pas la parole de cette page, et ils n'ont pas été réécrits. Les deux longs paragraphes préexistants de l'encadré restent tels quels : à 320 px le bloc fait encore une soixantaine de lignes. Aucune relecture par une personne de l'association n'est consignée, et aucun lecteur d'écran ni autre navigateur n'a été essayé."""
suite = "Faire relire la nouvelle formulation par une personne de l'association et par des lecteurs et lectrices extérieurs ; raccourcir les deux paragraphes préexistants si la longueur à 320 px gêne ; décider ensuite, séparément, du titre du simulateur et de la citation juridique qu'il reprend."
initiatives = ["coherence-textes-publics", "co-conception-et-essais"]

[[avancee]]
id = "une-lacune-qualifiee-nest-pas-un-compteur"
date = 2026-11-06
titre = "Une lacune qualifiée n'est pas un compteur — le relevé prospectif ne doit pas vieillir en silence"
constat = """Le portefeuille R&D annonçait encore « Dix-sept sujets restent sans aucune fiche » alors que la carte générée en comptait six, et le brief prospectif du 5 novembre 2026 portait des chiffres recopiés à la main (104 fiches, 78 prototypes, 233 Kio mobile, 8 essais navigateur) sans qu'aucune porte ne les relie au catalogue. La carte des lacunes dit elle-même que le manque des sujets `partiel` reste « à qualifier sujet par sujet » : elle nommait les absences, pas les épaisseurs. Trois fiches sur 104 portaient le repère 4 — une seule avant ce lot — et 89 sujets n'avaient qu'une fiche. Ajouter des fiches pour rendre le compteur plus flatteur n'aurait rien appris, et combler les six sujets sensibles sans relecture compétente aurait enfreint `AGENTS.md`."""
changement = """Trois fiches originales de repère 3 ou 4 complètent trois sujets qui n'en avaient qu'une (`argumentation`, `probabilites-incertitude`, `tests-debogage`) : distinguer fait, interprétation et recommandation ; comparer deux relevés fictifs par moyenne, médiane et étendue ; lire une trace d'erreur fictive et isoler la plus petite modification. Exemples, calculs et corrections sont vérifiables à la main et restent au statut « Prototype à relire ». Quatre pages externes ont été ouvertes et lues le 6 novembre 2026, déclarées en `reference-factuelle` sans aucun extrait reproduit ; la quatrième (controlflow) a été écartée d'une fiche faute de lacune démontrée. Le nouveau `construire-couverture-sujets.py` qualifie les 106 sujets du référentiel par nombre de fiches, repères couverts, carte de sujet, statut et exigence de relecture spécialisée, et injecte un relevé chiffré entre deux bornes dans `prospective-lacunes-2027.md`. `test_mutations_couverture_sujets.py` plante 11 fautes dans une copie complète du dépôt ; `test_reproductibilite_artefacts.py` rejoue la porte à +0, +37 et +400 jours. La prose périmée du portefeuille est corrigée sans effacer la date de la revue d'octobre, et les repères publics (107 fiches, 81 prototypes, 122 pages) sont régénérés avec les sorties."""
preuves = ["docs/apprentissage/catalogue.toml", "docs/apprentissage/referentiel.toml", "outils/construire-couverture-sujets.py", "outils/test_mutations_couverture_sujets.py", "docs/rd/couverture-sujets.md", "docs/rd/prospective-lacunes-2027.md", "docs/rd/portefeuille.toml", "docs/rd/journal.md"]
controle = "python3 outils/construire-couverture-sujets.py --verifier && python3 outils/test_mutations_couverture_sujets.py && python3 outils/verifier-decision-prospective.py && python3 outils/verifier-rd-continue.py && python3 outils/verifier-inventaire-controles.py && python3 outils/test_reproductibilite_artefacts.py"
limite = """Le générateur compte des cases, il ne lit pas les fiches : il ne juge ni l'exactitude, ni la clarté, ni l'accessibilité, et il ne fournit aucune source. Le tri de la « file de travail » porte sur le nombre de manques mesurés, pas sur l'importance d'un domaine ou d'une personne ; ce n'est pas une priorité éditoriale. Les six sujets sans fiche — dont trois `revue-experte` — restent sans fiche et exigent une carte, des sources primaires datées et une relecture compétente. Aucune relecture humaine n'est consignée, aucune validation de contenu n'a eu lieu, aucune donnée d'usage n'a été collectée. Le décalage entre la version épinglée `v3.14.0` déjà citée dans le corpus et la documentation vivante affichée 3.15.2 le 6 novembre 2026 est relevé sans être tranché. Les scénarios A/B/C sont des conséquences arithmétiques, pas des prévisions : le cap de 1 000 reste une hypothèse de planification. La note de prospective est un document de travail, non une décision de l'association."""
suite = "Faire relire les trois fiches par des personnes compétentes en français, en statistique et en programmation ; faire relire les cartes de `securite-sciences` et `revenus-salaire-impots` ; trancher, ou non, le décalage de versions Python ; puis laisser l'association décider entre consolider, étendre et tenir le cap du nombre. Ne rien publier sur les six sujets sensibles sans relecture consignée."
initiatives = ["cartographier-les-lacunes", "veille-savoirs-evolutifs", "documentation-rd-eva"]

[[avancee]]
id = "un-controle-humain-ne-vaut-que-pour-ce-quil-a-regarde"
date = 2026-11-06
titre = "Un contrôle humain ne vaut que pour ce qu'il a regardé — le bouton Menu est confirmé sur le comportement"
constat = """Depuis le 5 novembre 2026, trois lots avaient aligné les panneaux, mesuré 27 styles calculés en Chromium et vérifié les octets servis, sans qu'aucune personne n'ait confirmé le résultat à l'écran. Le 6 novembre 2026, la personne utilisatrice écrit : « J'ai contrôlé le comportement du bouton "menu" et celui de son contenu et c'es OK plus de décrochage du mode réduit vers agrandit donc impeccable ! ». C'est le premier contrôle humain consigné sur ce bouton, et il porte sur deux choses précises : le comportement du bouton et de son panneau, et l'absence du saut du mode réduit vers le mode agrandi au clic."""
changement = """Le résultat est consigné tel quel dans le journal et le portefeuille, sans le gonfler : il valide le comportement constaté et la disparition du décrochage, pas une comparaison côte à côte des 27 styles calculés, ni les lignes et icônes restées non unifiées, ni un essai multi-navigateurs ou lecteur d'écran. Aucun nouveau contrôle technique n'est lancé au nom de ce signal : la chaîne CI/déploiement/fraîcheur du lot #279 reste la preuve technique, et le procès-verbal humain s'y ajoute sans s'y substituer. La convergence des lignes et des icônes reste une décision ouverte, non une conséquence du « impeccable »."""
preuves = ["docs/rd/journal.md", "docs/rd/portefeuille.toml", "outils/verifier-rd-continue.py"]
controle = "python3 outils/verifier-rd-continue.py && python3 outils/verifier-integration.py && python3 outils/verifier-feuille-servie.py --verifier"
limite = """Un contrôle sur un appareil et un navigateur ne vaut pas essai multi-navigateurs, ni lecture avec lecteur d'écran, ni validation de la parité visuelle publiée des deux commandes. Les mesures Chromium du 5 novembre portaient sur les styles calculés, pas sur une perception. Ce procès-verbal ne clôt ni la relecture humaine du texte de Transparence, ni la décision d'atelier sur la citation signée, ni le débordement préexistant à 320 px et 130 % de texte."""
suite = "Proposer, sans l'imposer, une comparaison côte à côte des états fermé, ouvert, survol, focus et page courante ; si la personne s'en tient à son contrôle, consigner que les lignes et icônes restent telles quelles et clore l'initiative de convergence sans la déclarer validée visuellement."
initiatives = ["optimisation-du-site", "coherence-textes-publics"]

[[avancee]]
id = "une-page-de-transparence-se-lit-dans-un-ordre"
date = 2026-11-06
titre = "Une page ne se rend pas lisible en ajoutant des paragraphes — la Transparence est remise en contexte"
constat = """Après la reformulation du 6 novembre 2026, la personne utilisatrice signale que « la page transparence.html mélange tous les sujets » et qu'elle est « vraiment incompréhensible ». Le diagnostic est structurel : le registre de traçabilité — la réponse concrète à « d'où vient ce chiffre ? » — arrivait en sixième section, après un bloc R&D unique de cinquante lignes qui enchaînait six règles de méthode, la transmission entre agents, l'état du catalogue, quatre scénarios prospectifs, la sobriété numérique et neuf paragraphes d'accessibilité. Aucun sommaire, aucun repère de partie, aucun sous-titre dans les notes denses : les sujets se succédaient sans dire pourquoi ils étaient là."""
changement = """Les textes de fond ne sont pas réécrits : ils sont déplacés et contextualisés. Un sommaire de six questions ouvre la page, dit ce qu'elle contient, ce qu'elle ne contient pas et que les relevés chiffrés sont datés. Sept parties numérotées s'enchaînent : projet, méthode, registre des sources, licence, entretien du site et contrôles, prospective en débat, relevés mesurés. Le registre remonte avant la licence et la R&D ; prospective, sobriété et accessibilité forment deux sections distinctes. Chaque partie reçoit une phrase de contexte, et les notes denses reçoivent des sous-titres. `verifier-integration.py` gagne `structure_transparence()` : neuf repères, résolution des ancres, sept libellés, ordre des parties et séparation des trois familles de travaux. Quatre mutations de plus dans le banc d'intégration prouvent que la porte refuse un sommaire retiré, un registre à nouveau enterré, un repère effacé et une ancre morte ; le banc passe à 11 cas. Aucune feuille CSS ni script modifié."""
preuves = ["transparence.html", "outils/verifier-integration.py", "outils/test_mutations_integration.py", "docs/rd/inventaire-controles.md", "docs/rd/poids-pages.md", "docs/rd/journal.md"]
controle = "python3 outils/verifier-integration.py && python3 outils/test_mutations_integration.py && python3 outils/verifier-site-statique.py && python3 outils/verifier-rd-continue.py && python3 outils/verifier-budgets-visuels.py"
limite = """Le contrôle vérifie l'ordre, les ancres et les libellés, pas la compréhension : aucune personne n'a relu la page restructurée, alors que le signal venait d'une lecture humaine. Chromium n'était plus disponible dans cet atelier : aucune mesure nouvelle à 320 px ou à 130 % de texte n'a été faite, et le débordement horizontal préexistant de 24 px à `320-130` n'est ni aggravé mesuré ni corrigé. Les chiffres, dates et formulations restent ceux des lots précédents ; seule la disposition change. La relecture humaine du titre, de la citation collective et de la signature du 6 novembre reste ouverte."""
suite = "Faire relire la page restructurée à l'écran, sur téléphone et à fort zoom ; remesurer les six configurations dès qu'un navigateur est disponible ; traiter séparément le débordement préexistant, sans le mettre sur le compte de cette restructuration."
initiatives = ["coherence-textes-publics", "co-conception-et-essais"]

[[avancee]]
id = "une-structure-qui-convient-nest-pas-un-texte-relu"
date = 2026-11-06
titre = "« Cela correspond » valide une structure, pas le fond des textes"
constat = """Le 6 novembre 2026, la personne utilisatrice avait signalé que `transparence.html` « mélange tous les sujets » et était « vraiment incompréhensible ». La page a été restructurée en sept parties numérotées, puis publiée (PR #281, déploiement `42262076783`, en-têtes `42263372965`, post-fusion `42262076779`) et relue dans le HTML réellement servi. À la question « dites-moi ce que donne la page à l'écran », la réponse est « Cela correspond ». C'est la seconde validation humaine consignée ce jour, après celle du bouton « Menu »."""
changement = """La confirmation est enregistrée dans le journal et le portefeuille avec son périmètre exact : la structure publiée correspond à la demande. Aucun statut éditorial n'est promu, aucune entrée n'est ajoutée à `relectures.toml`, aucun texte de fond n'est déclaré relu. La distinction est écrite noir sur blanc entre « la page se lit dans le bon ordre » et « les informations qu'elle contient ont été vérifiées par une personne compétente ». Aucun nouveau contrôle technique n'est lancé au nom de cette réponse : la chaîne CI/déploiement déjà verte reste la preuve technique, et la porte documentaire est simplement relancée après la trace."""
preuves = ["docs/rd/journal.md", "docs/rd/portefeuille.toml", "transparence.html", "outils/verifier-integration.py"]
controle = "python3 outils/verifier-integration.py && python3 outils/verifier-rd-continue.py && python3 outils/construire-avancees.py --verifier && python3 outils/memoire-eva.py --verifier"
limite = """« Cela correspond » ne répond qu'à la lisibilité de la structure sur un appareil et un navigateur : ni essai multi-navigateurs, ni lecteur d'écran, ni mesure à 320 px / 130 % de texte. Le débordement horizontal préexistant de 24 px à `320-130` reste ouvert. Les trois fiches du lot R&D, la note de prospective non tranchée, la décision d'atelier sur la citation signée et les lignes/icônes des deux boutons restent sans relecture humaine consignée. Une confirmation ne transforme pas un prototype en contenu validé."""
suite = "Faire relire le fond des textes par une personne compétente, puis consigner cette relecture dans `relectures.toml` pour les fiches concernées ; remesurer les six configurations dès qu'un navigateur est disponible ; traiter séparément `320-130`."
