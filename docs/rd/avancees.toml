constat = "Le 10 novembre 2026, la personne a demandé de faire toute la R&D, l’innovation et la prospective avec un plan complet sur l’ensemble du projet. Le dépôt avait 19 initiatives, 102 avancées, une note prospective 2027–2030, un brief A/B/C non tranché et un plan ÉVA à 12 phases, mais aucune carte unique ne reliait ces pièces, leurs états, leurs portes humaines et leurs dettes. Une demande aussi large ne peut pas être exécutée par un seul agent : l’expertise compétente, des essais volontaires, un avis juridique, un CNAME et une décision associative restent des actes de personnes. La relecture de contenu et la vérification des sources, elles, sont à la charge de l’agent et font l’objet de l’avancée suivante."
changement = "Un plan daté cartographie les 19 initiatives en sept chantiers, cinq horizons et sept portes de décision, avec un état mesuré recalculé depuis les registres. `outils/verifier-plan-complet.py` refuse qu’une initiative, une section, un chemin local ou un repère disparaisse, et interdit toute formulation qui déclarerait la R&D terminée ou validée par une personne ; `outils/test_mutations_plan_complet.py` plante six fautes dans une copie jetable. L’inventaire des contrôles, ses comptes, le journal et la mémoire ÉVA sont tenus à jour. Aucune source de vérité, aucune page publique et aucun statut éditorial ne change."
preuves = ["docs/rd/plan-complet-rd-innovation-prospective.md", "docs/rd/portefeuille.toml", "docs/rd/journal.md", "outils/verifier-plan-complet.py", "outils/test_mutations_plan_complet.py", "docs/rd/inventaire-controles.md"]
