[[avancee]]
id = "accueil-d-apres-les-statuts-2026-11-11"
date = 2026-11-11
titre = "L’accueil ne représentait pas l’association : il est réécrit d’après les statuts, lus en entier"
constat = "La personne a cité l’ouverture de l’accueil mot pour mot et tranché : « ça ne représente pas l’association donc relis les statuts et fait quelque chose qui correspond ! ». Le H1 « Apprendre, vérifier et débattre des sujets qui nous concernent » décrivait une fonction de site. Lecture faite de assets/documents/statuts-2020.pdf — 25 pages, empreinte sha256 identique à celle de docs/rd/statuts-matrice-tracabilite.toml, PDF chiffré en AES à mot de passe vide extrait par pypdf après installation de cryptography, 31862 caractères —, sept repères statutaires manquaient à l’ouverture : le slogan « La force citoyenne » (article 1), l’objet entier avec l’histoire, les traditions, la culture et l’avenir (article 2), l’organisation par territoires de vie et assemblées territoriales (préambule, 11.1, 11.6), la règle de vote des membres concernés ou impactés (3 et 5), la pépinière d’idées et les outils de formation (2), les phases du fonctionnement (11.9) et le format d’une proposition (11.8). La lede de la présentation tronquait en plus l’objet aux seuls « intérêts des personnes »."
changement = "index.html : H1 « Préserver, défendre et représenter la société civile. » (53 caractères), titre de page, og:title et noms JSON-LD WebSite et WebPage alignés (63 caractères), descriptions meta et JSON-LD réécrites et égales. Ouverture : slogan cité avec l’article 1, définition du territoire de vie, assemblée où les membres s’informent, se conseillent, partagent, débattent et décident ensemble, règle de vote, pépinière d’idées et outils de l’article 2, puis « Ce site est un de ces outils » avant les trois ressources inchangées. Présentation : objet complet écrit une seule fois, valeurs de l’article 3, phases de l’article 11.9, format des propositions de l’article 11.8, repère « Statuts » devenu « Décision », trois angles de lecture ancrés chacun dans un article, mention « une lecture datée, pas une interprétation juridique ». llms.txt, docs/rd-coherence-visuelle-editoriale.md et docs/protocole-editorial.md suivent. Une redite a été trouvée par les bancs et retirée : l’énumération de l’objet était écrite deux fois. Gardes amendées pour exiger ces repères : verifier-integration.py (163 contrôles, deux réécrits), verifier-plan-site.py (11 repères d’accueil ajoutés), verifier-budgets-visuels.py (plafonds abaissés : titre 73 → 63, H1 63/6/4 → 53/5/3). Bancs enrichis : test_mutations_integration.py 16 cas dont 3 nouveaux, test_mutations_plan_site.py 14 cas dont 1 nouveau. Les dix compteurs de redondance sont remesurés : neuf inchangés, sources de 16 à 15 avec son seuil abaissé. Ne sont publiés ni les noms de personnes de l’article 1, ni l’adresse du siège de l’article 1.3, ni une activité économique de l’article 2."
