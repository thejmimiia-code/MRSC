]
controle = "python3 outils/test_reproductibilite_artefacts.py && python3 outils/verifier-rd-continue.py"
limite = "Le contrôle prouve qu'une sortie est stable, jamais qu'une date est juste : la véracité d'une date de revue reste une relecture humaine. Il ne couvre pas non plus les scripts d'un futur lot, ni les rapports non commités de la veille, qui restent hors du périmètre comparé."
suite = "Étendre la règle au prochain générateur ajouté : si sa sortie est commitée puis comparée, son horodatage doit venir d'une donnée du dépôt et une entrée doit être ajoutée aux portes rejouées."
initiatives = ["optimisation-du-site", "coordination-de-tous-les-agents"]

[[avancee]]
id = "ecouter-sans-promettre-une-conformite"
date = 2026-10-23
titre = "Une aide d'inclusion se mesure sur ce qu'elle n'envoie pas, pas sur ce qu'elle déclare"
constat = "Une lecture à voix haute pouvait sembler une simple fonctionnalité de confort. Trois vérifications en ont fait une décision de conception : le texte lu ne doit jamais quitter l'appareil, la commande ne doit pas exister sur un appareil sans voix, et le résultat ne doit jamais être présenté comme une conformité. Un service public a d'ailleurs été mis en demeure en juin 2026 pour avoir déclaré « totalement conforme » un espace mesuré à 42,11 %."
changement = "Toute aide d'accessibilité ajoutée au site est désormais instruite comme une option comparée de la note prospective, avec sa source externe, son coût, son repli et ses limites publiées à côté de la commande. Trois garanties sont vérifiables dans le code plutôt que dans une intention : aucune création de la commande sans moteur de synthèse, aucun envoi réseau dans le module, et langue de chaque bloc respectée. Le contrôle statique refuse un `fetch`, un appel à un service de synthèse et une commande construite mais jamais ajoutée au panneau."
preuves = [
  "docs/rd/inclusion-lecture-vocale.md",
  "assets/js/site.js",
  "outils/verifier-affichages.py",
  "outils/test-experience.cjs",
  "outils/verifier-accessibilite.cjs",
]
controle = "python3 outils/verifier-affichages.py && node outils/test-experience.cjs && node outils/verifier-accessibilite.cjs"
limite = "Aucune voix réelle n'a été écoutée, aucun lecteur d'écran n'a été utilisé et aucune personne n'a essayé la commande : le banc remplace `speechSynthesis` par un double qui enregistre les énoncés. La limite affichée sous le bouton dit seulement ce que le dispositif ne peut pas garantir ; elle ne prouve aucune amélioration de compréhension, et les chiffres d'effet cités viennent d'études scolaires anglophones."
suite = "Faire écouter la fonction à une personne qui lit difficilement et à une personne utilisant un lecteur d'écran, puis consigner les mots mal prononcés et le cran de vitesse qui lui convient ; retirer le lot si la voix perd le fil ou si un bloc est lu deux fois."
initiatives = ["ecouter-la-page"]

[[avancee]]
id = "boite-non-nulle-nest-pas-affichee"
date = 2026-10-23
titre = "Une boîte non nulle ne prouve pas qu'un élément est affiché"
constat = "Un balayage de la taille des cibles a signalé 50 liens de 15 px sur `apprendre.html`. Ils étaient dans des `<details>` refermés : Chromium leur donne une boîte non nulle, un texte vide et une position, alors que personne ne les voit et qu'aucun clavier ne les atteint. Le même angle mort menaçait la lecture à voix haute livrée la veille, dont le filtre reposait sur `getClientRects` seul."
changement = "Quatre cas ont été mesurés et séparés : `display:none` donne un texte mais pas de boîte, `visibility:hidden` et un `<details>` refermé donnent une boîte mais pas de texte, `aria-hidden` est visible pour l'œil et doit être écarté à part. Toute liste d'éléments « affichés » du dépôt — lecture à voix haute, audit des cibles, échantillon de focus — vérifie désormais `checkVisibility({ checkVisibilityCSS: true, contentVisibilityAuto: true })`, garde `getClientRects` et `innerText` en secours, et écarte `details:not([open])` explicitement."
preuves = [
  "assets/js/site.js",
  "outils/auditer-criteres-22.mjs",
  "outils/verifier-affichages.py",
  "outils/test-experience.cjs",
  "docs/rd/inclusion-criteres-wcag-22.md",
]
controle = "python3 outils/verifier-affichages.py && node outils/test-experience.cjs"
limite = "Ces trois signaux décrivent un rendu dans Chromium, pas la perception : un contenu à contraste insuffisant, hors cadre après défilement ou recouvert par un bandeau reste « affiché » pour la mesure. Le cas d'un contenu animé, d'un iframe ou d'un canvas n'est pas couvert, et aucun de ces tests ne remplace une passe au clavier avec un lecteur d'écran."
suite = "Reprendre ce filtre pour tout futur balayage d'éléments interactifs, et vérifier qu'aucun script du dépôt ne conclut « visible » à partir d'une seule mesure de boîte."
initiatives = ["optimisation-du-site", "ecouter-la-page"]

[[avancee]]
id = "un-espacement-impose-casse-la-page"
date = 2026-10-24
titre = "Un espacement imposé casse la page avant de la rendre lisible"
constat = "Le critère WCAG 1.4.12 ne demande pas d'afficher un texte espacé, mais de supporter qu'une personne impose interligne 1,5, interlettrage 0,12 em, espacement des mots 0,16 em et 2 em après chaque paragraphe. Appliqué aux 98 pages, il a sorti la barre de navigation du cadre de 47 à 56 px entre 1 261 et 1 366 px — « Nous contacter » finissait hors de la fenêtre — et fait déborder les 84 fiches de 22 px à 1 280 px. Aucun des deux défauts ne se voyait sans imposer cet espacement."
changement = "`outils/auditer-criteres-22.mjs` applique les quatre valeurs du critère en `!important`, puis cherche deux pertes : une page qui se met à défiler horizontalement et un texte rogné par un ancêtre en `overflow: hidden` ou `clip`, nœud de texte par nœud de texte. Deux corrections sont livrées : `flex-wrap: wrap` sur `.nav-links`, qui laisse la ligne unique tant qu'elle tient, et `white-space: normal` sur le seul bouton de la colonne latérale d'une fiche. Un seizième contrôle de `verifier-affichages.py` refuse le retour en arrière."
preuves = [
  "outils/auditer-criteres-22.mjs",
  "outils/verifier-affichages.py",
  "assets/css/site.css",
  "docs/rd/formats-affichage.md",
  "docs/rd/inclusion-criteres-wcag-22.md",
  "docs/rd/audit-criteres-22-2026-10-24.json",
  "transparence.html",
]
controle = "python3 outils/verifier-affichages.py && node outils/auditer-criteres-22.mjs"
limite = "La mesure voit un débordement et un rognage, pas une perte de sens : un chevauchement partiel, une coupure de mot, un texte masqué par un `clip-path` sans `overflow` ou déplacé hors du champ visible sans déborder lui échappent. Aucune personne n'a relu ce critère, et rien ne prouve qu'une personne qui a besoin de cet espacement lit mieux la page : c'est une géométrie, pas un usage."
suite = "Faire lire la page à une personne qui agrandit l'interlettrage, puis étendre la mesure au zoom 200 % et au critère 1.4.10 (redistribution du contenu), qui n'ont jamais été éprouvés ici."
initiatives = ["optimisation-du-site"]

