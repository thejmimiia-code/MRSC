constat = """Le 10 novembre 2026, la personne a corrigé la réponse R&D : « la relecture c’est toi qui doit la faire ». Le plan complet et la réponse précédente présentaient à tort les 81 prototypes comme une porte de relecture humaine à ouvrir et suggéraient d’attribuer des rôles de relecture. `docs/protocole-editorial.md` et `docs/rd/relecture-automatique.md` disent le contraire depuis le 7 novembre : l’agent lit le contenu et vérifie les sources, la personne garde le rendu à l’œil. Le registre des relectures humaines était vide, la sentinelle gardait 499 unités dont 473 en `reference-initiale`, et aucun constat de lecture n’existait pour les fiches."""
changement = """L’agent lit les 11 champs éditoriaux de chacun des 81 prototypes de `docs/apprentissage/catalogue.toml`, recalcule 20 égalités arithmétiques simples sans écart, ouvre 17 pages de source déclarées et confronte énoncés, aides et corrections. Il consigne 81 entrées datées dans `docs/rd/relecture-agent-prototypes.toml` (41 sans écart détecté, 40 à trancher) et le rapport `docs/rd/relecture-agent-prototypes-2026-11-10.md`. `outils/relecture-agent-prototypes.py` vérifie la couverture, les constats, les limites et l’absence de validation inventée ; son banc de 10 mutations exige l’échec nommé. Les 81 pages passent de `reference-initiale` à `relu-par-agent` avec une `[[edition]]` datée chacune. Le plan, la note de méthode, la grille, le journal et l’inventaire sont amendés pour ne plus renvoyer la lecture à la personne. Aucune fiche, aucun catalogue, aucun statut, aucune page publique et aucune URL externe nouvelle."""
preuves = ["docs/rd/relecture-agent-prototypes.toml", "docs/rd/relecture-agent-prototypes-2026-11-10.md", "outils/relecture-agent-prototypes.py", "outils/test_mutations_relecture_agent_prototypes.py", "docs/rd/plan-complet-rd-innovation-prospective.md", "docs/rd/empreintes-contenus.toml"]
