# Registre des avancées réutilisables de la R&D.
#
# Une « avancée » est un apprentissage du projet qui change durablement la façon
# de travailler — pas une fonctionnalité, pas un chiffre de communication. Chaque
# entrée dit ce qui a été constaté, ce que cela change, comment cela reste vrai
# (preuves locales + contrôle exécutable), ce que cela ne prouve pas, et ce qui
# reste à faire.
#
# Ce registre ne certifie rien : il rend une décision réutilisable par un autre
# agent. Une avancée sans limite écrite n'est pas une avancée, c'est une croyance.

[[avancee]]
id = "un-controle-qui-n-a-pas-pu-chercher-ne-doit-pas-rassurer"
date = 2026-10-28
titre = "Un contrôle qui n'a pas pu chercher doit le dire, pas annoncer qu'il n'a rien trouvé"
constat = "`outils/verifier-planches-statuts.py` garde 12 planches citées, 203 liens d'image, 343 empreintes d'archive et l'absence de PNG suivi dans `docs/rd/statuts-animation/`. Il n'avait aucun test. En écrivant son banc, le cas « copie sans dépôt git » a révélé un défaut réel : `git ls-files` en échec renvoie une sortie vide, `splitlines()` rend une liste vide, et le contrôle annonçait « aucun PNG suivi » — il affirmait le résultat d'une recherche qu'il n'avait jamais pu faire. Le défaut ne se voyait pas dans le dépôt, où la commande réussit toujours."
changement = "Le banc `outils/test_mutations_planches_statuts.py` plante sept situations dans une copie complète du dépôt : planche citée supprimée, référence `statuts-animation/…` sans fichier ni archive, lien d'image non résolu, manifeste à 342 empreintes, manifeste de 344 empreintes dont deux homonymes, PNG réellement suivi par `git add`, et copie privée de dépôt git. Huit tests, 1,3 s. `verifier-planches-statuts.py` honore `MRSC_RACINE` et lève une erreur explicite quand `git ls-files` échoue, au lieu de rendre un silence complice. Inventaire : `banc`, et le total passe à 28 contrôles sur 37."
preuves = [
  "outils/verifier-planches-statuts.py",
  "outils/test_mutations_planches_statuts.py",
  "outils/banc_mutations.py",
  "docs/rd/plan-statuts-animation.md",
  "docs/rd/statuts-animation/ARCHIVE-film-associatif.sha256",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/test_mutations_planches_statuts.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc prouve que le contrôle refuse ces sept situations, pas qu'il voit toutes les façons de casser une archive : une empreinte fausse pour un fichier présent, une planche citée depuis un fichier binaire ou un `.gitignore` trop large lui échappent. Le manifeste est vérifié en nombre, en unicité de noms et en forme de ligne, jamais en contenu : un fichier modifié sous une empreinte recopiée passerait. Et `git ls-files` reste la seule autorité sur les PNG suivis : le banc en simule l'absence de dépôt, pas une sortie incohérente."
suite = "Vérifier aussi les empreintes elles-mêmes (`sha256sum -c` sur l'archive), puis attaquer les quatre contrôles navigateur depuis le job `graphismes`."
initiatives = ["documentation-rd-eva", "optimisation-du-site"]

[[avancee]]
id = "un-faux-navigateur-prouve-le-contrat-pas-la-mesure"
date = 2026-10-28
titre = "Un faux navigateur prouve le contrat de sortie, et il a trouvé un vrai défaut de rapport"
constat = "`outils/auditer-criteres-22.mjs` mesure trois critères WCAG dans un vrai Chromium et n'avait aucun test. Sa géométrie ne se teste pas sans navigateur, mais son contrat de sortie si — et c'est là qu'il a menti une fois : sans serveur local, il rendait « 0 cible, 0 élément testé », c'est-à-dire une page parfaite. En écrivant le banc, un second défaut est apparu, latent : la ligne des cibles à corriger poussait `{ page, largeur, ...cible }`, et la cible portait elle aussi une clé `largeur`. La largeur de fenêtre était donc écrasée par la largeur de la cible, dans le compte rendu comme dans le JSON — mais seulement quand il y avait quelque chose à corriger. Le relevé du 24 octobre 2026, qui en comptait zéro, était juste par accident."
changement = "Deux faux paquets (`outils/faux-navigateur/puppeteer-core` et `@sparticuz/chromium`) sont copiés dans un `node_modules` jetable, et `outils/test_auditer_criteres_22.mjs` lance **le vrai script** quatre fois : nominal, échec total (code 1, « Toutes les pages ont échoué », aucune ligne de bilan), échec partiel (le doute est écrit, la page en échec est nommée), défauts (cible trop petite, débordement, rognage, focus masqué, passe coupée par le plafond). 4 cas, 4 s, aucun binaire. Le rapport nomme désormais `largeurCible` et `hauteurCible` à côté de `largeur`, la fenêtre."
preuves = [
  "outils/auditer-criteres-22.mjs",
  "outils/test_auditer_criteres_22.mjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  "outils/faux-navigateur/@sparticuz/chromium/index.js",
  "outils/verifier-inventaire-controles.py",
  ".github/workflows/verification.yml",
]
controle = "node outils/test_auditer_criteres_22.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc ne mesure rien : il regarde ce que le script fait de mesures qu'on lui donne. La justesse de la géométrie — taille réelle d'une cible, recouvrement réel d'un bandeau, rognage réel d'un texte — reste hors de sa portée, et c'est pourquoi l'inventaire le classe `faute-en-memoire` et non `banc`. Le faux onglet départage la description d'une cible de ses points par le rang d'appel, ce qui casse si le script change l'ordre de ses appels ; et aucun banc ne couvre encore `verifier-accessibilite.cjs` ni `verifier-fiches-statistiques.cjs`, qui demandent, eux, un vrai Chromium."
suite = "Éprouver les deux contrôles navigateur restants dans le job `graphismes` (le banc y a sa place : il lui faut un vrai Chromium), puis `etat-rd.py`."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-etat-qui-perd-une-source-garde-l-air-complet"
date = 2026-10-29
titre = "Un rapport d'état qui perd une source sans le dire garde l'air complet"
constat = "`outils/etat-rd.py` imprime le tableau que le brief de décision prospective cite comme pièce justificative — initiatives, fiches, prototypes, revues, poids maximal. Il n'avait aucun test, et son défaut n'était pas de se tromper : il était de **se taire**. Un `poids-pages.md` absent ou reformaté faisait disparaître trois lignes du tableau, un journal sans entrée datée en retirait une autre, un portefeuille absent levait une trace d'exception, et une fiche dont `revue_le` ne se lisait pas était écartée du compte des revues échues — une date mal écrite rendait la fiche **moins** suivie. Dans les trois premiers cas, le tableau restait lisible, donc rassurant."
changement = "`etat-rd.py` honore `MRSC_RACINE`, traduit toute source absente ou illisible en `SourceIllisible` et l'inscrit comme une ligne « **non lu** — cause » au lieu de la supprimer ; les fiches à date illisible sont comptées et nommées dans une ligne « Revues non calculables » ; une sortie incomplète porte un code non nul et un avertissement explicite (« ce tableau ne doit pas servir de pièce jointe en l'état »). `outils/test_etat_rd.py` couvre sept cas dans une copie complète du dépôt : copie intacte, relevé de poids supprimé, relevé reformaté à trois colonnes, journal sans entrée datée, fiche au `revue_le` illisible, portefeuille absent, échéance calculée depuis `--date`. 1,2 s."
preuves = [
  "outils/etat-rd.py",
  "outils/test_etat_rd.py",
  "outils/banc_mutations.py",
  "docs/rd/poids-pages.md",
  "docs/rd/portefeuille.toml",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/test_etat_rd.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc prouve que l'outil nomme ce qu'il n'a pas pu lire, pas que ce qu'il lit est juste : une valeur fausse dans un fichier bien formé passerait sans être vue. La lecture du tableau de poids reste liée à sa forme — quatre colonnes, nom entre accents graves — et un futur relevé correctement rempli mais autrement formaté serait refusé, ce qui est le comportement voulu mais coûtera une correction. Rien ne vérifie non plus que les chiffres publiés correspondent à ce qu'un humain considérerait comme l'état de la R&D : c'est un compte, pas un jugement."
suite = "Éprouver `verifier-fiches-statistiques.cjs`, `verifier-accessibilite.cjs` et `auditer-affichages.mjs` avec le faux navigateur, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
initiatives = ["documentation-rd-eva", "veille-savoirs-evolutifs"]

[[avancee]]
id = "un-releve-qui-n-existe-pas-ne-dit-pas-zero-defaut"
date = 2026-10-29
titre = "Un relevé qui n'existe pas ne dit pas « zéro défaut »"
constat = "`outils/verifier-fiches-statistiques.cjs` promène les deux fiches de statistiques dans 288 configurations (4 largeurs × 3 tailles de texte × 6 dispositions × contraste et espacement renforcés) et écrit un relevé JSON dans `docs/rd/`. Il n'avait aucun test. Son pire défaut n'était pas de mal mesurer : c'était qu'un relevé **absent** se lise comme un audit propre. Le script sort en code 2 si un chargement échoue, mais rien n'était vérifié là-dessus, et le fichier de relevé commité pouvait être écrasé par un simple lancement depuis le dépôt."
changement = "`outils/test_verifier_fiches_statistiques.mjs` remplace `puppeteer-core` et `@sparticuz/chromium` par les deux faux paquets et lance **le vrai script** quatre fois : nominal (288 relevés, 0 échec, périmètre écrit dans le fichier), géométrie fautive (288 échecs comptés, l'erreur nommée), statut absent (le contrôle de statut n'est pas avalé par le contrôle géométrique), chargement impossible (code 2 et **aucun relevé écrit**). Le banc vérifie enfin que le relevé commité n'a pas bougé — il redirige toujours l'écriture hors du dépôt. 5 cas, 0,3 s."
preuves = [
  "outils/verifier-fiches-statistiques.cjs",
  "outils/test_verifier_fiches_statistiques.mjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  "docs/rd/audit-fiches-statistiques-2026-10-24.json",
  ".github/workflows/verification.yml",
]
controle = "node outils/test_verifier_fiches_statistiques.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Le banc ne mesure aucune géométrie : il vérifie ce que le script fait du résultat qu'on lui donne, pas si un élément est réellement hors écran. Le faux reconnaît la fonction de géométrie à son texte (elle ne prend aucun argument et cherche `Prototype à relire`) : si le script était reformulé, le faux rendrait une valeur neutre et les cas d'échec ne mordraient plus — c'est le point fragile, écrit dans le code source du faux. Rien ne dit non plus que les 288 configurations soient les bonnes : c'est le choix de l'outil, pas une mesure."
suite = "Éprouver `verifier-accessibilite.cjs` et `auditer-affichages.mjs` de la même façon, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-balayage-vide-ne-vaut-pas-un-site-sans-violation"
date = 2026-10-29
titre = "Un balayage qui n'a rien analysé ne vaut pas un site sans violation"
constat = "`outils/verifier-accessibilite.cjs` visite 12 pages à deux largeurs et une vingtaine d'états interactifs — menu ouvert, panneau Affichage, contraste renforcé, lecture à voix haute, filtres d'Apprendre, aides dépliées, mission des Mondes, commandes du simulateur — et passe axe-core sur chacun. Il n'avait aucun test. Trois mensonges possibles : n'analyser aucune page et annoncer « 0 violation », perdre le lien entre une violation et l'état qui la porte, ou sortir en succès malgré une règle en échec. Un total agrégé ne dit jamais où regarder."
changement = "`outils/test_verifier_accessibilite.mjs` remplace `puppeteer-core`, `@sparticuz/chromium` et `axe-core` par trois faux, lance le vrai script — sans serveur local, via `MRSC_A11Y_BASE` — et vérifie trois cas : nominal (code 0, chaque exécution annoncée a sa ligne de verdict, les états interactifs sont relevés séparément), violations (code 1, deux règles nommées avec nœud, état et largeur, message rappelant qu'une mesure n'est pas un audit), chargement impossible (code 2, aucun rapport écrit). Le nombre d'états n'est pas recopié dans le banc : il est confronté au décompte publié par le script. 3 cas, 40 s."
preuves = [
  "outils/verifier-accessibilite.cjs",
  "outils/test_verifier_accessibilite.mjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  "outils/faux-navigateur/axe-core/axe.min.js",
  ".github/workflows/verification.yml",
]
controle = "node outils/test_verifier_accessibilite.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "Aucune règle axe n'est évaluée : le faux rend les violations qu'on lui demande, donc le banc prouve le traitement d'un résultat, jamais sa détection. Un axe-core cassé ou mal chargé ne serait pas vu, et aucune page réelle n'est ouverte. Les 40 secondes viennent des attentes d'interface du script lui-même, ce qui en fait le banc le plus coûteux de la série ; il tourne malgré tout dans `qualite`, sans navigateur."
suite = "Éprouver `auditer-affichages.mjs`, dernier script navigateur sans banc, puis `verifier-source-distante.py` en remplaçant sa sonde réseau."
initiatives = ["optimisation-du-site", "co-conception-et-essais"]

[[avancee]]
id = "un-banc-a-dix-minutes-se-reduit-en-lecrivant"
date = 2026-10-29
titre = "Un banc qui coûte dix minutes se réduit, en l'écrivant au-dessus du banc"
constat = "`outils/auditer-affichages.mjs` mesure 13 pages dans 19 formats et 10 modes — 2 470 mesures — et n'avait aucun test. Son contrat de sortie s'éprouve comme celui des trois autres scripts navigateur, mais chaque mesure est suivie d'une pause de 120 ms dans le script : une exécution complète prend dix minutes, mesurées le 29 octobre 2026, et il en faut trois pour couvrir les cas. Un banc qu'on n'exécute pas ne prouve rien, et un banc qui coûte une demi-heure sera contourné."
changement = "`outils/test_auditer_affichages.mjs` monte une arborescence jetable — `outils/` copié, le reste lié symboliquement, les faux paquets dans `node_modules` — parce que ce script, contrairement aux trois autres, importe ses dépendances en modules ES sans lire de variable. Il lance le script du dépôt après avoir réduit le périmètre **dans la copie** à une page, un format et deux modes, par ancres exactes qui échouent si le script est reformaté. Trois cas : nominal (chaque mesure annoncée est écrite, aucune clé ne manque), défauts (code 1, mesure nommée avec mode, page, format et compteurs), chargement impossible (arrêt non nul, aucun rapport partiel). 2,7 s au lieu de 30 minutes."
preuves = [
  "outils/auditer-affichages.mjs",
  "outils/test_auditer_affichages.mjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  ".github/workflows/verification.yml",
]
controle = "node outils/test_auditer_affichages.mjs && python3 outils/verifier-inventaire-controles.py"
limite = "La réduction du périmètre est le point sensible : le banc ne prouve pas que les 19 formats et les 10 modes sont couverts, seulement que le script traite une mesure, nomme un défaut et écrit son rapport. Une régression qui ne toucherait qu'un format particulier (le 4k, le pliable 280) passerait sans être vue — c'est un choix assumé au nom du coût, et il est écrit dans l'en-tête du banc. Le faux navigateur ne charge aucune page : les six contrôles de géométrie ne sont jamais exercés sur du vrai HTML, et la netteté d'image dépend d'ImageMagick, absent ici."
suite = "Éprouver `verifier-source-distante.py`, dernier contrôle sans preuve, en remplaçant sa sonde réseau."
initiatives = ["optimisation-du-site", "poids-et-sobriete-numerique"]

[[avancee]]
id = "le-reseau-se-teste-sur-la-boucle-locale"
date = 2026-10-29
titre = "Un contrôle réseau se prouve sur la boucle locale, sans simuler HTTP"
constat = "`outils/verifier-source-distante.py` était le dernier contrôle de l'inventaire sans aucune preuve. Il décide de la bascule du site vers la version en ligne du simulateur : page servie **et** API de calcul qui répond. Son banc ne pouvait pas se contenter de simuler — `api/verifier-source.py` fait ses requêtes avec `urllib` dans un module chargé par `importlib`, et le script est un sous-processus. Et il restait une faiblesse de rapport : quand `/api/scenarios` répondait 200 avec un JSON sans les clés attendues, seule la route suivante (`/api/catalogue`, 404) était affichée, et la raison réelle du refus disparaissait."
changement = "`outils/test_verifier_source_distante.py` fait tourner un vrai serveur sur un port éphémère de la boucle locale et lance le script en sous-processus avec `SIMULATEUR_SOURCE_DISTANTE_TEST_LOCALE=1`, la seule exception prévue pour les tests. Neuf cas : page et API fonctionnelles, page de présentation refusée, API absente, seconde route qui suffit, JSON 200 sans les clés attendues, port fermé (jamais un succès), hôte non autorisé (refus sans requête), `--json` sur un refus, et la forme du JSON. `api/verifier-source.py` gagne `api_essais` — toutes les routes essayées, dans l'ordre — et le script imprime une ligne par essai. 9 cas, 4,5 s, aucun octet hors de la machine."
preuves = [
  "outils/verifier-source-distante.py",
  "outils/test_verifier_source_distante.py",
  "api/verifier-source.py",
  "outils/verifier-integration.py",
  ".github/workflows/verification.yml",
]
controle = "python3 outils/test_verifier_source_distante.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le serveur local répond exactement ce que le cas décide : le banc prouve la décision du script sur des réponses connues, pas la réalité de Vercel — un déploiement amont cassé ne serait pas vu, et la vérification réelle reste une action humaine. Le cas « port fermé » dépend d'un port rendu au système après fermeture, ce qui peut échouer si une autre processus le reprend entre-temps. Enfin, la lecture du JSON ne juge pas son contenu : un moteur qui renvoie des clés vides passe pour fonctionnel."
suite = "Vérifier les empreintes de l'archive des statuts (`sha256sum -c`), que `verifier-planches-statuts.py` ne contrôle jamais en contenu, puis éprouver les trois scripts qui sont eux-mêmes des tests."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-manifeste-verifie-sa-forme-ne-verifie-pas-son-contenu"
date = 2026-10-29
titre = "Un manifeste dont on vérifie la forme ne dit rien de son contenu"
constat = "`outils/verifier-planches-statuts.py` concluait « manifeste de 343 empreintes conforme » alors qu'il ne vérifiait que trois choses : le nombre de lignes, l'unicité des noms et la forme des empreintes. Le contenu n'était jamais comparé, et le mot « conforme » se lisait comme « archive intacte ». La comparaison existe pourtant — `sha256sum -c` sur une archive restaurée — mais elle reste une étape manuelle documentée, donc non rejouée. Mesuré le 29 octobre 2026 : la bible du film présente dans l'arbre a une empreinte (`e6c9d68c…`) différente de celle du manifeste (`6f3dcb4e…`), ce qui interdit de comparer naïvement l'arbre au manifeste."
changement = "`verifier-planches-statuts.py` accepte `--empreintes DOSSIER` : il recalcule les empreintes d'une archive restaurée, nomme chaque écart, compte les fichiers réellement vérifiés et ceux qui sont absents de la copie. Sans l'option, le résumé ne dit plus « conforme » mais « 343 empreintes bien formées (contenu non vérifié ici : l'archive vit hors de l'arbre) ». Le banc gagne trois cas : deux fichiers non conformes nommés, un fichier conforme compté (empreinte recalculée, jamais recopiée), un dossier absent dit comme un manque. 11 tests, 1,6 s."
preuves = [
  "outils/verifier-planches-statuts.py",
  "outils/test_mutations_planches_statuts.py",
  "docs/rd/statuts-animation/ARCHIVE-film-associatif.sha256",
  "docs/rd/archives-et-poids-du-depot.md",
]
controle = "python3 outils/test_mutations_planches_statuts.py && python3 outils/verifier-planches-statuts.py"
limite = "La vérification reste optionnelle, donc absente de la CI : l'archive pèse plus d'un gigaoctet et vit hors du dépôt. Tant qu'une personne ne lance pas `--empreintes` sur une copie restaurée, le contenu n'est pas vérifié — le résumé le dit, ce qui vaut mieux qu'un « conforme » trompeur, mais ne remplace pas la vérification. L'écart d'empreinte de la bible du film, lui, a été tranché le 29 octobre 2026 : la copie de l'étiquette `planches-statuts-animation-2026-10`, extraite par `git archive`, porte exactement l'empreinte du manifeste, donc l'archive est intacte et c'est le document de l'arbre qui a évolué. Une seule empreinte a été vérifiée sur les 343 : l'extraction complète pèse plus d'un gigaoctet."
suite = "Éprouver les trois scripts qui sont eux-mêmes des tests (`test-experience.cjs`, `test-cache-css-ia.cjs`, `verifier-graphismes.cjs`). La vérification complète des 343 empreintes reste une action humaine, faute de place pour extraire l'archive."
initiatives = ["documentation-rd-eva", "poids-et-sobriete-numerique"]

[[avancee]]
id = "un-code-de-sortie-ne-dit-pas-pourquoi"
date = 2026-10-29
titre = "Un code de sortie ne dit pas pourquoi : une mutation doit constater ce qu'elle plante"
constat = "`verifier-graphismes.cjs` rejoue trois fautes internes — `distorsion`, `densite`, `ancre` — et la CI exigeait seulement que le contrôle sorte en erreur (code 1). Or un échec peut venir d'une panne sans rapport avec la mutation : un serveur absent, une page renommée, une exception dans une mesure. La CI aurait été verte avec un contrôle qui ne voit plus ce qu'il prétend voir, ce qui est exactement le défaut que la série de bancs cherchait à éliminer ailleurs."
changement = "`outils/verifier-mutation-graphismes.py` lit le rapport JSON de chaque passe mutée et exige que l'erreur attendue y figure : « distorsion » pour `distorsion`, « densité insuffisante » pour `densite`, « ancre » pour `ancre`. Un rapport absent ou illisible est un refus, pas un silence. Le job `graphismes` appelle ce contrôle après chaque mutation, à côté du test du code de sortie. `outils/test_verifier_mutation_graphismes.py` couvre six cas hors ligne, dont un qui **relit les messages attendus dans le script** : une reformulation de `verifier-graphismes.cjs` fait échouer le test au lieu de le rendre faux."
preuves = [
  "outils/verifier-mutation-graphismes.py",
  "outils/test_verifier_mutation_graphismes.py",
  "outils/verifier-graphismes.cjs",
  ".github/workflows/verification.yml",
  "docs/rd/audit-graphismes-2026-10-24.json",
]
controle = "python3 outils/test_verifier_mutation_graphismes.py && python3 outils/verifier-inventaire-controles.py"
limite = "Le contrôle dit qu'une erreur attendue a été constatée, jamais qu'elle a été constatée **pour la bonne raison** : la chaîne cherchée est un fragment, et un rapport qui la contiendrait par accident passerait. Il ne voit pas non plus une mutation qui n'échouerait sur aucune page, si le rapport contient par ailleurs l'erreur cherchée sur un autre relevé. Enfin, la liste des messages attendus reste une convention écrite à deux endroits — le script et le contrôle — et seule la relecture du test relie les deux."
suite = "Éprouver les trois scripts qui sont eux-mêmes des tests (`test-experience.cjs`, `test-cache-css-ia.cjs`, `verifier-graphismes.cjs`), en commençant par vérifier que leurs mutations portent sur ce qu'ils mesurent."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-test-de-cache-qui-ne-sert-plus-rien-reste-vert"
date = 2026-10-29
titre = "Un test de cache qui ne sert plus rien reste vert"
constat = "`test-cache-css-ia.cjs` simule un téléphone qui aurait gardé l'ancienne feuille de style : il intercepte la requête du CSS et sert lui-même deux feuilles, puis exige que les pastilles de la constellation soient décalées avec l'ancienne et alignées avec la versionnée. Rien ne prouvait que ce test mord encore. Sa panne la plus discrète n'est pas un écart de géométrie : c'est de **ne plus servir l'ancienne feuille**. Si l'interception disparaît, ou si les deux cas servent la même feuille, le test continue d'afficher un bilan vert sans rien reproduire du tout."
changement = "`outils/test_test_cache_css_ia.mjs` lance le vrai script dans une racine factice (ses deux fichiers d'entrée et les faux paquets) et éprouve cinq cas : nominal — douze essais, les deux URL demandées, et le nombre annoncé relu dans la sortie puis confronté au relevé ; version de CSS périmée dans la page — code 1, message nommé, aucun relevé écrit ; attente des deux cas inversée dans une copie du script — code 1 ; `setRequestInterception` retiré — code 1 ; CSS courant servi comme « ancien » — code 1. Le faux `puppeteer-core` rejoue l'interception et tire la distance pastille/point du CSS **réellement servi**."
preuves = [
  "outils/test_test_cache_css_ia.mjs",
  "outils/test-cache-css-ia.cjs",
  "outils/faux-navigateur/puppeteer-core/index.js",
  ".github/workflows/verification.yml",
  "docs/rd/inventaire-controles.md",
]
controle = "node outils/test_test_cache_css_ia.mjs"
limite = "Le faux navigateur ne mesure rien : il encode la seule règle « l'ancien CSS décale les pastilles », et le banc prouve donc la plomberie du test — qu'il sert bien deux feuilles, qu'il les distingue, que ses assertions mordent — jamais que le CSS de f3c4ddf décalait réellement de 12 px sur un téléphone. Les trois cas mutés portent sur des copies jetables ; la racine factice ne contient que le CSS, la page et le script, si bien qu'une dépendance nouvelle du script à un autre fichier du dépôt ferait échouer le cas nominal — c'est voulu, mais ce n'est pas dit par le script lui-même."
suite = "Éprouver `test-experience.cjs`, dernier script qui est lui-même un test, en commençant par ce qui est faisable sans navigateur : le compte d'essais annoncé et l'existence d'au moins une assertion par essai."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

[[avancee]]
id = "un-test-que-personne-ne-lancait"
date = 2026-10-29
titre = "Un test que personne ne lançait : neuf essais navigateur hors de toute CI"
constat = "`test-experience.cjs` contient neuf essais interactifs — choix immédiat, clavier et retour du focus, en-tête compact, panneaux à 320 et 1 440 px, contraste et espacement, stockage bloqué, guide, lecture à voix haute, iframe synchronisée — et **aucun workflow ne le lançait**. Il n'était exercé qu'à la main, sur une machine équipée de Chromium. L'inventaire le classait `test-en-soi`, statut dont la définition dit « lancé par la CI » : la définition était fausse pour lui. Un test que rien ne lance ne protège rien, même quand il passe."
changement = "Deux corrections. Le job `graphismes` — le seul qui installe Chromium — lance désormais `node outils/test-experience.cjs` contre le serveur du site qu'il a déjà démarré. Et `outils/test_test_experience.mjs` éprouve le **harnais** : avec le faux navigateur en échec total, les neuf essais doivent être comptés une fois, nommés, le bilan annoncé doit être `0/9`, et le code de sortie 1. Trois mutations sont rejetées par ce verdict — `process.exitCode` effacé, succès enregistré malgré l'exception, essai renommé — et deux invariants sont lus dans la source : aucune assertion absente d'un essai, aucun nom en double."
preuves = [
  "outils/test_test_experience.mjs",
  "outils/test-experience.cjs",
  ".github/workflows/verification.yml",
  "docs/rd/inventaire-controles.md",
]
controle = "node outils/test_test_experience.mjs"
limite = "Le banc ne rejoue aucun essai : le faux navigateur ne clique pas et ne mesure pas. Il prouve que le harnais ne peut pas raconter un succès qui n'a pas eu lieu — comptage, nommage, bilan, code de sortie — jamais que les neuf essais mesurent ce qu'ils annoncent. Ce second point est tenu par le job `graphismes` et un vrai Chromium : observé vert le 29 octobre (exécution 40972858034). Il a d'abord échoué, et c'est instructif — servi par `python3 -m http.server`, `simulateur/` reçoit des 404 sur son API, n'ouvre jamais `#overlay.visible`, et quatre essais tombent en `TimeoutError`. Le script doit donc démarrer `outils/serveur-local.py`, comme sa documentation le dit. Rien de tout cela ne prouve que les neuf essais couvrent ce qu'ils prétendent couvrir : ils sont verts, pas exhaustifs."
suite = "Éprouver la mesure de `verifier-graphismes.cjs`, dernier contrôle sans second témoin."
initiatives = ["optimisation-du-site", "documentation-rd-eva"]

