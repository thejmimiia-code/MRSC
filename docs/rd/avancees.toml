limite = "Ce lot ne relit aucun des 81 prototypes, ne tranche aucune option A/B/C, ne modifie aucune page HTML, CSS ou JavaScript, ne déplace pas la date de revue du portefeuille, ne pose pas de CNAME, ne met pas à jour le moteur du simulateur et ne collecte aucune donnée. Il n’est ni une validation humaine du texte ou du rendu, ni une expertise de domaine, ni un avis juridique, ni un essai avec des personnes. Les chiffres du plan sont un instantané du 10 novembre 2026, à recalculer avec `outils/etat-rd.py` ; `docs/apprentissage/relectures.toml` reste vide et la dette de relecture de fond reste consignée."
suite = "Choisir une seule porte à ouvrir entre la revue du 2026-11-19 et la décision prospective avant le 31 janvier 2027, puis consigner ce choix dans le journal. Ne pas franchir ces portes à la place de l’association, et ne pas lui renvoyer la lecture du contenu."
