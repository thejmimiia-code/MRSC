controle = "python3 outils/verifier-integration.py && python3 outils/verifier-plan-site.py && python3 outils/test_mutations_plan_site.py && python3 outils/test_mutations_integration.py && python3 outils/verifier-budgets-visuels.py && python3 outils/test_mutations_budgets_visuels.py && python3 outils/verifier-site-statique.py && python3 outils/verifier-affichages.py --verifier && python3 outils/auditer-selecteurs-morts.py --verifier && python3 outils/verifier-poids-pages.py && python3 outils/test_protocole_editorial.py && python3 outils/relire-contenus.py && python3 outils/construire-avancees.py --verifier && python3 outils/memoire-eva.py --verifier && git diff --check"
