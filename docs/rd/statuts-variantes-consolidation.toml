# Variantes de consolidation : aucune option n’est sélectionnée ni validée.
[meta]
version = 1
date = 2026-10-18
initiative = "resilience-statutaire-globale"
statut = "a-arbitrer"
selection_effectuee = false
regle = "La variante candidate sert au débat ; elle ne devient une règle qu’après compétence, preuve, relecture et décision."

