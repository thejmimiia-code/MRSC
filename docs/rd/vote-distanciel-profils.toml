# Profils non exécutables dérivés du relevé statutaire.
# Aucun nombre ci-dessous ne doit être injecté dans une urne avant relecture.
[meta]
version = 1
date = 2026-10-17
initiative = "vote-distanciel-verifiable"
source_regles = "docs/rd/vote-distanciel-regles.toml"
statut = "a-faire-relire"
regle = "Un profil sert à préparer une décision humaine ; il n'est ni une configuration ni une interprétation juridique."

[[profil]]
id = "bureau-executif"
