affirmation_fiche = "La fusion est un changement d'état d'une même substance avec conservation de la masse, tandis que la dissolution disperse un solide soluble dans l'eau."
ancres_attendues = ["glace", "fonte", "masse", "dissolution"]
ancres_reperees = ["glace", "fonte", "masse"]
ancres_absentes = ["dissolution"]
date_releve = 2026-10-20
etat_releve = "constat-couverture-partielle"
faux_positif_possible = "Le mot « eau » figure dans les deux documents Éduscol de la fiche : l'utiliser comme seule ancre donnerait un indice concordant trompeur sur un document qui ne parle pourtant pas de dissolution."
faux_negatif_possible = "Cas réel de faux négatif de périmètre observé le 20 octobre 2026 : l'ancre « dissolution » est absente du document 15199 parce que la fiche répartit son étayage entre deux sources complémentaires (le document 15199 pour la fusion et le document 95295 pour la dissolution)."
limite = "Un constat de couverture partielle sur une source isolée ne signale pas une erreur de la fiche : il rappelle qu'une affirmation composée peut reposer sur plusieurs sources distinctes du catalogue."

