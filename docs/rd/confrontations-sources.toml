# Prototype borné de confrontation d'affirmations aux pages sources déclarées.
#
# Ce fichier ne stocke aucun extrait sous droits et ne valide aucune fiche.
# Il associe à une affirmation courte de la fiche (rédigée par le projet) une
# liste d'ancres lexicales brèves (1 à 5 mots), consigne le résultat du relevé
# daté comme un simple indice ou constat, et documente pour chaque cas les faux
# positifs et les faux négatifs observés ou possibles.
#
# Tant que le taux d'erreur n'est pas mesuré sur un échantillon relu par une
# personne, ce dispositif reste hors de la porte de publication.

[meta]
version = 1
derniere_revue = 2026-10-20
source_catalogue = "docs/apprentissage/catalogue.toml"
regle = "Une confrontation produit un indice daté ou un constat, jamais une validation ni une conclusion automatique sur la vérité d'une fiche ; aucune ancre ne dépasse 5 mots."

[[confrontation]]
id = "meteo-climat-reference-30-ans"
fiche = "sciences-meteo-climat"
url_source = "https://meteofrance.com/meteo-a-z/quelle-difference-entre-meteo-et-climat"
affirmation_fiche = "La météo décrit le temps à un instant et un endroit donnés ; le climat repose sur des moyennes sur plusieurs décennies, avec une période de référence de 30 ans, et une vague de froid isolée ne suffit pas à infirmer la tendance climatique."
ancres_attendues = ["instant", "endroit", "moyenne", "décennies", "30 ans", "vague de froid"]
ancres_reperees = ["instant", "endroit", "moyenne", "décennies", "30 ans", "vague de froid"]
ancres_absentes = []
date_releve = 2026-10-20
etat_releve = "indice-concordant"
faux_positif_possible = "La présence simultanée de « 30 ans », « moyenne » et « vague de froid » dans la page ne prouve pas le sens de la relation : un texte qui contesterait la normale de 30 ans contiendrait exactement les mêmes ancres."
faux_negatif_possible = "Si Météo-France remplace « 30 ans » par « trente années » ou déplace ce repère dans un schéma illustré, l'ancre disparaît du texte brut alors que l'affirmation reste étayée."
limite = "Cet indice confirme uniquement que les six repères lexicaux figuraient dans la page ouverte le 20 octobre 2026 ; il ne vérifie ni la justesse pédagogique de la fiche ni l'absence de contresens."

[[confrontation]]
id = "vitesse-moyenne-quotient-unites"
fiche = "sciences-calculer-vitesse-moyenne"
url_source = "https://eduscol.education.fr/document/16837/download"
affirmation_fiche = "La vitesse moyenne relie la distance parcourue et la durée du parcours par une division, et s'exprime notamment en m/s ou en km/h."
ancres_attendues = ["vitesse", "distance", "durée", "m/s", "km/h", "400"]
ancres_reperees = ["vitesse", "distance", "durée", "m/s", "km/h", "400"]
ancres_absentes = []
date_releve = 2026-10-20
etat_releve = "indice-concordant"
faux_positif_possible = "Le même document Éduscol cite aussi la formule d'énergie « E = P × t » (grandeur produit) pour la opposer à la vitesse : repérer « distance » et « durée » dans le corps du texte ne prouve pas que la fiche utilise la bonne opération."
faux_negatif_possible = "Faux négatif observé le 20 octobre 2026 lors de l'extraction du PDF : dans l'équation mise en forme, le mot « durée » est découpé en « dur é e » et « distance parcourue » est collé en « distanceparcourue ». Chercher la formule exacte échoue sur le PDF alors qu'elle y figure."
limite = "L'indice porte sur des mots isolés présents dans le PDF du 20 octobre 2026 ; la coupure des formules mathématiques lors de l'extraction montre qu'une absence d'ancre dans un PDF ne permet jamais de conclure que la fiche est fausse."

[[confrontation]]
