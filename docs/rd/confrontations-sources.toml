etat_releve = "indice-concordant"
faux_positif_possible = "La même page de l'IMCCE présente aussi la notation algébrique des astronomes (Cassini, 1740) où l'an 1 avant J.-C. est appelé « année 0 » : la présence simultanée de « an 1 » et « année 0 » ne permet pas à un automate de savoir laquelle des deux conventions la fiche retient."
faux_negatif_possible = "La source de l'IMCCE écrit « XXème siècle » et « XXIème siècle » alors que la fiche M.R.S.C. typographie « XXe siècle » et « XXIe siècle » : une ancre portant sur « XXe siècle » échouerait sur cette variante orthographique."
