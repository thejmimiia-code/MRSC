etat_releve = "indice-concordant"
faux_positif_possible = "Dans le tableau de la ressource Éduscol, « 90° » apparaît trois fois : « de 0° à 90° » (angle aigu), « 90° » (angle droit) et « de 90° à 180° » (angle obtus). Une fiche qui écrirait par erreur qu'un angle obtus vaut 90° passerait quand même le test d'ancre."
