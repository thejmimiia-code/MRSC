affirmation_fiche = "Pour comparer le coût d'un crédit à la consommation, on distingue le taux débiteur, les frais compris dans le coût total du crédit et le taux annuel effectif global."
ancres_attendues = ["taux débiteur", "frais", "coût total du crédit", "taux annuel effectif global"]
ancres_reperees = ["taux débiteur", "frais", "coût total du crédit", "taux annuel effectif global"]
ancres_absentes = []
date_releve = 2026-10-20
etat_releve = "indice-concordant"
faux_positif_possible = "Faux positif observé sur cette même page le 20 octobre 2026 : la fiche F2451 contient les mots « améliore la situation financière ou le budget de l'emprunteur » et « substitut d'épargne » dans la liste de ce qu'il est interdit d'écrire dans une publicité. Un contrôle par mots-clés qui ignorerait la négation « Il est interdit » validerait à tort une affirmation illégale."
faux_negatif_possible = "Une mise à jour éditoriale de Service-Public.fr qui emploierait l'abréviation « TAEG » au lieu de la forme développée « taux annuel effectif global » ferait disparaître l'ancre sans changement du droit applicable."
limite = "Cet indice ne vaut ni validation juridique ni conseil financier : la présence des termes réglementaires dans la fiche F2451 ne prouve pas que l'exemple chiffré fictif de la fiche M.R.S.C. est exact."

[[confrontation]]
