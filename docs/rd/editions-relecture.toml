constat = "Le lot « déclarer » a modifié assets/css/site.css sans régénérer la version de cache du CSS de la page IA : l'étape CI « Vérifier la version du CSS de la page IA » et, par ricochet, le contrôle navigateur des graphismes, échouaient. La version est régénérée par l'outil propriétaire (f2d93d5a18ac421c, sha256 tronqué du fichier) et la page ia-societe.html la porte."
limite = "Cette signature couvre le réalignement d'une version de cache, pas une relecture nouvelle du contenu de la page : les phrases du bloc « déclarer » ont été signées séparément. Elle ne dit rien du rendu ni du cache réel d'un navigateur ; elle atteste seulement que le nom versionné correspond au fichier servi."

