constat = "Relecture de la consignation de publication du lot statutaire : la chaîne réellement suivie est écrite dans le journal — commit sur la branche de session, poussage sur origin, demande de fusion vers main, contrôles attendus, fusion, puis lecture de l’état du run de publication et du déploiement sur l’API du dépôt — et la suite de la 111e avancée est alignée sur cette chaîne au lieu d’attendre une demande séparée. Les avancées sont régénérées à 111 entrées, la mémoire ÉVA à 512 entrées, 324 nœuds et 734 arêtes, puis toutes deux vérifiées. Aucun fait externe : la règle de publication citée est la demande verbatim de la personne à 18 h 55 UTC et les compteurs viennent des outils reproductibles cités en mesures."
limite = "Cette signature atteste une lecture d’agent et des exécutions locales reproductibles, pas une validation humaine du texte ou du rendu, ni une expertise, ni un avis juridique, ni une interprétation des statuts, ni un essai avec des personnes. Elle ne certifie ni la fusion ni le déploiement : leur état réel est lu après coup sur l’API du dépôt et rapporté. Elle ne prouve pas que la nouvelle ouverture plaît à l’œil sur téléphone, clavier, zoom ou lecteur d’écran, ne couvre ni www.ign.fr/ (HTTP 403) ni aucune date ultérieure, ne promeut aucun statut et n’écrit aucun registre humain."

