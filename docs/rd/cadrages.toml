# Registre des cadrages personnalisés confrontés au navigateur.
#
# Tenu par `outils/cadrages.py --controler`, mesuré par
# `outils/mesurer-cadrages.cjs`, éprouvé par `outils/test_cadrages.py`.
#
# Le 2 novembre 2026, la promesse « la mise en page suit l'espace disponible »
# n'était vérifiée que dans **un** cadrage : présentation par défaut, trois
# tailles de texte. Le panneau de personnalisation en propose six présentations
# et cinq crans de 75 à 130 %, et `--content` comme les gouttières changent avec
# eux : une grille n'a pas la même place dans 940 px que dans 1 480.

[releve]
date = 2026-11-02
feuille = "assets/css/site.css"

# La tolérance est le plus petit écart qu'un navigateur puisse produire en
# arrondissant une longueur : un demi-pixel. Au-delà, le débordement est réel.
tolerance_px = 0.5

# Ce qui est confronté, à chaque combinaison : le débordement horizontal du
# document, et le nombre de colonnes de chaque grille déclarée dans
# `grilles-dynamiques.toml`. Une combinaison non mesurée est une erreur.

[[dimension]]
nom = "presentation"
valeurs = ["defaut", "vitrine", "panorama", "compacte", "mosaique", "lecture"]
raison = "Les six présentations du panneau. Elles réimposent des colonnes, changent `--content` (940 à 1 480 px) et parfois la base des panneaux `flex` : c'est le cadrage le plus large du site."

[[dimension]]
nom = "cran_de_texte"
valeurs = ["75", "85", "100", "115", "130"]
raison = "Les cinq crans réellement proposés par `site.js` (`textLevels`). Une gouttière en `rem` grandit avec le texte : le conteneur rétrécit quand on agrandit, et le nombre de colonnes change."

[[dimension]]
nom = "largeur"
valeurs = ["320", "390", "768", "1440"]
raison = "Quatre largeurs qui encadrent les seuils de la feuille : téléphone étroit, téléphone courant, tablette — de part et d'autre du seuil de 760 px et du changement de gouttière — et bureau."

[[dimension]]
nom = "page"
# Les treize pages publiées, lues sur le disque par `pages_publiees()` : la
# liste n'est pas recopiée à la main, et `test_cadrages.py` confronte ce bloc au
# disque. Jusqu'au 2 novembre 2026, quatre pages seulement étaient visitées ;
# neuf échappaient à tout cadrage, ce qui était écrit dans les limites — et une
# limite écrite n'est pas une couverture.
valeurs = [
  "404.html", "anglais-aventure.html", "apprendre.html", "confidentialite.html",
  "documents.html", "eva.html", "ia-societe.html", "index.html",
  "liens-utiles.html", "localisation.html", "nous-contacter.html",
  "simulateur.html", "transparence.html",
]
raison = "Toutes les pages publiées. Huit portent une grille déclarée et sont donc mesurées dans les six présentations ; cinq n'en portent aucune (`404`, `anglais-aventure`, `confidentialite`, `localisation`, `nous-contacter`) et sont mesurées dans la présentation par défaut seulement : une présentation n'a de cible nommée que là où une grille est déclarée, et la mesurer six fois coûterait cinq chargements de plus par cran et par largeur sans rien confronter."

[cout]
# Mesuré les 2 et 3 novembre 2026 sur le dépôt. Le 2, 480 combinaisons en 262 à
# 302 s. Le 3, 1 060 combinaisons — les 13 pages, contraste compris — en 405 s :
# les cinq pages sans grille déclarée ne coûtent qu'un état chacune et le temps
# par combinaison baisse, il ne dit donc rien de la qualité du contrôle.
mesure_locale_secondes = 408
combinaisons = 1060
note = """Une combinaison coûte un changement de largeur, pas un chargement : le
temps de chargement se compte en états (page, présentation, cran), pas en
combinaisons. Un banc qui annonce le coût de l'état précédent se trompe de
moitié, et c'est ce que `test_cadrages.py` refuse."""

[exemplaires]
# Un sélecteur peut nommer plusieurs grilles dans une page : `liens-utiles.html`
# en porte sept, `transparence.html` deux. Chaque exemplaire est relevé à part.
plafond = 12
note = """
Le plan annonce une **capacité** : combien de colonnes la place permet. Le
contrôle applique à chaque exemplaire le nombre de cartes réellement lu, et
nomme les deux nombres quand la piste déclarée n'est pas occupée. Au-delà du
plafond, le contrôle refuse le cadrage en disant combien d'exemplaires il n'a
pas inspectés : un plafond tu serait un accord de complaisance.
"""
ecart_du_3_novembre = """
Quatorze écarts faux ont été produits avant cette règle, sur `.link-grid` en
Compacte et `.principle-grid` en Panorama et Compacte : le relevé ne mesurait
que le premier exemplaire, alors que le registre déclare des listes de tailles
possibles (`items = [1, …, 7]`). La matrice statique (`modele-grilles.py
--presentations`) borne, elle, son calcul par le plus grand nombre de cartes
déclaré ; c'est un outil de conception, pas le contrôle, et les deux nombres
peuvent donc différer sans que l'un des deux mente — le contrôle, lui, lit le
nombre réel.
"""
[divergences_colonnes]
# Décision C1 du 4 novembre 2026 : elles restent comptées, jamais absorbées.
seuil_px = 1.0
resultat = "Quatre divergences au 3 novembre 2026, toutes sous le pixel : `.mission-grid` (0,78 px, annoncé 1, vu 2 à 743 px), `.home-share-panel` (0,60 px, annoncé 2, vu 1 à 615 px), `.hero-grid` (0,28 px), `.english-promo-panel` (0,20 px) — sur 722 points annoncés, 718 confirmés, 0 non mesuré."
decision = """**Tranchée le 4 novembre 2026 : comptées comme aujourd'hui (C1).** La personne responsable a choisi de ne rien absorber. Motif, écrit avec la décision : la tolérance de 0,5 px existe pour le **débordement**, où elle protège d'un arrondi de navigateur ; l'appliquer aussi au **nombre de colonnes** effacerait la seule trace d'un désaccord entre ce que la feuille promet et ce que la page fait — or c'est précisément ce que le contrôle est là pour voir. Une divergence absorbée ne se distingue plus d'une divergence absente. Elles restent donc nommées, chiffrées, et l'annotation de CI les imprime."""
limite = """Ce que cela coûte, dit franchement : quatre lignes de bruit dans chaque rapport, pour quatre écarts que personne ne voit à l'écran. Si la liste s'allonge — plus de quatre, ou des écarts qui se répètent sur les mêmes sélecteurs — la décision devra être revue : beaucoup de bruit finit par cacher un vrai écart. Le seuil de 1 px reste écrit ici comme borne de lecture, pas comme tolérance appliquée."""
condition_de_revision = """Plus de six divergences, ou une divergence qui dépasse 0,5 px sans atteindre 1 px : la décision C1 est réexaminée sur pièces, avec la liste et ses cadrages."""

[contraste]
# Ce que la mesure calcule, et ce que le contrôle exige.
seuil_petit_texte = 4.5
seuil_grand_texte = 3.0
grand_texte_px = 24.0
grand_texte_gras_px = 18.66
note = """
Le navigateur écrit le rapport de chaque texte qui descend sous 4,5:1 ; le seuil
applicable est décidé par `cadrages.py` (`seuil_de_contraste`), seul endroit où
il est écrit, et éprouvé sans navigateur par `test_cadrages.py`. Un texte
**décoratif** — `aria-hidden`, `role="presentation"` — est compté à part et
jamais jugé : un glyphe ornemental n'a pas à tenir un rapport de lecture, et
l'écarter est un choix explicite plutôt qu'un angle mort.
"""
angle_mort = """
Un fond en **image** — une photographie, un `url(...)` — n'est pas mesuré : la
méthode ne lit que des couleurs. Ces textes sont **comptés** dans le rapport,
jamais supposés bons. Un **dégradé**, en revanche, est une plage de couleurs que
le navigateur rend exactement : ses arrêts sont relevés, et le pire contraste de
la plage est calculé puis comparé au seuil. Les états de survol, de focus et les
éléments révélés par script ne sont pas mesurés non plus : le relevé voit l'état
affiché, pas tous les états.
"""
note_degrade = """
Un dégradé n'est pas une couleur mais une étendue. Le navigateur rend les arrêts
de chaque couche ; `cadrages.py` projette la boîte du texte sur l'axe du dégradé
et n'échantillonne que la **portion réellement sous le texte** (neuf points
régulièrement espacés, plus chaque arrêt qui tombe dans cette portion). Les
couches sont composées dans l'ordre, arrêts transparents compris, sur le fond
opaque le plus proche, et le **pire** rapport est retenu. La remontée s'arrête au
premier fond **opaque** : un bouton plein sur un bandeau dégradé ne laisse pas
voir le bandeau, et continuer faisait accuser 24 boutons d'un contraste de
1,06:1 contre une couleur qu'ils recouvrent.

Deux fautes ont été corrigées le 3 novembre 2026, avant que le chiffre soit
publié. La première : la découpe des couches se faisait sur une expression
régulière, et la virgule entre deux **arrêts** d'un même dégradé ressemble à
celle entre deux **couches** — chaque arrêt devenait un calque, et la plage
calculée portait sur des aplats qui n'existent nulle part. La découpe se fait
maintenant sur la profondeur des parenthèses. La seconde : retenir le pire point
de l'étendue entière est un majorant ; la géométrie le resserre, et sur les
17 500 textes concernés 16 515 verdicts deviennent plus permissifs, aucun plus
sévère.

Ce qu'il ne sait pas : une image, un `conic-gradient`, un `repeating-*`, une
`color-mix()` — ceux-là sont comptés et nommés, jamais supposés conformes. Un
dégradé radial n'est situé que si son centre est écrit en pourcentage et son
rayon en pixels ; sinon la zone vaut la plage entière, ce qui est un majorant et
non un silence. L'interpolation suivie est celle de sRGB. La boîte du dégradé est
prise au `border-box` : une bordure épaisse décalerait l'axe de quelques pixels.
"""
resultat_degrade = """Relevé du 3 novembre 2026, sur les 1 060 combinaisons : **17 500 textes** posés sur un dégradé, jugés un par un contre la portion de plage qui les couvre. Le relevé compte aussi **385 810 textes** sur fond uni, 3 460 décoratifs écartés et 4 240 textes volontairement masqués ; aucun texte sur fond d'image, car le site n'en pose aucun derrière du texte. Le pire rapport mesuré sur un dégradé est **4,782:1** ; aucun texte n'est sous son seuil. Avec l'ancienne valeur du jeton `--muted` (`#647086`), le même relevé refuserait **732 textes** répartis sur **cinq** sélecteurs (le pire : `p.page-lead`, à **4,444:1**) — le jeton est donc bien la cause, et c'est en le mesurant qu'on l'a su, pas en le supposant."""
decision_humaine_du_4_novembre = """
Tranchée le 4 novembre 2026 par la personne responsable, sur pièce visuelle et
non sur un tableau : « de ce que je vois, c'est bon ». La planche
`Planche-1-jeton-muted-avant-apres.png` (Drive de passation, dossier 46, fichier
`14xeIsVfZmMR1bk54Q-cROHHGdft3SRdU`) montre le même paragraphe du site sur les
quatre fonds réellement posés derrière du texte secondaire — crème
`#f8f1df`, bleu pâle `rgb(237, 242, 250)`, vert pâle `#eff5e9`, blanc — avec,
pour chacun, l’ancienne et la nouvelle valeur. Les rapports y sont ceux du
calcul, pas d’une capture : 4,434 → 4,771 · 4,444 → 4,782 · 4,498 → 4,840 ·
4,996 → 5,375. La teinte est conservée (même angle de gris-bleu, clarté −4 %) :
la planche ne sert pas à choisir une couleur, elle sert à vérifier qu’un
assombrissement de 4 % ne change pas la lecture du site. Ce qu’elle ne prouve
pas : l’accord porte sur une **reconstitution mesurée**, pas sur une capture du
navigateur, et aucune personne extérieure n’a relu la page. La planche est
refaite à l’identique par `outils/planches-rd.py` (fichiers identiques au
bit près, vérifié par empreinte MD5 le 4 novembre 2026).
"""
[glyphe_decoratif]
# Décision B1 du 4 novembre 2026 : le glyphe reste tel quel.
selecteur = "span.adventure-map-mark"
feuille = "assets/css/anglais-aventure.css"
valeur = "#d29236"
rapport_sur_blanc = 2.66
declaration = "aria-hidden=\"true\" — décoratif déclaré, jamais jugé comme du texte"
decision = """**Tranchée le 4 novembre 2026 : assumé tel quel (B1).** La personne responsable a choisi de ne pas foncer le glyphe. Motif, écrit avec la décision : le glyphe est une **étoile d'ornement** dans l'en-tête de « Tes destinations » — il ne porte aucune information, le titre voisin dit tout, et il est déclaré `aria-hidden`. WCAG 2.2 AA n'exige un rapport de 3:1 pour un élément non textuel que s'il est **nécessaire à la compréhension** (1.4.11) ; un ornement purement décoratif en est exclu, et le contrôle le compte déjà comme décoratif par `--ecartes`. Les alternatives chiffrées sur la planche 3 — 3,06:1 à `#b57c26`, 4,20:1 à `#a8701f`, 4,99:1 à `#9a6415`, 6,68:1 à `#835100` — auraient toutes éteint l'or du jeu au profit d'un brun administratif, pour un élément qui ne se lit pas."""
limite = """Ce que la décision ne règle pas, et qui reste à surveiller : si le glyphe venait à porter un sens — un état, une progression, une action — il tomberait sous 1.4.11 à 3:1 et la décision serait caduque. Rien dans le HTML ne le dit : le contrôle le compte comme décoratif parce qu'il est `aria-hidden`, pas parce qu'on a vérifié qu'il ne signifie rien. Un futur lot qui le rendrait signifiant doit relire cette entrée."""
condition_de_revision = """Le jour où `span.adventure-map-mark` n'est plus `aria-hidden`, ou reçoit un `title`, un état, ou une interaction : la décision B1 est révisée d'office, et le glyphe passe au seuil 3:1."""

[focus]
# Le focus au clavier se mesure comme le texte : même navigateur, même méthode,
# seuil différent. Ce n'est pas un cadrage — la largeur ne change pas l'anneau —
# mais deux largeurs sont visitées pour ne pas le supposer.
outil = "python3 outils/focus.py --plan PLAN puis node outils/mesurer-focus.cjs PLAN RAPPORT puis python3 outils/focus.py --controler PLAN RAPPORT"
seuil = 3.0
critere = "WCAG 2.2 AA, 1.4.11 — contraste des éléments non textuels ; 2.4.7 pour un élément dont rien ne change au focus."
largeurs_px = [390, 1440]
resultat = "26 relevés (13 pages × 2 largeurs, 500 éléments au plus par relevé — la page entière), 2 621 éléments portés au focus, 2 497 indicateurs jugés, 0 sous le seuil, 0 sans indicateur, 124 sur fond d'image comptés à part, 0 relevé arrêté au plafond. Coût : 38 s."
trouvaille = "Premier passage : 40 liens sous le seuil, tous sur `.creator-note`, où le bleu du site sur le marine donne 1,76:1. Corrigé par le jeton `--focus-ring`, clair sur les cinq surfaces sombres, plutôt que par un `outline-color` répété par composant."
angle_mort = """
Deux largeurs seulement, et la traversée s'arrête au premier élément déjà vu :
le rapport dit si elle a buté sur le plafond (jamais ici), pas ce qu'elle n'a pas
atteint. Les états de survol et de focus programmatique ne sont pas mesurés, ni
le focus dans une iframe, ni un élément posé sur une image (124 comptés). Un
indicateur peut être conforme à 3:1 et rester peu visible sur un écran de
téléphone en plein soleil : la mesure donne un chiffre, pas une impression.
"""

[rangees]
