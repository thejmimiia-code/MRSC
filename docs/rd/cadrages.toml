decision = """**Tranchée le 4 novembre 2026 : carte seule assumée, motif écrit (A2).** La personne responsable a choisi, sur la planche 3, de garder les grilles telles quelles et d'écrire le motif de chaque vide plutôt que de changer un nombre de colonnes. Conséquence de méthode : un vide qui n'a pas de motif écrit est désormais **nommé comme tel** par `--orphelins` (« SANS MOTIF ÉCRIT »), et non compté comme assumé. Un vide assumé sans motif serait une dérogation en blanc. Toute correction qui ajouterait un palier de largeur resterait un raccommodage, refusé depuis le 30 octobre 2026 : le motif explique le dessin, il ne rachète pas une cascade."""

