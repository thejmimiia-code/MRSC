# Registre des cadrages personnalisés confrontés au navigateur.
#
# Tenu par `outils/cadrages.py --controler`, mesuré par
# `outils/mesurer-cadrages.cjs`, éprouvé par `outils/test_cadrages.py`.
#
# Le 2 novembre 2026, la promesse « la mise en page suit l'espace disponible »
# n'était vérifiée que dans **un** cadrage : présentation par défaut, trois
# tailles de texte. Le panneau de personnalisation en propose six présentations
# et cinq crans de 75 à 130 %, et `--content` comme les gouttières changent avec
# eux : une grille n'a pas la même place dans 940 px que dans 1 480.

[releve]
date = 2026-11-02
feuille = "assets/css/site.css"

# La tolérance est le plus petit écart qu'un navigateur puisse produire en
# arrondissant une longueur : un demi-pixel. Au-delà, le débordement est réel.
tolerance_px = 0.5

# Ce qui est confronté, à chaque combinaison : le débordement horizontal du
# document, et le nombre de colonnes de chaque grille déclarée dans
# `grilles-dynamiques.toml`. Une combinaison non mesurée est une erreur.

[[dimension]]
nom = "presentation"
valeurs = ["defaut", "vitrine", "panorama", "compacte", "mosaique", "lecture"]
raison = "Les six présentations du panneau. Elles réimposent des colonnes, changent `--content` (940 à 1 480 px) et parfois la base des panneaux `flex` : c'est le cadrage le plus large du site."

[[dimension]]
nom = "cran_de_texte"
valeurs = ["75", "85", "100", "115", "130"]
raison = "Les cinq crans réellement proposés par `site.js` (`textLevels`). Une gouttière en `rem` grandit avec le texte : le conteneur rétrécit quand on agrandit, et le nombre de colonnes change."

[[dimension]]
nom = "largeur"
valeurs = ["320", "390", "768", "1440"]
raison = "Quatre largeurs qui encadrent les seuils de la feuille : téléphone étroit, téléphone courant, tablette — de part et d'autre du seuil de 760 px et du changement de gouttière — et bureau."

[[dimension]]
nom = "page"
# Les treize pages publiées, lues sur le disque par `pages_publiees()` : la
# liste n'est pas recopiée à la main, et `test_cadrages.py` confronte ce bloc au
# disque. Jusqu'au 2 novembre 2026, quatre pages seulement étaient visitées ;
# neuf échappaient à tout cadrage, ce qui était écrit dans les limites — et une
# limite écrite n'est pas une couverture.
valeurs = [
  "404.html", "anglais-aventure.html", "apprendre.html", "confidentialite.html",
  "documents.html", "eva.html", "ia-societe.html", "index.html",
  "liens-utiles.html", "localisation.html", "nous-contacter.html",
  "simulateur.html", "transparence.html",
]
raison = "Toutes les pages publiées. Huit portent une grille déclarée et sont donc mesurées dans les six présentations ; cinq n'en portent aucune (`404`, `anglais-aventure`, `confidentialite`, `localisation`, `nous-contacter`) et sont mesurées dans la présentation par défaut seulement : une présentation n'a de cible nommée que là où une grille est déclarée, et la mesurer six fois coûterait cinq chargements de plus par cran et par largeur sans rien confronter."

[cout]
# Mesuré les 2 et 3 novembre 2026 sur le dépôt. Le 2, 480 combinaisons en 262 à
# 302 s. Le 3, 1 060 combinaisons — les 13 pages, contraste compris — en 405 s :
# les cinq pages sans grille déclarée ne coûtent qu'un état chacune et le temps
# par combinaison baisse, il ne dit donc rien de la qualité du contrôle.
mesure_locale_secondes = 408
combinaisons = 1060
note = """Une combinaison coûte un changement de largeur, pas un chargement : le
temps de chargement se compte en états (page, présentation, cran), pas en
combinaisons. Un banc qui annonce le coût de l'état précédent se trompe de
moitié, et c'est ce que `test_cadrages.py` refuse."""

[exemplaires]
# Un sélecteur peut nommer plusieurs grilles dans une page : `liens-utiles.html`
# en porte sept, `transparence.html` deux. Chaque exemplaire est relevé à part.
plafond = 12
note = """
Le plan annonce une **capacité** : combien de colonnes la place permet. Le
contrôle applique à chaque exemplaire le nombre de cartes réellement lu, et
nomme les deux nombres quand la piste déclarée n'est pas occupée. Au-delà du
plafond, le contrôle refuse le cadrage en disant combien d'exemplaires il n'a
pas inspectés : un plafond tu serait un accord de complaisance.
"""
ecart_du_3_novembre = """
Quatorze écarts faux ont été produits avant cette règle, sur `.link-grid` en
Compacte et `.principle-grid` en Panorama et Compacte : le relevé ne mesurait
que le premier exemplaire, alors que le registre déclare des listes de tailles
possibles (`items = [1, …, 7]`). La matrice statique (`modele-grilles.py
--presentations`) borne, elle, son calcul par le plus grand nombre de cartes
déclaré ; c'est un outil de conception, pas le contrôle, et les deux nombres
peuvent donc différer sans que l'un des deux mente — le contrôle, lui, lit le
nombre réel.
"""

[contraste]
# Ce que la mesure calcule, et ce que le contrôle exige.
seuil_petit_texte = 4.5
seuil_grand_texte = 3.0
grand_texte_px = 24.0
grand_texte_gras_px = 18.66
note = """
Le navigateur écrit le rapport de chaque texte qui descend sous 4,5:1 ; le seuil
applicable est décidé par `cadrages.py` (`seuil_de_contraste`), seul endroit où
il est écrit, et éprouvé sans navigateur par `test_cadrages.py`. Un texte
**décoratif** — `aria-hidden`, `role="presentation"` — est compté à part et
jamais jugé : un glyphe ornemental n'a pas à tenir un rapport de lecture, et
l'écarter est un choix explicite plutôt qu'un angle mort.
"""
angle_mort = """
Un fond en **image** — une photographie, un `url(...)` — n'est pas mesuré : la
méthode ne lit que des couleurs. Ces textes sont **comptés** dans le rapport,
jamais supposés bons. Un **dégradé**, en revanche, est une plage de couleurs que
le navigateur rend exactement : ses arrêts sont relevés, et le pire contraste de
la plage est calculé puis comparé au seuil. Les états de survol, de focus et les
éléments révélés par script ne sont pas mesurés non plus : le relevé voit l'état
affiché, pas tous les états.
"""
note_degrade = """
Un dégradé n'est pas une couleur mais une étendue. Le navigateur rend les arrêts
de chaque couche ; `cadrages.py` échantillonne l'interpolation en neuf points par
paire d'arrêts, compose les couches (arrêts transparents compris) et compose sur
le fond opaque le plus proche. Il retient le **pire** rapport. La remontée
s'arrête au premier fond **opaque** : un bouton plein sur un bandeau dégradé ne
laisse pas voir le bandeau, et continuer faisait accuser 24 boutons d'un
contraste de 1,06:1 contre une couleur qu'ils recouvrent. Ce qu'il ne sait pas :
une image, un `conic-gradient`, un `repeating-*`, une `color-mix()` — ceux-là
sont comptés et nommés, jamais supposés conformes.
"""

[focus]
# Le focus au clavier se mesure comme le texte : même navigateur, même méthode,
# seuil différent. Ce n'est pas un cadrage — la largeur ne change pas l'anneau —
# mais deux largeurs sont visitées pour ne pas le supposer.
outil = "python3 outils/focus.py --plan PLAN puis node outils/mesurer-focus.cjs PLAN RAPPORT puis python3 outils/focus.py --controler PLAN RAPPORT"
seuil = 3.0
critere = "WCAG 2.2 AA, 1.4.11 — contraste des éléments non textuels ; 2.4.7 pour un élément dont rien ne change au focus."
largeurs_px = [390, 1440]
resultat = "26 relevés (13 pages × 2 largeurs, 500 éléments au plus par relevé — la page entière), 2 621 éléments portés au focus, 2 497 indicateurs jugés, 0 sous le seuil, 0 sans indicateur, 124 sur fond d'image comptés à part, 0 relevé arrêté au plafond. Coût : 38 s."
trouvaille = "Premier passage : 40 liens sous le seuil, tous sur `.creator-note`, où le bleu du site sur le marine donne 1,76:1. Corrigé par le jeton `--focus-ring`, clair sur les cinq surfaces sombres, plutôt que par un `outline-color` répété par composant."
angle_mort = """
Deux largeurs seulement, et la traversée s'arrête au premier élément déjà vu :
le rapport dit si elle a buté sur le plafond (jamais ici), pas ce qu'elle n'a pas
atteint. Les états de survol et de focus programmatique ne sont pas mesurés, ni
le focus dans une iframe, ni un élément posé sur une image (124 comptés). Un
indicateur peut être conforme à 3:1 et rester peu visible sur un écran de
téléphone en plein soleil : la mesure donne un chiffre, pas une impression.
"""

[rangees]
# `--orphelins` nomme les grilles dont la dernière rangée laisse un vide visible.
# Il ne refuse rien : une rangée incomplète est parfois le dessin voulu, et le
# 2 novembre 2026 la décision chiffrée revient à une personne, pas au modèle.
outil = "python3 outils/cadrages.py --orphelins PLAN RAPPORT"
definition = "Une grille laisse un vide quand ce que sa dernière rangée occupe, gouttières déduites, laisse plus de 0,5 px libres sur la largeur utile — seuil identique à celui du débordement, pour la même raison : c'est le plus petit écart qu'un navigateur puisse produire en arrondissant une longueur."
seuil_px = 0.5
resultat = "16 couples page/grille laissent un vide dans au moins un cadrage. Le pire : `apprendre.html · .learning-catalogue-grid`, 35 cadrages, 1 176,50 px libres en « Compacte » à 75 % sur 1 440 px (une carte sur six colonnes). Puis `ia-societe.html · .ai-fraud-lesson-list` et `liens-utiles.html · .link-grid`, 35 cadrages, 1 048,19 px chacun. Huit grilles partagent le même cas à trois colonnes en « Vitrine » à 115 % : 15 cadrages, 850,67 px libres. Le nombre est passé de 13 à 16 le 3 novembre 2026, quand le contrôle a cessé de ne visiter que quatre pages."
decision = "Non tranchée. Les nombres sont publiés, l'annotation de CI les imprime à chaque passage ; toute correction qui ajouterait un palier de largeur serait un raccommodage, refusé depuis le 30 octobre 2026."

[limites]
texte = """
Le relevé mesure quatre choses, et elles seules : le débordement **horizontal**,
le nombre de colonnes de chaque grille déclarée, les **mots coupés** par une zone
de découpe et les **cartes qui se recouvrent** entre enfants directs d'une
grille déclarée.

Il ne dit rien de la hauteur totale de la page, du contraste, ni de la
lisibilité d'une carte étroite — une carte peut rester lisible à 300 px et
devenir illisible à 260. Une superposition entre deux sections, ou avec un
élément en position fixe, lui échappe, faute d'être un couple d'enfants de
grille. Il ne voit que l'état visible au moment du relevé : un mot coupé qui
n'apparaît qu'au survol ou dans un panneau ouvert n'est pas vu. Enfin, les
présentations sont mesurées sur les pages qui portent les grilles déclarées :
une page sans grille déclarée n'est pas visitée, et un défaut qui n'affecterait
qu'elle échapperait au contrôle.
"""
