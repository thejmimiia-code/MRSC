# Sources de la carte des coûts, vérifiées une par une.
#
# Chaque entrée dit qui publie, sous quelle licence, à quelle maille, ce que le
# site en tire, et ce qu'elle ne permet pas de dire. Chaque URL citée ici est enregistrée
# comme source primaire dans `docs/rd/relecture-contenus.toml`, avec son extrait daté dans
# `docs/rd/sources-primaires/` : c'est cette lecture-là qui fait foi, et c'est elle que
# `outils/relire-contenus.py` vérifie à chaque édition.
#
# Aucune de ces lignes n'est une validation : ce sont des lectures datées.

[meta]
version = 1
date = 2026-11-13
auteur = "agent"
regle = "Une source n'entre ici qu'après lecture de sa fiche ou de sa réponse ; une source qui ne répond pas reste en dette, elle n'est pas inventée."

[[source]]
id = "ign-admin-express-departements"
organisme = "IGN"
titre = "ADMINEXPRESS-COG-CARTO.LATEST:departement (WFS)"
url = "https://www.data.gouv.fr/datasets/admin-express-admin-express-cog-admin-express-cog-carto-admin-express-cog-carto-pe-admin-express-cog-carto-plus-pe"
licence = "Licence Ouverte 2.0"
consultee_le = 2026-11-13
maille = "departement"
champs = ["geometrie", "code_insee", "nom_officiel"]
apporte = "Contours des 96 départements de métropole pour le fond de carte."
ne_dit_pas = "Rien des communes : les contours communaux de 2018 sont périmés depuis les fusions, et 34 000 polygones ne tiennent pas dans une page."
statut = "verifiee"
verification = "Couche interrogée en WFS le 13 novembre 2026 sur le géoservice de l’État (data.geopf.fr, requête GetFeature sur ADMINEXPRESS-COG-CARTO.LATEST:departement) : elle existe, répond en GeoJSON, et refuse une propriété absente en nommant les propriétés valides. La fiche de licence et de producteur retenue est celle du jeu ADMIN EXPRESS sur data.gouv.fr, enregistrée dans `docs/rd/relecture-contenus.toml` (source `data-gouv-admin-express`)."

