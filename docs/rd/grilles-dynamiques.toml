# — Dernière grille égale sous palier, 31 octobre 2026 : `.ai-path-steps` passe
# de cinq colonnes fixes à une largeur de piste. La cascade imposait
# `repeat(3, …)` sous 520 px et recentrait la dernière étape par
# `li:last-child { grid-column: 2 }` ; les deux règles disparaissent ensemble.
[[grille]]
selecteur = ".ai-path-steps"
colonnes = 5
minimum = 220
items = [5]
raison = "Cinq étapes du parcours de la page IA : le plus large minimum qui garde cinq colonnes au conteneur maximal. Sous 520 px, l'ancienne cascade repliait à trois colonnes — un chiffre choisi, qui laissait des cartes de 59 px à 240 px de fenêtre ; la largeur de piste les remplace par un repli progressif."

# — Grilles **fixes à dessein**, 31 octobre 2026. Le registre des grilles
# dynamiques disait quoi convertir ; il ne disait pas ce qui doit rester fixe.
# Les aperçus de présentation dessinent chacun une mise en page : leur forme
# 3 × 2 **est** l'information, et une largeur de piste la détruirait. Sans cette
# section, `--regle` leur proposait une conversion, et rien n'aurait signalé
# qu'un aperçu cessait de montrer ce qu'il annonce.
[[grille_fixe]]
selecteur = ".layout-choice-preview[data-preview=\"lecture\"]"
colonnes = 1
raison = "Aperçu schématique de la présentation « Lecture » : une colonne, comme la présentation qu'il annonce."

[[grille_fixe]]
selecteur = ".layout-choice-preview[data-preview=\"vitrine\"]"
colonnes = 1
raison = "Aperçu schématique de la présentation « Vitrine » : une colonne de blocs larges."

[[grille_fixe]]
selecteur = ".layout-choice-preview[data-preview=\"mosaique\"]"
colonnes = 3
raison = "Aperçu schématique de la présentation « Mosaïque » : trois colonnes sur deux rangées, c'est le dessin qui porte l'information."

[[grille_fixe]]
selecteur = ".layout-choice-preview[data-preview=\"panorama\"]"
colonnes = 3
raison = "Aperçu schématique de la présentation « Panorama » : trois colonnes, deux rangées."

[[grille_fixe]]
selecteur = ".layout-choice-preview[data-preview=\"compacte\"]"
colonnes = 3
raison = "Aperçu schématique de la présentation « Compacte » : trois colonnes serrées, écart et remplissage réduits."

# — Grilles à pistes inégales converties en `flex-wrap`, 31 octobre 2026. Une
# largeur de piste (`auto-fit`) ne sait pas produire deux colonnes de largeurs
# différentes ; `flex-wrap` le sait, et se replie quand les planchers déclarés ne
# tiennent plus, sans aucune largeur d'écran. Le registre garde la valeur
# **d'avant** (`grille_avant`) pour que le contrôle recalcule l'écart au lieu de
# croire le nombre écrit, et le nom des présentations qui la repliaient.
[[grille_flex]]
selecteur = ".ai-hero-grid"
grille_avant = "minmax(0, 1.05fr) minmax(330px, .95fr)"
gap_avant = "clamp(2rem, 5vw, 4.5rem)"
ecart_max_px = 16.5
ecart_part = 0.049
presentation_repliee = ["lecture"]
raison = "Bandeau de la page IA : texte et constellation. Deux largeurs sur 233 changeaient de nombre de colonnes après conversion ; une colonne peut varier de 16,5 px (4,9 %) au plus, à cause du partage du seul surplus. Le palier de 760 px et la surcharge d'écart qui l'accompagnait disparaissent."

[[grille_flex]]
selecteur = ".english-promo-panel"
grille_avant = "minmax(0, 1.05fr) minmax(280px, .95fr)"
gap_avant = "clamp(1.2rem, 4vw, 3rem)"
ecart_max_px = 14
ecart_part = 0.05
presentation_repliee = ["lecture"]
raison = "Encart « aventure anglaise » de la page Apprendre : texte et illustration. Treize largeurs sur 233 changent de nombre de colonnes après conversion ; une colonne peut varier de 14 px (5 %) au plus. Le palier de 760 px et le `justify-items` du palier de 761 px, qui n'ont plus d'objet en flex, disparaissent."

[[grille_flex]]
selecteur = ".ai-path-panel"
grille_avant = "minmax(0, .9fr) minmax(320px, 1.1fr)"
gap_avant = "2rem"
ecart_max_px = 32
ecart_part = 0.111
presentation_repliee = ["lecture"]
raison = "Panneau « Comprendre. Débattre. Décider. » de la page IA : méthode à gauche, cinq étapes à droite. Le palier de 1 000 px ne portait que cette grille et disparaît en entier (37 blocs, 191 règles). Coût mesuré, et c'est la première fois qu'on le lit en plage : de 720 à 1 000 px de fenêtre, une colonne devient deux ; ailleurs rien. Une colonne peut varier de 32 px (7,6 %) au plus."

[[grille_flex]]
selecteur = ".home-share-panel"
grille_avant = "minmax(0,1fr) minmax(260px,.8fr)"
gap_avant = "1.5rem"
ecart_max_px = 28.9
ecart_part = 0.111
presentation_repliee = ["lecture"]
raison = "Panneau « Partager le site » de l'accueil : texte à gauche, boutons de partage à droite. Entre 600 et 760 px de fenêtre, deux colonnes de 264 px apparaissent là où le palier de 760 px en imposait une — c'est la grille qui demande 260 px par colonne, et le palier le lui refusait. Une colonne peut varier de 29 px (11 %) au plus sur l'ensemble du balayage."

[[grille_flex]]
selecteur = ".hero-grid"
grille_avant = "minmax(0, 1.15fr) minmax(280px, .75fr)"
gap_avant = "clamp(2.5rem, 8vw, 7rem)"
plancher_expr = "20.37em"
plancher_px = 325.92
repli_avant_px = 760
ecart_max_px = 68.6
ecart_part = 0.243
presentation_repliee = ["lecture"]
raison = "Ouverture de l'accueil : texte à gauche, carte de repères à droite. Première base écrite en em : elle suit la taille du texte, donc le repli avance tout seul à 115 % et 130 %, ce qu'aucune condition de largeur d'écran ne fait. La base écrite est 20.37em (325,92 px), pas 20.4em : les bases qui replient à 760 px forment une fenêtre étroite — ]325,60 ; 326,06] px, soit 0,46 px de large — et 20.4em (326,40 px) tombe juste au-dessus, ce qui laissait une bande d'un seul pixel à 761 px. Le nombre de colonnes ne change donc à aucune largeur, vérifié au pixel et non au pas de 10 px, au prix d'un écart de largeur de colonne plus grand (68,6 px, 24,3 % au lieu de 58,9 px, 20,9 %). Deux règles de palier qui forçaient une colonne disparaissent, dont celle de .home-hero-civic .hero-grid."

[[grille_flex]]
selecteur = ".mission-grid"
grille_avant = "minmax(0, 1.35fr) minmax(260px, .65fr)"
gap_avant = "clamp(2rem, 6vw, 5rem)"
plancher_expr = "20.85em"
plancher_px = 333.6
repli_avant_px = 760
ecart_max_px = 116.8
ecart_part = 0.447
presentation_repliee = ["lecture"]
raison = "Bloc ÉVA de l'accueil : texte long à gauche, carte des valeurs à droite. Base en em (20.85em), la plus petite qui reproduit le repli d'avant (333,48 px) : aucune largeur ne change de nombre de colonnes. Le rapport 1,35 / 0,65 est le plus dissymétrique converti jusqu'ici, d'où un coût de 116,8 px (44,7 %) sur la largeur de colonne — c'est le prix du partage du seul surplus par flex, contre le partage de tout l'espace par fr."

[[grille_flex]]
selecteur = ".learning-work-panel"
grille_avant = "minmax(0,1.2fr) minmax(280px,.8fr)"
gap_avant = "2rem"
plancher_expr = "21.28em"
plancher_px = 340.48
repli_avant_px = 760
ecart_max_px = 68.1
ecart_part = 0.243
presentation_repliee = ["lecture"]
raison = "Panneau « Le quotidien et le travail sont aussi des lieux d'apprentissage » de la page Apprendre : texte à gauche, trois étapes à droite. Base en em 21.28em (340,48 px) : la fenêtre des bases qui replient à 760 px va de 340,00 à 340,50 px, et 21.29em (340,64 px) en sortait de 0,14 px — une bande d'un pixel à 761 px, invisible au pas de 10 px du relevé. Vérifié au pixel, aucune largeur ne change de nombre de colonnes. Coût mesuré : 68,1 px (24,3 %)."

[[grille_flex]]
selecteur = ".ai-questions-layout"
grille_avant = "minmax(260px, .7fr) minmax(0, 1.3fr)"
gap_avant = "clamp(2rem, 6vw, 5rem)"
plancher_expr = "20.85em"
plancher_px = 333.6
repli_avant_px = 760
ecart_max_px = 100
ecart_part = 0.383
presentation_repliee = ["lecture"]
raison = "Boussole « Cinq questions avant de dire oui — ou non » de la page IA : introduction à gauche, liste des questions à droite. Base en em (20.85em = 333,6 px), la plus petite qui reproduit le repli d'avant (333,48 px) : aucune largeur ne change de nombre de colonnes. Coût élevé, 100 px (38,3 %), pour la même raison que .mission-grid : le rapport 0,7 / 1,3 est très dissymétrique et flex ne partage que le surplus."

[[grille_flex]]
selecteur = ".learning-hero-grid"
grille_avant = "minmax(0,1.15fr) minmax(270px,.85fr)"
gap_avant = "clamp(1.5rem,5vw,4rem)"
plancher_expr = "21.09em"
plancher_px = 337.44
repli_avant_px = 760
ecart_max_px = 50.6
ecart_part = 0.174
presentation_repliee = ["lecture"]
raison = "Ouverture de la page Apprendre : texte et principes. Base en em (21.09em = 337,4 px), la plus petite qui reproduit le repli d'avant : aucune largeur ne change de nombre de colonnes. Coût mesuré : 50,6 px (17,4 %)."

[[grille_flex]]
selecteur = ".participation-grid"
grille_avant = "minmax(0, 1.1fr) minmax(280px, .9fr)"
gap_avant = "2rem"
plancher_expr = "21.28em"
plancher_px = 340.48
repli_avant_px = 760
ecart_max_px = 34.0
ecart_part = 0.11
presentation_repliee = ["lecture"]
raison = "Bloc de participation de l'accueil : citation et carte « Comment participer ? ». Grille RETENUE le matin du 31 octobre — 640–760 px de plage, 28 px (9 %) d'écart — puis convertie l'après-midi : la base de compromis (340,48 px, écrite 21.28em — et non 21.29em, qui sort de la fenêtre de 0,46 px en rouvrant une bande d'un pixel) reproduit exactement le repli d'avant, donc la plage disparaît. Le coût passe de 28 px (9 %) à 34,0 px (11 %) : un demi-point de proportion payé pour un nombre de colonnes constant, et une base qui suit désormais la taille du texte."

# — Refus écrits du 1er novembre 2026 -----------------------------------------
# Le relevé `--pistes` classait six grilles « borne » — le mot d'un plafond.
# Cinq n'en avaient aucun : `2.75rem 1fr`, `2.375rem minmax(0,1fr)`,
# `1.25rem 3.375rem minmax(0,1fr)`, `2.4rem 1fr`, `1.125rem 2.5rem minmax(0,1fr)`.
# Ce sont des colonnes de numéro ou d'icône, sans aucun palier : elles ne se
# replient jamais, il n'y a rien à rendre dynamique. Leur seul défaut était
# l'unité — quatre d'entre elles étaient en pixels nus, donc insensibles au
# réglage de taille de texte ; elles sont passées en `rem`, à longueur égale à
# 100 %. Le relevé les nomme désormais `badge`, et `--verifier` refuse toute
# piste écrite en pixels nus dans les feuilles qui sont de nous.
#
# Il reste un vrai plafond, et il est écrit ici pour qu'on ne le reconvertisse
# pas sans le relire.
[[grille_plafond]]
selecteur = ".learning-article-layout"
valeur = "minmax(0,1fr) minmax(230px,300px)"
raison = "Article de leçon et rail latéral. Mesure du 1er novembre 2026 : sur les 180 largeurs où la grille a deux colonnes, la piste plafonnée vaut exactement 300 px — la borne basse de 230 px n'est jamais atteinte, la cascade ne la sert pas. Le refus ne porte donc pas sur la borne, mais sur la seconde conséquence du plafond : sous 760 px, la grille met ce panneau sur une seule piste `minmax(0,1fr)` et il prend toute la largeur ; un `flex` de base 300 px ne saurait pas faire cela, parce que `flex-grow` ne peut pas dépendre du repli. Convertir demanderait un second comportement, pas une base."

# — Septième vague, 1er novembre 2026 : `.simulateur-intro` --------------------
# Le relevé la classait « contenu » avec les vraies pistes `auto`, mais rien n'y
# dépend du texte : `minmax(0,1.35fr) minmax(0,1fr)` n'a simplement aucun
# plancher. Le repli venait du palier de 1 000 px, et une base choisie le
# remplace. La fenêtre des bases qui replient pile entre 1 000 et 1 001 px est
# ]456,00 ; 456,48] ; 28.53em = 456,48 px est la plus grande écriture en `em`
# qui y tombe, et la vérification au pixel sur 2 321 largeurs ne trouve aucune
# bande. La recherche par pas de 0,5 px, elle, ratait cette fenêtre de 0,48 px :
# 456,0 était sous la borne basse et 456,5 au-dessus de la haute.
[[grille_flex]]
selecteur = ".simulateur-intro"
grille_avant = "minmax(0, 1.35fr) minmax(0, 1fr)"
gap_avant = "clamp(1.5rem, 4vw, 3rem)"
plancher_expr = "28.53em"
plancher_px = 456.48
repli_avant_px = 1000
ecart_max_px = 68.0
ecart_part = 0.173
presentation_repliee = ["lecture"]
raison = "Introduction de la page simulateur : texte d'un côté, chiffres clés de l'autre. Deux colonnes sans plancher, repliées par un palier de 1 000 px qui ne portait qu'elles. Base choisie dans la fenêtre exacte du repli, vérifiée au pixel : aucune largeur ne change de nombre de colonnes. Coût mesuré : 68,0 px (17,3 %), pour la même raison que partout ailleurs — flex ne partage que le surplus."
