# Relevé des en-têtes servis par l'hébergement — 20 octobre 2026.
#
# Ce fichier est la trace lisible d'une mesure réseau réelle (rapport automatique
# publié dans l'issue #90). Il n'est pas un audit de performance : il constate un
# code, un type MIME, un encodage, un nombre d'octets et une durée de cache.
#
# Les fichiers binaires doivent être servis OCTET POUR OCTET : c'est ce qui prouve
# que la version publiée est exactement celle du dépôt, sans recompression ni
# corruption. Les fichiers texte, eux, arrivent compressés : seul le rapport
# « servi < local » est vérifiable, pas la taille exacte, puisqu'un contenu
# publié change à chaque correction de fiche.

[meta]
version = 1
mesure_le = 2026-10-20
base_url = "https://thejmimiia-code.github.io/MRSC/"
rapport = "https://github.com/thejmimiia-code/MRSC/issues/90"
outil = "outils/verifier-publication.py"
regle = "Un binaire servi doit faire exactement la taille du fichier du dépôt ; un texte servi doit être plus petit que sa version locale et annoncé compressé."

[[fichier]]
chemin = "index.html"
url = "/"
nature = "texte"
type_mime = "text/html"
encodage = "gzip"
octets_servis = 7269
cache = "max-age=600"

