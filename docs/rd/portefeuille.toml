[[initiative]]
id = "relire-les-44-prototypes"
titre = "Faire relire les 58 prototypes d'apprentissage"
priorite = "P0"
phase = "relecture"
etat = "a-valider"
domaines = ["langue-communication", "langues-etrangeres", "mathematiques", "economie-finances", "sciences-techniques-environnement", "geographie", "histoire-memoire", "citoyennete-medias", "numerique-ia", "informatique-programmation", "arts-culture", "methodes-communication", "etudes-superieures-recherche"]
question = "Quels contenus sont exacts, utiles, accessibles, originaux et suffisamment délimités pour franchir leurs revues spécialisées?"
preuves = ["docs/apprentissage/catalogue.toml", "docs/apprentissage/grille-relecture.md", "docs/apprentissage/file-relecture.md", "outils/file-relecture.py", "docs/apprentissage/paquets-relecture.md", "outils/construire-paquets-relecture.py", "docs/apprentissage/relectures.toml", "outils/registre-relecture.py", "outils/test_registre_relecture.py", "docs/apprentissage/audit-automatique.md", "outils/auditer-prototypes.py", "outils/test_audit_prototypes.py", "outils/statuts_editoriaux.py", "docs/apprentissage/revue-interne-prototypes-2026-10-11.md", "docs/apprentissage/sources-refusees.toml", "docs/apprentissage/sources-refusees.md", "docs/rd/avancees.toml", "docs/rd/avancees.md"]
prochaine_action = "Mesure du 20 octobre 2026 : 58 prototypes, 17 contrôles automatiques, 0 échec mécanique, 1 constat (`arts-composer-formes`, dont le portail est conservé après lecture et refus d'un lexique Éduscol hors périmètre et d'un référentiel PDF tronqué avant sa table de composition), 22 fiches citant désormais une page précise ouverte et datée, 7 sources tentées et refusées consignées dans `docs/apprentissage/sources-refusees.toml`, 0 relecture humaine consignée. Les 19 prototypes prioritaires gardent un paquet de relecture prêt (`docs/apprentissage/paquets-relecture.md`). Trancher le constat restant sur `arts-composer-formes` : soit une source primaire ouverte et lue intégralement sur la hiérarchie visuelle et le contraste non coloré, soit un verdict humain « le portail suffit ». Utiliser la file de relecture (`python3 outils/file-relecture.py`) pour répartir les 58 prototypes : commencer par les 9 fiches des domaines à relecture spécialisée (santé, droit et démarches, argent, politique publique). Conserver le statut Prototype à relire jusqu'à ce que chaque contrôle ait une preuve humaine, et consigner chaque relecture dans `docs/apprentissage/relectures.toml` (bloc imprimé par `python3 outils/registre-relecture.py --modele <fiche>`), contrôlé par `outils/registre-relecture.py` : un statut « Relu — relecture consignée » sans relecture conforme au registre fait échouer la porte. Ne jamais citer une page qui n'a pas été ouverte : voir `docs/rd/avancees.md`."
criteres_sortie = ["Chaque fiche a une décision et une trace de revue adaptée au risque.", "Toute erreur importante, incertitude ou source manquante est corrigée ou affichée.", "Aucune revue interne n'est présentée comme validation indépendante."]
skills = ["recherche-sources", "conception-pedagogique", "accessibilite-co-conception", "evaluation-maintenance"]

