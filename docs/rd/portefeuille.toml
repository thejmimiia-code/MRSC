# Portefeuille vivant de recherche, d'innovation et d'entretien.
# Le registre décrit des travaux, pas des résultats certifiés ni une couverture exhaustive.
# La veille automatique vérifie sa structure et son échéance; elle ne lit pas les sources externes.

[meta]
version = 1
derniere_revue = 2026-10-13
cadence_revue_jours = 30
source_cartographie = "docs/apprentissage/referentiel.toml"
source_catalogue = "docs/apprentissage/catalogue.toml"
regle = "Ne changer derniere_revue qu'après une revue réellement effectuée et résumée."

[[initiative]]
id = "relire-les-44-prototypes"
titre = "Faire relire les 55 prototypes d'apprentissage"
priorite = "P0"
phase = "relecture"
etat = "a-valider"
domaines = ["langue-communication", "langues-etrangeres", "mathematiques", "economie-finances", "sciences-techniques-environnement", "geographie", "histoire-memoire", "citoyennete-medias", "numerique-ia", "informatique-programmation", "arts-culture", "methodes-communication", "etudes-superieures-recherche"]
question = "Quels contenus sont exacts, utiles, accessibles, originaux et suffisamment délimités pour franchir leurs revues spécialisées?"
preuves = ["docs/apprentissage/catalogue.toml", "docs/apprentissage/grille-relecture.md", "docs/apprentissage/file-relecture.md", "outils/file-relecture.py", "docs/apprentissage/revue-interne-prototypes-2026-10-11.md"]
prochaine_action = "Utiliser la file de relecture (`python3 outils/file-relecture.py`) pour répartir les 55 prototypes : commencer par les 9 fiches des domaines à relecture spécialisée (santé, droit et démarches, argent, politique publique), puis les 9 signalées par mots-clés hors de ces domaines, en corrigeant au passage les signalements par excès. Conserver le statut Prototype à relire jusqu'à ce que chaque contrôle ait une preuve humaine."
