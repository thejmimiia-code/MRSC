[[initiative]]
id = "vote-distanciel-verifiable"
titre = "Cadrer un vote distanciel vérifiable sans promesse absolue"
priorite = "P0"
phase = "recherche"
etat = "a-cadrer"
domaines = ["citoyennete-medias", "numerique-ia", "informatique-programmation", "demarches-droits-travail"]
question = "Un scrutin distant peut-il rendre détectables les altérations, préserver le secret du bulletin et rester contestable sans relier identité et choix ni promettre une sécurité absolue?"
preuves = ["docs/rd/vote-distanciel-verifiable.md", "docs/rd/vote-distanciel-menaces.toml", "docs/rd/vote-distanciel-statuts.md", "docs/rd/vote-distanciel-regles.toml", "docs/rd/vote-distanciel-protocole-banc.md", "docs/rd/vote-distanciel-cas-essai.toml", "docs/rd/vote-distanciel-decision.md", "assets/documents/statuts-2020.pdf", "outils/verifier-vote-distanciel.py", "outils/test_verifier_vote_distanciel.py", "docs/rd/portefeuille.toml", "docs/rd/journal.md"]
