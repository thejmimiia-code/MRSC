[[initiative]]
id = "optimisation-du-site"
titre = "Améliorer clarté, performance et résilience du site"
priorite = "P1"
phase = "essai"
etat = "a-tester"
domaines = ["numerique-ia", "methodes-communication"]
question = "Les pages restent-elles rapides, lisibles, robustes, accessibles et utilisables quand le stockage, le réseau ou une fonction optionnelle échoue?"
preuves = ["docs/rd-plan-global-consolidation.md", "docs/rd-affichage-adaptatif.md", "docs/rd-audit-securite-optimisation.md", "docs/rd-confidentialite-rgpd.md", "outils/verifier-integration.py", "outils/verifier-site-statique.py"]
prochaine_action = "Faire une revue visuelle et au clavier du contrôle Parcours, des cinq paliers de texte (50–150 %) et du menu de bureau repliable à 125/150 % sur pages représentatives et appareils réels ; vérifier navigation, reflow, focus, tactile et lecteur d’écran, sans collecte d’usage avant de changer l’état de l’initiative."
criteres_sortie = ["Les principaux parcours, les cinq paliers de texte, l’en-tête compactable et la navigation à 125/150 % sont testés sur des largeurs et technologies représentatives.", "Les améliorations ne retirent ni zoom natif, clavier, reflow ou contenu sans JavaScript.", "Aucune collecte ou dépendance tierce n'est ajoutée sans nécessité et information."]
skills = ["conception-innovation", "accessibilite-co-conception", "integration-securite", "evaluation-maintenance"]

[[initiative]]
id = "direction-artistique-motion"
titre = "Explorer une signature graphique et animée pour le site"
priorite = "P1"
phase = "recherche"
etat = "en-cours"
domaines = ["arts-culture", "methodes-communication", "numerique-ia"]
question = "Quelle direction artistique et quels mouvements originaux, reliés aux contenus du M.R.S.C., donnent envie d'explorer et de revenir sans réduire la lisibilité, l'accessibilité, la liberté de parcours ou la sobriété?"
preuves = ["docs/rd/visuel-motion.md", ".agents/skills/direction-artistique-motion/SKILL.md", ".claude/skills/direction-artistique-motion/SKILL.md", ".claude/skills/frontend-design/SOURCE.md", ".claude/skills/motion-design/SOURCE.md", "docs/rd-coherence-visuelle-editoriale.md", "docs/rd-affichage-adaptatif.md", "docs/pistes-visuelles-ia.html"]
prochaine_action = "Préparer trois maquettes comparatives non publiées pour une surface pilote, puis demander au M.R.S.C. de choisir ou combiner une direction avant toute intégration; prévoir ensuite des essais accessibles sans télémétrie individuelle."
criteres_sortie = ["Trois options graphiques réellement distinctes, liées au propos du M.R.S.C., avec droits et limites documentés.", "Une seule page prototype réversible est intégrée après sélection; les pages, contenus, fonctions et voies de repli existants sont préservés.", "La découverte est facultative et ne repose ni sur une progression forcée, ni sur des pénalités, ni sur des séries quotidiennes, ni sur un profil ou un suivi individuel.", "Les états clavier, mobile, mouvement réduit, texte équivalent et performance sont vérifiés; les contrôles automatisés restent distincts de la revue visuelle et des essais humains."]
skills = ["direction-artistique-motion", "conception-innovation", "conception-pedagogique", "conception-jeu", "accessibilite-co-conception", "integration-securite", "recherche-sources", "evaluation-maintenance"]

