[[initiative]]
id = "poids-et-sobriete-numerique"
titre = "Alléger les pages et documenter leur poids sans retirer d’accès"
priorite = "P1"
phase = "essai"
etat = "a-tester"
domaines = ["numerique-ia", "sciences-techniques-environnement", "methodes-communication"]
question = "Quels octets peuvent être évités sans retirer de contenu, de repli sans JavaScript, d’accessibilité ni de qualité visuelle, et que peut-on réellement affirmer à partir d’une mesure locale ?"
preuves = ["docs/rd/poids-et-sobriete-numerique.md", "docs/rd/poids-pages.md", "docs/rd/derives-images.json", "outils/optimiser-images.py", "outils/verifier-poids-pages.py", "index.html", "anglais-aventure.html", "apprendre.html", "assets/css/site.css", "outils/test-experience.cjs"]
prochaine_action = "Les en-têtes de GitHub Pages ont été relevés le 17 octobre 2026 (issue #90) : types AVIF/WebP corrects, gzip sur les fichiers texte, cache de 600 secondes ; la sonde couvre depuis le 20 octobre 2026 vingt-trois fichiers, icônes PNG et llms.txt compris, et le relevé du 20 octobre les donne tous en 200 avec leur type attendu. Le workflow mensuel refait ce relevé et ne couvre pas Vercel, qui héberge le simulateur du dépôt amont. Faire maintenant relire les trois illustrations par une personne et mesurer sur appareil et réseau réels (LCP, CLS, octets transférés) sans convertir ces mesures en bilan carbone. Ne pas présenter la passe comme un audit RGESN ni comme une preuve d’impact évité."
criteres_sortie = ["Chaque grande image a des variantes AVIF/WebP dimensionnées avec un repli JPEG, et les tailles sont vérifiées hors ligne.", "Les pages publiques restent sous les budgets de travail sans retirer de contenu, de texte alternatif ni de repli sans JavaScript.", "Les types MIME, la compression et le cache sont vérifiés sur au moins un hébergement réel avant toute revendication de gain en production.", "Le relevé d’en-têtes reste hors de la porte hors ligne et est refait après une modification du contrôleur ou du site.", "La sélection des formats et le repli de la scène sont testés dans un navigateur, et les limites de la mesure sont publiées avec les chiffres.", "Le manifeste des variantes reste reproductible et aucune source n’est supprimée au profit d’un format unique."]
skills = ["integration-securite", "strategie-tests", "analyse-donnees-reproductible", "recherche-sources", "evaluation-maintenance"]

