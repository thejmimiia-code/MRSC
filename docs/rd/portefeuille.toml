priorite = "P0"
phase = "cadrage"
etat = "a-cadrer"
domaines = ["methodes-communication", "langue-communication", "numerique-ia"]
question = "Les personnes comprennent-elles les consignes, repèrent-elles les aides et trouvent-elles les fiches ou fonctions visées sur différents appareils?"
