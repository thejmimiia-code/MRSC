[[initiative]]
id = "optimisation-du-site"
titre = "Améliorer clarté, performance et résilience du site"
priorite = "P1"
phase = "essai"
etat = "a-tester"
domaines = ["numerique-ia", "methodes-communication"]
question = "Les pages restent-elles rapides, lisibles, robustes, accessibles et utilisables quand le stockage, le réseau ou une fonction optionnelle échoue?"
preuves = ["docs/rd-plan-global-consolidation.md", "docs/rd-affichage-adaptatif.md", "docs/rd-audit-securite-optimisation.md", "docs/rd-confidentialite-rgpd.md", "docs/rd/accessibilite-2026-10-17.md", "outils/verifier-accessibilite.cjs", "outils/verifier-integration.py", "outils/verifier-site-statique.py", "outils/test-experience.cjs"]
prochaine_action = "Le test Chromium 720 → 500 → 480 → 460 → 320 → 240 px passe désormais 8/8 dans l’environnement local, y compris 320 px à 150 %, contraste et espacement renforcés, depuis la correction du réflow à 320 px et de la largeur stable du bouton compact. Le balayage axe-core 4.14.0 du 17 octobre 2026 ne relève plus aucune violation après correction des contrastes du pied de page et des noms accessibles des commandes : 192 exécutions sur les 96 pages aux deux largeurs et 47 exécutions sur 12 pages et 23 états interactifs, via `outils/verifier-accessibilite.cjs` ; ces mesures restent celles de l’agent. Faire la revue visuelle manuelle dans Chrome signalée par la personne utilisatrice ; faire relire les corrections d’accessibilité par une personne compétente et, si possible, avec un lecteur d’écran ; contrôler les autres breakpoints, les panneaux repliables et leurs états ouverts, les trois modes, le zoom natif, le tactile sur pages types, fiches, aventure et simulateur avant de réviser l’état. L’URL publique est configurée, mais doit encore être vérifiée visuellement après propagation ; aucune collecte d’usage."
criteres_sortie = ["Les principaux parcours, la barre d’outils, les cinq paliers de texte, les trois mises en page, l’en-tête compactable et la navigation à 125/150 % sont testés sur des largeurs et technologies représentatives.", "Les améliorations ne retirent ni zoom natif, clavier, reflow ou contenu sans JavaScript.", "Aucune collecte ou dépendance tierce n'est ajoutée sans nécessité et information."]
skills = ["conception-innovation", "accessibilite-co-conception", "integration-securite", "evaluation-maintenance"]

