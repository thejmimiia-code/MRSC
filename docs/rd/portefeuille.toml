prochaine_action = "Faire relire le protocole d'essais par les rôles requis et confirmer le cadre de consentement, puis adapter quelques tâches et seulement ensuite proposer des essais volontaires minimisant les données."
criteres_sortie = ["Tâches d'essai compréhensibles, option d'arrêt et solution de repli.", "Retours minimisés et non identifiants.", "Problèmes classés, corrigés et retestés sur clavier, mobile, zoom et technologies d'assistance pertinentes."]
