prochaine_action = "Trois sujets sont désormais ouverts par une carte de sujet : `ecoute-prononciation` (`docs/rd/sujet-ecoute-prononciation.md`, `partiel` avec deux fiches prototypes), `systemes-embarques` (`docs/rd/sujet-systemes-embarques.md`, passé à `partiel` le 20 octobre 2026 avec la fiche prototype `info-objet-connecte-local-distant` sur le programme embarqué local et la liaison réseau, vérifiée sans doublon avec `tech-electronique-capteur`) et `securite-sciences` (`docs/rd/sujet-securite-sciences.md`, ouvert le 20 octobre 2026 à l'état `a-creer` à partir du dossier INRS sur le règlement CLP, de l'actualité INRS sur le règlement délégué 2023/707 et ses classes de danger sans pictogramme aux échéances 2025–2026, et du programme de sciences et technologie de cycle 3). Dix-sept sujets restent sans aucune fiche dans `docs/rd/carte-lacunes.md`. Faire relire les trois fiches prototypes issues de ces cartes et décider s'il faut rédiger une première fiche prototype sur la lecture complète d'une étiquette CLP (`securite-sciences`) en respectant la frontière avec `premiers-secours` et `securite-electricite`. Régénérer la carte après chaque modification du référentiel."
