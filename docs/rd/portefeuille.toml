[[initiative]]
id = "optimisation-du-site"
titre = "Améliorer clarté, performance et résilience du site"
priorite = "P1"
phase = "essai"
etat = "a-tester"
domaines = ["numerique-ia", "methodes-communication"]
question = "Les pages restent-elles rapides, lisibles, robustes, accessibles et utilisables quand le stockage, le réseau ou une fonction optionnelle échoue?"
preuves = ["docs/rd-plan-global-consolidation.md", "docs/rd-affichage-adaptatif.md", "docs/rd-audit-securite-optimisation.md", "docs/rd-confidentialite-rgpd.md", "outils/verifier-integration.py", "outils/verifier-site-statique.py", "outils/test-experience.cjs"]
prochaine_action = "Le test Chromium 720 → 500 → 480 → 460 → 320 → 240 px passe et la publication Pages du merge commit 01bbed52e32aa5e9c28dd926fadf8c27050c81f7 a réussi. Faire la revue visuelle manuelle dans Chrome signalée par la personne utilisatrice ; contrôler Agrandir/Réduire, les autres breakpoints, les panneaux repliables, les trois modes, le zoom natif, le tactile et le lecteur d’écran sur pages types, fiches, aventure et simulateur avant de réviser l’état. L’URL publique est configurée, mais doit encore être vérifiée visuellement après propagation ; aucune collecte d’usage."
criteres_sortie = ["Les principaux parcours, la barre d’outils, les cinq paliers de texte, les trois mises en page, l’en-tête compactable et la navigation à 125/150 % sont testés sur des largeurs et technologies représentatives.", "Les améliorations ne retirent ni zoom natif, clavier, reflow ou contenu sans JavaScript.", "Aucune collecte ou dépendance tierce n'est ajoutée sans nécessité et information."]
skills = ["conception-innovation", "accessibilite-co-conception", "integration-securite", "evaluation-maintenance"]

[[initiative]]
id = "indexation-et-lecteurs-de-contenu"
titre = "Améliorer l’indexabilité et la lecture machine du site"
priorite = "P1"
phase = "prototype"
etat = "a-tester"
domaines = ["numerique-ia", "methodes-communication"]
question = "Quels repères vérifiables rendent les pages publiques plus faciles à découvrir et à interpréter sans promettre leur indexation, leur classement ou leur reprise par un système tiers?"
preuves = ["sitemap.xml", "index.html", "simulateur/interface.py", "llms.txt", "outils/verifier-site-statique.py", "outils/serveur-local.py", ".github/workflows/deploy-pages.yml", "docs/rd/journal.md"]
prochaine_action = "Après publication, faire vérifier le sitemap, quelques canoniques et les éventuelles erreurs d’exploration dans les outils pour webmasters administrés par l’association ; ne réexaminer robots.txt qu’après confirmation du domaine d’hébergement et de son chemin racine."
criteres_sortie = ["Chaque page publique indexable a un titre, une description et une canonique cohérents avec le sitemap ; 404 reste hors index.", "Le JSON-LD ne décrit que l’organisation, le site et l’accueil avec des informations présentes sur la page.", "Le sommaire llms.txt reste explicitement facultatif, ses liens sont vérifiés et le fichier est publié sans dépendance tierce ni suivi.", "Les validations techniques sont distinguées des vérifications par un moteur et aucune garantie d’indexation ou de classement n’est annoncée."]
skills = ["recherche-sources", "integration-securite", "strategie-tests", "documentation-technique", "evaluation-maintenance"]

