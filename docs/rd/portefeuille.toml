[[initiative]]
id = "optimisation-du-site"
titre = "Améliorer clarté, performance et résilience du site"
priorite = "P1"
phase = "essai"
etat = "a-tester"
domaines = ["numerique-ia", "methodes-communication"]
question = "Les pages restent-elles rapides, lisibles, robustes, accessibles et utilisables quand le stockage, le réseau ou une fonction optionnelle échoue?"
preuves = ["docs/rd/en-tetes-servis-2026-10-20.toml", "outils/verifier-fichiers-servis.py", "outils/test_fichiers_servis.py", "docs/rd-plan-global-consolidation.md", "docs/rd-affichage-adaptatif.md", "docs/rd/presentations-personnalisees.md", "docs/rd/inventaire-couleurs-jetons.md", "docs/rd-audit-securite-optimisation.md", "docs/rd-confidentialite-rgpd.md", "docs/rd/accessibilite-2026-10-17.md", "outils/verifier-accessibilite.cjs", "outils/verifier-integration.py", "outils/verifier-site-statique.py", "outils/test-experience.cjs"]
prochaine_action = "Le test Chromium 720 → 500 → 480 → 460 → 320 → 240 px passe désormais 8/8 dans l’environnement local, y compris 320 px à 150 %, contraste et espacement renforcés, depuis la correction du réflow à 320 px et de la largeur stable du bouton compact. Le balayage axe-core 4.14.0 du 17 octobre 2026 ne relève plus aucune violation après correction des contrastes du pied de page et des noms accessibles des commandes : 194 exécutions sur les 97 pages aux deux largeurs et 47 exécutions sur 12 pages et 23 états interactifs, revérifié le 20 octobre 2026 sans aucune violation, via `outils/verifier-accessibilite.cjs` ; ces mesures restent celles de l’agent. Faire la revue visuelle manuelle dans Chrome signalée par la personne utilisatrice ; faire relire les corrections d’accessibilité par une personne compétente et, si possible, avec un lecteur d’écran ; contrôler les autres breakpoints, les panneaux repliables et leurs états ouverts, les six présentations (dont Vitrine, Mosaïque et Compacte, ajoutées le 18 octobre 2026 avec leurs mini-aperçus), le zoom natif, le tactile sur pages types, fiches, aventure et simulateur avant de réviser l’état. L’URL publique est configurée, mais doit encore être vérifiée visuellement après propagation ; aucune collecte d’usage. L’inventaire des couleurs du 18 octobre 2026 (docs/rd/inventaire-couleurs-jetons.md) prépare une tokenisation par rôle à valeurs identiques, sans aucune variante sombre avant prototype borné, captures et relecture humaine. Phase 1 réalisée le 18 octobre 2026 : 18 jetons de rôle dans la feuille principale et 84 littéraux remplacés à valeurs identiques, styles calculés inchangés sur 16 582 éléments photographiés ; Phase 2 réalisée le même jour : 77 littéraux de la feuille de l’aventure et 31 de l’habillage du simulateur passent par des jetons, styles calculés inchangés sur 41 940 éléments photographiés (contraste renforcé compris) ; Arbitrage de l’ensemble gelé réalisé le même jour : libellés d’accueil et couleurs de marque de l’aventure branchés sur les jetons, thème par défaut inchangé et contrastes renforcés tous en hausse. Prototype sombre borné et non activé réalisé le même jour : valeurs candidates au-dessus de 4,5:1 sur les fonds de référence, mais surfaces littérales claires (en-tête, dégradés) et jetons à double rôle encore bloquants ; avant toute phase 3, une phase de résorption des surfaces littérales serait nécessaire, puis une décision séparée. Phase 2.5 réalisée le 18 octobre 2026 : scission de --white et --navy par rôle (--navy-ink, --on-accent, miroirs en contraste renforcé et en couleurs forcées) et 234 remplacements à valeurs identiques dans la feuille principale, en-tête translucide, dégradés, voiles et surfaces sombres littérales compris, pour 77 jetons ajoutés ; styles calculés inchangés sur 26 734 éléments photographiés en 26 contextes. Le prérequis technique du re-prototype sombre est rempli, toujours sans activation ni décision ; la relecture visuelle humaine reste la prochaine étape. Re-prototype sombre borné et non activé réalisé le même jour après la phase 2.5 : sur la feuille principale, aucun texte sous les repères de contraste (2 368 mesurés élément par élément, témoin clair par le même banc) une fois simulée la scission de --blue, dont le double rôle lien/surface de bouton est le bloqueur résiduel (2,13:1 en jetons seuls) ; l’aventure garde 439 textes sous les repères sur 1 338 (littéraux par monde hors phase 2.5). Resteraient avant toute décision de phase 3 : scission de --blue à valeurs claires identiques, périmètre aventure, relecture visuelle humaine des captures et essais avec personnes concernées."
criteres_sortie = ["Les principaux parcours, la barre d’outils, les cinq paliers de texte, les six mises en page, l’en-tête compactable et la navigation à 125/150 % sont testés sur des largeurs et technologies représentatives.", "Les améliorations ne retirent ni zoom natif, clavier, reflow ou contenu sans JavaScript.", "Aucune collecte ou dépendance tierce n'est ajoutée sans nécessité et information."]
skills = ["conception-innovation", "accessibilite-co-conception", "integration-securite", "evaluation-maintenance"]

