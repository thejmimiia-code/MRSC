prochaine_action = "Mesure du 22 octobre 2026 : l'ouverture de l'accueil a été réécrite à la demande de la personne utilisatrice, qui la jugeait évasive ; elle nomme l'objet de chaque ressource, affiche des repères chiffrés recalculés depuis le catalogue et le moteur du simulateur, et énonce la règle de preuve (sources, limites, statut) ; `outils/verifier-integration.py` contrôle ces formulations, vérifie les nombres et refuse le retour des formules générales. Faire relire humainement cette ouverture, la présentation de l'association, les trois repères d'accueil et les formulations modifiées, et vérifier le rendu du composant `home-hero-facts` à 320-1440 px, en contraste renforcé, couleurs forcées et dans les six présentations; appliquer le protocole éditorial à des lots de pages et consigner les sources/relectures manquantes sans déclarer tout le site harmonisé; traiter le domaine dans l'initiative raccordement-domaine-www; examiner le patch de sécurité avant toute mise à jour du moteur embarqué. Après publication de la migration du lien, contrôler dans un navigateur l'alias Vercel, /api/scenarios, /api/catalogue, une simulation et l'intégration iframe; demander à l'association de confirmer les informations publiées sur le fournisseur et ses journaux."
