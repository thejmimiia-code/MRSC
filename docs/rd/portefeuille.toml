prochaine_action = "Registre ouvert et vérifié le 20 octobre 2026 (`docs/apprentissage/sources-refusees.toml`, `outils/construire-sources-refusees.py`, 10 tests dans `outils/test_sources_refusees.py`) avec sept refus réels sur cinq fiches couvrant trois catégories d'échec (`acces-refuse-403`, `hors-perimetre`, `extraction-incomplete`) : la page HAL sur l'export de citations non encore actif (`recherche-distinguer-resume-citation`), trois tentatives en HTTP 403 sur l'IGN (`geo-lire-legende-carte` et `geo-decrire-paysage`), la fiche Éduscol `16789` qui ne donne pas les bornes arithmétiques d'un siècle (`histoire-situer-siecle`, remplacée par la page IMCCE `277.html`), ainsi que le lexique Éduscol `14122` (hors périmètre) et le référentiel professionnel `h092c.pdf` (extraction tronquée à 30 pages avant la table `S 2.4`) sur `arts-composer-formes` (décision `portail-conserve` qui maintient volontairement la fiche en constat plutôt que d'y attacher une source non lue). Consigner dans ce registre tout nouveau refus rencontré lors des prochaines revues."
