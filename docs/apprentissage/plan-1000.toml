# Allocation de travail vers un corpus d'environ 1 000 fiches autonomes.
# Ce fichier planifie des quotas, pas 1 000 fiches rédigées ni une couverture exhaustive.
# Le domaine dédié à l’informatique redistribue les cibles; les quotas restent des hypothèses.
version = 1
objectif_fiches = 1000

