[autonomie]
lecon_autonome = true
liens_externes_obligatoires = false
comptes_externes_obligatoires = false
ressources_chargees_depuis_un_tiers = false
sections_minimales = ["objectif", "notions définies", "exemple original", "analogie et limites", "démarche", "exercice facultatif", "aide", "correction", "transfert", "sources attribuées"]

[qualite]
quotas_non_exhaustifs = true
une_fiche_egale_un_objectif_distinct = true
les_versions_et_traductions_ne_comptent_pas_comme_nouvelles_fiches = true
publication_conditionnee_aux_relectures_et_aux_droits = true
les_comptages_ne_sont_pas_un_score_de_qualite = true
