# Registre des sources tentées et refusées lors du travail sur le catalogue.
#
# Ce registre conserve la trace des pages qui semblaient pertinentes pour une
# fiche mais qui n'ont pas pu être retenues après vérification : accès refusé
# (HTTP 403), accès payant, page introuvable, ou contenu hors du périmètre
# cherché après lecture.
#
# Pourquoi ce registre existe :
# - éviter qu'un autre agent ne tente puis ne cite la même page sans l'avoir
#   ouverte ;
# - expliquer pourquoi une source pressentie a été écartée au profit d'une
#   autre page ou d'un portail assumé ;
# - empêcher qu'un refus ne fasse passer une fiche pour relue ou validée.
#
# Aucun extrait de la source externe n'est stocké ici.

[meta]
version = 1
derniere_revue = 2026-10-20
source_catalogue = "docs/apprentissage/catalogue.toml"
regle = "N'inscrire ici qu'une page réellement tentée pour une fiche du catalogue, avec sa date, son motif et sa limite ; une URL refusée ne doit jamais figurer comme source active de la fiche."

[[refus]]
id = "hal-citations-fonctionnalite-non-active"
fiche = "recherche-distinguer-resume-citation"
titre_pressenti = "HAL — « Les citations dans HAL »"
url = "https://doc.hal.science/citations/"
date = 2026-10-20
categorie_motif = "hors-perimetre"
motif = "Ouverte le 20 octobre 2026 : la page annonce d'emblée qu'elle décrit une fonctionnalité d'export de citations (APA, MLA, IEEE, Chicago) non encore mise en place, au lieu d'expliquer les champs Résumé et Citer d'une notice déposée."
decision = "remplacee"
url_remplacement = "https://doc.hal.science/visualisation-dun-depot/"
limite = "Ce refus porte uniquement sur l'adéquation de cette page à l'objectif de la fiche au 20 octobre 2026 ; il ne juge ni la qualité de la documentation HAL, ni le fonctionnement réel de l'archive ouverte."

[[refus]]
id = "ign-mag-lire-carte-cinq-etapes-403"
fiche = "geo-lire-legende-carte"
titre_pressenti = "IGN — « Apprendre à lire une carte en cinq étapes »"
url = "https://www.ign.fr/mag/apprendre-lire-une-carte-en-cinq-etapes"
date = 2026-10-20
categorie_motif = "acces-refuse-403"
motif = "Tentée le 20 octobre 2026 : l'ouverture directe de la page renvoie une erreur HTTP 403. Seuls des extraits d'indexation étaient visibles, ce qui ne permet ni de lire la page en entier, ni d'en vérifier le périmètre et les droits."
decision = "remplacee"
url_remplacement = "https://eduscol.education.fr/document/16807/download"
limite = "Un refus HTTP 403 depuis l'environnement de travail ne prouve pas que la page est indisponible pour un navigateur ordinaire, mais interdit de la citer comme une source ouverte et lue."

[[refus]]
id = "ign-livret-decouvrez-monde-cartes-403"
fiche = "geo-lire-legende-carte"
titre_pressenti = "IGN — « Découvrez le monde des cartes » (livret pédagogique PDF)"
url = "https://www.ign.fr/publications-de-l-ign/institut/Ressources_pedagogiques/livret_decouvrez_LMDC.pdf"
date = 2026-10-20
categorie_motif = "acces-refuse-403"
motif = "Tentée le 20 octobre 2026 : le téléchargement direct du livret PDF renvoie une erreur HTTP 403. Faute d'ouverture directe du document, il est écarté au profit d'une ressource pédagogique Éduscol ouverte et lue."
decision = "remplacee"
url_remplacement = "https://eduscol.education.fr/document/16807/download"
limite = "Ce refus constate seulement l'impossibilité d'ouvrir le PDF à la date du relevé ; il ne dit rien de l'exactitude ni de la licence du livret de l'IGN, dont le portail reste cité comme point d'entrée."
