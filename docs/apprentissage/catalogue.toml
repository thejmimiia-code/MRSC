[[fiche]]
id = "recherche-conserver-reference"
titre = "Garder la trace d’une source pour la retrouver"
matiere = "Recherche et esprit critique"
matiere_id = "recherche"
domaine = "etudes-superieures-recherche"
niveau = 2
horizon_contenu = "Premiers repères de prise de notes bibliographiques ; aucun style de citation institutionnel n’est imposé"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de méthode pour noter les informations nécessaires à retrouver une source et relier une affirmation à son origine. Faire vérifier les exemples, les champs utiles et les nuances des styles par une personne compétente en documentation et en intégrité de recherche. Les exigences de citation varient selon les disciplines ; les droits, sources, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Noter qui a publié une ressource, son titre, sa date et où la retrouver, puis préciser ce qu’elle aide à vérifier."
objectif = "Créer une notice minimale pour une source fictive et distinguer la référence d’une preuve automatique."
situation = "Tu lis une ressource fictive sur les jardins urbains et tu veux la retrouver plus tard. Quelles informations devrais-tu noter au-delà du seul titre ?"
analogie_titre = "Comme noter l’adresse d’un livre avant de quitter la bibliothèque"
analogie = "Si tu veux retrouver un livre, le titre seul peut être insuffisant. L’auteur, l’éditeur ou le lieu où tu l’as trouvé aident à le distinguer. Une référence de recherche rassemble aussi des repères pour retrouver et vérifier une source."
limite_analogie = "Une référence indique où chercher ; elle ne garantit pas que la source est exacte, pertinente ou suffisante. Les disciplines et les publications utilisent des formats de citation différents, et un lien peut changer ou disparaître."
notions = [
  "Référence — ensemble de renseignements qui permettent d’identifier et de retrouver une source.",
  "Auteur ou organisme — personne ou institution responsable de la publication, lorsqu’elle est indiquée.",
  "Titre — nom de la page, du document ou de l’article.",
  "Date — date de publication ou de mise à jour si elle est indiquée ; elle peut être absente.",
  "URL et date de consultation — adresse Web et jour où une page en ligne a été consultée.",
  "Lien affirmation-source — note qui précise quelle idée la ressource peut aider à vérifier et quelles sont ses limites."
]
demarche = [
  "Note l’auteur ou l’organisme qui publie, sans le deviner si l’information manque.",
  "Copie le titre exact et la date de publication ou de mise à jour lorsqu’elle est visible.",
  "Pour une ressource en ligne, conserve son URL et la date où tu l’as consultée.",
  "Ajoute une courte note : quelle affirmation cette source éclaire-t-elle et quelle question reste ouverte ?",
  "Vérifie ensuite que la source est adaptée et assez récente pour la question ; une référence seule ne prouve pas une affirmation.",
  "Suis le style de citation demandé par la discipline ou l’établissement quand un format précis est requis."
]
exercice = "Crée une référence minimale pour cette ressource entièrement fictive : organisme « Observatoire des jardins-exemple », titre « Espaces verts en ville », publiée en 2025, consultée le 11 octobre 2026 à l’adresse fictive https://exemple.test/jardins. Ajoute une note indiquant ce qu’il faudrait vérifier avant de reprendre une affirmation."
aide = "Rassemble organisme, titre, date, adresse et date de consultation. Ensuite, écris une question que la ressource n’a pas forcément résolue."
correction = [
  "Exemple : Observatoire des jardins-exemple, « Espaces verts en ville », 2025, https://exemple.test/jardins, consultée le 11 octobre 2026. La référence est entièrement fictive.",
  "Note possible : « À vérifier : quelles surfaces sont comptées, pour quel territoire et selon quelle méthode ? »",
  "Le fait de consigner la source facilite sa vérification, mais ne confirme ni sa qualité, ni ses droits, ni la vérité de chaque affirmation."
]
a_retenir = [
  "Consigne assez d’éléments pour distinguer et retrouver une source.",
  "Relie une affirmation précise à la source qui peut l’étayer ; une bibliographie sans lien explicite peut être difficile à contrôler.",
  "Une référence n’est ni une preuve automatique ni une permission de reproduire le contenu.",
  "Les formats de citation varient ; vérifie les consignes de la discipline ou de l’établissement."
]
transferer = "Cette méthode peut servir à préparer une bibliographie ou un carnet de lecture. Pour une publication universitaire, respecte le style demandé, vérifie chaque référence et les règles d’intégrité de ton établissement ; cette fiche ne définit pas de format officiel."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

