[[fiche]]
id = "maths-surface"
titre = "Mesurer une surface et distinguer aire et contour"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 2
minutes = 8
resume = "Calculer la surface d’un rectangle et ne pas la confondre avec son bord."
objectif = "Utiliser longueur × largeur pour trouver l’aire d’un rectangle."
situation = "Une pièce rectangulaire fictive mesure 4 m de long sur 3 m de large. Quelle surface de sol faut-il couvrir ?"
analogie_titre = "Comme compter les carreaux à l’intérieur d’un cadre"
analogie = "Imagine des carreaux identiques qui remplissent le sol. Quatre rangées de trois carreaux font 12 carreaux : longueur × largeur permet de compter l’espace couvert."
limite_analogie = "Un vrai sol n’est pas toujours un rectangle parfait et les murs, découpes ou ouvertures comptent pour la pose. Le calcul simplifié ne remplace pas une mesure précise du chantier."
notions = [
  "Aire — mesure de la surface à l’intérieur d’une forme, exprimée par exemple en m².",
  "Périmètre — longueur du contour d’une forme, exprimée dans une unité de longueur comme le mètre.",
  "Rectangle — forme avec quatre angles droits ; ses côtés opposés ont la même longueur."
]
demarche = [
  "Repère les deux dimensions du rectangle : longueur et largeur.",
  "Multiplie-les : 4 m × 3 m = 12 m².",
  "Écris l’unité de surface : des mètres carrés.",
  "Demande-toi si la question porte sur l’intérieur (aire) ou le tour (périmètre)."
]
exercice = "Un tapis rectangulaire fictif mesure 5 m sur 2 m. Quelle est son aire ?"
aide = "Multiplie les deux mesures : 5 × 2. L’unité sera le mètre carré."
correction = [
  "5 m × 2 m = 10 m².",
  "L’aire du tapis est de 10 mètres carrés. Cela mesure la surface couverte, pas la longueur de son contour."
]
a_retenir = [
  "Aire d’un rectangle = longueur × largeur.",
  "Le mètre mesure une longueur ; le mètre carré mesure une surface.",
  "Aire et périmètre répondent à deux questions différentes."
]
