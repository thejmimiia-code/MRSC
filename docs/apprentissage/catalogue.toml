[[fiche]]
id = "fr-preparer-explication-orale"
titre = "Préparer une explication courte"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 1
horizon_contenu = "Communication orale et modes d’expression au quotidien ; aucune prise de parole en public n’est imposée"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome pour organiser une explication brève. Faire relire la progression, le vocabulaire et les exemples par des personnes ayant différentes expériences de communication. La fiche propose aussi des réponses écrites ou assistées et ne suppose pas que parler à voix haute soit possible ou souhaité ; accessibilité, sources, droits et essais apprenants restent à contrôler."
minutes = 8
resume = "Organiser une explication en quelques idées et vérifier si le message est compris."
objectif = "Préparer une explication courte avec un sujet, deux informations utiles et une vérification adaptée du message."
situation = "Scénario fictif : une personne arrive à un atelier. Tu veux lui indiquer que l’accueil commence à 14 h, dans la salle 3, et qu’elle peut demander une autre façon de recevoir les consignes si besoin. Comment présenter ces informations sans tout mélanger ?"
analogie_titre = "Comme poser trois panneaux sur un chemin"
analogie = "Un panneau de départ annonce où l’on va ; quelques repères aident ensuite à suivre le chemin. Dans une explication, une phrase annonce le sujet et deux ou trois idées donnent les repères utiles."
limite_analogie = "Une personne qui écoute peut interrompre, demander un exemple ou préférer un autre mode de communication. Une explication n’est pas un chemin à sens unique : on peut adapter le rythme, écrire, montrer ou utiliser une communication assistée."
notions = [
  "Sujet — ce dont l’explication va parler.",
  "Idée principale — le message essentiel à retenir.",
  "Repère — une information utile qui aide à comprendre ou à agir.",
  "Vérification — une question ou une reformulation qui permet de voir si le message est clair, sans tester ni juger la personne.",
  "Mode de communication — parole, texte, gestes, pictogrammes ou outil d’aide ; le choix dépend des personnes et de la situation."
]
demarche = [
  "Demande-toi ce que la personne doit comprendre ou pouvoir faire après ton explication.",
  "Annonce le sujet en une phrase courte.",
  "Choisis deux ou trois informations utiles et place-les dans un ordre facile à suivre.",
  "Prépare un exemple ou un repère concret si cela aide ; évite les détails qui ne répondent pas au besoin.",
  "Choisis un mode adapté : parler, écrire, montrer ou proposer une autre forme de communication.",
  "Laisse la personne reformuler, poser une question ou demander une autre explication."
]
exercice = "Dans ce scénario fictif, une rencontre commence à 10 h, dans la salle 2. L’entrée se fait par la porte côté jardin. Prépare une explication en une ou deux phrases ; tu peux l’écrire, la dire ou la décrire sous forme de pictogrammes. Ajoute une façon de vérifier que l’information est claire."
aide = "Commence par le sujet, puis donne l’heure et le lieu. Une question ouverte comme « Quelle information veux-tu que je répète ? » laisse plusieurs réponses possibles."
correction = [
  "Exemple écrit possible : « La rencontre commence à 10 h dans la salle 2. L’entrée se fait par la porte côté jardin. Veux-tu que je reformule un de ces repères ? »",
  "Une réponse orale, dessinée, gestuelle ou assistée peut convenir si elle transmet les mêmes informations et laisse une possibilité de clarification.",
  "L’objectif est d’être compris, pas d’utiliser une formule unique ni d’obtenir une réponse particulière."
]
a_retenir = [
  "Une explication courte peut suivre un ordre simple : sujet, repères utiles, vérification.",
  "Le mode et le rythme de communication peuvent être adaptés aux personnes concernées.",
  "Demander une clarification n’est pas un échec et ne prouve pas que l’explication était mauvaise.",
  "Cette fiche ne remplace pas un interprète ou un moyen de communication adapté lorsqu’il est nécessaire."
]
transferer = "Cette démarche peut servir pour expliquer une consigne, présenter une activité ou transmettre un rendez-vous. Pour une information importante, demande un retour qui convient à la personne et confirme les détails par un support accessible si besoin."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

