id = "sciences-demarche"
titre = "Distinguer une observation d’une explication"
matiere = "Sciences"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 2
minutes = 9
resume = "Décrire ce qui a été observé, puis tester une explication possible."
objectif = "Formuler une question et comparer deux conditions en ne changeant qu’un élément à la fois."
situation = "Expérience fictive et sans danger : deux morceaux identiques de papier absorbant reçoivent chacun une petite quantité d’eau. On veut comparer deux marques."
analogie_titre = "Comme tester une recette en ne changeant qu’un ingrédient"
analogie = "Si tu changes le four, la quantité et les ingrédients en même temps, tu ne sais pas lequel a modifié le résultat. Pour comparer deux papiers, garde les conditions aussi semblables que possible et change seulement la marque."
limite_analogie = "Une expérience de sciences demande aussi des mesures, des répétitions et une description précise. Une recette réussie une fois ne suffit pas à établir une règle générale."
notions = [
  "Observation — description de ce que l’on voit ou mesure, sans ajouter une cause supposée.",
  "Hypothèse — explication possible qu’on peut mettre à l’épreuve.",
  "Variable — élément qui peut changer, comme la marque, la quantité ou la durée."
]
demarche = [
  "Pose une question précise : lequel des deux papiers absorbe le plus d’eau dans les mêmes conditions ?",
  "Note ce qui restera pareil : taille des morceaux, quantité d’eau, durée et méthode de mesure.",
  "Change uniquement la marque, puis observe ou mesure le résultat.",
  "Répète si possible et décris ce que tu as vraiment mesuré, sans transformer une seule observation en règle universelle."
]
exercice = "Dans une comparaison, on utilise un papier plus grand, davantage d’eau et une durée plus longue pour l’un des échantillons. Peut-on attribuer le résultat à la seule marque ? Pourquoi ?"
aide = "Liste les éléments qui n’étaient pas identiques."
correction = [
  "Non. La taille, la quantité d’eau et la durée changent en même temps que la marque.",
  "On ne sait donc pas quel changement explique le résultat. Il faut garder ces conditions comparables et ne faire varier qu’un élément à la fois."
]
a_retenir = [
  "Sépare ce que tu as vu de ce que tu penses que cela signifie.",
  "Une comparaison est plus utile si les conditions sont équitables.",
  "Une observation limitée ne prouve pas une règle valable dans toutes les situations."
]
transferer = "Cette façon de raisonner sert pour une expérience simple, un test de matériel ou une comparaison de méthodes. Pour les produits chimiques, la santé, l’électricité ou les outils, ne réalise pas d’essai sans consigne fiable et sécurité adaptée."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

