[[fiche]]
id = "apprendre-methode"
titre = "Apprendre une notion à partir d’une situation connue"
matiere = "Méthodes pour apprendre"
matiere_id = "apprendre"
domaine = "methodes-communication"
niveau = 1
minutes = 8
resume = "Partir d’un geste connu, essayer une notion et vérifier si elle peut servir ailleurs."
objectif = "Construire une courte séance d’apprentissage sans note ni test de niveau."
situation = "Tu sais déjà lire un horaire de travail. Tu souhaites apprendre à calculer combien de temps sépare deux rendez-vous."
analogie_titre = "Comme tracer un itinéraire depuis un lieu que tu connais"
analogie = "Pour aller dans un endroit inconnu, on peut partir d’un point familier, suivre quelques étapes puis vérifier qu’on est arrivé. Pour apprendre, pars d’une situation comprise, ajoute une petite notion et essaie de la réutiliser."
limite_analogie = "Apprendre n’est pas toujours un trajet en ligne droite. On peut revenir en arrière, essayer une autre explication, faire une pause ou choisir une activité différente."
notions = [
  "Objectif — ce que tu veux être capable de comprendre ou de faire.",
  "Exemple guidé — démonstration découpée en étapes.",
  "Transfert — réutilisation d’une notion dans une autre situation."
]
demarche = [
  "Choisis un but très précis : par exemple, calculer la durée entre deux horaires.",
  "Relie-le à une situation que tu connais déjà, comme ton planning.",
  "Lis un exemple guidé, puis essaie une variante par écrit, à voix haute, avec un dessin ou un calcul mental.",
  "Compare avec une correction, repère ce qui reste flou et choisis la prochaine petite étape."
]
exercice = "Choisis une notion parmi lire une consigne, calculer une durée ou repérer une source. Écris ou dis : 1) ce que tu veux savoir faire, 2) un exemple du quotidien, 3) comment tu vérifieras ton essai."
aide = "Tu peux utiliser cette phrase : « À la fin, je veux pouvoir… Je peux m’entraîner avec… Je vérifierai en… »"
correction = [
  "Exemple : « Je veux calculer une durée. Je vais utiliser deux horaires de rendez-vous. Je vérifierai en additionnant la durée à l’heure de départ. »",
  "Il n’existe pas une seule bonne façon de s’exercer. Choisis une forme qui te permet d’essayer puis de vérifier le résultat."
]
a_retenir = [
  "Un objectif concret aide à savoir par où commencer.",
  "Un exemple de la vie réelle peut servir de point d’appui.",
  "Essayer, vérifier et réutiliser sont des possibilités ; tu peux en choisir une autre si elle te convient mieux."
]
transferer = "Cette petite méthode peut servir pour une compétence de travail, une démarche, un sujet de culture générale ou un loisir. La page ne suit pas ta progression et ne classe pas tes capacités."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

