[[fiche]]
id = "maths-pourcentage"
titre = "Calculer une réduction de 20 %"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 3
minutes = 8
resume = "Trouver le montant d’une réduction, puis le nouveau prix."
objectif = "Calculer 20 % d’un prix en utilisant 10 % comme étape intermédiaire."
situation = "Un article fictif coûte 80 €. Une étiquette annonce une réduction de 20 %. Combien économise-t-on ? Quel est le prix réduit ?"
analogie_titre = "Comme colorier 20 cases sur une grille de 100"
analogie = "Le symbole % signifie « pour cent », c’est-à-dire sur 100. Sur une grille de cent cases, 20 % correspondraient à 20 cases. Pour un prix de 80 €, 10 % vaut 8 €, donc 20 % vaut deux fois 8 €."
limite_analogie = "Une grille aide à visualiser la proportion, mais un prix n’est pas composé de cent morceaux égaux. Les frais, les conditions de l’offre ou les prix de départ peuvent modifier une comparaison réelle."
notions = [
  "Pourcentage — manière d’exprimer une proportion sur 100.",
  "10 % — un dixième de la quantité ; on peut donc diviser par 10.",
  "Prix réduit — prix de départ moins le montant économisé."
]
demarche = [
  "Trouve 10 % de 80 € : 80 ÷ 10 = 8 €.",
  "Double ce montant pour obtenir 20 % : 8 × 2 = 16 €.",
  "Soustrais la réduction du prix de départ : 80 − 16.",
  "Vérifie que le prix réduit est bien inférieur au prix initial."
]
exercice = "Un sac fictif coûte 50 €. La réduction affichée est de 10 %. Quel est le montant économisé et quel est le prix après réduction ?"
aide = "10 % signifie un dixième. Divise 50 par 10 avant de soustraire."
correction = [
  "10 % de 50 € = 50 ÷ 10 = 5 €.",
  "Prix après réduction : 50 € − 5 € = 45 €.",
  "Vérification : le prix réduit est inférieur de 5 € au prix de départ."
]
a_retenir = [
  "Pour calculer 10 %, divise par 10.",
  "Pour calculer 20 %, double 10 %.",
  "Un pourcentage s’applique à une base : vérifie toujours de quel prix il s’agit."
]
transferer = "Cette méthode aide à estimer une remise ou une part d’un budget. Pour comparer des offres commerciales, regarde aussi la quantité, les frais et les conditions indiqués."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

