[[fiche]]
id = "geo-decrire-paysage"
titre = "Décrire un paysage sans lui faire dire trop"
matiere = "Géographie et espace"
matiere_id = "geographie"
domaine = "geographie"
niveau = 1
horizon_contenu = "Premiers repères pour décrire un paysage fictif et distinguer observation et interprétation"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de géographie utilisant une description écrite entièrement fictive. Faire vérifier la distinction entre éléments naturels, aménagements et interprétations par une personne compétente en géographie. Le texte ne permet pas de conclure sur la population, l’activité économique ou l’accessibilité du lieu ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Repérer des éléments naturels et aménagés dans un paysage, puis distinguer observation et hypothèse."
objectif = "Décrire un paysage à partir d’indices visibles et nommer une information qui demanderait une autre source."
situation = "Description fictive : une rivière traverse une vallée ; un pont la franchit ; des maisons sont regroupées près d’une route et des parcelles cultivées occupent une partie des pentes. Que peux-tu décrire directement ? Que ne peux-tu pas savoir avec cette seule description ?"
analogie_titre = "Comme décrire une scène avant d’imaginer son histoire"
analogie = "Une scène montre des éléments que l’on peut nommer : un chemin, des bâtiments, une rivière. On peut ensuite formuler des questions sur leur usage ou leur histoire, mais celles-ci demandent souvent d’autres informations."
limite_analogie = "Un paysage ne se limite pas à ce qui est visible depuis un point de vue. Les usages, les habitants, les changements dans le temps et les accès peuvent être invisibles ou absents d’une description ; ne pas les déduire d’une image ou d’un seul texte."
notions = [
  "Paysage — partie d’un territoire perçue depuis un point de vue, avec des éléments naturels et aménagés.",
  "Élément naturel — forme ou composant du milieu, comme une rivière ou une pente.",
  "Aménagement — transformation ou équipement réalisé par des personnes, comme une route, un pont ou des parcelles cultivées.",
  "Observation — élément explicitement visible ou décrit.",
  "Interprétation — explication proposée à partir d’indices ; elle doit rester distinguée de l’observation."
]
demarche = [
  "Lis ou observe la description sans expliquer tout de suite pourquoi les éléments se trouvent là.",
  "Liste les éléments naturels décrits, puis les constructions et aménagements.",
  "Relève les relations visibles : un pont franchit une rivière, une route passe près de maisons.",
  "Écris ce qui est observé et ce que tu supposes dans des colonnes différentes.",
  "Pour parler des habitants, des déplacements, des activités ou de l’évolution, cherche d’autres sources adaptées."
]
exercice = "Dans la description fictive, cite un élément naturel et deux aménagements. Peut-on savoir combien de personnes habitent les maisons, pourquoi elles ont été construites là ou si le pont est accessible à tout le monde ?"
aide = "La rivière et la vallée sont décrites comme éléments naturels ; le pont, la route et les parcelles cultivées sont des aménagements. Cherche ensuite ce qui n’est pas indiqué."
correction = [
  "Élément naturel possible : la rivière ou la vallée.",
  "Aménagements possibles : le pont, la route et les parcelles cultivées.",
  "Non. La description ne donne ni le nombre d’habitants, ni la raison de l’emplacement, ni les conditions d’accessibilité. Il faudrait d’autres sources ou une observation adaptée."
]
a_retenir = [
  "Décris d’abord les éléments naturels et les aménagements explicitement visibles.",
  "Une relation visible entre deux lieux ne prouve pas pourquoi elle existe.",
