  "Lis la liste des ingrédients et repère les allergènes mis en évidence.",
  "Repère la formule exacte de la date : « à consommer de préférence avant » ou « à consommer jusqu’au ».",
  "Respecte aussi les conditions de conservation indiquées sur l’emballage. En cas d’allergie, ne te fie pas à une fiche d’exercice : vérifie le produit réel."
]
exercice = "Dans l’exemple fictif, quelle quantité nette est indiquée ? Où chercher l’information sur les allergènes ? La date écrite est-elle présentée comme une date de durabilité minimale ou comme une date limite de consommation ?"
aide = "Cherche les mots « 125 g », « allergènes » et « à consommer de préférence avant »."
