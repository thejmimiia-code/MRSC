  "Place les trois formes autour du titre dans une première version, en laissant un espace entre certains éléments.",
  "Crée une deuxième version en changeant une seule chose, par exemple la taille d’une forme ou sa distance au titre.",
  "Compare les versions : qu’est-ce qui semble ressortir et pourquoi ? Décris-le en mots si tu préfères.",
  "Vérifie qu’un contraste ne repose pas seulement sur la couleur ; la taille, la position ou une bordure peuvent aussi aider."
]
exercice = "Imagine deux compositions avec un cercle, un rectangle et un triangle. Dans la première, le titre est isolé et plus grand ; dans la seconde, les formes ont toutes la même taille et sont proches du titre. Laquelle semble mettre le titre en avant ? Tu peux répondre par une description, un croquis ou un autre moyen."
aide = "Compare un seul indice à la fois : taille, distance, position ou différence de forme. Il n’y a pas de réponse esthétique obligatoire."
correction = [
  "Dans la première description, le titre a plus de chances d’être remarqué d’abord parce qu’il est plus grand et séparé des formes.",
  "Cette réponse décrit un effet possible, pas une règle valable pour chaque personne ou chaque affiche.",
  "Une autre composition peut aussi fonctionner si son intention est claire pour les personnes auxquelles elle s’adresse."
]
a_retenir = [
  "La taille, la position, le contraste et l’espace peuvent modifier la manière dont une composition est perçue.",
  "Changer un élément à la fois aide à comparer deux versions.",
  "Les choix artistiques n’ont pas toujours une solution unique ; décrire une intention est aussi une façon de travailler.",
  "Un contraste accessible ne devrait pas dépendre uniquement de la couleur.",
  "Cette activité utilise des formes originales et ne demande pas de reproduire une œuvre protégée."
]
transferer = "Ces repères peuvent aider à préparer une affiche, une page ou une composition abstraite. Pour une création destinée à être lue par d’autres personnes, teste la compréhension et l’accessibilité auprès de personnes concernées ; cette fiche n’évalue ni le talent ni la valeur artistique."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

