[[fiche]]
id = "methodes-demander-clarification"
titre = "Reformuler une demande avant de commencer"
matiere = "Méthodes pour apprendre"
matiere_id = "apprendre"
domaine = "methodes-communication"
niveau = 1
horizon_contenu = "Échanges en formation, en équipe ou dans une activité quotidienne ; scénario fictif"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon sur la clarification d’une demande, sans évaluer la personne ni supposer que toute question peut être posée sans risque. Faire relire la formulation, le ton et les exemples par des personnes ayant différentes expériences de communication et de travail. La fiche reconnaît plusieurs voies de confirmation ; l’accessibilité, les sources, les droits et les essais apprenants restent à contrôler."
minutes = 8
resume = "Vérifier les actions, l’ordre et les conditions d’une demande en la reformulant avec ses propres mots."
objectif = "Repérer une information manquante, résumer une consigne et demander une confirmation avant d’agir."
situation = "Dans un scénario fictif d’organisation d’un atelier, une personne dit : « Installe les chaises près de l’entrée, garde le passage libre, puis demande-moi avant de déplacer les tables. » Tu veux vérifier l’ordre et la limite avant de commencer."
analogie_titre = "Comme relire une adresse avant d’envoyer un colis"
analogie = "Avant d’envoyer un colis, relire l’adresse permet de repérer une erreur pendant qu’on peut encore la corriger. Reformuler une demande permet aussi de vérifier qu’on a compris l’action, l’ordre et la contrainte avant de commencer."
limite_analogie = "Une demande humaine peut évoluer et la personne peut préciser autrement. Reformuler ne garantit pas que tout est compris et ne remplace pas une consigne écrite, une formation ou une règle de sécurité lorsque celles-ci sont nécessaires."
notions = [
  "Reformulation — dire avec ses propres mots ce que l’on pense avoir compris.",
  "Clarification — question ou précision qui rend un élément moins ambigu.",
  "Ordre — séquence dans laquelle les actions sont attendues, si un ordre est indiqué.",
  "Condition — limite ou détail à respecter, comme « avant de déplacer les tables ».",
  "Confirmation — réponse qui valide ou corrige la reformulation."
]
demarche = [
  "Écoute ou lis la demande jusqu’au bout et repère les actions principales.",
  "Note les éléments qui changent la manière d’agir : l’ordre, le lieu, l’heure, le résultat attendu ou une limite.",
  "Reformule brièvement : « Si j’ai bien compris, je place les chaises près de l’entrée et je garde le passage libre. »",
  "Pose une question précise sur ce qui manque : « Dois-je attendre ta confirmation avant de déplacer les tables ? »",
  "Laisse à l’autre personne le temps de confirmer ou de corriger. Si l’échange oral n’est pas adapté, demande une autre forme de confirmation, par exemple un message écrit."
]
exercice = "Une personne te dit, dans un scénario fictif : « Prépare les affiches pour vendredi, mais attends mon accord avant de les envoyer. » Reformule les deux points à confirmer et pose une question qui permet de savoir quand tu peux les envoyer."
aide = "Repère l’action, la date et la limite. Une phrase peut commencer par « Si j’ai bien compris… » ; ta question porte ensuite sur l’accord avant l’envoi."
correction = [
  "Reformulation possible : « Si j’ai bien compris, je prépare les affiches pour vendredi et je ne les envoie pas avant ton accord. »",
  "Question possible : « Quand pourras-tu me confirmer que je peux les envoyer ? » ou « Dois-je attendre ton accord explicite avant l’envoi ? »",
  "La personne peut préciser un autre délai ou une autre procédure. L’objectif est de vérifier la demande, pas de deviner ni de traiter une absence de réponse comme un accord."
]
a_retenir = [
  "Une reformulation courte peut vérifier l’action, l’ordre, l’échéance et les limites.",
  "Pose une question précise plutôt que de cacher une incertitude derrière un « d’accord ».",
  "L’autre personne peut corriger ta reformulation : c’est une partie utile de la vérification.",
  "Si une consigne de sécurité ou une règle officielle s’applique, ne la remplace pas par une simple reformulation."
]
transferer = "Cette méthode peut aider en formation, dans une activité associative ou dans un travail d’équipe. Selon le contexte, privilégie le moyen de communication adapté et demande une confirmation écrite si la décision ou la consigne doit être conservée. Si poser une question n’est pas possible ou sûr, cherche un interlocuteur ou un moyen de soutien approprié."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

