[[fiche]]
id = "maths-budget"
titre = "Additionner un petit budget et vérifier le reste"
matiere = "Mathématiques et budget"
matiere_id = "economie"
domaine = "economie-finances"
niveau = 1
minutes = 8
resume = "Additionner des prix et comparer une dépense à la somme disponible."
objectif = "Calculer le total de quelques achats, puis trouver ce qu’il reste dans un budget fictif."
situation = "Pour un goûter inventé, trois achats coûtent 12,50 €, 8,40 € et 4,10 €. Tu as prévu 30 €. Quel est le total ? Quelle somme reste-t-il ?"
analogie_titre = "Comme une enveloppe avec une somme limitée"
analogie = "Imagine que l’enveloppe contient 30 €. Chaque achat retire une partie de cette somme. Additionner les prix permet de savoir combien a été utilisé ; soustraire le total aide à trouver ce qui reste."
limite_analogie = "Dans la vie, un budget peut comporter des dépenses oubliées, des frais variables ou des dates différentes. Cet exemple ne remplace pas un budget complet ni un conseil financier."
notions = [
  "Total — somme obtenue en réunissant plusieurs montants.",
  "Reste — différence entre la somme de départ et ce qui a été dépensé.",
  "Virgule décimale — elle sépare les euros et les centimes dans l’écriture d’un prix."
]
demarche = [
  "Aligne les virgules des prix ou additionne d’abord les euros et les centimes.",
  "Additionne les trois montants : 12,50 + 8,40 + 4,10.",
  "Compare le total aux 30 € prévus.",
  "Soustrais la dépense totale du budget pour trouver le reste, puis vérifie par addition."
]
exercice = "Tu as prévu 25 €. Deux achats fictifs coûtent 9,80 € et 6,75 €. Combien dépenses-tu ? Combien reste-t-il ?"
aide = "Tu peux écrire 9,80 + 6,75, puis faire 25,00 moins le total."
correction = [
  "9,80 € + 6,75 € = 16,55 € dépensés.",
  "25,00 € − 16,55 € = 8,45 € restants.",
  "Vérification : 16,55 € + 8,45 € = 25,00 €."
]
a_retenir = [
  "Pour additionner des prix, garde les euros sous les euros et les centimes sous les centimes.",
  "Le reste se calcule en soustrayant la dépense du budget prévu.",
  "Une estimation rapide peut aider à repérer une erreur de virgule."
]
transferer = "Cette compétence sert à lire un ticket, comparer quelques prix ou prévoir une dépense. Les tarifs et contrats réels peuvent comporter des conditions supplémentaires : vérifie toujours le document du fournisseur."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

