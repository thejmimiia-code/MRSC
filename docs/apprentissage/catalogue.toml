[[fiche]]
id = "maths-estimer-calcul"
titre = "Estimer un résultat pour vérifier un calcul"
matiere = "Mathématiques — calcul et ordre de grandeur"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
horizon_contenu = "Repères de cycle 3 et de collège ; reprise des bases possible à tout âge"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Rédaction et données fictives originales ; la démarche, les choix d’arrondi, la relecture pédagogique indépendante, les droits, l’accessibilité et les essais apprenants restent à vérifier avant toute diffusion. Les sources servent de repères factuels et leurs licences de réutilisation n’ont pas été vérifiées."
minutes = 9
resume = "Arrondir des nombres pour prévoir un résultat et repérer une erreur importante."
objectif = "Construire une estimation simple, la comparer au calcul exact et décider si le résultat paraît cohérent."
situation = "Une étagère fictive contient 48 livres sur une rangée et 37 sur une autre. Avant de recompter précisément, peux-tu prévoir si le total est proche de 85 ou de 150 ?"
analogie_titre = "Comme compter des objets par paquets avant le compte exact"
analogie = "Pour savoir rapidement combien de boutons se trouvent dans deux boîtes, tu peux penser à des paquets d’environ dix : 48 ressemble à 50 et 37 ressemble à 40. Cela donne une estimation rapide autour de 90 avant de recompter les objets un à un."
limite_analogie = "Les paquets arrondis ne donnent pas le compte exact et peuvent ajouter ou retirer quelques objets. Une estimation sert à contrôler la vraisemblance ; si une quantité précise est nécessaire, il faut effectuer et vérifier le calcul exact."
notions = [
  "Estimation — résultat approché, utile pour se faire une idée ou contrôler un calcul.",
  "Arrondir — remplacer un nombre par un nombre plus simple et proche, comme 48 par 50.",
  "Ordre de grandeur — valeur approximative qui situe la taille d’un résultat.",
  "≈ — symbole qui signifie « environ égal à », et non « exactement égal à »."
]
demarche = [
  "Décide si une valeur approchée suffit ou si tu as besoin d’un résultat exact.",
  "Remplace les nombres par des nombres faciles et proches : 48 devient environ 50 ; 37 devient environ 40.",
  "Effectue le même calcul avec ces valeurs : 50 + 40 = 90. C’est l’estimation.",
  "Calcule ensuite exactement si la situation l’exige : 48 + 37 = 85.",
  "Compare les deux résultats : 85 est proche de 90. Si le calcul exact était 150, il faudrait revérifier les nombres ou l’opération."
]
exercice = "Deux boîtes fictives contiennent 26 et 41 fiches. Donne une estimation en arrondissant à la dizaine la plus proche, puis calcule le total exact."
aide = "26 est plus proche de 30 que de 20 ; 41 est plus proche de 40 que de 50. Additionne d’abord les nombres arrondis."
correction = [
  "Estimation : 26 ≈ 30 et 41 ≈ 40, donc 30 + 40 = 70 fiches environ.",
  "Calcul exact : 26 + 41 = 67 fiches.",
  "67 est proche de 70 ; l’estimation était cohérente. L’estimation n’est pas le total exact."
]
a_retenir = [
  "Arrondir facilite un calcul mental rapide, mais modifie un peu chaque nombre.",
  "Une estimation se note comme une valeur approchée ; elle ne remplace pas un résultat exact quand celui-ci est demandé.",
  "Si le résultat exact est très loin de l’estimation, vérifie les nombres, les unités et l’opération.",
  "Selon la situation, plusieurs arrondis raisonnables peuvent donner des estimations légèrement différentes."
]
transferer = "Estimer aide à prévoir une quantité, à vérifier un ticket fictif, un temps annoncé ou un total calculé. Choisis l’approximation en fonction de la question : une idée générale tolère un arrondi, tandis qu’une mesure, un paiement ou une dose exige les précautions et la précision adaptées."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

