minutes = 8
resume = "Distinguer le logiciel système qui organise l’environnement de l’appareil des applications utilisées pour une tâche."
objectif = "Classer quelques exemples fictifs comme système d’exploitation ou application et décrire leur rôle général."
situation = "Sur un appareil fictif, tu ouvres un navigateur pour consulter une page et un éditeur pour rédiger un texte. Un logiciel système permet à ces applications d’utiliser l’écran, le clavier et le stockage. Quel élément correspond au système d’exploitation ?"
analogie_titre = "Comme un régisseur qui coordonne une salle"
analogie = "Un régisseur aide plusieurs équipes à utiliser une salle, ses équipements et les créneaux disponibles. Un système d’exploitation organise aussi des ressources de l’appareil et fournit des services aux applications."
limite_analogie = "Un système d’exploitation n’est pas une personne qui décide librement. Il suit des règles et des programmes ; ses fonctions et ses réglages diffèrent selon l’appareil, la version et la configuration."
notions = [
  "Système d’exploitation — logiciel système qui fournit des fonctions de base et coordonne l’utilisation de ressources d’un appareil.",
  "Application — logiciel conçu pour accomplir une tâche, par exemple écrire un texte ou consulter le Web.",
  "Ressource — capacité utilisée par des logiciels, comme le processeur, la mémoire, le stockage ou un périphérique.",
  "Fichier — données enregistrées auxquelles une application peut accéder selon les règles du système.",
  "Permission — règle qui détermine si un compte ou un logiciel peut réaliser une action ou accéder à une ressource."
]
demarche = [
  "Repère la tâche demandée : écrire, calculer, naviguer ou organiser des fichiers.",
  "Identifie l’application qui sert directement à cette tâche.",
  "Repère le logiciel système qui fournit l’environnement et coordonne l’accès aux ressources de l’appareil.",
  "Distingue le nom d’une application de celui du système d’exploitation, même si les deux sont fournis ensemble.",
  "Souviens-toi que les permissions et les fonctions varient ; ne change aucun réglage important sans comprendre son effet."
]
exercice = "Dans un appareil fictif, un navigateur affiche une page, un éditeur ouvre un document et un système d’exploitation fournit des services aux deux applications. Classe ces trois éléments et indique lequel coordonne l’environnement logiciel de l’appareil."
aide = "Le navigateur et l’éditeur accomplissent directement des tâches. Le système d’exploitation fournit les fonctions de base utilisées par les applications."
correction = [
  "Le navigateur est une application de consultation du Web.",
  "L’éditeur est une application utilisée pour créer ou modifier un document.",
  "Le système d’exploitation coordonne l’environnement logiciel et l’accès à des ressources ; ce n’est ni le navigateur ni l’éditeur."
]
a_retenir = [
  "Le système d’exploitation fournit des fonctions de base et coordonne des ressources de l’appareil.",
  "Une application répond directement à une tâche ; elle s’appuie généralement sur l’environnement système.",
  "Fichiers, comptes et permissions dépendent des logiciels et des réglages concernés.",
  "Cette fiche ne décrit pas comment installer, mettre à jour, réparer ou modifier un système."
]
transferer = "Cette distinction peut aider à comprendre pourquoi plusieurs applications fonctionnent sur un même appareil. Pour une action réelle sur des comptes, permissions, mises à jour ou fichiers, consulte la documentation adaptée et les règles de l’organisation."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

