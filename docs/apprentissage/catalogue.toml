[[fiche]]
id = "sciences-distinguer-melange-changement-etat"
titre = "Distinguer fusion et dissolution"
matiere = "Sciences, technologie et environnement"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 2
horizon_contenu = "Premières descriptions de la fusion d’un solide et de la dissolution dans un liquide ; aucune manipulation n’est demandée"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de sciences limité à distinguer un changement d’état d’une dissolution simple. Faire relire les termes, les exemples et la précision du modèle par une personne compétente en chimie. La fiche ne propose aucun mélange ou essai réel et n’explique pas les transformations chimiques ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Reconnaître qu’un glaçon qui fond change d’état, tandis que du sucre dissous forme un mélange avec l’eau."
objectif = "Classer deux descriptions fictives comme fusion ou dissolution et expliquer ce qui change dans chaque cas."
situation = "Deux descriptions fictives : un glaçon devient de l’eau liquide dans une pièce ; du sucre est dissous dans un verre d’eau et n’est plus visible à l’œil nu. S’agit-il du même phénomène ?"
analogie_titre = "Comme comparer un glaçon qui fond et une poudre dispersée"
analogie = "Quand un glaçon fond, l’eau passe de l’état solide à l’état liquide. Quand du sucre se dissout dans l’eau, il se répartit dans le liquide et forme une solution, même s’il n’est plus visible en grains."
limite_analogie = "Ces descriptions donnent un premier modèle, pas une observation complète des particules. La quantité, la température et la nature des substances peuvent compter ; certaines matières ne se dissolvent pas de la même manière. Aucun mélange réel n’est demandé ici."
notions = [
  "État physique — forme solide, liquide ou gazeuse d’une matière dans les conditions considérées.",
  "Fusion — passage d’un solide à l’état liquide, comme la glace qui devient de l’eau liquide.",
  "Dissolution — répartition d’une substance dans un liquide pour former une solution, lorsque cette substance peut s’y dissoudre.",
  "Solution — mélange homogène à l’échelle observée, formé d’un liquide et d’une substance dissoute.",
  "Observation — ce que l’on voit ou mesure ; une substance non visible n’a pas forcément disparu."
]
demarche = [
  "Lis ce qui arrive à la matière : change-t-elle d’état, ou une substance se répartit-elle dans un liquide ?",
  "Si un solide devient liquide, nomme le changement d’état : c’est une fusion dans l’exemple du glaçon.",
  "Si une substance se répartit dans un liquide et forme une solution, décris une dissolution.",
  "Distingue ce que l’on observe — par exemple, des grains qui ne sont plus visibles — de ce que l’on conclut sur la matière.",
  "Précise les limites : toutes les substances ne se dissolvent pas dans tous les liquides et cette fiche n’explique pas les réactions chimiques."
]
exercice = "Classe chaque description fictive : A. un morceau de glace devient de l’eau liquide ; B. du sucre est réparti dans de l’eau et forme une solution. Laquelle décrit une fusion ? Laquelle décrit une dissolution ? Le sucre a-t-il simplement cessé d’exister parce qu’on ne le voit plus en grains ?"
aide = "Cherche si la matière change d’état ou si elle se répartit dans un liquide. Une apparence différente ne prouve pas que la substance a disparu."
correction = [
  "A décrit une fusion : la glace passe de l’état solide à l’état liquide.",
  "B décrit une dissolution : le sucre se répartit dans l’eau pour former une solution.",
  "Non. Le fait de ne plus voir les grains ne suffit pas à conclure que le sucre a cessé d’exister. Cette fiche ne détaille pas son comportement moléculaire."
]
a_retenir = [
  "La fusion est un changement d’état du solide vers le liquide.",
  "La dissolution forme une solution lorsque la substance peut se répartir dans le liquide.",
  "Une matière devenue invisible à l’œil nu n’est pas nécessairement absente.",
  "Cette comparaison ne permet pas de reconnaître toutes les transformations chimiques ni de prévoir si deux substances peuvent être mélangées sans risque."
]
transferer = "Ces mots aident à décrire des phénomènes dans un cours de sciences. Ne mélange pas des produits réels pour vérifier une idée : cette fiche est une lecture de situations fictives, pas une consigne d’expérience."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

