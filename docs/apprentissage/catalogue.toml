[[fiche]]
id = "econ-comparer-prix-unitaires"
titre = "Comparer deux prix à quantité égale"
matiere = "Économie, budget et consommation"
matiere_id = "economie"
domaine = "economie-finances"
niveau = 2
horizon_contenu = "Comparaison de prix et proportionnalité simple ; exemples fictifs de consommation"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome fondé sur des quantités et prix fictifs. Les calculs, la formulation du prix ramené à une unité commune, la relecture mathématique et éditoriale, les droits des sources, l’accessibilité et les essais apprenants restent à vérifier. Le résultat ne constitue pas une recommandation d’achat et ne tient pas compte de la qualité, du besoin, des promotions ou du gaspillage."
minutes = 9
resume = "Ramener des prix à la même unité pour comparer des quantités différentes, sans confondre coût du paquet et coût par unité."
objectif = "Calculer un prix rapporté à une quantité commune et distinguer cette comparaison du montant réellement payé pour un paquet."
situation = "Deux paquets fictifs du même produit pèsent 250 g et 500 g. Le premier coûte 1,50 €, le second 2,80 €. Si l’on compare le prix pour 1 kg, lequel a le prix unitaire le plus bas ?"
analogie_titre = "Comme comparer deux longueurs de ruban au prix du mètre"
analogie = "Si deux rouleaux de ruban ont des longueurs différentes, comparer seulement leur prix total ne suffit pas. On peut ramener chaque prix à un mètre, puis comparer. Pour des produits comparables vendus en quantités différentes, on peut faire la même opération avec une unité de masse ou de volume commune."
limite_analogie = "Un produit n’est pas un simple ruban : sa composition, sa qualité, son utilité, sa conservation et la quantité réellement nécessaire comptent aussi. Le prix par unité compare un aspect chiffré, pas la valeur globale ni le meilleur choix pour une personne."
notions = [
  "Prix du paquet — somme affichée pour acheter le paquet entier.",
  "Quantité — masse, volume ou nombre indiqué pour le produit ; il faut comparer des quantités de même nature.",
  "Unité commune — même quantité de référence pour les deux prix, par exemple le kilogramme pour deux produits comparés en masse.",
  "Prix unitaire — ici, prix calculé pour une unité commune ; il ne faut pas le confondre avec le prix du paquet.",
  "Proportionnalité — relation où multiplier une quantité par un nombre multiplie aussi le prix correspondant, si le tarif reste le même."
]
demarche = [
  "Vérifie que tu compares le même type de produit et la même grandeur : deux masses entre elles, deux volumes entre eux, par exemple.",
  "Note le prix total de chaque paquet et sa quantité. Si les unités diffèrent, convertis-les avant de comparer : 1 kg correspond à 1 000 g.",
  "Choisis une unité commune pratique, comme 1 kg. Calcule combien de paquets de chaque taille correspondraient à cette quantité.",
  "Multiplie le prix de chaque paquet par ce nombre. Dans la situation de départ, 250 g à 1,50 € donnent 4 × 1,50 € = 6,00 €/kg ; 500 g à 2,80 € donnent 2 × 2,80 € = 5,60 €/kg.",
  "Compare les deux prix obtenus pour 1 kg. Ici, 5,60 €/kg est inférieur à 6,00 €/kg ; c’est le prix par kilogramme le plus bas dans cet exemple.",
  "Garde le prix total du paquet séparé du prix pour 1 kg : un paquet au prix unitaire plus bas peut demander une somme plus élevée à payer maintenant."
]
exercice = "Deux paquets fictifs du même produit sont proposés : 500 g pour 3,00 € et 1 kg pour 5,50 €. Calcule le prix de chaque option pour 1 kg. Laquelle a le prix unitaire le plus bas ? Laquelle demande la somme la plus faible pour prendre un paquet ?"
aide = "Un kilogramme contient deux fois 500 g. Multiplie donc le prix du paquet de 500 g par deux ; le prix du paquet de 1 kg est déjà donné pour cette quantité."
correction = [
  "Pour 500 g à 3,00 €, le prix pour 1 kg est 2 × 3,00 € = 6,00 €/kg.",
  "Pour 1 kg à 5,50 €, le prix pour 1 kg est 5,50 €/kg. À quantité égale, cette option a donc le prix unitaire le plus bas : 5,50 € contre 6,00 € par kilogramme.",
  "Le paquet de 500 g demande la somme la plus faible à payer au moment de l’achat : 3,00 € contre 5,50 €. Le prix unitaire ne suffit pas à décider ce qui convient ; la quantité utile, la conservation, les autres caractéristiques et les conditions de l’offre comptent aussi."
]
a_retenir = [
  "Pour comparer des formats différents, ramène leurs prix à la même unité de masse, de volume ou de nombre.",
  "Vérifie les unités avant le calcul : grammes avec grammes, litres avec litres, sauf si tu les convertis correctement.",
  "Le prix unitaire et le prix du paquet répondent à deux questions différentes.",
  "Un prix ramené à une unité n’évalue ni la qualité, ni l’utilité, ni la quantité que tu pourras consommer.",
  "Les promotions, les lots, les conditions particulières ou une quantité inutilisée peuvent changer la comparaison pratique."
]
transferer = "La même démarche peut comparer le prix par kilogramme, par litre ou par article lorsque les produits, les unités et les conditions sont vraiment comparables. Sur une étiquette réelle, vérifie le prix total, l’unité, la quantité et les conditions de l’offre ; un coût unitaire plus faible n’est pas à lui seul un conseil d’achat."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

