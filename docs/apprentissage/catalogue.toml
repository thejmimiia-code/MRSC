[[fiche]]
id = "maths-fractions-recette"
titre = "Comprendre une fraction avec une recette"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 2
minutes = 9
resume = "Lire une fraction comme un nombre de parts égales."
objectif = "Interpréter un demi, un quart et trois quarts d’une quantité."
situation = "Une préparation fictive demande 600 g de farine. On veut préparer la moitié de cette quantité, puis les trois quarts."
analogie_titre = "Comme découper une tarte en parts égales"
analogie = "Le nombre du bas indique en combien de parts égales on partage l’ensemble. Le nombre du haut indique combien de parts on prend. Trois quarts, c’est trois parts quand l’ensemble est découpé en quatre parts égales."
limite_analogie = "Les parts d’une tarte semblent faciles à voir, mais les fractions décrivent aussi des nombres, des durées ou des distances. Une fraction n’est pas toujours une part matérielle que l’on peut découper."
notions = [
  "Fraction — écriture qui exprime une ou plusieurs parts égales d’un tout.",
  "Dénominateur — nombre du bas : il indique le nombre de parts égales dans le tout.",
  "Numérateur — nombre du haut : il indique combien de ces parts on prend."
]
demarche = [
  "Pour trouver la moitié, divise la quantité par 2 : 600 ÷ 2.",
  "Pour trouver un quart, divise par 4 : 600 ÷ 4.",
  "Pour trouver trois quarts, calcule un quart puis prends-en trois.",
  "Vérifie que trois quarts sont plus grands qu’un quart et plus petits que la quantité entière."
]
exercice = "Une bouteille contient 800 mL. Combien font la moitié de son contenu ? Et un quart ?"
aide = "Pour la moitié, divise par 2. Pour le quart, divise par 4."
correction = [
  "La moitié : 800 ÷ 2 = 400 mL.",
  "Un quart : 800 ÷ 4 = 200 mL.",
  "Vérification : deux quarts font la moitié, soit 400 mL."
]
a_retenir = [
  "Pour calculer une part unitaire, divise le tout par le nombre de parts égales.",
  "Pour plusieurs parts, multiplie la part unitaire par le nombre de parts prises.",
  "Vérifie si le résultat est plus petit ou plus grand que l’ensemble, selon la fraction."
]
transferer = "Tu peux réutiliser les fractions pour une recette, un temps de trajet ou une quantité partagée. Pour modifier une recette réelle, vérifie aussi les autres ingrédients et les consignes de cuisson."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

