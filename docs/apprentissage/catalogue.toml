[[fiche]]
id = "fr-comprendre-mot-contexte"
titre = "Comprendre un mot grâce à son contexte"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 1
horizon_contenu = "Premiers repères de vocabulaire en lecture ; les phrases et situations sont fictives"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de vocabulaire limité à quelques indices de contexte. Faire relire le choix des exemples, la clarté de l’explication et les mots retenus par des personnes compétentes en français et en formation de base. Le contexte suggère un sens sans toujours le prouver ; les sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 7
resume = "Utiliser les mots autour d’un terme pour proposer son sens, puis vérifier cette interprétation."
objectif = "Repérer des indices dans une phrase pour choisir entre deux sens possibles d’un mot courant."
situation = "Phrase fictive : « Jo pose la feuille sur la table, puis écrit son prénom au recto. » Ici, que désigne probablement le mot « feuille » ? Quel indice t’aide ?"
analogie_titre = "Comme utiliser les indices autour d’une empreinte"
analogie = "Une empreinte seule peut laisser plusieurs possibilités. Les traces alentour aident à formuler une hypothèse. De même, les mots qui entourent un terme donnent des indices sur le sens employé dans la phrase."
limite_analogie = "Les mots ne sont pas des traces toujours univoques : une phrase peut rester ambiguë, ironique ou incomplète. Le contexte suggère parfois un sens sans permettre de le confirmer ; il est alors utile de relire ou de consulter une définition."
notions = [
  "Sens — idée ou chose qu’un mot exprime dans un emploi donné.",
  "Polysémie — fait qu’un même mot peut avoir plusieurs sens selon l’usage.",
  "Contexte — mots, phrases et situation qui entourent un terme.",
  "Indice — élément du texte qui aide à proposer un sens, sans toujours le démontrer.",
  "Vérification — comparaison avec une autre phrase, une définition ou une personne compétente lorsque le sens reste incertain."
]
demarche = [
  "Lis la phrase entière, puis relis-la en remplaçant le mot inconnu par un espace.",
  "Cherche les mots qui décrivent une action, un objet ou une situation autour du terme.",
  "Propose un sens qui rend la phrase cohérente, sans oublier qu’il peut y avoir plusieurs hypothèses.",
  "Remplace le mot par ce sens et relis la phrase pour vérifier si elle reste compréhensible.",
  "Si deux sens restent possibles, lis les phrases voisines ou cherche une définition adaptée au contexte."
]
exercice = "Dans la phrase fictive « La feuille jaune est tombée de la branche », que désigne probablement le mot « feuille » ? Cite l’indice qui t’aide, puis explique pourquoi une autre phrase pourrait lui donner un autre sens."
aide = "Repère ce qui est tombé et d’où cela est tombé. Les mots « jaune » et « branche » donnent des indices sur le sens probable."
correction = [
  "Ici, « feuille » désigne probablement une partie de la plante : elle est jaune et tombe d’une branche.",
  "Dans « Jo pose la feuille sur la table et écrit son prénom au recto », le contexte indique plutôt une feuille de papier.",
  "Le mot seul ne suffit pas toujours : la phrase et la situation aident à choisir le sens."
]
a_retenir = [
  "Un mot peut avoir plusieurs sens ; les mots qui l’entourent aident à comprendre celui qui convient.",
  "Un indice permet de proposer une interprétation, mais pas toujours de la prouver.",
  "Relis la phrase avec le sens choisi ; si elle reste ambiguë, cherche une autre information.",
  "Un dictionnaire aide à vérifier un sens, mais il faut encore choisir la définition adaptée à la phrase."
]
transferer = "Cette démarche peut aider à lire un récit, une consigne ou un message. Pour un document important, ne devine pas le sens d’un mot déterminant : consulte le reste du texte ou demande une précision."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

