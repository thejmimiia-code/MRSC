[[fiche]]
id = "geo-lire-legende-carte"
titre = "Lire une légende sur une carte"
matiere = "Géographie et espace"
matiere_id = "geographie"
domaine = "geographie"
niveau = 1
horizon_contenu = "Premiers repères de lecture d’une légende avec une carte fictive décrite en texte"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de géographie centré sur la légende d’une carte schématique. Faire vérifier les symboles, la distinction entre catégorie et élément représenté, et les limites d’inférence par une personne compétente en cartographie. La fiche ne fournit aucun itinéraire réel et n’évalue pas l’accessibilité du terrain. Sources, droits et essais apprenants restent à contrôler."
minutes = 7
resume = "Utiliser la légende pour associer un symbole à l’élément qu’il représente sur une carte."
objectif = "Retrouver deux éléments sur une carte fictive en lisant d’abord la légende et les symboles correspondants."
situation = "Carte fictive décrite en texte : la légende indique qu’une ligne bleue représente une rivière, une zone verte un parc et une ligne grise épaisse une route. Le plan montre ces trois signes. Que représente chacun ?"
analogie_titre = "Comme le code des symboles sur une boîte de jeu"
analogie = "Un mode d’emploi peut expliquer qu’un symbole représente une action ou un objet. Une légende fait pareil pour les signes d’une carte : elle indique comment lire les couleurs, formes et traits choisis."
limite_analogie = "Les conventions varient selon les cartes et les producteurs. Une légende ne donne pas forcément toutes les informations utiles ; elle ne garantit ni que la carte est récente, ni que le lieu est accessible ou sûr."
notions = [
  "Carte — représentation simplifiée d’un espace selon une échelle et un objectif.",
  "Légende — liste ou tableau qui explique les symboles de la carte.",
  "Symbole — forme, couleur ou trait choisi pour représenter une catégorie d’élément.",
  "Catégorie — type d’élément représenté, par exemple une route ou une zone verte.",
  "Date et source — informations nécessaires pour situer la carte et savoir qui l’a produite."
]
demarche = [
  "Lis le titre et repère le sujet et la zone couverts par la carte.",
  "Cherche la légende avant d’interpréter les couleurs ou les traits.",
  "Fais correspondre un symbole de la carte avec son explication dans la légende.",
  "Vérifie si le signe représente un lieu, une ligne, une zone ou une autre catégorie.",
  "Consulte aussi la date, l’échelle, l’orientation et la source ; la légende seule ne suffit pas pour choisir un trajet réel."
]
exercice = "La légende fictive indique : triangle noir = point de vue ; ligne bleue = rivière ; zone verte = parc. Sur le plan décrit, tu vois un triangle noir près d’une ligne bleue et d’une zone verte. Quels éléments sont représentés ? Que ne peux-tu pas conclure sur leur accessibilité ?"
aide = "Associe chaque signe à l’entrée de la légende qui a la même forme ou couleur, puis nomme l’élément."
correction = [
  "Le triangle noir correspond à un point de vue, la ligne bleue à une rivière et la zone verte à un parc.",
  "La carte et sa légende ne disent pas nécessairement si le point de vue, le parc ou le chemin pour les atteindre est accessible à une personne donnée.",
  "Il faudrait une carte adaptée, des données à jour ou une information du gestionnaire pour vérifier les conditions réelles."
]
a_retenir = [
  "La légende explique les symboles choisis pour une carte donnée.",
  "Ne déduis pas le sens d’une couleur ou d’un trait sans lire cette légende.",
  "La date, l’échelle, l’orientation et la source complètent la lecture.",
  "Un symbole ne garantit ni l’état actuel du lieu, ni sa sécurité, ni son accessibilité."
]
transferer = "Ces repères peuvent aider à lire un plan de quartier, une carte thématique ou un schéma de territoire. Pour une sortie réelle, consulte des informations récentes et adaptées au besoin ; cette fiche ne donne aucun itinéraire."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

