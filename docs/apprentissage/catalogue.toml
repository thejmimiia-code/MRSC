statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome fondé sur un plan fictif et une flèche du nord explicitement indiquée. Faire vérifier les points cardinaux, l’orientation des plans et les limites d’usage par une personne compétente en géographie. Aucun trajet réel, conseil de sécurité ou garantie d’accessibilité n’est fourni ; droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Lire une flèche du nord et nommer une direction générale sur un plan simple."
objectif = "Utiliser nord, est, sud et ouest pour décrire la direction entre deux repères sur un plan dont l’orientation est connue."
situation = "Sur un plan fictif, une flèche indique le nord vers le haut de la page. La bibliothèque est au centre, le parc se trouve à l’ouest et l’arrêt de bus au sud. Dans quelle direction générale faut-il aller de la bibliothèque au parc, puis à l’arrêt ?"
analogie_titre = "Comme se repérer sur un tapis dont un bord est marqué nord"
analogie = "Si tu sais quel bord du tapis représente le nord, tu peux nommer les autres côtés et décrire une direction. Sur un plan, une flèche du nord joue ce rôle de repère avant de comparer la position de deux lieux."
limite_analogie = "Un tapis reste immobile et plat ; le terrain réel comporte des rues, des obstacles, des pentes et des accès différents. Une direction cardinale ne décrit ni un itinéraire complet, ni sa distance, ni sa sécurité ou son accessibilité."
notions = [
  "Point cardinal — l’une des quatre directions principales : nord, est, sud ou ouest.",
  "Flèche du nord — repère qui montre vers quelle direction le nord se trouve sur un plan.",
  "Orientation — position d’un plan par rapport aux directions ou à un repère choisi.",
  "Direction générale — indication d’ensemble entre deux lieux, sans décrire toutes les étapes du trajet."
]
demarche = [
  "Cherche la flèche du nord ou la rose des vents. Sans ce repère, ne suppose pas que le haut de la page correspond au nord.",
  "Repère le lieu de départ et celui d’arrivée.",
  "Si le nord pointe vers le haut, le sud est vers le bas, l’est vers la droite et l’ouest vers la gauche. Si le plan est tourné, suis la flèche plutôt que les bords de l’écran.",
  "Compare la position des deux lieux et nomme la direction générale : par exemple, le parc est à l’ouest de la bibliothèque.",
  "Pour un déplacement réel, consulte un itinéraire récent et adapté au lieu ; cette fiche ne permet pas de choisir un trajet praticable ou sûr."
]
exercice = "Sur un plan fictif dont la flèche du nord pointe vers le haut, tu es à la bibliothèque. Le jardin est à l’est et le marché au sud. Dans quelle direction générale se trouve chacun ?"
aide = "Commence par la flèche. Quand le nord pointe vers le haut, l’est est à droite et le sud en bas."
correction = [
  "Le jardin se trouve à l’est de la bibliothèque.",
  "Le marché se trouve au sud de la bibliothèque.",
  "Ces réponses indiquent une direction générale. Elles ne donnent ni les rues à suivre, ni une distance, ni les conditions d’accès."
]
