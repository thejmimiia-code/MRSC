[[fiche]]
id = "fr-reperer-idee-texte"
titre = "Repérer l’idée principale et les informations utiles"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 2
horizon_contenu = "Compréhension de textes courts et repérage d’informations ; exemples fictifs"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome avec un message entièrement fictif. La distinction entre idée principale, détail et information utile selon la question, la clarté du texte et les réponses restent à relire par une personne compétente en français et en formation d’adultes. Les textes et exercices sont originaux ; les sources, les droits, l’accessibilité et les essais apprenants restent à contrôler."
minutes = 8
resume = "Distinguer le sujet principal d’un texte des détails qui répondent à une question précise."
objectif = "Résumer un court message fictif en une phrase et retrouver les informations utiles à une question donnée."
situation = "Message fictif : « La permanence de réparation, prévue lundi, est déplacée au jeudi 14 mai, de 16 h à 18 h, dans la salle du centre. Les objets doivent être déposés avant 15 h 45. Les inscriptions déjà faites restent valables. » Tu veux savoir ce qui change et à quelle heure apporter un objet."
analogie_titre = "Comme lire le titre d’un dossier, puis chercher la bonne pièce"
analogie = "Le titre d’un dossier indique son sujet ; les pages à l’intérieur donnent les détails. De même, une idée principale aide à dire de quoi parle un texte, tandis que certains détails répondent à une question précise : quand, où, pour qui ou sous quelle condition."
limite_analogie = "Un texte n’est pas toujours un dossier avec un seul titre. Il peut développer plusieurs idées importantes, et le détail utile dépend de la question que l’on se pose. Un résumé doit rester fidèle au texte, sans ajouter une interprétation comme si elle était écrite."
notions = [
  "Sujet — thème général dont parle un texte.",
  "Idée principale — information centrale que le texte cherche surtout à communiquer dans le passage étudié.",
  "Détail — élément qui précise, illustre ou limite l’information principale.",
  "Information explicite — information écrite directement dans le texte.",
  "Déduction — conclusion que l’on tire en reliant des indices ; elle doit être distinguée des mots réellement écrits."
]
demarche = [
  "Lis le texte en entier une première fois pour comprendre la situation générale.",
  "Demande-toi de quoi le passage parle principalement et quelle information nouvelle il apporte.",
  "Résume cette idée avec tes mots, en une phrase courte. Vérifie que ta phrase ne change pas le sens du texte.",
  "Relis la question. Repère les détails qui y répondent : une date, une heure, un lieu, une action ou une condition.",
  "Sépare ce qui est écrit de ce que tu en déduis. Si un détail nécessaire manque, le texte ne permet peut-être pas de répondre à tout."
]
exercice = "Message fictif : « L’atelier de couture aura lieu samedi 20 juin, de 10 h à 11 h, dans la salle 4. Tu peux apporter un vêtement à réparer, mais ce n’est pas obligatoire. L’entrée est gratuite. » En une phrase, indique l’idée principale. Puis trouve l’heure et le lieu, et dis si apporter un vêtement est obligatoire."
aide = "Repère d’abord ce qui est annoncé. Ensuite, cherche les mots qui répondent séparément à « quand ? », « où ? » et « faut-il apporter quelque chose ? »."
correction = [
  "Idée principale possible : un atelier de couture est organisé le samedi 20 juin.",
  "Il a lieu de 10 h à 11 h, dans la salle 4.",
  "Non. Le texte dit que l’on peut apporter un vêtement, mais que ce n’est pas obligatoire. D’autres résumés fidèles sont possibles s’ils gardent ces informations distinctes."
]
a_retenir = [
  "L’idée principale résume le message ; les détails répondent à des questions précises.",
  "La question aide à choisir les détails utiles, mais elle ne doit pas changer ce que dit le texte.",
  "Une déduction n’est pas forcément écrite : présente-la comme une interprétation et vérifie ses indices.",
  "Si le texte ne donne pas une information, mieux vaut le dire que la deviner."
]
transferer = "Cette démarche peut aider à lire une annonce, un courriel, une consigne ou une page d’information. Pour un formulaire, une décision juridique ou une démarche importante, cette fiche ne remplace pas la lecture de toutes les conditions ni une vérification auprès du service compétent."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

