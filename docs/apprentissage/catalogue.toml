  "Pour comparer des territoires, vérifie la date, l’échelle, la légende et la source des données."
]
transferer = "Cette méthode peut aider à lire une carte, une photo légendée ou une description de territoire. Les populations et leurs activités ne se déduisent pas d’un paysage seul ; utilise des données contextualisées et respecte les personnes concernées."
