[[fiche]]
id = "numerique-ia-usages"
titre = "Choisir un usage de l’IA et garder la main"
matiere = "Numérique et intelligence artificielle"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 2
minutes = 10
resume = "Comparer plusieurs usages d’IA et décider ce qu’on peut leur confier sans abandonner la vérification."
objectif = "Repérer si un outil génère, classe, recommande, prédit ou agit, puis adapter le contrôle au contexte."
situation = "Une application suggère une vidéo, un outil résume une consigne, un service traduit un message et un logiciel classe des candidatures. Ces outils ne font pas le même travail et n’ont pas les mêmes conséquences."
analogie_titre = "Comme choisir le bon outil dans une boîte à outils"
analogie = "Un tournevis, une pince et un mètre servent à des tâches différentes. Pour un outil d’IA, commence par nommer le besoin : rédiger, résumer, traduire, reconnaître, recommander, classer, prévoir ou commander une action. Ensuite, demande-toi comment vérifier le résultat."
limite_analogie = "Une IA n’est pas un outil mécanique dont le résultat serait toujours prévisible : elle peut se tromper, refléter des biais, changer selon les données et traiter des informations selon les règles du service. Les catégories se recoupent et cette carte n’énumère pas tous les usages."
notions = [
  "Générer — produire ou transformer du texte, une image, une voix, une vidéo ou du code.",
  "Recommander ou classer — trier des contenus ou des personnes, puis en proposer certains avant d’autres.",
  "Prédire ou aider à décider — estimer un résultat à partir de données ; une estimation n’est pas une certitude.",
  "Automatiser — déclencher une action ou piloter un équipement, parfois avec une supervision humaine."
]
demarche = [
  "Nomme la tâche exacte et le besoin : que veux-tu obtenir, et une IA est-elle nécessaire ?",
  "Repère les données que l’outil demande. N’envoie pas d’informations personnelles, confidentielles ou professionnelles dans un service non approuvé.",
  "Évalue les conséquences d’une erreur : une idée de brouillon n’a pas le même enjeu qu’une décision de santé, d’emploi, d’argent ou de droits.",
  "Vérifie le résultat avec une source ou une personne compétente, garde une possibilité de correction et décide toi-même si tu peux t’y fier."
]
exercice = "Associe chaque exemple à un rôle possible : un assistant qui rédige un brouillon, une plateforme qui propose une chanson, un outil qui classe des dossiers, un programme qui estime la demande d’électricité. Quel contrôle prévoirais-tu ?"
aide = "Plusieurs rôles peuvent coexister. Pour chaque cas, demande : qu’est-ce qui entre, qu’est-ce qui sort et qui vérifie avant une conséquence importante ?"
correction = [
  "Le brouillon mobilise une IA générative ; la chanson relève d’une recommandation ; le classement organise des dossiers ; l’estimation de demande relève d’une prédiction.",
  "Les catégories peuvent se combiner : un système de recommandation peut aussi prédire ce qui intéressera une personne.",
  "Il faut vérifier le contenu du brouillon, comprendre les critères de classement et comparer une prédiction à des données réelles. Plus l’effet sur les personnes est important, plus le contrôle humain, l’explication et le recours comptent."
]
a_retenir = [
  "Commence par l’usage et ses conséquences, pas par l’étiquette « IA ».",
  "Générer, recommander, classer, prédire et agir sont des rôles différents, qui peuvent se combiner.",
  "Une réponse plausible n’est pas une preuve ; la personne ou l’organisation qui utilise l’outil reste responsable de ses vérifications."
]
transferer = "Cette grille peut servir pour un chatbot, une traduction, un filtre anti-spam, un moteur de recherche, un outil de recrutement, une caméra, un service de santé ou un équipement automatisé. Les règles et les risques dépendent du contexte ; cette fiche n’est ni un avis juridique ni une liste exhaustive."
revue_le = "2026-10-07"
intervalle_revue_jours = 180

