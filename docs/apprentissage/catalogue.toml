[[fiche]]
id = "maths-lire-graphique"
titre = "Lire un tableau ou un graphique sans tirer de conclusion trop vite"
matiere = "Mathématiques et données"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 3
minutes = 9
resume = "Repérer le titre, les unités, la valeur la plus élevée et la portée des données."
objectif = "Extraire une information chiffrée et distinguer ce que les données montrent de ce qu’elles ne prouvent pas."
situation = "Exemple entièrement fictif : un tableau indique le nombre de personnes présentes à un atelier sur trois jours : lundi 6, mardi 8, mercredi 5."
analogie_titre = "Comme lire un panneau avant de prendre une route"
analogie = "Le titre, les axes et les unités sont comme les indications d’un panneau : ils disent ce que l’on regarde et dans quelle mesure. Sans eux, on risque de comparer des nombres qui ne parlent pas de la même chose."
limite_analogie = "Un panneau indique un chemin ; des données décrivent seulement les mesures recueillies. Elles ne disent pas toujours pourquoi un changement a eu lieu ni ce qui se passera ensuite."
notions = [
  "Titre — indique généralement le sujet des données.",
  "Unité — précise ce que l’on compte ou mesure, par exemple des personnes ou des euros.",
  "Tendance — évolution visible sur plusieurs mesures ; elle ne démontre pas à elle seule sa cause."
]
demarche = [
  "Lis le titre et la période avant de regarder les chiffres.",
  "Repère l’unité et les catégories comparées.",
  "Lis les valeurs avec leurs intitulés ; compare seulement ce qui est comparable.",
  "Sépare le constat (« mardi a la valeur la plus grande ») de l’explication (« pourquoi ? »)."
]
exercice = "Avec les trois nombres fictifs de la situation, quel jour a le plus de présences ? Combien y en a-t-il au total ? Peut-on conclure que les présences augmentent chaque jour ?"
aide = "Compare 6, 8 et 5. Pour le total, additionne-les. Pour la dernière question, regarde si chaque valeur est plus grande que la précédente."
correction = [
  "Mardi a la valeur la plus élevée : 8 présences.",
  "Total des trois jours : 6 + 8 + 5 = 19 présences.",
  "Non, les nombres n’augmentent pas chaque jour : 6 devient 8 puis 5. Et trois journées fictives ne suffiraient pas à expliquer les causes d’une évolution réelle."
]
a_retenir = [
  "Un nombre se lit avec son titre, sa période et son unité.",
  "Un constat chiffré n’est pas encore une explication.",
  "Un exemple fictif ne décrit pas une fréquentation réelle."
]
transferer = "La démarche sert à lire un graphique dans un journal, une facture, un rapport ou un tableau de travail. Pour une décision importante, consulte la source et la méthode de collecte des chiffres."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

