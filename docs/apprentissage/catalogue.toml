[[fiche]]
id = "recherche-lire-etude"
titre = "Lire une étude sans confondre résultats et certitudes"
matiere = "Méthodes de recherche et esprit critique"
matiere_id = "recherche"
domaine = "etudes-superieures-recherche"
niveau = 4
horizon_contenu = "Post-bac, licence, master et doctorat — selon la discipline"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Une relecture spécialisée et des essais avec des personnes apprenantes restent à effectuer avant toute diffusion publique."
minutes = 15
resume = "Examiner la question, les observations, la méthode et les limites d’une étude avant de reprendre sa conclusion."
objectif = "Distinguer ce qui a été observé de ce qui est interprété, puis déterminer ce qu’une étude permet ou ne permet pas de conclure."
situation = "Exemple entièrement fictif : une petite équipe compare un carnet papier et une application pour organiser des tâches. Après deux semaines, les volontaires qui ont choisi l’application déclarent en moyenne avoir terminé plus de tâches que ceux qui ont choisi le carnet. Peut-on conclure que l’application en est la cause ?"
analogie_titre = "Comme tester deux façons d’organiser une semaine"
analogie = "Imagine deux groupes qui essaient chacun une manière différente de préparer leur semaine. Pour comparer, il faut savoir qui a choisi chaque méthode, quelles tâches comptent, comment on mesure qu’elles sont terminées et si les semaines se ressemblent. Une étude doit rendre visibles les mêmes éléments : la question, les personnes ou phénomènes observés, la mesure et les conditions de comparaison."
limite_analogie = "Une recherche peut porter sur des textes, des entretiens, une expérience en laboratoire, des archives, un modèle mathématique ou d’autres objets. Elle ne se réduit pas toujours à deux groupes comparables ; les disciplines ont plusieurs méthodes valables. L’image sert à poser des questions, pas à imposer une recette unique."
notions = [
  "Question de recherche — question précise à laquelle l’étude cherche à répondre.",
  "Méthode — manière de choisir les observations ou données et de les analyser.",
  "Résultat — constat rapporté à partir des observations ou de l’analyse.",
  "Interprétation — explication proposée par les auteurs pour donner du sens aux résultats.",
  "Limite — élément qui réduit la portée d’une conclusion ou laisse une autre explication possible.",
  "Généralisation — extension d’un constat au-delà des personnes, documents ou situations étudiés ; elle doit être justifiée."
]
demarche = [
  "Formule la question en une phrase : quel phénomène est étudié, auprès de qui ou à partir de quelles données, et dans quelles conditions ? Si tu ne peux pas répondre, lis le résumé et le début du texte pour retrouver le but annoncé.",
  "Sépare trois colonnes dans tes notes : ce qui a été mesuré ou observé, ce que les auteurs en déduisent, et ce qui reste incertain. Un titre ou un résumé peut condenser le propos ; vérifie les données et le contexte avant de reprendre une affirmation.",
  "Repère le type de publication : étude avec nouvelles données, synthèse de plusieurs travaux, article théorique ou autre forme. Les questions à poser changent selon son objectif ; toutes les publications ne décrivent pas une expérience avec des participants.",
  "Examine la méthode adaptée à cette publication : comment les participants, documents ou travaux ont été choisis, comment les matériaux ont été analysés, quelles comparaisons ont été faites et quelles données manquent. Dans un travail qualitatif, regarde aussi comment les interprétations sont construites ; ne cherche pas forcément un pourcentage.",
  "Vérifie si le résultat répond bien à la question initiale. Pour une étude quantitative, repère les tailles de groupe, les écarts et l’incertitude quand ces éléments sont pertinents ; une différence observée ne prouve pas à elle seule une cause.",
  "Cherche les limites et les explications alternatives : choix des participants, mesure imprécise, durée courte, facteur extérieur, contexte très particulier ou données manquantes. Demande à quelles situations le résultat pourrait raisonnablement s’appliquer.",
  "Avant une décision importante, compare l’étude à d’autres travaux pertinents, à une revue de littérature ou à une source de synthèse adaptée. L’évaluation par des pairs est un contrôle utile, pas une garantie qu’il n’y a ni erreur ni débat."
]
exercice = "Dans l’exemple fictif, les volontaires ont choisi eux-mêmes entre le carnet et l’application ; après deux semaines, l’équipe a recueilli leurs déclarations sur les tâches terminées. Quelle observation peut-elle rapporter ? Quelle conclusion causale ne peut-elle pas encore établir ? Cite deux informations supplémentaires à rechercher."
aide = "Commence par séparer le résultat mesuré de l’explication « l’application a aidé ». Demande ensuite si les personnes des deux groupes se ressemblaient et si elles ont compris et déclaré les tâches de la même façon."
correction = [
  "Observation possible : dans ce petit groupe et pendant ces deux semaines, les personnes ayant choisi l’application ont déclaré avoir terminé en moyenne plus de tâches. Ce constat porte sur leurs déclarations et sur ce groupe précis.",
  "On ne peut pas conclure que l’application a causé la différence : les personnes l’ont choisie elles-mêmes et peuvent différer par leur disponibilité, leur motivation ou le type de tâches.",
  "À rechercher : combien de personnes ont participé et combien ont abandonné ; comment les tâches ont été définies et comptées ; si un groupe de comparaison existait ; si les résultats se maintiennent sur une période plus longue.",
  "Une étude mieux contrôlée pourrait réduire certaines explications alternatives, mais elle devrait aussi respecter l’éthique, la vie privée et les limites du contexte. D’autres méthodes peuvent convenir à d’autres questions."
]
a_retenir = [
  "Résultat observé, interprétation et conclusion ne sont pas la même chose.",
  "La méthode doit être adaptée à la question et décrite avec assez de précision pour être examinée.",
  "Une association ou une différence ne démontre pas automatiquement une relation de cause à effet.",
  "Les limites ne rendent pas une étude inutile : elles précisent ce qu’elle apporte et ce qu’il reste à vérifier.",
  "Une publication est une contribution à discuter avec d’autres travaux, pas une vérité définitive à elle seule."
]
transferer = "Cette grille peut aider à lire une étude en sciences, en santé, en économie ou en sciences sociales, mais les méthodes, critères de preuve et règles d’éthique varient selon les domaines. Pour une décision médicale, juridique ou financière, consulte des sources et personnes compétentes du domaine plutôt que de te fier à une seule étude."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

