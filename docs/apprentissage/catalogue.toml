[[fiche]]
id = "numerique-organiser-fichiers"
titre = "Nommer et retrouver ses fichiers sans exposer ses données"
matiere = "Numérique et usages du quotidien"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 2
horizon_contenu = "Organisation générale de fichiers, sans dépendre d’un appareil ou d’un logiciel précis"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon généraliste qui ne suppose ni système d’exploitation ni service de stockage particulier. Faire vérifier les termes fichier, dossier, extension, version et sauvegarde, ainsi que les conseils de confidentialité et leurs limites par une personne compétente en numérique. Les étapes varient selon les outils ; aucun fichier réel, partage ou suppression n’est demandé. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 9
resume = "Choisir des noms compréhensibles, retrouver un document et éviter de partager des informations sensibles par erreur."
objectif = "Créer une convention simple de nommage et retrouver un fichier sans modifier son format ni révéler de données personnelles."
situation = "Dans un dossier fictif, tu vois « document.pdf », « document-final.pdf » et « document-final2.pdf ». Tu cherches le planning corrigé d’une réunion. Comment pourrais-tu nommer une nouvelle version pour la retrouver plus facilement, sans inscrire de renseignement personnel dans son nom ?"
analogie_titre = "Comme classer des papiers dans des chemises étiquetées"
analogie = "Une chemise marquée « planning réunion — octobre » est plus facile à retrouver qu’une chemise appelée « papier 2 ». Un nom de fichier peut aussi annoncer son sujet et, si nécessaire, sa date ou sa version. Un dossier joue le rôle d’un rangement pour des fichiers liés."
limite_analogie = "Un ordinateur peut rechercher, trier, masquer ou partager des fichiers d’une manière qui dépend du logiciel et des réglages. Un nom clair ne remplace ni une sauvegarde, ni le contrôle des personnes qui ont accès au dossier."
notions = [
  "Fichier — document numérique enregistré, par exemple un texte, une image ou un PDF.",
  "Dossier — emplacement qui rassemble des fichiers ou d’autres dossiers.",
  "Nom de fichier — texte qui aide à reconnaître le contenu ; il peut contenir un sujet, une date ou une version utile.",
  "Extension — partie finale du nom, souvent après un point, qui indique le format comme .pdf ; la renommer ne convertit pas le document.",
  "Sauvegarde — copie conservée séparément pour pouvoir retrouver un document si l’original est perdu ou abîmé."
]
demarche = [
  "Choisis un nom court qui décrit le contenu : par exemple « planning-reunion » plutôt que « document-final2 ».",
  "Si plusieurs versions existent, ajoute une date ou un numéro cohérent, par exemple « planning-reunion-2026-10-v02 ». Évite « final-final » et vérifie quelle version est réellement la plus récente.",
  "Range les fichiers liés dans un dossier au nom clair et garde une organisation simple que tu peux retrouver.",
  "Préserve l’extension du fichier : renommer « rapport.pdf » en « rapport.docx » ne transforme pas son format.",
  "Avant d’écraser ou de remplacer un document important, vérifie qu’une copie utile existe. Les options de sauvegarde varient selon l’appareil, l’organisation et les règles applicables.",
  "Avant de partager un fichier ou son dossier, vérifie le destinataire, les droits d’accès et les informations personnelles contenues dans le nom ou le document."
]
exercice = "Tu crées la deuxième version d’un planning fictif de réunion prévu pour octobre 2026. Propose un nom qui indique le sujet, la période et la version, sans nom de personne ni adresse. Que faut-il éviter de modifier si tu veux garder le même format ?"
aide = "Tu peux utiliser l’ordre « sujet-période-version », par exemple « planning-reunion-2026-10-v02 ». L’extension du format est différente du numéro de version."
correction = [
  "Exemple de nom : « planning-reunion-2026-10-v02 ». Une autre convention claire peut aussi convenir.",
  "Garde l’extension qui indique le format, par exemple .pdf si le document est un PDF ; changer le texte de l’extension ne convertit pas le fichier.",
  "Le nom et le rangement aident à retrouver le document, mais ne garantissent pas qu’il est sauvegardé ou que son partage est limité aux bonnes personnes."
]
a_retenir = [
  "Un nom descriptif et une organisation constante facilitent la recherche.",
  "Une date ou un numéro de version peut aider si plusieurs documents proches coexistent.",
  "Ne confonds pas le nom du fichier, son extension et son format réel.",
  "Une sauvegarde, une autorisation de partage et un nom clair sont trois choses différentes.",
  "N’inscris pas de donnée sensible dans un nom de fichier et vérifie le contenu avant de le transmettre."
]
transferer = "La convention peut servir pour des courriels enregistrés, des photos, des documents de travail ou des projets partagés. Les menus et fonctions changent selon les outils ; si tu ne sais pas où un fichier est enregistré ou qui peut le voir, demande une vérification avant de le déplacer, supprimer ou partager."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

