[[fiche]]
id = "arts-lire-image"
titre = "Observer une image avant de l’interpréter"
matiere = "Arts visuels et médias"
matiere_id = "arts"
domaine = "arts-culture"
niveau = 2
minutes = 8
resume = "Séparer les éléments visibles, l’effet produit et l’interprétation personnelle."
objectif = "Décrire une image avec des indices précis avant d’en déduire une intention."
situation = "Image fictive : une affiche montre un vélo rouge au centre, une rue sombre à l’arrière-plan et le texte « Choisissez la liberté »."
analogie_titre = "Comme un projecteur qui attire le regard"
analogie = "La taille, le contraste et la place d’un élément peuvent guider le regard, comme un projecteur sur une scène. Repérer d’abord ce qui est visible aide à expliquer ensuite pourquoi un détail attire l’attention."
limite_analogie = "Une image n’a pas toujours un seul projecteur ou une intention unique. Les personnes peuvent la lire différemment selon leur expérience et leur culture."
notions = [
  "Description — ce qui est effectivement visible ou écrit dans l’image.",
  "Interprétation — idée que l’on construit à partir des indices visibles.",
  "Cadrage — partie de la scène montrée, et partie laissée hors de l’image."
]
demarche = [
  "Nomme trois détails visibles sans expliquer ce qu’ils signifient.",
  "Observe ce qui est grand, coloré, centré ou répété.",
  "Lis le texte et repère l’auteur, le contexte et le public visé si ces informations sont disponibles.",
  "Propose une interprétation et indique les indices qui te l’ont suggérée."
]
exercice = "Dans l’affiche fictive, donne deux faits visibles et une interprétation possible. Quel détail de l’image soutient cette interprétation ?"
aide = "Un fait visible peut être « le vélo est rouge et au centre ». Une interprétation est une idée que tu proposes, pas une observation directe."
correction = [
  "Faits visibles : le vélo est rouge, il est placé au centre ; une rue sombre apparaît derrière lui ; le texte dit « Choisissez la liberté ».",
  "Interprétation possible : l’affiche associe le vélo à la liberté ou veut donner envie de le choisir. Le texte et la place centrale du vélo sont des indices.",
  "Cette lecture est une hypothèse : il faudrait connaître l’auteur, le produit et le contexte pour aller plus loin."
]
a_retenir = [
  "Décris d’abord ce que tu vois ; explique ensuite ce que tu en déduis.",
  "Une image est cadrée : certaines choses sont montrées, d’autres restent hors champ.",
  "Justifie une interprétation par des indices et laisse la place à d’autres lectures."
]
transferer = "Cette grille peut servir pour une affiche, une photographie, une publicité, une œuvre d’art ou une image partagée en ligne. Elle ne prouve pas à elle seule l’intention réelle de son auteur."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

