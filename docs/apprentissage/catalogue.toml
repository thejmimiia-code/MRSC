[[fiche]]
id = "langue-anglais-direction"
titre = "Demander son chemin en anglais"
matiere = "Langue étrangère : anglais"
matiere_id = "langues"
domaine = "langues-etrangeres"
niveau = 1
minutes = 7
resume = "Utiliser quelques phrases courtes pour demander une direction et remercier."
objectif = "Comprendre et réutiliser quatre expressions simples dans une situation de voyage."
situation = "Tu es dans une gare et tu cherches la sortie. Tu peux demander : « Excuse me, where is the exit? »"
analogie_titre = "Comme garder quelques outils dans sa poche"
analogie = "On n’a pas besoin de connaître tout un dictionnaire pour commencer une conversation. Quelques expressions utiles sont comme de petits outils : choisis celui qui correspond à la situation et complète-le avec un mot connu."
limite_analogie = "Une phrase apprise ne garantit pas que chacun la comprendra dans toutes les régions ou tous les contextes. L’accent, le bruit et les habitudes locales peuvent changer l’échange."
notions = [
  "Excuse me — formule polie pour attirer l’attention ou demander à passer.",
  "Where is…? — « Où se trouve… ? ».",
  "Could you…? — début d’une demande polie, comme « Pourriez-vous… ? »."
]
demarche = [
  "Écoute ou lis l’expression entière avant de la répéter.",
  "Remplace le lieu recherché : station (gare), exit (sortie), bus stop (arrêt de bus).",
  "Ajoute « please » pour formuler une demande polie.",
  "Termine par « Thank you » pour remercier. Tu peux aussi montrer une carte si les mots manquent."
]
exercice = "Complète et lis à voix haute, dans ta tête ou avec une personne, cette demande : « Excuse me, where is the ___, please? » Choisis : station, exit ou bus stop."
aide = "La structure est la même ; seul le lieu recherché change."
correction = [
  "Exemple : « Excuse me, where is the station, please? » — « Excusez-moi, où se trouve la gare, s’il vous plaît ? »",
  "Tu peux aussi demander : « Could you show me on the map, please? » — « Pourriez-vous me montrer sur la carte, s’il vous plaît ? »",
  "Prononciation et formulation peuvent varier ; demander de répéter est normal."
]
a_retenir = [
  "Excuse me attire poliment l’attention.",
  "Where is…? demande où se trouve un lieu.",
  "Une carte ou un geste peut compléter les mots."
]
transferer = "Tu peux remplacer le lieu par un autre nom connu et utiliser la même structure. Cette fiche est un petit point de départ ; elle ne couvre pas toute la langue anglaise."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

