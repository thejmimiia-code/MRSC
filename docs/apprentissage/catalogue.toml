[[fiche]]
id = "fr-lire-consigne"
titre = "Lire une consigne en repérant l’action"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 1
minutes = 7
resume = "Repérer ce qu’il faut faire, sur quoi, et sous quelle condition."
objectif = "Comprendre l’action demandée sans devoir deviner les étapes."
situation = "Consigne fictive : « Lisez la note, repérez la date et écrivez une question à poser. »"
analogie_titre = "Comme une petite recette"
analogie = "Dans une recette, le verbe indique le geste, l’ingrédient dit ce qu’on manipule et les détails précisent comment. Dans une consigne, le verbe d’action dit quoi faire, le complément indique sur quoi, et les conditions ajoutent les limites."
limite_analogie = "Une recette suit souvent un ordre de cuisine. Une consigne peut être plus libre : lis-la en entier et vérifie le résultat attendu avant de commencer."
notions = [
  "Verbe d’action — mot qui annonce un geste, comme lire, comparer, entourer ou écrire.",
  "Complément — mot ou groupe de mots qui précise ce que l’action concerne.",
  "Condition — détail à respecter, comme une date, un nombre d’éléments ou un ordre."
]
demarche = [
  "Lis toute la phrase une première fois, sans t’arrêter sur chaque mot.",
  "Repère les verbes qui demandent une action : lire, repérer, écrire.",
  "Pour chaque verbe, demande-toi : quoi ? sur quel document ? combien ? dans quel ordre ?",
  "Redis la consigne avec tes propres mots avant de répondre."
]
exercice = "Dans cette consigne inventée, que faut-il faire en premier et quelle information faut-il noter ? « Entourez la salle B sur le plan, puis notez l’heure indiquée à côté. »"
aide = "Cherche d’abord les mots qui se terminent par -ez : ils donnent ici les actions. Le mot « puis » indique un ordre."
correction = [
  "Première action : entourer la salle B sur le plan.",
  "Deuxième action : noter l’heure indiquée à côté de cette salle. Le plan et l’heure sont les éléments à repérer."
]
a_retenir = [
  "Le verbe donne souvent l’action à faire.",
  "Les petits mots comme « puis », « avant » ou « seulement » changent parfois l’ordre ou les limites.",
  "Tu peux reformuler la consigne avant d’agir."
]
transferer = "Cette méthode peut servir pour lire une notice, un planning, une demande de travail ou un formulaire. Si une consigne reste ambiguë, demander une précision est une stratégie utile."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

