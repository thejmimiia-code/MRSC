[[fiche]]
id = "histoire-lire-frise"
titre = "Lire une frise chronologique et ordonner des événements"
matiere = "Histoire et chronologie"
matiere_id = "histoire"
domaine = "histoire-memoire"
niveau = 1
horizon_contenu = "Premiers repères de chronologie ; exemple de dates entièrement fictif et dans un même mois"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome utilisant uniquement une séquence fictive de dates du même mois. Faire vérifier la distinction entre ordre chronologique, date et intervalle, ainsi que la lisibilité de l’échelle. La fiche ne donne aucun repère historique de fond et ne prétend pas représenter une chronologie exhaustive ; relectures, droits et essais apprenants restent à faire."
minutes = 8
resume = "Placer des événements dans l’ordre des dates et distinguer une date d’un intervalle."
objectif = "Lire une frise simple, repérer ce qui arrive avant ou après et calculer le temps entre deux dates proches."
situation = "Un jardin collectif fictif suit trois étapes : réunion de préparation le 6 mai, livraison des outils le 13 mai, puis ouverture au public le 20 mai. Quelle étape arrive en premier ? Combien de jours séparent la réunion de la livraison ?"
analogie_titre = "Comme une règle posée le long du temps"
analogie = "Une frise place des repères le long d’une ligne. Sur une règle, les marques les plus éloignées correspondent à une plus grande longueur ; sur une frise avec une échelle régulière, leur écart représente un temps plus long. Les dates permettent aussi de classer les événements."
limite_analogie = "Une frise peut choisir seulement certains événements, et son échelle n’est pas toujours régulière. La place d’un événement sur la ligne ne prouve pas qu’il a causé celui qui vient ensuite ; les exemples de cette fiche ne sont pas des faits historiques."
notions = [
  "Chronologie — classement d’événements selon le moment où ils ont eu lieu.",
  "Frise chronologique — représentation qui place des dates ou événements sur une ligne du temps.",
  "Date — repère qui situe un jour, un mois et une année, selon le calendrier utilisé.",
  "Intervalle — temps qui sépare deux dates ou deux événements ; ce n’est pas la durée de chaque événement.",
  "Échelle — relation entre la distance représentée sur la ligne et le temps correspondant, lorsqu’elle est indiquée et régulière."
]
demarche = [
  "Lis le titre, les dates et le sens de lecture de la frise. Vérifie la période représentée et l’unité utilisée.",
  "Place chaque événement près de sa date, puis compare les dates pour trouver l’ordre.",
  "Pour trouver un intervalle, compte le temps entre deux dates. Dans le même mois, du 6 au 13 mai, il s’écoule 7 jours.",
  "Distingue la date de l’événement de sa durée : une date indique quand il arrive, tandis qu’une durée indique combien de temps il se poursuit.",
  "Ne déduis pas une cause d’une simple succession. Pour étudier un fait historique réel, il faut aussi examiner les sources, le contexte et les interprétations."
]
exercice = "Une exposition fictive est préparée le 3 juin, installée le 10 juin et ouverte le 17 juin de la même année. Range ces événements du premier au dernier. Combien de jours séparent la préparation de l’installation ?"
aide = "Les trois dates sont dans le même mois : compare les nombres 3, 10 et 17, puis calcule l’écart entre 3 et 10."
correction = [
  "Ordre chronologique : préparation le 3 juin, installation le 10 juin, ouverture le 17 juin.",
  "Du 3 au 10 juin, il s’écoule 7 jours.",
  "L’intervalle de sept jours ne dit pas combien de temps chaque étape dure et ne prouve pas qu’une étape a causé la suivante."
]
a_retenir = [
  "La date sert à situer un événement ; l’intervalle mesure le temps entre deux repères.",
  "Vérifie l’année, le mois, le calendrier et l’échelle quand tu lis une frise.",
  "Une frise sélectionne et organise des informations ; elle n’est pas l’histoire entière.",
  "Une succession d’événements ne suffit pas à établir un lien de cause à effet."
]
transferer = "La même lecture peut servir pour une chronologie de projet ou une frise historique. Pour les événements réels, consulte des sources datées et contextualisées ; cette fiche n’apporte pas elle-même de contenu historique ni d’interprétation sur une période."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

