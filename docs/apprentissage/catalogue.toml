[[fiche]]
id = "sciences-cycle-vie-plante"
titre = "Repérer les grandes étapes de vie d’une plante à fleurs"
matiere = "Sciences, technologie et environnement"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 2
horizon_contenu = "Premiers repères sur un cycle simple de plante à fleurs ; description fictive sans expérience ni conseil de culture"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de biologie limité à un cycle de vie simplifié pour certaines plantes à fleurs. Faire vérifier les termes, l’ordre des étapes et les limites par une personne compétente en biologie. Les cycles varient selon les espèces ; aucun essai de culture, ingestion ou conseil horticole n’est demandé. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Ordonner quelques étapes d’un cycle de plante à fleurs sans prétendre décrire toutes les plantes."
objectif = "Placer graine, germination, jeune pousse et production de nouvelles graines dans un cycle fictif simple."
situation = "Schéma verbal fictif d’une plante annuelle à fleurs : une graine germe, une jeune pousse grandit, la plante adulte produit des fleurs puis des graines. Quelles étapes se suivent et pourquoi parle-t-on de cycle ?"
analogie_titre = "Comme une boucle de transformation avec de nouvelles graines"
analogie = "Pour certaines plantes à fleurs, une graine peut donner une jeune plante qui grandit et produit de nouvelles graines. La suite peut recommencer avec ces graines, même si chaque plante et chaque environnement ont leurs particularités."
limite_analogie = "Toutes les plantes ne suivent pas exactement ce schéma : certaines se reproduisent autrement ou vivent plusieurs années. Un schéma de cycle simplifie une diversité importante et n’indique pas à lui seul les conditions nécessaires à une espèce particulière."
notions = [
  "Graine — structure qui peut donner une nouvelle plante lorsque les conditions adaptées sont réunies.",
  "Germination — début du développement d’une plante à partir d’une graine.",
  "Jeune pousse — plante en croissance après les premières étapes de germination.",
  "Plante adulte — étape où certaines plantes à fleurs peuvent produire fleurs puis graines.",
  "Cycle de vie — suite d’étapes qui se répètent d’une génération à l’autre, avec des variations entre espèces."
]
demarche = [
  "Lis le titre et vérifie de quelle plante ou de quel groupe parle le schéma.",
  "Repère la première étape décrite : ici, la graine.",
  "Suis les changements annoncés : germination, jeune pousse, plante adulte, fleurs et graines.",
  "Replace les étapes dans l’ordre et explique comment de nouvelles graines peuvent relancer le cycle.",
  "Note les limites : ce cycle simplifié ne décrit pas toutes les plantes ni toutes les conditions de croissance."
]
exercice = "Dans l’exemple fictif, remets en ordre : plante adulte qui produit des graines ; jeune pousse ; graine qui germe. Quelle étape peut recommencer le cycle ?"
aide = "Commence par ce qui se trouve avant la jeune pousse, puis cherche ce que la plante adulte produit dans ce schéma."
correction = [
  "Ordre : une graine germe, devient une jeune pousse, puis une plante adulte qui produit des graines.",
  "Les nouvelles graines peuvent initier un cycle suivant lorsque les conditions adaptées sont réunies.",
  "Ce schéma concerne une plante à fleurs fictive et simplifiée ; il ne s’applique pas à toutes les formes de vie végétale."
]
a_retenir = [
  "Un cycle de vie représente des étapes qui se suivent et peuvent recommencer.",
  "Dans cet exemple, la germination précède la jeune pousse, puis la plante adulte produit de nouvelles graines.",
  "Les cycles et modes de reproduction varient selon les espèces.",
  "Cette fiche ne remplace pas une source de biologie consacrée à une plante précise et ne demande pas de manipulation."
]
transferer = "Un cycle simplifié aide à suivre les étapes d’un schéma de biologie. Pour comprendre une espèce réelle, vérifie son mode de reproduction, son environnement et la source scientifique ; ne généralise pas un exemple à toutes les plantes."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

