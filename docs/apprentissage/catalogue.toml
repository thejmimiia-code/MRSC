[[fiche]]
id = "maths-probabilite-tirage"
titre = "Comprendre une chance dans un tirage simple"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 2
horizon_contenu = "Premiers repères sur les chances et le hasard ; exemples fictifs avec des possibilités également probables"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de probabilités limité à des tirages fictifs simples. Faire vérifier le dénombrement, l’hypothèse d’équiprobabilité et la différence entre tirage avec et sans remise par une personne compétente en mathématiques. La fiche rappelle qu’une probabilité ne garantit pas un résultat individuel ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 9
resume = "Compter les possibilités d’un tirage simple et comprendre qu’une chance n’est pas une certitude."
objectif = "Calculer une probabilité élémentaire lorsque chaque objet a la même chance d’être tiré."
situation = "Un sac opaque contient quatre jetons : un jaune et trois verts. Pour cet exemple, on suppose que le mélange et le mode de tirage donnent à chaque jeton la même chance d’être choisi. On tire un jeton, puis on le remet dans le sac avant tout nouveau tirage. Quelle part des jetons est jaune ? Est-ce que cela garantit un jeton jaune au prochain tirage ?"
analogie_titre = "Comme compter les tickets gagnants parmi des tickets de même format"
analogie = "Si quatre tickets ont exactement la même chance d’être choisis et qu’un seul est jaune, on peut compter un cas jaune sur quatre cas possibles. Le comptage donne une chance théorique pour un tirage, pas la couleur qui sortira forcément."
limite_analogie = "Le calcul suppose que chaque jeton a la même chance d’être choisi et que le mélange est impartial. Si les objets diffèrent, si le tirage est biaisé ou si l’on ne remet pas le jeton, les chances peuvent changer."
notions = [
  "Issue — résultat possible d’une expérience aléatoire, comme tirer un jeton jaune.",
  "Événement — résultat ou ensemble de résultats qui t’intéresse.",
  "Cas équiprobables — cas possibles qui ont tous la même chance de se produire.",
  "Probabilité — mesure d’une chance ; dans un ensemble de cas équiprobables, elle se calcule en divisant les cas favorables par tous les cas possibles.",
  "Tirage avec remise — objet remis dans l’ensemble avant un nouveau tirage ; la composition initiale est alors rétablie."
]
demarche = [
  "Décris précisément l’expérience : quel objet est tiré, combien de fois et avec ou sans remise ?",
  "Compte tous les résultats possibles. Vérifie que chaque objet a la même chance d’être tiré avant d’utiliser une simple fraction de comptage.",
  "Compte les résultats favorables à l’événement demandé. Ici, un jeton jaune sur quatre jetons équiprobables donne 1/4.",
  "Interprète la fraction comme une chance théorique pour un tirage, pas comme une promesse sur le prochain résultat.",
  "Si l’objet n’est pas remis, recompte les possibilités restantes avant de calculer la chance d’un tirage suivant."
]
exercice = "Un sac fictif contient deux jetons rouges et deux bleus. On suppose que chaque jeton a la même chance d’être tiré et on en tire un. Quelle est la probabilité de tirer un jeton bleu ? Cette probabilité garantit-elle le résultat de ce tirage ?"
aide = "Compte le nombre total de jetons, puis le nombre de jetons bleus. Les quatre jetons ont la même chance d’être choisis."
correction = [
  "Il y a quatre jetons en tout et deux jetons bleus : 2/4, ce qui équivaut à 1/2 ou une chance sur deux.",
  "Non. Une chance sur deux décrit la probabilité théorique du tirage ; le résultat particulier peut être rouge ou bleu."
]
a_retenir = [
  "Pour compter les chances, vérifie que les résultats considérés sont réellement équiprobables.",
  "Dans un cas simple équiprobable, probabilité = cas favorables ÷ cas possibles.",
  "Une probabilité décrit une chance, pas une certitude sur un résultat isolé.",
  "Remettre ou non l’objet change la composition et peut changer les chances au tirage suivant."
]
transferer = "Cette démarche peut s’appliquer à un dé supposé équilibré ou à un jeu avec des secteurs identiques, si les hypothèses d’égalité des chances sont raisonnables. Elle ne permet pas de prédire sûrement un résultat ni de conclure qu’un objet réel est impartial sans vérification."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

