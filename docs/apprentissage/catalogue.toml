titre = "Lire une notice d’œuvre en séparant faits et interprétations"
matiere = "Arts et culture"
matiere_id = "arts"
domaine = "arts-culture"
niveau = 2
horizon_contenu = "Premiers repères pour lire une notice de musée fictive, sans œuvre ni artiste réels"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de littératie artistique fondé sur une notice entièrement fictive. Faire vérifier les termes, la distinction entre données de notice et interprétation, et les formulations avec des personnes compétentes en arts et médiation culturelle. Les notices varient selon les institutions ; aucune œuvre réelle n’est décrite. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Repérer le titre, l’auteur, la date et la technique d’une notice, puis distinguer ces informations d’une interprétation."
objectif = "Extraire les éléments explicitement donnés dans un cartel fictif et identifier une question qui reste ouverte."
situation = "Cartel entièrement fictif — œuvre, nom, date et dimensions inventés : « Fenêtre de papier », Lina Morel, 2024, collage de papier et encre, 30 × 40 cm. Une phrase de médiation ajoute : « Les formes bleues peuvent évoquer une soirée calme. » Quelles informations décrivent l’objet et quelle phrase propose une interprétation ?"
analogie_titre = "Comme lire l’étiquette et le commentaire d’un objet"
analogie = "Une étiquette peut indiquer le nom, la date ou les matériaux d’un objet. Un commentaire propose ensuite une manière de le regarder. Séparer ces éléments aide à savoir ce qui est fourni par la notice et ce qui relève d’une interprétation."
limite_analogie = "Une œuvre ne se résume pas à son étiquette, et le commentaire d’une institution n’est pas la seule lecture possible. Les notices peuvent être incomplètes, varier selon les lieux ou présenter des informations qui demandent une source complémentaire."
notions = [
  "Cartel ou notice — texte court qui accompagne une œuvre ou un objet exposé.",
  "Titre — nom donné à l’œuvre, parfois attribué après sa création ou inconnu.",
  "Attribution — nom de l’artiste ou de l’auteur lorsque l’institution peut le fournir ; elle peut rester incertaine.",
  "Technique ou matériau — indication sur la manière ou les matières décrites dans la notice.",
  "Interprétation — proposition de sens ou de lecture, qui doit être distinguée des informations factuelles de la notice."
]
demarche = [
  "Repère les champs présentés : titre, auteur, date, technique, dimensions ou provenance, selon la notice.",
  "Note uniquement les informations réellement écrites ; une rubrique absente ne peut pas être devinée.",
  "Sépare les données de la notice du commentaire qui propose un sens ou une émotion.",
  "Relis les mots de nuance comme « peut évoquer » : ils indiquent une interprétation possible, pas une conclusion obligatoire.",
  "Si une date, une attribution ou une histoire est importante, cherche une autre source du musée ou demande une précision."
]
exercice = "Notice fictive : « Trois cercles », Samir Elan, 2021, impression sur papier. Le commentaire dit : « L’artiste a peut-être voulu représenter le passage des saisons. » Quelles informations la notice affirme-t-elle explicitement ? Le commentaire prouve-t-il l’intention de l’artiste ?"
aide = "Le titre, le nom, la date et la technique apparaissent comme des champs de notice. Le mot « peut-être » signale une hypothèse dans le commentaire."
correction = [
  "La notice indique le titre « Trois cercles », le nom Samir Elan, la date 2021 et une impression sur papier.",
  "Non. La phrase propose une interprétation et ne prouve pas l’intention de l’artiste.",
