[[fiche]]
id = "maths-partager"
titre = "Partager une quantité en parts égales"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
minutes = 7
resume = "Comprendre la multiplication et la division avec des groupes de même taille."
objectif = "Trouver combien d’objets placer dans chaque groupe quand le partage est égal."
situation = "Une association prépare 24 livrets fictifs et les répartit à parts égales dans 4 pochettes. Combien de livrets vont dans chaque pochette ?"
analogie_titre = "Comme répartir des objets dans des plateaux"
analogie = "Si tu poses le même nombre d’objets dans chaque plateau, tu peux distribuer un par un ou chercher un nombre qui, répété quatre fois, donne 24. Les deux façons décrivent le même partage."
limite_analogie = "Dans un partage réel, certains objets ne se divisent pas en morceaux égaux. Il faut alors annoncer le reste ou trouver une autre répartition ; on ne peut pas toujours l’ignorer."
notions = [
  "Multiplication — addition répétée de groupes identiques.",
  "Division — opération qui partage une quantité ou cherche combien de groupes sont possibles.",
  "Part égale — chaque groupe reçoit la même quantité."
]
demarche = [
  "Compte le nombre total d’objets : ici, 24.",
  "Compte le nombre de groupes : ici, 4 pochettes.",
  "Cherche le nombre qui, multiplié par 4, donne 24.",
  "Vérifie en recomposant le total avec 4 groupes."
]
exercice = "Répartis 18 bouteilles d’eau, de manière égale, dans 3 caisses. Combien y en a-t-il par caisse ?"
aide = "Cherche un nombre qui, multiplié par 3, donne 18."
correction = [
  "18 ÷ 3 = 6.",
  "Il y a 6 bouteilles par caisse.",
  "Vérification : 6 + 6 + 6 = 18, ou 6 × 3 = 18."
]
a_retenir = [
  "La division partage ou regroupe.",
  "La multiplication peut vérifier un partage.",
  "Quand il reste des objets, note le reste au lieu de le cacher."
]
transferer = "La méthode sert à répartir des équipes, du matériel, des portions ou des tâches. Dans la réalité, vérifie que les groupes doivent bien être égaux."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

