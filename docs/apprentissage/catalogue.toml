domaine = "informatique-programmation"
niveau = 1
horizon_contenu = "Initiation aux idées de programmation ; aucun compte, outil ou téléchargement requis"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Exemples de code écrits pour cette fiche et non exécutés par la page ; vérification de la syntaxe dans les deux environnements, relecture informatique indépendante, accessibilité et essais apprenants restent à faire. Les sources sont des références factuelles à licence de réutilisation non vérifiée."
minutes = 12
resume = "Distinguer la logique d’un algorithme de la syntaxe particulière d’un langage de programmation."
objectif = "Lire une petite répétition d’actions en Python et en JavaScript et expliquer ce qui reste identique et ce qui change."
situation = "Tu veux afficher trois étapes fictives dans l’ordre. Tu peux d’abord décrire les actions en français, puis les exprimer avec la syntaxe d’un langage que l’ordinateur sait exécuter."
analogie_titre = "Comme écrire une même recette avec deux systèmes de notation"
analogie = "La liste des actions décrit ce qu’il faut faire ; le langage de programmation donne une façon très précise de l’écrire. Deux langages différents peuvent exprimer la même idée, comme deux notations peuvent décrire la même suite d’étapes. Ici, les deux programmes parcourent une liste et affichent chaque élément."
limite_analogie = "Un langage de programmation n’est pas simplement une langue humaine traduite mot à mot. Ses symboles, règles et comportements sont formels ; le programme doit respecter exactement les conventions du langage et de l’environnement où il s’exécute. Deux programmes proches en apparence peuvent aussi avoir des effets différents."
notions = [
  "Algorithme — suite finie et organisée d’étapes permettant de résoudre une tâche ou de produire un résultat.",
  "Programme — instructions écrites dans un langage que l’environnement informatique peut interpréter ou exécuter.",
  "Langage de programmation — règles et mots-clés qui servent à décrire des opérations de façon précise.",
  "Variable — nom associé à une valeur ou à un ensemble de données utilisé par un programme.",
  "Liste — collection ordonnée de plusieurs éléments.",
  "Boucle — instruction qui répète une action, par exemple une fois pour chaque élément d’une liste.",
  "Syntaxe — règles d’écriture propres à un langage."
]
demarche = [
  "Formule le résultat souhaité en mots simples : afficher chacune des trois étapes une fois et dans le bon ordre.",
  "Repère les données : la liste appelée etapes contient trois textes ; le programme n’a pas besoin d’une information personnelle.",
  "Repère la boucle : elle prend chaque texte l’un après l’autre et demande de l’afficher.",
  "Compare la forme écrite en Python et celle écrite en JavaScript. Les délimitations et certaines commandes changent, mais l’idée de parcourir la liste reste la même.",
  "Prévois un test : avec trois éléments, le programme doit afficher trois lignes, ni deux ni quatre."
]
exercice = "Imagine une liste fictive de deux mots : Lire, puis Vérifier. Avec la méthode des exemples, combien de lignes la boucle doit-elle afficher, et dans quel ordre ?"
aide = "La boucle passe une fois sur chaque élément de la liste. Elle ne trie pas et n’ajoute pas de mot de son propre chef."
correction = [
  "Elle doit afficher deux lignes : d’abord Lire, puis Vérifier.",
  "Le nombre de passages correspond au nombre d’éléments de la liste : deux.",
  "La même intention peut être écrite dans plusieurs langages, mais le texte exact du code doit respecter la syntaxe de chacun."
]
a_retenir = [
  "L’algorithme décrit l’idée et les étapes ; le langage fournit une syntaxe que l’ordinateur peut traiter.",
  "Une boucle répète une instruction pour les éléments prévus ; vérifie combien de passages sont attendus.",
  "Python et JavaScript sont deux langages distincts, parmi beaucoup d’autres ; un exemple ne résume ni leurs usages ni leurs limites.",
  "Un extrait peut être lu sans l’exécuter. Avant de faire fonctionner un programme, il faut comprendre ses données, ses effets et son contexte."
]
transferer = "Cette distinction sert à discuter d’un besoin avec une personne qui programme, à comparer une explication et du code, ou à choisir une prochaine étape d’apprentissage. D’autres langages comme SQL, C, Java ou Rust ont des règles et usages différents ; ils ne sont pas couverts par cette courte fiche."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

[[fiche.exemples_code]]
titre = "Parcourir une liste en Python"
langage = "Python"
contenu = """etapes = [\"Lire la consigne\", \"Choisir une méthode\", \"Vérifier le résultat\"]
for etape in etapes:
    print(etape)"""
explication = "La variable etapes contient trois textes. La ligne for prend chaque texte à son tour, le nomme etape, puis print l’affiche. L’indentation indique quelles instructions appartiennent à la boucle."

[[fiche.exemples_code]]
titre = "Parcourir une liste en JavaScript"
langage = "JavaScript"
contenu = """const etapes = [\"Lire la consigne\", \"Choisir une méthode\", \"Vérifier le résultat\"];
for (const etape of etapes) {
  console.log(etape);
}"""
explication = "La liste contient les mêmes trois textes. La boucle for...of passe sur chaque élément et console.log l’affiche. Les accolades délimitent le corps de la boucle ; const déclare ici le nom de la liste."

