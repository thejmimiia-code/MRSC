analogie_titre = "Comme une petite carte d’identité du produit"
analogie = "Le nom indique ce qu’est le produit, la quantité précise ce qu’il contient, la liste décrit ses ingrédients et la date donne un repère de conservation. Cette carte aide à trouver l’information utile."
limite_analogie = "Une étiquette ne permet pas de savoir si un produit convient à chaque personne. Les allergies et besoins de santé sont personnels : lis l’emballage réel et demande conseil à un professionnel si nécessaire."
notions = [
  "Liste des ingrédients — informations sur les ingrédients, généralement présentées selon les règles applicables au produit.",
  "Allergène — substance susceptible de provoquer une réaction chez certaines personnes ; les règles prévoient une information particulière.",
  "Date de durabilité minimale — formule « à consommer de préférence avant » ; elle concerne principalement la qualité. Une date limite de consommation indique un repère de sécurité et doit être respectée."
]
demarche = [
