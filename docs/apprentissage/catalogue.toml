[[fiche]]
id = "fr-ecrire-message"
titre = "Écrire un message court et clair"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 1
minutes = 8
resume = "Organiser les informations pour que la personne sache quoi comprendre ou faire."
objectif = "Rédiger un message bref avec son sujet, l’information principale et la demande."
situation = "Tu veux proposer un rendez-vous fictif à une connaissance : jeudi à 18 h, à la médiathèque. Tu souhaites savoir si cette heure lui convient."
analogie_titre = "Comme une étiquette sur un colis"
analogie = "Une étiquette aide le colis à arriver au bon endroit. Dans un message, un objet précis et un destinataire clair aident l’information à arriver à la bonne personne. Le texte donne ensuite le détail et l’action attendue."
limite_analogie = "Un message peut demander une réponse ou ouvrir une discussion, alors qu’un colis ne répond pas. Le ton et les détails doivent aussi s’adapter à la relation et au sujet."
notions = [
  "Objet — quelques mots qui annoncent le sujet d’un courriel.",
  "Information principale — fait nécessaire à la compréhension : quoi, quand, où.",
  "Demande — question ou action que l’on propose à la personne."
]
demarche = [
  "Commence par nommer le sujet ou la raison du message.",
  "Place les informations utiles dans un ordre facile à suivre : quoi, quand, où.",
  "Écris clairement ce que tu demandes ou proposes.",
  "Relis en vérifiant le nom, la date, l’heure et le ton. Retire les détails qui n’aident pas."
]
exercice = "Écris deux ou trois phrases pour proposer à une personne de se retrouver mardi à 15 h devant la médiathèque. Demande-lui si cela lui convient. Tu peux répondre à l’écrit ou à voix haute."
aide = "Tu peux t’appuyer sur ce début : « Bonjour, je te propose… Est-ce que… ? »"
correction = [
  "Exemple possible : « Bonjour, je te propose de nous retrouver mardi à 15 h devant la médiathèque. Est-ce que cela te convient ? À bientôt. »",
  "D’autres formulations sont correctes si le jour, l’heure, le lieu et la question sont compréhensibles."
]
a_retenir = [
  "Un message utile n’a pas besoin d’être long.",
  "Des informations précises évitent plusieurs allers-retours.",
  "La même idée peut être écrite de plusieurs façons."
]
transferer = "La trame peut servir pour un courriel, un texto, un message à un collègue ou une demande de rendez-vous. Pour des sujets sensibles, choisis un canal adapté et limite les informations personnelles."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

