analogie = "Imagine un petit train qui doit suivre une voie continue pour revenir à son point de départ. Une barrière levée laisse un passage ; une voie interrompue ne forme plus la boucle. Dans un circuit électrique simple, l’interrupteur peut ouvrir ou fermer le chemin parcouru par le courant."
limite_analogie = "Le courant n’est pas un train et l’électricité n’est pas un véhicule sur une voie. L’image aide seulement à voir la continuité du circuit ; elle n’explique ni les charges électriques, ni la tension, ni les mesures physiques."
notions = [
  "Source — élément qui fournit de l’énergie électrique dans le modèle, par exemple une pile.",
  "Conducteur — partie qui relie des éléments du circuit et permet le passage du courant dans les conditions prévues.",
  "Récepteur — élément qui reçoit de l’énergie électrique et la transforme, par exemple en lumière.",
  "Interrupteur — commande qui peut établir ou interrompre le chemin du courant.",
  "Circuit fermé — boucle conductrice continue entre les bornes de la source, permettant au courant de circuler si les composants fonctionnent.",
  "Circuit ouvert — chemin interrompu ; le courant ne circule pas dans cette boucle."
]
demarche = [
  "Repère une source d’énergie, comme une pile, puis un récepteur, comme une lampe.",
  "Suis mentalement les conducteurs : la boucle doit relier les éléments et revenir à l’autre borne de la source.",
  "Si un interrupteur ouvre le chemin, le circuit est ouvert et le courant ne passe plus dans cette boucle.",
  "Si l’interrupteur ferme le chemin, le circuit est fermé. La lampe peut alors s’allumer si la pile, la lampe et les contacts fonctionnent correctement.",
  "Ne conclus pas qu’un objet est sans danger parce qu’il est petit : cette fiche décrit un modèle et ne donne pas de procédure de branchement."
]
exercice = "Dans le jouet fictif, l’interrupteur est fermé mais la lampe reste éteinte. Donne deux explications possibles, en plus d’un circuit ouvert."
aide = "La boucle peut être fermée sans que chaque pièce fonctionne. Pense à la source et au récepteur eux-mêmes."
correction = [
  "La pile peut être déchargée ou mal reliée.",
  "La lampe ou un conducteur peut être endommagé ; un contact peut aussi manquer.",
  "Le modèle ne permet pas de diagnostiquer un appareil réel. Ne l’ouvre pas et ne touche pas à une installation électrique."
]
a_retenir = [
  "Un circuit simple a besoin d’un chemin continu entre les bornes de la source pour que le courant circule.",
  "Un interrupteur ouvert coupe le trajet ; un interrupteur fermé le rétablit si les autres éléments fonctionnent.",
  "La lampe utilise l’énergie transférée dans le circuit ; le courant n’est pas une réserve que la lampe consomme comme un combustible."
]
transferer = "Ces mots aident à comprendre un dessin de circuit ou une explication scolaire. Cette fiche ne demande aucune manipulation : ne démonte pas un chargeur, une prise, un appareil branché ni une installation fixe. Pour un problème réel, cesse d’utiliser un équipement abîmé et sollicite une personne qualifiée ou un service approprié."
