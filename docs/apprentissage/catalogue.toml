[[fiche]]
id = "numerique-reagir-fraude"
titre = "Que faire après un clic, un code transmis ou un paiement ?"
matiere = "Numérique et sécurité"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 2
minutes = 10
resume = "Agir vite et sans honte après une sollicitation suspecte, selon ce qui a été partagé."
objectif = "Protéger un compte ou un moyen de paiement, conserver les preuves et contacter le bon service."
situation = "Tu as ouvert un lien reçu par SMS, saisi un mot de passe et transmis un code. Tu viens ensuite de comprendre que le message était peut-être faux."
analogie_titre = "Comme appeler la banque après la perte d’une carte"
analogie = "Quand une carte est perdue, on appelle vite la banque avec le numéro officiel pour la bloquer. Après une fraude numérique, commence par protéger l’accès ou le moyen de paiement concerné avec les coordonnées officielles, puis garde les traces pour expliquer ce qui s’est passé."
limite_analogie = "Une carte, un compte en ligne et une identité ne se bloquent pas de la même manière. Les actions exactes dépendent de ce qui a été transmis, du service concerné et de la situation ; cette fiche donne des premiers repères, pas un diagnostic personnalisé."
notions = [
  "Preuve — élément conservé qui aide à reconstituer les faits : message, date, adresse du site, reçu ou capture d’écran.",
  "Opposition — demande faite à l’établissement financier pour empêcher l’utilisation d’un moyen de paiement.",
  "Signalement — information adressée à une plateforme ou à un organisme compétent ; elle ne remplace pas nécessairement une plainte."
]
demarche = [
  "Si de l’argent ou des données bancaires sont concernés, contacte immédiatement ta banque par son application ou le numéro officiel déjà connu ; demande les mesures adaptées et fais opposition si nécessaire.",
  "Si un mot de passe a été saisi, change-le depuis le site ou l’application officielle, idéalement depuis un appareil sûr. Change aussi les autres comptes où le même mot de passe était utilisé, déconnecte les sessions ouvertes et active une authentification renforcée si possible.",
  "Si un accès à distance ou un logiciel a été installé, n’utilise plus cet appareil pour saisir tes identifiants ; demande conseil à 17Cyber ou à une personne compétente.",
  "Conserve le message, l’adresse, les captures d’écran, les reçus et les dates. Ne transfère pas le contenu douteux à d’autres personnes comme s’il était vérifié.",
  "Préviens l’organisme ou la personne dont l’identité a été utilisée. Selon les faits, demande de l’aide à 17Cyber, signale le message et contacte la police ou la gendarmerie pour déposer plainte."
]
exercice = "Une page imitait ta banque et tu as saisi le numéro de ta carte, mais pas ton mot de passe. Quelle première personne ou quel service contacterais-tu, et par quel canal ?"
aide = "Utilise l’application bancaire ou le numéro figurant sur ta carte, pas le lien ou le numéro de la page reçue."
correction = [
  "Contacte immédiatement ta banque depuis son application habituelle ou le numéro officiel au dos de ta carte afin qu’elle te dise comment bloquer ou surveiller les moyens de paiement.",
  "Conserve le SMS, l’adresse de la page, les captures et l’heure de l’incident. Ne retourne pas sur la page douteuse.",
  "Consulte les recommandations officielles et le diagnostic 17Cyber ; si de l’argent a été détourné ou une identité usurpée, demande conseil sur le dépôt de plainte."
]
a_retenir = [
  "Ne te blâme pas : les messages sont conçus pour tromper et la rapidité de réaction aide à limiter les suites.",
  "Banque ou service concerné d’abord, avec une coordonnée officielle indépendante.",
  "Protège les comptes, conserve les preuves, alerte les personnes ou organismes concernés et demande un accompagnement officiel.",
  "Un signalement, une opposition bancaire et une plainte sont des démarches différentes ; le service compétent peut t’orienter."
]
transferer = "Si l’incident concerne un emploi, une association ou une entreprise, préviens aussi sans délai le responsable informatique ou la personne chargée de la sécurité, sans effacer les traces ni minimiser la situation. Les démarches précises évoluent : suis les instructions actuelles de la banque, de 17Cyber et des autorités."
revue_le = "2026-10-07"
intervalle_revue_jours = 90

