niveau = 2
minutes = 8
resume = "Passer d’une distance dessinée à une distance représentée."
objectif = "Utiliser une échelle numérique simple et distinguer une distance en ligne droite d’un trajet."
situation = "Sur une carte fictive à l’échelle 1 : 100 000, deux points sont séparés de 3,5 cm. Quelle est leur distance en ligne droite sur le terrain ?"
analogie_titre = "Comme une maquette réduite"
analogie = "Une maquette conserve une relation de taille avec l’objet réel. L’échelle d’une carte joue ce rôle : à l’échelle 1 : 100 000, un centimètre sur la carte représente 100 000 centimètres sur le terrain."
limite_analogie = "Une carte simplifie le territoire et peut déformer les distances ou les formes. La distance droite entre deux points n’est pas forcément la distance à parcourir par une route ou un chemin."
notions = [
  "Échelle — rapport entre une distance dessinée et la distance représentée.",
  "1 : 100 000 — 1 unité sur la carte représente 100 000 fois cette unité sur le terrain.",
  "Ligne droite — distance directe entre deux points, sans suivre les routes."
]
demarche = [
  "Lis le nombre de l’échelle : 1 cm représente 100 000 cm.",
  "Convertis 100 000 cm en kilomètres : 100 000 cm = 1 000 m = 1 km.",
  "Multiplie la distance sur la carte par la distance représentée : 3,5 cm représentent 3,5 km en ligne droite.",
  "Pour un trajet, mesure le parcours sur les routes et tiens compte du réseau réel."
]
exercice = "Sur la même carte fictive, deux lieux sont séparés de 2 cm. Quelle distance en ligne droite cela représente-t-il ?"
aide = "À cette échelle, 1 cm sur le papier représente 1 km sur le terrain."
correction = [
  "1 cm représente 1 km.",
  "2 cm représentent donc 2 km en ligne droite.",
  "Un itinéraire réel peut être plus long."
]
a_retenir = [
  "Vérifie d’abord l’échelle de la carte.",
  "Convertis les unités avant de comparer les distances.",
  "Distance directe, distance routière et durée du trajet sont trois informations différentes."
]
transferer = "Cette lecture peut servir pour un plan de quartier, une carte de randonnée ou un itinéraire. Pour un déplacement réel, vérifie les travaux, l’accessibilité et les conditions du trajet avec une source à jour."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

