niveau = 2
horizon_contenu = "Premiers repères sur le protocole, l’hôte, le chemin et le paramètre d’une adresse Web fictive"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon d’informatique limité à la lecture de quelques parties d’une URL. Faire vérifier le vocabulaire et les nuances concernant HTTPS, les noms d’hôte et les paramètres par une personne compétente en Web et en sécurité numérique. L’adresse d’exercice est fictive ; la fiche ne conseille pas de cliquer, de partager ou de saisir des données personnelles. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Reconnaître le schéma, l’hôte, le chemin et le paramètre dans une adresse fictive, sans confondre HTTPS et confiance."
objectif = "Découper une adresse Web de démonstration en quelques parties et expliquer ce que le texte seul ne garantit pas."
situation = "Adresse fictive : https://site-fictif.test/agenda?jour=mardi. Quels éléments indiquent le protocole, le nom d’hôte, le chemin et un paramètre ? L’adresse est-elle une preuve suffisante que le site est fiable ?"
analogie_titre = "Comme lire les lignes d’adresse sur une enveloppe"
analogie = "Une adresse postale sépare des informations comme la ville, la rue et le numéro. Une adresse Web sépare aussi des éléments qui aident le navigateur à trouver un hôte et une ressource."
limite_analogie = "Internet n’est pas un service postal centralisé. Les règles techniques, les redirections, les paramètres et les certificats ajoutent des détails que l’adresse visible ne montre pas toujours. Une URL lisible ne prouve pas que son contenu est sûr ou exact."
notions = [
  "URL — adresse qui indique comment retrouver une ressource sur le Web.",
  "Schéma — début de l’adresse, par exemple https, qui indique le protocole utilisé.",
  "Hôte — nom du serveur ou domaine indiqué après le schéma et les séparateurs.",
  "Chemin — partie qui suit l’hôte et désigne une ressource ou une route, comme /agenda.",
  "Paramètre — information ajoutée après un point d’interrogation ; elle peut être transmise au site.",
  "HTTPS — HTTP protégé par chiffrement pendant la connexion ; cette indication ne garantit pas à elle seule l’identité éditoriale, l’absence de fraude ou l’exactitude d’une page."
]
demarche = [
  "Repère le schéma avant les deux-points : dans l’exemple, c’est https.",
  "Après les deux barres obliques, lis l’hôte : site-fictif.test.",
  "Après l’hôte et la barre oblique, repère le chemin : /agenda.",
  "Après le point d’interrogation, repère un paramètre : jour=mardi. Il peut servir à transmettre une indication au site.",
  "Ne saisis pas un mot de passe, un code ou une donnée personnelle dans une adresse si tu ne comprends pas pourquoi elle est demandée.",
  "Pour juger une demande, vérifie l’identité et le contexte par un canal fiable ; HTTPS seul n’atteste pas que le site appartient à l’organisme attendu."
]
exercice = "Dans l’adresse fictive https://site-fictif.test/agenda?jour=mardi, indique le schéma, l’hôte, le chemin et le paramètre. Une adresse qui commence par https prouve-t-elle que le contenu est officiel ?"
aide = "Lis l’adresse par étapes : avant ://, après :// jusqu’au prochain /, puis le chemin ; le point d’interrogation introduit le paramètre."
correction = [
  "Schéma : https. Hôte : site-fictif.test. Chemin : /agenda. Paramètre : jour=mardi.",
  "Non. HTTPS protège la connexion vers l’hôte affiché, mais ne prouve pas que cet hôte est l’organisme que l’on cherche ni que son contenu est exact.",
  "L’adresse est fictive ; aucun lien réel n’est à ouvrir."
]
a_retenir = [
  "Une adresse Web contient plusieurs parties qui n’ont pas le même rôle.",
  "Un paramètre peut transmettre une information au site ; évite d’y inclure des données personnelles ou secrètes.",
  "HTTPS protège la connexion, mais ne garantit pas que le site soit honnête, officiel ou fiable.",
  "Cette fiche n’explique pas les certificats, le DNS, les redirections ni toutes les formes d’URL."
]
transferer = "Cette lecture peut aider à comprendre un lien reçu ou une adresse copiée. Avant d’envoyer une donnée ou de répondre à une demande, vérifie l’hôte exact et confirme le contexte par une voie connue ; ne te fie pas au seul cadenas ou au préfixe HTTPS."
