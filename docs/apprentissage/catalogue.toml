[[fiche]]
id = "maths-lire-planning"
titre = "Lire un planning et calculer une durée"
matiere = "Mathématiques du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
minutes = 8
resume = "Lire des heures et trouver le temps entre deux rendez-vous."
objectif = "Calculer une durée en heures et en minutes, même quand elle passe par l’heure suivante."
situation = "Un atelier commence à 8 h 35 et se termine à 10 h 05. Combien de temps dure-t-il ?"
analogie_titre = "Comme avancer sur une ligne du temps"
analogie = "Imagine une ligne sur laquelle les heures sont des repères. Pour mesurer la durée, pars de l’heure de départ et avance jusqu’à l’arrivée, en comptant les minutes parcourues."
limite_analogie = "Une ligne dessinée peut sembler régulière, mais les heures se répètent après minuit et un planning peut changer de jour. Vérifie toujours la date et le fuseau si le contexte en dépend."
notions = [
  "Durée — temps écoulé entre un début et une fin.",
  "Une heure — 60 minutes.",
  "Horaire — moment affiché sur une horloge ou dans un planning."
]
demarche = [
  "Écris l’heure de départ et celle d’arrivée, sans les confondre.",
  "Avance du départ jusqu’à l’heure ronde suivante, puis jusqu’à la fin.",
  "Additionne les minutes et transforme 60 minutes en une heure.",
  "Vérifie que l’heure de fin est bien après l’heure de départ."
]
exercice = "Un rendez-vous commence à 14 h 20 et finit à 15 h 05. Quelle est sa durée ?"
aide = "Compte d’abord de 14 h 20 à 15 h 00, puis de 15 h 00 à 15 h 05."
correction = [
  "De 14 h 20 à 15 h 00, il y a 40 minutes.",
  "De 15 h 00 à 15 h 05, il y a 5 minutes.",
  "40 + 5 = 45 minutes. Le rendez-vous dure 45 minutes."
]
a_retenir = [
  "Une heure vaut 60 minutes, pas 100 minutes.",
  "Découper le trajet en deux morceaux autour d’une heure ronde simplifie le calcul.",
  "Vérifie la date si l’horaire passe à un autre jour."
]
transferer = "Tu peux utiliser cette méthode pour un trajet, une pause, un horaire de travail ou une durée de cuisson. Les horaires réels dépendent du planning concerné : la fiche n’en garantit aucun."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

