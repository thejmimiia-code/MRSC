[[fiche]]
id = "maths-convertir-unites"
titre = "Convertir des mesures sans changer leur quantité"
matiere = "Mathématiques — mesures du quotidien"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
horizon_contenu = "Repères de cycle 3 ; reprise possible à tout âge, sans parcours obligatoire"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Rédaction originale à partir de repères factuels ; vérification mathématique, relecture indépendante, contrôle des droits, accessibilité et essais apprenants restent à faire avant toute diffusion publique. Les licences des sources n’ont pas été vérifiées pour une réutilisation."
minutes = 11
resume = "Exprimer une même longueur, masse ou capacité dans une autre unité courante."
objectif = "Convertir quelques mesures usuelles en identifiant le rapport entre les unités, puis vérifier que la quantité n’a pas changé."
situation = "Une bande de tissu mesure 1 m 35 cm. Une étiquette doit indiquer sa longueur en centimètres. Quelle valeur écrire ?"
analogie_titre = "Comme lire la même bande avec une autre graduation"
analogie = "Une bande reste de la même longueur si l’on compte ses mètres ou ses centimètres. C’est comme décrire un trajet en kilomètres ou en mètres : l’unité change, pas le trajet. Pour une conversion simple, on s’appuie sur le nombre de petites unités qui composent la grande."
limite_analogie = "La bande graduée illustre des unités de longueur, mais elle ne donne pas toutes les règles de conversion. La masse, la capacité, l’aire et le volume ont des unités différentes ; la température ou le passage d’une masse à un volume ne se convertissent pas avec le même simple facteur."
notions = [
  "Unité — repère choisi pour exprimer une mesure, comme le mètre ou le centimètre.",
  "Conversion — écriture d’une même quantité avec une autre unité adaptée.",
  "Longueur — mesure d’une distance ; 1 mètre (m) vaut 100 centimètres (cm).",
  "Capacité — quantité qu’un récipient peut contenir ; 1 litre (L) vaut 1 000 millilitres (mL).",
  "Masse — mesure exprimée ici en kilogrammes (kg) ou grammes (g) ; 1 kg vaut 1 000 g."
]
demarche = [
  "Repère ce qui est mesuré : une longueur, une masse ou une capacité. Garde la même famille d’unités pendant la conversion.",
  "Écris l’égalité de référence. Par exemple : 1 m = 100 cm, 1 kg = 1 000 g ou 1 L = 1 000 mL.",
  "Demande-toi si tu passes vers une unité plus petite ou plus grande. Une même quantité s’écrit généralement avec un nombre plus grand en petites unités et un nombre plus petit en grandes unités.",
  "Pour une bande de 1 m 35 cm, sépare les deux parties : 1 m vaut 100 cm, puis ajoute les 35 cm. On obtient 100 cm + 35 cm = 135 cm.",
  "Additionne les parts converties, puis vérifie l’ordre de grandeur et l’unité écrite."
]
exercice = "Un récipient contient 2 L d’eau. On en verse 650 mL. Combien de millilitres restent-ils dans le récipient ?"
aide = "Commence par exprimer les 2 L en millilitres en utilisant l’égalité 1 L = 1 000 mL. Ensuite, soustrais les 650 mL."
correction = [
  "2 L = 2 × 1 000 mL = 2 000 mL.",
  "2 000 mL − 650 mL = 2 000 − 600 − 50 = 1 400 − 50 = 1 350 mL.",
  "Il reste 1 350 mL. Vérification : 1 350 mL + 650 mL = 2 000 mL, soit 2 L."
]
a_retenir = [
  "Une conversion change l’unité d’écriture, pas la quantité mesurée.",
  "Écris le rapport entre les unités avant de calculer : par exemple, 1 m = 100 cm.",
  "Vérifie que le résultat va dans le bon sens : une même longueur compte davantage de centimètres que de mètres.",
  "N’efface jamais l’unité pendant un calcul de mesure."
]
transferer = "Ces repères servent à lire une longueur, une masse ou une capacité sur une étiquette, une recette fictive ou un plan. Pour d’autres grandeurs, comme une surface, un volume géométrique ou une température, vérifie la relation adaptée au lieu de reprendre automatiquement le facteur 10 ou 1 000."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

