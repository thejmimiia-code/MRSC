[[fiche]]
id = "civ-choisir-source-publique"
titre = "Choisir une source publique adaptée à sa question"
matiere = "Citoyenneté et recherche d’information"
matiere_id = "citoyennete"
domaine = "citoyennete-medias"
niveau = 2
horizon_contenu = "Démarches, vie citoyenne et lecture critique ; références françaises modulables selon le sujet"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Proposition originale de littératie des sources ; vérification des périmètres et liens, relecture éditoriale, accessibilité et tests apprenants restent à faire. Les références sont facultatives et leurs licences de réutilisation ne sont pas déclarées vérifiées."
minutes = 12
resume = "Faire correspondre une question à une source, puis vérifier son responsable, sa date, son territoire et son rôle."
objectif = "Choisir un point de départ public pertinent sans confondre texte juridique, démarche, statistique, explication et position éditoriale."
situation = "Tu veux vérifier une démarche administrative ou une donnée sur une commune. Plusieurs pages donnent des informations différentes : laquelle examiner en premier et que contrôler avant de la reprendre ?"
analogie_titre = "Comme choisir le bon guichet et lire l’étiquette d’un document"
analogie = "Un guichet spécialisé est souvent le bon point de départ pour une question précise. De la même manière, une source publique a un rôle : une page de démarches, un texte juridique, un jeu de données ou une explication citoyenne ne répondent pas tous à la même question. Lire l’émetteur et la date aide à choisir."
limite_analogie = "Un site officiel n’est pas un guichet qui garantit une réponse personnalisée : sa page peut être ancienne, limitée à un territoire ou simplifier une situation. Une statistique, un texte de loi et un commentaire éditorial demandent des vérifications différentes."
notions = [
  "Émetteur — organisme ou personne qui publie l’information et en répond.",
  "Portée — sujet, public, territoire et période auxquels une information s’applique.",
  "Source primaire — document ou donnée directement produit par l’organisme qui mène l’action ou publie la mesure.",
  "Donnée publique — information produite ou détenue dans le cadre d’une mission publique ; son accès et sa réutilisation peuvent avoir des conditions propres au jeu de données.",
  "Mise à jour — date indiquant quand une page ou un jeu de données a été révisé ; elle ne garantit pas à elle seule que tout le contenu est à jour."
]
demarche = [
  "Formule ta question : cherches-tu une règle en vigueur, une démarche, une statistique, un service, une explication ou un avis ?",
  "Choisis une famille de source adaptée. Pour les démarches administratives, Service-Public peut orienter ; pour lire le texte juridique, cherche la version applicable sur Légifrance ; pour les chiffres, consulte la définition et la période de l’organisme statistique concerné.",
  "Vérifie qui publie la page, son rôle, son territoire et son public. Un organisme public, une autorité indépendante, un média, une association et une entreprise n’ont pas la même mission.",
  "Regarde la date, la version et les liens vers le document, les données ou les textes cités. Pour un jeu de données, vérifie aussi la méthode, les unités, les champs manquants et la licence affichée pour ce jeu précis.",
  "Sépare ce que la source établit de son explication ou de son commentaire. Si l’action a des conséquences importantes, confirme les conditions avec le service compétent ou une personne qualifiée."
]
exercice = "Une page anonyme décrit un droit sans date. Une fiche de Service-Public datée renvoie vers un texte sur Légifrance. Quelle page choisir comme premier repère et quelles vérifications faire avant d’agir ?"
aide = "Un émetteur identifiable et une date sont utiles, mais demande aussi quel organisme est compétent, quelle version du texte s’applique et si la situation décrite correspond à la tienne."
correction = [
  "La fiche Service-Public est un meilleur point de départ que la page anonyme pour s’orienter, car son émetteur et sa date sont visibles et elle renvoie vers une source juridique.",
  "Il faut encore vérifier la date et la portée de la fiche, la version en vigueur du texte sur Légifrance, le territoire et les conditions propres à la situation.",
  "Une source officielle peut être incomplète ou mal interprétée ; pour une situation importante, contacter le service compétent ou demander un conseil approprié."
]
a_retenir = [
  "Commence par la question à résoudre, pas par le premier résultat d’un moteur de recherche.",
  "Identifie l’émetteur, sa mission, la date, le territoire, le public et le type de contenu.",
  "Une explication administrative, un texte juridique, une statistique et une prise de position ne sont pas interchangeables.",
  "L’accès public ne rend pas automatiquement toutes les données libres de réutilisation ; consulte la licence et les conditions du jeu concerné.",
  "Une source officielle est un repère important, pas une garantie absolue qu’une page est actuelle ou suffisante pour chaque cas."
]
transferer = "Ce parcours peut servir pour un droit, une démarche, un indicateur statistique, une question de santé ou un choix de consommation. Les exemples de portails ci-dessous sont des portes d’entrée facultatives ; leurs périmètres évoluent et aucune source ne remplace une vérification adaptée au cas précis."
revue_le = "2026-10-08"
intervalle_revue_jours = 180

