[[fiche]]
id = "tech-electronique-capteur"
titre = "Distinguer capteur, commande et action dans un objet électronique"
matiere = "Sciences et technologie"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 2
horizon_contenu = "Technologie et systèmes techniques ; modèle explicatif sans montage"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Proposition originale de vulgarisation ; vérification technique indépendante, relecture pédagogique, limites et sécurité restent à contrôler. Aucun montage, essai matériel ou test apprenant n’est revendiqué. Les licences des sources n’ont pas été vérifiées pour une réutilisation."
minutes = 11
resume = "Suivre le trajet d’une information depuis un capteur jusqu’à une action commandée."
objectif = "Décrire les rôles d’un capteur, d’une unité de commande et d’un actionneur dans un exemple fictif."
situation = "Dans un couloir fictif, une lampe commandée s’allume lorsque la lumière ambiante passe sous un seuil choisi. Quels éléments peuvent mesurer, décider et agir ?"
analogie_titre = "Comme une sonnette avec un détecteur et une commande"
analogie = "Un détecteur repère un changement, une commande applique une règle, puis un actionneur réalise une action. Dans l’exemple, un capteur mesure la lumière, une unité de commande compare la mesure au seuil, et la lampe reçoit une commande d’allumage."
limite_analogie = "Un capteur ne voit pas et ne comprend pas comme une personne : il répond à une grandeur physique selon ses caractéristiques. L’unité de commande applique des instructions, peut se tromper ou tomber en panne, et ne raisonne pas nécessairement comme une intelligence artificielle."
notions = [
  "Capteur — composant qui détecte ou mesure une grandeur, par exemple la lumière ou la température.",
  "Signal — information représentée par une variation électrique ou une suite de données transmise entre composants.",
  "Unité de commande — composant ou logiciel qui reçoit des données et applique une règle de fonctionnement.",
  "Actionneur — élément qui réalise une action commandée, comme allumer une lampe ou faire tourner un moteur.",
  "Seuil — valeur de référence à partir de laquelle une règle peut changer le comportement du système."
]
demarche = [
  "Nomme l’information d’entrée : ici, la mesure de luminosité.",
  "Repère le composant qui reçoit ou transforme cette information : le capteur.",
  "Écris la règle en mots : si la mesure est inférieure au seuil, demander l’allumage ; sinon, ne pas le demander.",
  "Repère la commande et la sortie : l’unité de commande applique la règle, puis l’actionneur ou le circuit de sortie commande la lampe.",
  "Vérifie les limites : un mauvais réglage, une mesure imprécise, une panne ou une source d’énergie coupée peut empêcher le comportement attendu."
]
exercice = "Un dispositif fictif allume un témoin pendant dix secondes quand une personne appuie sur un bouton. Repère l’entrée, la règle de commande et la sortie."
aide = "Le bouton fournit une entrée. Le programme applique une règle qui dépend de la durée. Le témoin lumineux est la sortie visible."
correction = [
  "Entrée : l’état du bouton, qui passe de relâché à appuyé.",
  "Règle : lorsqu’un appui est détecté, commander l’allumage pendant dix secondes, puis arrêter la commande.",
  "Sortie : le témoin lumineux, qui montre l’action demandée. Un vrai système comporte d’autres composants et contraintes que ce schéma simplifié."
]
a_retenir = [
  "Un objet électronique peut recevoir une information, appliquer une règle et commander une sortie.",
  "Énergie et information sont liées mais différentes : l’énergie permet le fonctionnement, tandis que le signal transporte une information.",
  "Le capteur mesure seulement ce pour quoi il a été conçu ; il n’interprète pas librement la situation.",
  "Un objet peut combiner une fonction électrique et une commande électronique ; les deux catégories ne s’excluent pas."
]
transferer = "Ce schéma permet de décrire un thermostat, un détecteur de présence, un feu commandé ou un appareil connecté à un niveau général. Il n’indique pas comment ouvrir, câbler, programmer ou réparer ces objets : ces tâches exigent le matériel, les compétences et les règles de sécurité adaptés."
revue_le = "2026-10-08"
intervalle_revue_jours = 180

