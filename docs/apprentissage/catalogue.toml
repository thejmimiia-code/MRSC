[[fiche]]
id = "maths-lire-echelle-graphique"
titre = "Lire les graduations d’un graphique"
matiere = "Mathématiques"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 2
horizon_contenu = "Lire un axe gradué dans un graphique simple ; les valeurs sont fictives et aucune image distante n’est requise"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de lecture graphique centré sur les graduations d’un axe. Faire vérifier les calculs, la description des échelles et la formulation sur les axes tronqués par une personne compétente en mathématiques et en lecture de données. Les exercices sont textuels ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Repérer l’unité et la valeur de chaque graduation avant de lire une barre ou un point."
objectif = "Lire une valeur sur un axe régulièrement gradué et vérifier l’échelle avant de comparer des longueurs visuelles."
situation = "Un graphique fictif présente des présences à un atelier. Son axe vertical est marqué 0, 5, 10, 15 et 20, avec des intervalles égaux. Une barre atteint la graduation 15. Combien de présences indique-t-elle ?"
analogie_titre = "Comme lire les repères réguliers d’une règle"
analogie = "Sur une règle, les traits et les nombres indiquent les distances représentées. Sur un graphique, les graduations d’un axe indiquent les valeurs associées aux positions des barres ou des points."
limite_analogie = "Les axes d’un graphique ne commencent pas toujours à zéro et n’utilisent pas toujours une échelle linéaire. Un graphique peut aussi omettre des repères. Il faut lire l’axe réel au lieu de supposer qu’il fonctionne comme une règle ordinaire."
notions = [
  "Axe — ligne de repère qui porte des catégories ou des valeurs dans un graphique.",
  "Graduation — trait ou repère associé à une valeur sur un axe.",
  "Pas — différence entre deux graduations successives ; il peut être de 1, 5, 10 ou une autre valeur.",
  "Origine — valeur à laquelle l’axe commence dans le graphique affiché ; elle n’est pas toujours zéro.",
  "Unité — indication de ce que mesurent les nombres, par exemple des personnes, des minutes ou des euros."
]
demarche = [
  "Lis le titre, les catégories et l’unité avant de comparer les marques du graphique.",
  "Repère les valeurs écrites sur l’axe et compte l’intervalle entre deux graduations voisines.",
  "Vérifie où commence l’axe ; ne suppose pas que la première valeur visible est zéro.",
  "Aligne le sommet de la barre ou le point avec la graduation correspondante et lis sa valeur.",
  "Avant de comparer deux barres, vérifie qu’elles partagent la même échelle et le même point de départ."
]
exercice = "Un graphique fictif a des graduations régulièrement espacées : 0, 2, 4, 6 et 8. Une barre atteint le repère 6. Quelle valeur lis-tu ? Si un autre graphique commence à 4 au lieu de 0, quel élément dois-tu regarder avant de comparer visuellement les barres ?"
aide = "Dans le premier axe, chaque graduation ajoute 2. Pour le second, vérifie la valeur de départ et le pas : la longueur dessinée ne raconte pas toute l’échelle."
correction = [
  "La barre atteint la graduation 6 ; elle représente 6 dans l’unité du graphique.",
  "Sur l’autre graphique, il faut lire la valeur de départ et les graduations avant de comparer la hauteur dessinée. Un axe qui commence à 4 peut amplifier visuellement une différence.",
  "Les deux graphiques doivent aussi présenter une unité et une échelle comparables pour qu’une comparaison soit pertinente."
]
a_retenir = [
  "Lis les valeurs des graduations et leur pas avant de lire une barre ou un point.",
  "Vérifie le titre, l’unité et la valeur de départ de l’axe.",
  "Une barre qui semble deux fois plus haute ne représente pas nécessairement deux fois la valeur si les axes diffèrent.",
  "Un axe tronqué n’est pas automatiquement faux, mais il peut modifier l’impression visuelle ; signale ce choix au lieu de l’ignorer."
]
transferer = "Cette méthode aide à lire un graphique dans un rapport, un article ou un tableau de bord. Pour une comparaison importante, consulte aussi la source, la période, l’unité et la méthode de collecte des données."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

