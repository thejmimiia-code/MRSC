[[fiche]]
id = "info-ordinateur-fonctions"
titre = "Comprendre les rôles d’un ordinateur"
matiere = "Informatique et programmation"
matiere_id = "informatique"
domaine = "informatique-programmation"
niveau = 1
horizon_contenu = "Premières bases en informatique ; accessible sans équipement ni installation"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Proposition originale à relire : vérification technique indépendante, relecture pédagogique, droits des sources, accessibilité et essais apprenants restent à faire. Les liens servent de repères de périmètre ; leurs licences de réutilisation n’ont pas été vérifiées."
minutes = 10
resume = "Repérer les rôles du matériel, des logiciels, du processeur, de la mémoire, du stockage et des sorties."
objectif = "Décrire le trajet simple d’une information depuis une action de la personne jusqu’à son affichage et son enregistrement."
situation = "Tu saisis un court texte dans un éditeur, tu l’enregistres, puis tu le rouvres. Quels éléments de l’ordinateur participent à ces actions ?"
analogie_titre = "Comme un atelier avec une table, des outils et une armoire"
analogie = "Le clavier apporte une information dans l’atelier. Le processeur exécute les instructions des logiciels ; la mémoire vive est un espace de travail temporaire ; le stockage ressemble à une armoire où l’on garde un fichier enregistré ; l’écran montre un résultat. Le système d’exploitation coordonne une partie de ces échanges et permet aux applications d’utiliser le matériel."
limite_analogie = "Un ordinateur ne comprend pas une consigne comme une personne : il exécute des instructions selon des règles précises. La mémoire vive et le stockage sont des circuits électroniques, pas une table ni une armoire, et la manière dont un logiciel enregistre un fichier peut varier."
notions = [
  "Matériel — parties physiques d’un système, comme un clavier, un écran ou un processeur.",
  "Logiciel — ensemble d’instructions et de données permettant à l’ordinateur d’accomplir des tâches.",
  "Système d’exploitation — logiciel de base qui coordonne notamment le matériel, les fichiers et le lancement d’applications.",
  "Processeur — composant qui exécute des instructions et effectue des opérations.",
  "Mémoire vive (RAM) — espace de travail temporaire utilisé pendant l’activité de l’ordinateur.",
  "Stockage — support qui conserve normalement des fichiers après la fermeture d’un logiciel et l’arrêt de l’ordinateur.",
  "Entrée et sortie — information reçue par le système ou résultat présenté, par exemple au clavier ou à l’écran."
]
demarche = [
  "Repère d’abord la personne et l’action : ici, elle tape un texte avec le clavier.",
  "Le logiciel d’édition reçoit les touches ; le système d’exploitation aide l’application à utiliser le matériel.",
  "Le processeur exécute les instructions. La mémoire vive garde temporairement les éléments dont l’application a besoin pendant qu’elle fonctionne.",
  "L’écran est une sortie : il présente le texte. Quand la personne choisit d’enregistrer, le logiciel demande au système de conserver le fichier sur un support de stockage.",
  "Quand le fichier est rouvert, le stockage fournit ses données au logiciel. Si le fichier n’a pas été enregistré, les dernières modifications peuvent ne pas avoir été conservées."
]
exercice = "Associe chaque rôle à l’action correspondante : le clavier reçoit les touches, le processeur exécute des instructions, la mémoire vive soutient le travail en cours, le stockage garde un fichier enregistré et l’écran montre le texte. Quel élément correspond à chaque action ?"
aide = "Cherche si l’élément reçoit une action, exécute des instructions, sert d’espace de travail temporaire, conserve des données ou présente un résultat."
correction = [
  "Le clavier est une entrée : il transmet les touches saisies.",
  "Le processeur exécute les instructions du logiciel.",
  "La mémoire vive soutient le travail en cours et son contenu peut disparaître à l’arrêt.",
  "Le stockage conserve normalement le fichier enregistré.",
  "L’écran est une sortie qui rend le texte visible."
]
a_retenir = [
  "Un ordinateur associe du matériel et des logiciels qui coopèrent.",
  "Mémoire vive et stockage ont des rôles différents : travail temporaire d’un côté, conservation d’un fichier enregistré de l’autre.",
  "Le processeur exécute des instructions ; il ne devine pas l’intention de la personne.",
  "Un service de stockage distant, un réglage de sauvegarde ou une application peut modifier l’endroit et la manière dont un fichier est conservé."
]
transferer = "Cette carte aide à comprendre un ordinateur, une tablette, une borne ou certains objets connectés. Elle simplifie les architectures réelles : plusieurs processeurs, mémoires et supports peuvent coopérer, et une application peut utiliser un service distant."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

