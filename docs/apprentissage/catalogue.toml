  "L’information sur les allergènes se trouve dans la liste des ingrédients ou dans l’indication prévue sur l’emballage.",
  "« À consommer de préférence avant » correspond à une date de durabilité minimale. Les conditions de stockage et l’état réel du produit restent importants."
]
a_retenir = [
  "Lis l’emballage réel plutôt que de te fier à la mémoire ou à une image ancienne.",
  "Ne confonds pas les deux formules de date.",
  "Une étiquette informe ; elle ne remplace pas un avis médical ou une vérification liée à une allergie."
]
transferer = "Ces repères peuvent aider à comparer des produits ou à repérer une information. Les règles d’étiquetage peuvent évoluer ; en cas de doute, consulte une source officielle récente, le fabricant ou un professionnel de santé."
