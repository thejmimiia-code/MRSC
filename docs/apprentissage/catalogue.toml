niveau = 2
horizon_contenu = "Premiers repères d’analyse de sources avec des documents entièrement fictifs, sans événement historique réel"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de méthode historique utilisant deux documents inventés. Faire relire la distinction entre auteur, date, intention, observation et interprétation par une personne compétente en histoire et en éducation aux médias. Une date proche ne garantit pas à elle seule la fiabilité ; aucun fait historique réel n’est avancé. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 9
resume = "Examiner qui a produit une source, quand, pour quel public et ce qu’elle permet réellement d’affirmer."
objectif = "Comparer deux documents fictifs en distinguant leur auteur, leur date, leur intention et les éléments qu’ils décrivent."
situation = "Deux documents fictifs parlent d’une réunion de quartier. Une affiche datée du 4 mai annonce un début à 18 h. Le lendemain, une participante note dans son carnet qu’elle est arrivée à 18 h 10 et que la discussion avait déjà commencé. Les documents donnent-ils exactement la même information ?"
analogie_titre = "Comme regarder une place depuis deux fenêtres"
analogie = "Deux fenêtres donnent des vues différentes du même endroit. De même, une affiche et le carnet d’une participante peuvent éclairer des aspects différents d’un événement : ce qui était prévu, ce qu’une personne a observé ou ce qu’elle a retenu."
limite_analogie = "Une source n’est pas une fenêtre transparente. Son auteur choisit quoi noter, pour qui et à quel moment ; un souvenir peut aussi être incomplet. Il faut examiner le document et le contexte, pas seulement l’impression qu’il donne."
notions = [
  "Source — document, objet, témoignage ou trace qui apporte des informations sur un sujet.",
  "Auteur ou producteur — personne ou organisme à l’origine de la source, s’il est connu.",
  "Date — moment où le document a été produit ou où l’événement est décrit ; ces dates peuvent différer.",
  "Point de vue — position et expérience depuis lesquelles une personne raconte ou décrit quelque chose.",
  "Corroborer — comparer avec d’autres éléments indépendants pour examiner une affirmation.",
  "Limite — question à laquelle une source ne peut pas répondre à elle seule."
]
demarche = [
  "Décris chaque document : de quel type s’agit-il et qui l’a produit ?",
  "Note sa date, son public visé et son but probable, en séparant ce qui est écrit de ce que tu supposes.",
  "Relève exactement les affirmations ou observations de chaque source.",
  "Compare les points communs et les différences ; vérifie si deux phrases parlent du même aspect ou du même moment.",
  "Cherche ce que chaque document ne permet pas de savoir et quelles autres sources pourraient éclairer la question.",
  "Présente une conclusion prudente, proportionnée aux éléments disponibles."
]
exercice = "Un avis fictif daté du 12 juin annonce une porte ouverte à 11 h. Une note de visite écrite le même jour dit : « Je suis entré vers 11 h 15 ; la présentation avait commencé. » Pour chaque document, indique qui parle, ce qui est annoncé ou observé et ce qu’on ne peut pas conclure à partir de ces seules lignes."
aide = "L’avis renseigne sur ce qui était annoncé. La note décrit l’expérience d’une personne après son arrivée ; elle ne dit pas nécessairement à quelle heure la présentation a commencé."
correction = [
  "L’avis, daté du 12 juin, annonce une porte ouverte à 11 h ; il renseigne sur le programme prévu.",
  "La note rapporte qu’une personne est arrivée vers 11 h 15 et a vu la présentation en cours ; elle ne donne pas l’heure exacte du début.",
  "Les deux documents ne se contredisent pas forcément. Pour savoir ce qui s’est réellement passé et à quelle heure, il faudrait d’autres éléments."
]
a_retenir = [
