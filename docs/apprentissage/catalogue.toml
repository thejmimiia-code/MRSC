id = "arts-rythme-musique"
titre = "Trouver la pulsation d’une musique"
matiere = "Arts : musique"
matiere_id = "arts"
domaine = "arts-culture"
niveau = 1
minutes = 7
resume = "Distinguer le battement régulier d’une musique des sons joués autour."
objectif = "Repérer une pulsation et compter des temps dans un motif simple."
situation = "Imagine un motif joué sur quatre temps : « fort, doux, doux, doux », puis répété. Il n’est pas nécessaire d’avoir un instrument pour lire l’exercice."
analogie_titre = "Comme un pas régulier en marchant"
analogie = "La pulsation ressemble à un pas régulier : elle donne un repère qui revient. Les sons ou silences placés entre les pas forment des rythmes plus variés."
limite_analogie = "Toute musique ne suit pas une marche régulière. Les styles, les cultures et les interprétations peuvent utiliser des pulsations variables ou difficiles à compter."
notions = [
  "Pulsation — battement régulier qui sert de repère dans une musique.",
  "Rythme — organisation des sons et des silences dans le temps.",
  "Tempo — vitesse de la pulsation."
]
demarche = [
  "Lis le motif en comptant lentement : 1, 2, 3, 4.",
  "Repère le son qui revient au début du cycle.",
  "Essaie de garder le même intervalle entre les nombres, même si le son change.",
  "Recommence plus vite ou plus lentement : le motif peut garder le même ordre avec un autre tempo."
]
exercice = "Sur quatre temps réguliers, le motif est « frappe, silence, frappe, frappe ». Combien de sons entends-tu sur un cycle ? Où se trouvent-ils ?"
aide = "Compte les temps et distingue le mot « silence » d’un son."
correction = [
  "Il y a trois sons sur quatre temps.",
  "Ils se trouvent aux temps 1, 3 et 4 ; le deuxième temps est un silence.",
  "Le comptage décrit cet exemple inventé, pas une règle pour toutes les musiques."
]
a_retenir = [
  "La pulsation sert de repère régulier ; le rythme organise les sons et les silences.",
  "Le tempo indique la vitesse de la pulsation.",
  "On peut écouter, compter, taper doucement ou simplement lire le motif."
]
transferer = "Tu peux essayer cette idée en écoutant une musique qui te plaît, ou la remplacer par un mouvement discret. Rien n’oblige à produire un son : tu peux compter mentalement ou utiliser un support visuel."
revue_le = "2026-10-07"
intervalle_revue_jours = 365

