[[fiche]]
id = "langue-anglais-demander-aide"
titre = "Demander de l’aide ou une répétition en anglais"
matiere = "Langue étrangère : anglais"
matiere_id = "langues"
domaine = "langues-etrangeres"
niveau = 1
horizon_contenu = "Premières expressions d’anglais dans des échanges simples ; traductions d’appui en français"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de langue à relire par une personne compétente en anglais et en pédagogie des langues. Vérifier le naturel des expressions, les traductions, le registre selon le contexte et les variantes possibles. La fiche n’inclut pas d’audio ni de garantie de prononciation ; les sources, les droits, l’accessibilité et les essais apprenants restent à contrôler."
minutes = 7
resume = "Utiliser quelques expressions courtes pour demander de l’aide, faire répéter ou ralentir un échange."
objectif = "Choisir une formule anglaise simple qui correspond au besoin, puis vérifier qu’elle est comprise."
situation = "Dans une situation fictive à l’accueil d’un lieu public, une personne te donne une indication trop rapidement. Tu veux demander qu’elle répète ou parle plus lentement."
analogie_titre = "Comme choisir le bon bouton pour préciser son besoin"
analogie = "Dans un échange, une phrase courte peut indiquer ce qui aiderait : recevoir de l’aide, entendre une répétition ou ralentir le débit. Choisir la phrase qui correspond à la difficulté évite de demander autre chose que ce dont on a besoin."
limite_analogie = "Une conversation n’est pas un appareil qui répond toujours de la même manière. Le ton, l’accent, le bruit et le contexte comptent ; une personne peut demander une autre formulation, écrire le message ou utiliser un autre moyen de communication."
notions = [
  "Could you help me, please? — formule polie pour demander de l’aide : « Pouvez-vous m’aider, s’il vous plaît ? »",
  "Could you say that again, please? — demande de répétition : « Pouvez-vous répéter, s’il vous plaît ? »",
  "Could you speak more slowly, please? — demande de parler plus lentement : « Pouvez-vous parler plus lentement, s’il vous plaît ? »",
  "I don’t understand. — « Je ne comprends pas. » Une phrase directe que l’on peut compléter par une demande précise.",
  "Please — mot de politesse souvent employé dans une demande ; son usage dépend aussi de la phrase et du contexte."
]
demarche = [
  "Repère ce qui bloque : tu as besoin d’aide, d’une répétition, d’un débit plus lent ou d’une explication différente ?",
  "Choisis une expression qui nomme ce besoin. Pour demander une répétition : « Could you say that again, please? »",
  "Pour ralentir : « Could you speak more slowly, please? » Pour demander de l’aide : « Could you help me, please? »",
  "Écoute ou lis la réponse et vérifie si elle t’aide. Tu peux redemander, montrer l’endroit concerné ou écrire une question courte.",
  "Termine l’échange par une formule adaptée, par exemple « Thank you » (« Merci »), si cela convient à la situation."
]
exercice = "Une personne te donne une consigne en anglais, mais tu n’as pas entendu la dernière partie. Choisis une phrase pour demander qu’elle répète, puis une autre pour demander un débit plus lent."
aide = "Pour demander une répétition, repère le verbe « say » (dire) et l’expression « again » (encore). Pour ralentir, le mot « slowly » signifie « lentement »."
correction = [
  "Pour demander une répétition : « Could you say that again, please? »",
  "Pour demander de parler plus lentement : « Could you speak more slowly, please? »",
  "« Sorry, I don’t understand » (« Désolé·e, je ne comprends pas ») peut aussi expliquer la difficulté. Les expressions peuvent varier ; l’objectif est de rendre le besoin compréhensible, pas de réciter une formule unique."
]
a_retenir = [
  "Choisis une formule qui correspond précisément à ce qui t’aiderait.",
  "Tu peux demander une répétition, un débit plus lent ou une autre explication : ce ne sont pas la même demande.",
  "Les traductions donnent un repère, mais la formulation et le registre peuvent varier selon la situation.",
  "La fiche ne fournit pas d’audio : elle n’enseigne pas la prononciation à elle seule."
]
transferer = "Ces expressions peuvent servir dans un échange de voyage, de formation ou de service. Si l’information est importante, vérifie les détails par écrit ou auprès d’une personne qui peut confirmer ; une phrase apprise ne garantit pas que le message a été compris."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

