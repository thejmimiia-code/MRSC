[[fiche]]
id = "recherche-question-hypothese"
titre = "Formuler une question et une hypothèse de recherche"
matiere = "Recherche et esprit critique"
matiere_id = "recherche"
domaine = "etudes-superieures-recherche"
niveau = 3
horizon_contenu = "Premiers repères de conception d’une question de recherche ; l’exemple de la voiture-jouet est fictif"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de méthode de recherche centré sur une question et une hypothèse testables. Faire relire la terminologie, le modèle et les limites par une personne compétente en méthodologie et en sciences expérimentales. Aucun essai réel n’est demandé ; le sujet ne couvre pas les méthodes qualitatives, l’éthique de la recherche ni les plans d’étude avancés. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 10
resume = "Transformer une curiosité en question délimitée, puis formuler une hypothèse qui peut être confrontée à des observations."
objectif = "Distinguer une question de recherche d’une hypothèse et nommer une mesure et une condition à contrôler dans un exemple fictif."
situation = "Scénario fictif : une équipe se demande si la hauteur de départ d’une voiture-jouet sur une rampe modifie la distance parcourue sur une piste horizontale. Quelle question pourrait-elle poser et quelle hypothèse provisoire pourrait-elle examiner ?"
analogie_titre = "Comme poser une question précise avant d’ouvrir une enquête"
analogie = "Une question précise délimite ce que l’on cherche à comprendre. Une hypothèse propose une réponse provisoire qui peut être confrontée à des observations. Elle aide à décider quelles informations seraient utiles, sans prédire à coup sûr ce qu’on découvrira."
limite_analogie = "Toutes les recherches ne testent pas une hypothèse de cette manière. Une étude historique, qualitative, théorique ou exploratoire peut nécessiter d’autres questions et méthodes ; ce petit schéma ne constitue pas une recette universelle."
notions = [
  "Question de recherche — question délimitée à laquelle un travail cherche à répondre à partir d’éléments adaptés.",
  "Hypothèse — réponse provisoire et examinable proposée avant ou pendant l’étude.",
  "Variable — caractéristique qui peut changer ou prendre différentes valeurs dans un exemple.",
  "Mesure — manière définie d’observer ou de quantifier un résultat.",
  "Condition contrôlée — élément que l’on essaie de garder comparable pour interpréter une différence.",
  "Résultat — ce qui est constaté après la collecte ou l’analyse ; il peut soutenir, nuancer ou contredire l’hypothèse."
]
demarche = [
  "Transforme le sujet général en question délimitée : quelle variable change et quel résultat sera observé ?",
  "Propose une hypothèse sous une forme qui peut être examinée : « Si…, alors… ».",
  "Définis comment mesurer le résultat ; évite les termes vagues comme « mieux » sans indicateur.",
  "Repère une condition importante à garder comparable, comme la même voiture, la même piste et la même façon de la relâcher.",
  "Prévois plusieurs essais et des limites ; un seul résultat ne suffit pas toujours pour conclure.",
  "Compare les observations à l’hypothèse et reste prêt à la modifier si les données ne la soutiennent pas."
]
exercice = "Pour la voiture-jouet fictive, écris une question précise sur la hauteur de départ et la distance parcourue. Ajoute une hypothèse qui commence par « Si la hauteur augmente… », une manière de mesurer la distance et deux conditions à garder comparables. Aucun essai réel n’est demandé."
aide = "Une question demande ce que l’on cherche à savoir. L’hypothèse propose une réponse provisoire. La mesure précise ce qu’on observerait pour les comparer."
correction = [
  "Question possible : « Dans ce modèle fictif, la hauteur de départ de la voiture change-t-elle la distance qu’elle parcourt sur la piste horizontale ? »",
  "Hypothèse possible : « Si la hauteur de départ augmente, alors la distance parcourue pourrait augmenter. » C’est une prédiction à examiner, pas un résultat établi.",
  "Mesure possible : mesurer en centimètres la distance entre le point où la voiture quitte la rampe et son arrêt.",
  "Conditions à comparer : utiliser la même voiture, la même piste et le même geste de relâchement ; répéter plusieurs essais. D’autres facteurs et les limites du modèle devraient aussi être examinés avant toute conclusion."
]
a_retenir = [
  "Une question délimite ce que l’on cherche ; une hypothèse propose une réponse provisoire.",
  "Définir une mesure aide à comprendre ce que signifie un résultat.",
  "Des conditions comparables et des répétitions peuvent aider à examiner une hypothèse, sans supprimer toutes les limites.",
  "Une hypothèse peut être nuancée ou contredite ; le but n’est pas de forcer les observations à la confirmer.",
  "Les méthodes de recherche varient selon la question et la discipline ; ce schéma ne s’applique pas à toutes les recherches."
]
transferer = "Cette démarche peut aider à lire un protocole ou à préparer un petit projet d’étude. Pour une recherche impliquant des personnes, des animaux, des données personnelles ou un risque matériel, des règles d’éthique, de sécurité et d’expertise spécifiques sont nécessaires ; cette fiche ne les remplace pas."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

