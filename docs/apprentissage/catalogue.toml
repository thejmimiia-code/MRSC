[[fiche]]
id = "maths-equation-simple"
titre = "Résoudre une équation simple en gardant l’égalité"
matiere = "Mathématiques"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 2
horizon_contenu = "Première équation à une étape de la forme x + a = b ; les nombres et exercices sont fictifs"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de mathématiques limité aux équations simples où l’inconnue est additionnée à un nombre positif. Faire refaire indépendamment les opérations, la vérification et l’analogie de balance ; ne pas laisser croire que cette fiche couvre l’algèbre. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Trouver un nombre inconnu dans une égalité simple et vérifier le résultat en le remplaçant."
objectif = "Résoudre une équation de la forme x + a = b en soustrayant le même nombre des deux côtés, puis contrôler l’égalité."
situation = "Une boîte contient un nombre inconnu de jetons. On en ajoute 5 et on en compte 13 au total. Combien y avait-il de jetons avant l’ajout ?"
analogie_titre = "Comme garder une balance à niveau"
analogie = "Si deux plateaux portent la même masse, retirer la même masse des deux côtés garde l’équilibre. Dans l’égalité x + 5 = 13, soustraire 5 aux deux membres permet d’isoler x sans changer l’égalité."
limite_analogie = "Les nombres ne sont pas des objets sur une balance, et l’analogie ne montre pas toutes les règles de l’algèbre. Elle aide seulement à comprendre pourquoi on effectue la même opération des deux côtés."
notions = [
  "Équation — égalité qui contient une ou plusieurs valeurs inconnues.",
  "Inconnue — valeur que l’on cherche ; elle peut être représentée par une lettre comme x.",
  "Égalité — les deux côtés ont la même valeur.",
  "Opération inverse — ici, soustraire 5 annule l’ajout de 5.",
  "Vérification — remplacer l’inconnue trouvée dans l’équation de départ et contrôler les deux côtés."
]
demarche = [
  "Repère l’inconnue et l’opération qui lui est appliquée : dans x + 5 = 13, on ajoute 5 à x.",
  "Pour défaire l’ajout de 5, soustrais 5 au membre de gauche et aussi au membre de droite.",
  "Calcule : x + 5 − 5 = 13 − 5, donc x = 8.",
  "Remplace x par 8 dans l’égalité de départ : 8 + 5 = 13.",
