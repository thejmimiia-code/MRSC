[[fiche]]
id = "numerique-verifier-media"
titre = "Vérifier une voix, une image ou une vidéo"
matiere = "Numérique et information"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 3
minutes = 9
resume = "Ne pas prendre une ressemblance sonore ou visuelle pour une preuve d’identité ou de vérité."
objectif = "Vérifier l’identité, l’origine, le contexte et la demande d’un média avant d’agir ou de le partager."
situation = "Tu reçois un message vocal qui semble venir d’un proche : « J’ai changé de téléphone, j’ai un problème, envoie-moi de l’argent tout de suite et ne rappelle pas. » Une voix familière suffit-elle à confirmer qui parle ?"
analogie_titre = "Comme vérifier la date et le verso d’une photo"
analogie = "Une photo imprimée peut sembler authentique, mais son verso, sa date et la personne qui l’a envoyée aident à comprendre d’où elle vient. Pour un fichier audio ou vidéo, regarde aussi la source d’origine, le contexte et une confirmation obtenue séparément."
limite_analogie = "Un fichier numérique peut être copié, recadré, monté ou synthétisé sans laisser de signe visible fiable. Une voix ou un visage ressemblant à quelqu’un, comme une petite anomalie visuelle, ne permet pas à lui seul de conclure. Les détecteurs automatiques peuvent aussi se tromper."
notions = [
  "Contenu synthétique — image, voix, vidéo ou texte produit ou modifié par un outil informatique, parfois à l’aide d’IA.",
  "Usurpation — usage trompeur du nom, de l’image, de la voix ou du compte d’une autre personne ou organisation.",
  "Vérification indépendante — confirmation obtenue par un contact ou une source choisis avant de recevoir le message suspect."
]
demarche = [
  "Fais une pause. Ne paie pas, ne transfère pas et ne relaie pas le fichier tant que la demande n’est pas vérifiée.",
  "Demande-toi qui affirme quoi, d’où vient le fichier, à quel moment et ce qu’on te demande de faire.",
  "Rappelle la personne sur un numéro déjà enregistré ou utilise un autre moyen de contact connu ; ne rappelle pas le numéro ni le compte indiqué dans le message suspect.",
  "Cherche la publication d’origine et une confirmation dans une source indépendante. Si le média reste incertain, présente-le comme non vérifié ou ne le partage pas."
]
exercice = "Un message vocal familier demande un virement urgent. Quelle vérification indépendante peux-tu faire avant toute action ?"
aide = "Rappelle la personne au numéro que tu connaissais déjà, ou pose avec elle une question de vérification convenue à l’avance."
correction = [
  "Ne transfère pas d’argent sur la seule base de la voix, du visage ou d’une vidéo.",
  "Contacte la personne par un numéro enregistré auparavant ou par un autre canal connu, sans utiliser les coordonnées de la demande reçue.",
  "Si tu ne parviens pas à confirmer l’identité et le contexte, diffère l’action et demande conseil à une personne de confiance."
]
a_retenir = [
  "Une voix, une image, une vidéo, un numéro affiché ou un ton familier ne prouvent pas une identité.",
  "Vérifie séparément l’identité, le contexte et la demande ; l’urgence est une raison de ralentir, pas d’obéir plus vite.",
  "Aucun indice visuel isolé ni détecteur d’IA ne fournit une garantie générale."
]
transferer = "La même méthode aide pour une vidéo d’actualité, une consigne professionnelle, un faux conseiller, une demande d’aide familiale ou une publicité. Elle ne permet pas d’authentifier un média à coup sûr : en cas d’incertitude, ne le présente pas comme certain et vérifie auprès d’une source ou d’un contact légitime."
revue_le = "2026-10-07"
intervalle_revue_jours = 90

