[[fiche]]
id = "sciences-calculer-vitesse-moyenne"
titre = "Calculer une vitesse moyenne simple"
matiere = "Sciences, technologie et environnement"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 2
horizon_contenu = "Relation distance-temps dans un exemple de mouvement fictif ; aucune consigne de déplacement réel"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de physique limité au calcul d’une vitesse moyenne constante sur la durée considérée. Faire vérifier les unités, l’interprétation de la moyenne et le périmètre par une personne compétente en physique. Le trajet est fictif et ne fournit aucun conseil de conduite ou de sécurité ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Diviser une distance par une durée pour exprimer une vitesse moyenne dans une unité cohérente."
objectif = "Calculer une vitesse moyenne simple à partir d’une distance et d’une durée données dans des unités compatibles."
situation = "Dans une simulation fictive, un petit robot parcourt 18 mètres en 3 secondes sur une piste. Quelle est sa vitesse moyenne pendant ce trajet ?"
analogie_titre = "Comme compter la distance parcourue pendant chaque tranche de temps"
analogie = "Si un robot avance à distance égale pendant chaque seconde, on peut compter combien de mètres il parcourt en une seconde. La vitesse moyenne résume la distance totale parcourue par unité de temps sur tout le trajet."
limite_analogie = "Un déplacement réel peut accélérer, ralentir ou s’arrêter. Une vitesse moyenne ne dit pas à quelle vitesse l’objet allait à chaque instant ni comment il s’est déplacé entre le départ et l’arrivée."
notions = [
  "Distance — longueur totale du trajet considéré, exprimée ici en mètres.",
  "Durée — temps écoulé pendant le trajet, exprimé ici en secondes.",
  "Vitesse moyenne — distance totale divisée par la durée totale sur l’intervalle étudié.",
  "Unité de vitesse — unité composée, par exemple mètres par seconde (m/s) ou kilomètres par heure (km/h).",
  "Unités compatibles — distance et durée exprimées dans les unités correspondant à la vitesse recherchée."
]
demarche = [
  "Repère la distance totale et la durée totale données dans le problème.",
  "Vérifie les unités ; si la distance est en mètres et le temps en secondes, le résultat sera en mètres par seconde.",
  "Divise la distance par la durée : vitesse moyenne = distance ÷ durée.",
  "Dans le scénario, calcule 18 m ÷ 3 s = 6 m/s.",
  "Contrôle l’ordre de grandeur en multipliant : 6 m/s pendant 3 s correspond à 18 m.",
  "Interprète le résultat comme une moyenne sur le trajet, pas comme une vitesse constante à chaque instant."
]
exercice = "Dans une autre simulation fictive, un robot parcourt 24 mètres en 4 secondes. Calcule sa vitesse moyenne en mètres par seconde et vérifie le résultat en multipliant par la durée."
aide = "Garde les mètres au numérateur et les secondes au dénominateur : divise 24 par 4, puis indique l’unité m/s."
correction = [
  "24 m ÷ 4 s = 6 m/s.",
  "Vérification : 6 m/s × 4 s = 24 m.",
  "La vitesse moyenne est de 6 mètres par seconde pour toute la durée indiquée. Le robot n’a pas nécessairement gardé cette vitesse à chaque instant."
]
a_retenir = [
  "Pour une vitesse moyenne simple, divise la distance totale par la durée totale.",
  "Les unités du résultat dépendent de celles de la distance et du temps.",
  "Une vitesse moyenne ne donne pas la vitesse instantanée ni le détail du trajet.",
  "Cette fiche ne traite pas des accélérations, des conversions entre m/s et km/h ni de la sécurité des déplacements réels."
]
transferer = "La relation peut aider à interpréter une simulation ou un énoncé de physique. Ne l’utilise pas seule pour prévoir la sécurité d’un déplacement réel : la trajectoire, les arrêts, les conditions et les règles applicables comptent aussi."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

