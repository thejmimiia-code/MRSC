[[fiche]]
id = "maths-moyenne"
titre = "Comprendre une moyenne comme un partage égal"
matiere = "Mathématiques — statistiques simples"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
horizon_contenu = "Repères de cycle 4 ; notion reprise pas à pas, sans âge requis"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Rédaction et exemples originaux ; exactitude du calcul, interprétation statistique, relecture pédagogique indépendante, droits, accessibilité et essais apprenants restent à vérifier avant toute diffusion. La source sert de repère factuel et sa licence de réutilisation n’a pas été vérifiée."
minutes = 10
resume = "Additionner des valeurs, puis répartir le total également pour calculer leur moyenne."
objectif = "Calculer et interpréter la moyenne arithmétique d’une petite série de valeurs compatibles."
situation = "Dans un jeu fictif, les scores de quatre manches sont 1, 3, 6 et 10 points. Quel score par manche obtiendrait-on si les 20 points étaient répartis également ?"
analogie_titre = "Comme partager une pile de jetons en parts égales"
analogie = "Imagine que tu réunisses les points de plusieurs manches dans une seule pile, puis que tu les partages également entre les manches. La part de chaque manche après ce partage est la moyenne. La règle de calcul est donc : additionner les valeurs, puis diviser par leur nombre."
limite_analogie = "Dans les données réelles, les scores ne sont pas déplacés : la moyenne résume la série, elle ne décrit pas forcément une valeur observée. Elle peut être influencée par une valeur très grande ou très petite et ne dit pas, à elle seule, comment les valeurs sont réparties."
notions = [
  "Série — liste des valeurs recueillies pour une même question ou mesure.",
  "Moyenne arithmétique — somme des valeurs divisée par le nombre de valeurs.",
  "Effectif — nombre de valeurs de la série.",
  "Diviser (÷) — partager une quantité en parts égales ; 20 ÷ 4 cherche la taille de chacune des 4 parts d’un total de 20.",
  "Valeur atypique — valeur éloignée de la plupart des autres, qui peut déplacer la moyenne."
]
demarche = [
  "Vérifie que toutes les valeurs décrivent la même chose et sont exprimées dans la même unité.",
  "Additionne les valeurs : 1 + 3 + 6 + 10 = 20 points.",
  "Compte les valeurs : il y a 4 manches.",
  "Divise le total par le nombre de valeurs : 20 ÷ 4 = 5. Le symbole ÷ signifie ici que l’on répartit les 20 points en 4 parts égales.",
  "Interprète le résultat avec son unité : la moyenne est de 5 points par manche. Vérifie le partage : 5 + 5 + 5 + 5 = 20. Aucune manche n’a marqué exactement 5 points : c’est une moyenne, pas le récit d’une manche."
]
exercice = "Dans trois manches fictives, une joueuse marque 3, 6 et 9 points. Quelle est sa moyenne de points par manche ?"
aide = "Additionne les trois scores, puis partage le total entre les trois manches : (3 + 6 + 9) ÷ 3."
correction = [
  "3 + 6 + 9 = 18 points au total.",
  "Il y a 3 manches, donc 18 ÷ 3 = 6.",
  "La moyenne est de 6 points par manche. Ici, ce score est aussi celui de la deuxième manche, mais ce n’est pas toujours le cas."
]
a_retenir = [
  "Moyenne = somme des valeurs ÷ nombre de valeurs.",
  "Le nombre de valeurs compte autant que leur total : n’oublie pas de compter les données.",
  "La moyenne peut ne correspondre à aucune valeur réellement observée.",
  "Une moyenne résume une série mais ne suffit pas toujours à décrire ses différences ou ses valeurs extrêmes."
]
transferer = "Une moyenne peut résumer de petites séries de durées, de distances ou de scores, si les valeurs mesurent bien la même chose. Pour comparer des groupes ou prendre une décision importante, examine aussi la taille des groupes, l’étendue des valeurs et le contexte ; une moyenne seule peut masquer des différences."
revue_le = "2026-10-08"
intervalle_revue_jours = 365

