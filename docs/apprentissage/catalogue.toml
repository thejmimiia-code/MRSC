[[fiche]]
id = "fr-argumenter-avec-exemple"
titre = "Présenter une idée avec une raison et un exemple"
matiere = "Français et communication"
matiere_id = "francais"
domaine = "langue-communication"
niveau = 2
horizon_contenu = "Premiers repères d’argumentation et de communication ; les situations et opinions proposées sont fictives"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome sur la structure d’un argument simple. Faire relire la distinction entre opinion, raison, exemple et fait, ainsi que le ton, par des personnes compétentes en français et en médiation. Un exemple fictif n’établit pas un fait général ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 9
resume = "Relier une idée à une raison et à un exemple, sans présenter une préférence comme une vérité générale."
objectif = "Formuler une proposition, l’expliquer par une raison et l’illustrer par un exemple clairement situé."
situation = "Scénario fictif : un groupe choisit entre 14 h et 15 h pour une activité de 75 minutes dans une salle qui ferme à 16 h. Tu proposes 14 h. Comment expliquer ton choix sans prétendre que tout le monde a la même préférence ?"
analogie_titre = "Comme donner l’adresse et un repère pour trouver le lieu"
analogie = "Une adresse indique ce que l’on propose ; un repère aide à comprendre pourquoi cela peut convenir. Un exemple rend le repère concret. Dans un argument, l’idée, la raison et l’exemple jouent des rôles différents."
limite_analogie = "Un argument n’est pas une adresse vérifiable d’un seul coup. Une raison peut être discutée, un exemple peut être particulier et plusieurs personnes peuvent tirer des conclusions différentes."
notions = [
  "Proposition — idée ou préférence que l’on présente.",
  "Raison — explication qui répond à la question « pourquoi ? ».",
  "Exemple — situation précise qui illustre une raison, sans prouver à elle seule une règle générale.",
  "Fait vérifiable — affirmation que l’on peut confronter à des éléments ou à des sources ; il ne se confond pas avec un avis.",
  "Nuance — précision qui indique une limite, une condition ou une autre possibilité."
]
demarche = [
  "Énonce ton idée ou ta proposition sans la présenter comme un fait si c’est une préférence.",
  "Ajoute une raison qui explique ce choix.",
  "Donne un exemple concret et précise à quelle situation il correspond.",
  "Vérifie si une phrase contient un fait vérifiable ; si oui, cherche une source ou formule-la avec prudence.",
  "Ajoute une nuance si l’exemple ne vaut pas pour tout le monde, puis laisse la place à une autre proposition."
]
exercice = "Pour le scénario de l’activité de 75 minutes et de la salle qui ferme à 16 h, écris une proposition pour commencer à 14 h, une raison et un exemple fictif qui l’illustre. Termine par une phrase qui montre que d’autres personnes peuvent préférer 15 h."
aide = "Tu peux compléter ces débuts : « Je propose… », « parce que… », « par exemple… », « cela peut différer si… »."
correction = [
  "Exemple possible : « Je propose 14 h parce qu’une activité de 75 minutes se terminerait à 15 h 15, avant la fermeture fictive de la salle à 16 h. Cela peut ne pas convenir à tout le monde ; nous pouvons comparer les deux horaires. »",
  "La durée et le groupe sont fictifs. Dans une discussion réelle, vérifie les contraintes au lieu de traiter cet exemple comme un fait.",
  "D’autres arguments sont possibles si l’idée, sa raison et l’exemple sont distincts et compréhensibles."
]
a_retenir = [
  "Une proposition, une raison et un exemple n’ont pas le même rôle.",
  "Un exemple illustre une idée mais ne suffit pas toujours à démontrer qu’elle est vraie en général.",
  "Une préférence peut être exprimée clairement sans être présentée comme une vérité universelle.",
  "Argumenter consiste à rendre son raisonnement compréhensible, pas à forcer l’accord."
]
transferer = "Cette structure peut aider à présenter un choix, une idée de projet ou un désaccord respectueux. Pour un sujet public, scientifique, juridique ou financier, vérifie les faits et les sources pertinentes ; un exemple personnel ne remplace pas cette vérification."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

