[[fiche]]
id = "histoire-situer-siecle"
titre = "Situer une année dans un siècle"
matiere = "Histoire et chronologie"
matiere_id = "histoire"
domaine = "histoire-memoire"
niveau = 2
horizon_contenu = "Repérer le siècle correspondant à une année de l’ère commune ; aucune chronologie d’événements n’est proposée"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de chronologie limité au calcul du siècle d’une année positive de l’ère commune. Faire vérifier les bornes, les exemples et la formulation avec une personne compétente en histoire et en mathématiques. Les années avant notre ère et les calendriers non grégoriens ne sont pas traités. Sources, droits et essais apprenants restent à contrôler."
minutes = 8
resume = "Associer une année de notre ère à son siècle en repérant les bornes de périodes de cent ans."
objectif = "Trouver le siècle correspondant à une année comprise entre l’an 1 et l’an 9999 de l’ère commune, puis vérifier une borne."
situation = "Une frise fictive porte l’année 1789. Dans quel siècle se situe-t-elle ? Comment vérifier les années qui ouvrent et terminent ce siècle ?"
analogie_titre = "Comme ranger les années dans des boîtes de cent"
analogie = "On peut ranger les années de notre ère dans des groupes de cent ans : les années 1 à 100 forment le premier siècle, les années 101 à 200 le deuxième, et ainsi de suite."
limite_analogie = "Le comptage des siècles avant notre ère suit d’autres repères, et cette fiche ne les traite pas. Les calendriers et conventions historiques peuvent aussi varier ; les exercices portent uniquement sur les années de l’ère commune utilisées ici."
notions = [
  "Année — repère de temps utilisé dans le calendrier considéré.",
  "Siècle — période de cent années ; le premier siècle de l’ère commune va de l’an 1 à l’an 100.",
  "Borne — année qui marque le début ou la fin d’une période.",
  "Ère commune — façon de numéroter les années à partir de l’an 1 dans le calendrier grégorien, sans année zéro dans cette suite.",
  "Vérification — contrôle des bornes pour éviter de décaler le siècle d’une année."
]
demarche = [
  "Repère l’année et vérifie qu’il s’agit d’une année de l’ère commune, sans notation avant notre ère.",
  "Si l’année se termine par 00, elle termine un siècle : 1900 est la dernière année du XIXe siècle.",
  "Si elle ne se termine pas par 00, prends les chiffres avant les deux derniers et ajoute 1 : 1789 donne 17 + 1 = XVIIIe siècle.",
  "Pour une année de 1 à 100, le siècle est le Ier ; pour les années suivantes, vérifie les bornes si tu hésites.",
  "Contrôle avec deux repères voisins : le XVIIIe siècle va de 1701 à 1800."
]
exercice = "Dans quel siècle se trouvent les années fictives de cette frise : 1500, 1501, 1900, 1901 et 2026 ? Pour l’une d’elles, donne les bornes du siècle pour vérifier."
aide = "Les années qui se terminent par 00 ferment un siècle. L’année suivante commence le siècle d’après."
correction = [
  "1500 appartient au XVe siècle ; 1501 au XVIe.",
  "1900 appartient au XIXe siècle ; 1901 au XXe.",
  "2026 appartient au XXIe siècle : celui-ci commence en 2001 et se termine en 2100.",
  "La règle ne traite ici que les années de l’ère commune ; elle ne s’applique pas directement aux dates avant notre ère."
]
a_retenir = [
  "Un siècle contient cent années, mais son numéro augmente après l’année qui se termine par 00.",
  "1789 est dans le XVIIIe siècle, qui va de 1701 à 1800.",
  "1900 est la dernière année du XIXe siècle ; 1901 ouvre le XXe.",
  "Cette méthode ne couvre pas les dates avant notre ère ni les autres calendriers."
]
transferer = "Ce repère peut aider à lire une frise ou un texte historique. Il indique une période, pas ce qui s’y est passé : vérifie les événements et les dates dans des sources historiques contextualisées."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

