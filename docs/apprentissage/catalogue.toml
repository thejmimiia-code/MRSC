[[fiche]]
id = "maths-reperer-angle-droit"
titre = "Repérer un angle droit"
matiere = "Mathématiques"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
horizon_contenu = "Reconnaître un angle droit dans des descriptions et formes simples ; aucune mesure avec outil n’est requise"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de géométrie centré sur l’angle droit. Faire vérifier les définitions, les exemples et les descriptions spatiales par une personne compétente en mathématiques et en accessibilité. La fiche n’enseigne pas la mesure de tous les angles ni les constructions géométriques ; sources, droits et essais apprenants restent à contrôler."
minutes = 7
resume = "Comparer un angle à un coin carré de référence pour repérer un angle droit."
objectif = "Identifier un angle droit dans une forme décrite et expliquer le rôle de son sommet et de ses côtés."
situation = "Un rectangle fictif a quatre coins identiques, comme les coins d’une feuille rectangulaire. Comment décrire l’angle formé par deux côtés qui se rejoignent à un coin ?"
analogie_titre = "Comme le coin d’une feuille rectangulaire"
analogie = "Le coin d’une feuille rectangulaire sert de repère familier : deux côtés s’y rejoignent en formant un angle droit. On peut comparer d’autres angles à ce coin sans mesurer immédiatement avec un instrument."
limite_analogie = "Une feuille peut être pliée ou déformée ; son coin n’est un bon repère que si elle est bien rectangulaire. Comparer à l’œil donne une première idée, pas une mesure précise pour un travail qui exige de l’exactitude."
notions = [
  "Angle — ouverture formée par deux demi-droites ou segments qui partent d’un même point.",
  "Sommet — point commun où les deux côtés de l’angle se rejoignent.",
  "Côtés — lignes ou segments qui forment l’angle.",
  "Angle droit — angle de 90 degrés, souvent représenté par un petit carré au sommet dans un schéma.",
  "Repère — forme connue à laquelle on compare un angle pour l’identifier."
]
demarche = [
  "Repère le sommet : le point où les deux côtés se rejoignent.",
  "Observe l’ouverture entre les deux côtés, pas leur longueur.",
  "Compare-la au coin d’une feuille rectangulaire tenue à plat ou à un autre angle droit connu.",
  "Dans un schéma, cherche si un petit carré marque l’angle droit.",
  "Pour un tracé exact, utilise un outil adapté et vérifie sa lecture ; une comparaison visuelle n’est qu’un repère."
]
exercice = "Dans une forme en L décrite comme deux segments qui se rejoignent exactement au coin d’une feuille rectangulaire, l’angle est-il droit ? Quelle partie forme le sommet ?"
aide = "Le sommet est le point de rencontre. Compare l’ouverture au coin de la feuille, pas la taille des segments."
correction = [
  "Oui, si l’angle de la forme correspond au coin rectangulaire de référence, il s’agit d’un angle droit.",
  "Le sommet est le point où les deux segments se rejoignent.",
  "La comparaison aide à reconnaître la forme ; pour garantir une mesure exacte dans un plan, un instrument et une méthode adaptés peuvent être nécessaires."
]
a_retenir = [
  "Un angle est formé par deux côtés qui ont un sommet commun.",
  "Un angle droit mesure 90 degrés et peut être comparé au coin d’un rectangle.",
  "L’ouverture compte, pas la longueur des côtés.",
  "Une comparaison visuelle ne remplace pas une mesure précise lorsque celle-ci est nécessaire."
]
transferer = "Ce repère peut aider à décrire un rectangle, un carrelage ou un dessin géométrique. Cette fiche ne donne pas de plan de découpe ni de consigne d’utilisation d’outil ; pour un travail réel, choisis des outils adaptés et respecte les règles de sécurité."
