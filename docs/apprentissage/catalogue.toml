[[fiche]]
id = "econ-lire-facture"
titre = "Lire une facture et repérer une échéance"
matiere = "Économie, budget et consommation"
matiere_id = "economie"
domaine = "economie-finances"
niveau = 2
horizon_contenu = "Repères de vie courante et de consommation ; les exemples sont fictifs et les portails cités concernent la France"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon autonome centré sur la lecture d’une facture fictive, sans interprétation juridique ni conseil financier personnalisé. La relecture par une personne compétente en consommation et par une personne éditoriale, la vérification des sources et droits, l’accessibilité et les essais apprenants restent à faire. La fiche ne décrit ni les mentions légalement obligatoires, ni les règles d’un abonnement, ni les délais de contestation."
minutes = 10
resume = "Repérer l’émetteur, les montants, le total et la date indiquée, sans confondre date d’émission, période et échéance."
objectif = "Lire les repères d’une facture fictive, additionner ses lignes simples et distinguer la date d’émission de l’échéance affichée."
situation = "Une facture fictive de réparation, datée du 6 septembre 2026, comporte deux lignes de 28 € et 12 €. Le total à régler indiqué est de 40 €, avec la mention « à régler avant le 20 septembre 2026 ». Que représentent les deux dates et comment vérifier le total ?"
analogie_titre = "Comme un ticket détaillé, avec une date à surveiller"
analogie = "Un ticket détaillé présente des lignes et un total : on peut regarder ce qui compose la somme. Une facture peut aussi indiquer qui l’a émise, ce qui est facturé, un total et, parfois, une période ou une échéance. Repérer chaque rubrique aide à lire le document dans le bon ordre."
limite_analogie = "Un ticket de caisse et une facture ne sont pas le même document. Leur présentation varie selon le service et le contexte ; toutes les factures n’affichent pas les mêmes rubriques. L’analogie aide à relier des lignes à un total, mais ne permet pas de vérifier seule la conformité juridique, la réalisation d’un service ou le paiement."
notions = [
  "Émetteur — entreprise ou organisme qui a produit la facture.",
  "Date d’émission — date à laquelle le document a été établi ; elle ne désigne pas forcément la période du service ni sa date de paiement.",
  "Période facturée — période à laquelle une somme se rapporte, lorsqu’elle est indiquée ; certaines factures portent sur une opération ponctuelle.",
  "Échéance — date limite de paiement indiquée sur le document, si une date est précisée ; les modalités peuvent aussi dépendre du contrat ou du moyen de paiement.",
  "Montant total à régler — somme affichée comme restant due ; elle peut tenir compte d’ajustements ou de paiements déjà enregistrés, selon le document."
]
demarche = [
  "Repère l’émetteur et l’objet de la facture. Garde pour toi les références, l’adresse et les autres informations personnelles qui peuvent apparaître sur un document réel.",
  "Cherche la période ou l’opération facturée, si elle est indiquée. Ne suppose pas qu’une facture concerne forcément un mois entier ou un abonnement.",
  "Distingue la date d’émission, la période de service éventuelle et la date d’échéance. Une date ne permet pas de déduire automatiquement les deux autres.",
  "Lis les lignes et leurs montants. Dans un exemple simple, additionne les lignes concernées ; si le total diffère, cherche une remise, un paiement déjà reçu, une taxe ou une autre ligne affichée au lieu de deviner.",
  "Repère le montant présenté comme restant à régler et tout statut de paiement explicite. Un montant dû n’indique pas à lui seul qu’un paiement a déjà été effectué.",
  "Si une facture réelle est ambiguë ou inattendue, vérifie les informations auprès de l’émetteur par un moyen de contact connu. Pour un droit, un désaccord ou une échéance importante, consulte une source officielle à jour ou une personne compétente."
]
exercice = "Sur une facture simplifiée et fictive, une réparation coûte 28 € et une pièce coûte 12 €. Le document a été établi le 6 septembre 2026 ; il indique un total à régler de 40 € avant le 20 septembre 2026. Vérifie le total et nomme les deux dates. Le document indique-t-il que la somme a déjà été payée ?"
aide = "Additionne les deux lignes. Cherche ensuite les mots « établi le » et « à régler avant » : ils ne décrivent pas le même moment."
correction = [
  "28 € + 12 € = 40 €. Dans cet exemple sans autre ligne, le total affiché est cohérent.",
  "Le 6 septembre est la date d’établissement du document ; le 20 septembre est l’échéance affichée pour le règlement.",
  "Non. La mention « total à régler » ne prouve pas que la somme a été payée. Il faudrait consulter un statut de paiement explicite ou une confirmation adaptée, sans partager publiquement les détails du document."
]
a_retenir = [
  "Date d’émission, période facturée et échéance sont trois repères différents.",
  "Les rubriques et leur présentation varient selon le type de facture ; l’absence d’une rubrique ne permet pas d’inventer l’information.",
  "Une addition simple permet de vérifier certaines lignes, mais des remises, taxes, acomptes ou paiements déjà enregistrés peuvent modifier le total.",
  "Une facture n’explique pas nécessairement toutes les conditions d’un contrat et ne confirme pas toujours un paiement déjà effectué.",
  "Sur un document réel, protège les références et vérifie auprès d’un interlocuteur fiable si quelque chose est incertain."
]
transferer = "Ces repères peuvent aider à lire une facture de service ou le détail d’une période d’abonnement. Cette fiche est une première entrée : elle n’explique pas les mentions légalement obligatoires, le renouvellement ou la résiliation d’un abonnement, ni les délais et démarches de contestation. Ces éléments dépendent du document, du contrat et des règles à jour ; vérifie-les auprès d’un service officiel ou d’une personne compétente."
revue_le = "2026-10-11"
intervalle_revue_jours = 180

