[[fiche]]
id = "maths-lire-tableau-croise"
titre = "Lire une information à l’intersection d’un tableau"
matiere = "Mathématiques"
matiere_id = "mathematiques"
domaine = "mathematiques"
niveau = 1
horizon_contenu = "Lire une table fictive à deux entrées en croisant une ligne et une colonne"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de lecture d’un tableau à double entrée. Faire vérifier la disposition, les intitulés et les réponses par une personne compétente en mathématiques et en littératie des données. La fiche ne couvre pas les tableaux complexes ni les données réelles ; sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 7
resume = "Croiser un intitulé de ligne et un intitulé de colonne pour retrouver la bonne case."
objectif = "Lire une valeur fictive dans un tableau à deux entrées sans confondre les lignes et les colonnes."
situation = "Tableau fictif des salles d’un atelier : en colonnes, « Matin » et « Après-midi » ; en lignes, « Lundi » et « Mardi ». Lundi : salle A le matin, salle C l’après-midi. Mardi : salle B le matin, salle A l’après-midi. Quelle salle est prévue mardi après-midi ?"
analogie_titre = "Comme choisir un casier à partir de deux repères"
analogie = "Un casier peut être repéré par une rangée et une colonne. Dans un tableau à deux entrées, on utilise aussi deux intitulés pour trouver la case qui les croise."
limite_analogie = "Un tableau ne contient que les informations qui y sont inscrites. Des lignes ou colonnes manquantes, une unité imprécise ou un titre incomplet peuvent rendre la lecture incertaine ; le tableau n’explique pas toujours comment les données ont été obtenues."
notions = [
  "Ligne — rangée d’informations, souvent nommée à gauche du tableau.",
  "Colonne — série verticale d’informations, souvent nommée en haut du tableau.",
  "En-tête — intitulé qui décrit une ligne ou une colonne.",
  "Case — emplacement à l’intersection d’une ligne et d’une colonne.",
  "Tableau à deux entrées — tableau où deux catégories servent ensemble à retrouver une information."
]
demarche = [
  "Lis le titre pour comprendre ce que le tableau décrit.",
  "Repère l’intitulé de la ligne qui correspond à ta première information.",
  "Repère l’intitulé de la colonne qui correspond à la seconde information.",
  "Suis la ligne et la colonne jusqu’à leur intersection, puis lis la case.",
  "Vérifie les en-têtes et l’unité avant de reprendre la valeur."
]
exercice = "Avec le tableau fictif de la situation, quelle salle est prévue lundi après-midi ? Et quelle salle est prévue mardi matin ? Quelle case dois-tu lire pour répondre à chaque question ?"
aide = "Pour « lundi après-midi », repère d’abord la ligne Lundi, puis la colonne Après-midi. Fais l’inverse pour Mardi matin, sans changer de case."
correction = [
  "Lundi après-midi : la case à l’intersection de la ligne Lundi et de la colonne Après-midi indique la salle C.",
  "Mardi matin : la ligne Mardi croisée avec la colonne Matin indique la salle B.",
  "La ligne et la colonne doivent toutes deux correspondre à la question ; lire une seule étiquette ne suffit pas."
]
a_retenir = [
  "Lis le titre et les en-têtes avant de chercher une case.",
  "Une valeur d’un tableau à deux entrées se trouve au croisement d’une ligne et d’une colonne.",
  "Vérifie l’unité et la période si le tableau porte sur une mesure ou un horaire.",
  "Un tableau organisé ne garantit pas que les données sont exactes ou complètes."
]
transferer = "Cette lecture sert pour un horaire, un tableau de présence ou un relevé simple. Pour une donnée qui a des conséquences, cherche aussi sa source, sa date et la méthode utilisée."
