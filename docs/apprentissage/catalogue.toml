id = "tech-kwh"
titre = "Comprendre un kilowattheure"
matiere = "Sciences et technologie"
matiere_id = "sciences"
domaine = "sciences-techniques-environnement"
niveau = 3
minutes = 9
resume = "Relier une puissance à une durée pour comprendre une consommation d’électricité."
objectif = "Utiliser la relation énergie consommée = puissance × durée dans un exemple simple."
situation = "Un appareil fictif utilise une puissance moyenne de 1 000 watts pendant une heure. Quelle énergie cela représente-t-il ?"
analogie_titre = "Comme le débit d’un robinet et le volume dans un seau"
analogie = "Le débit dit combien d’eau passe chaque minute ; le volume total dépend aussi du temps pendant lequel le robinet coule. De façon comparable, la puissance indique un rythme d’utilisation de l’énergie et la durée contribue à la consommation totale."
limite_analogie = "L’électricité n’est pas de l’eau, et cette comparaison n’explique pas son fonctionnement physique. La puissance réelle d’un appareil peut varier pendant l’usage : une étiquette ou un calcul simple donne un repère, pas toujours la consommation exacte du foyer."
notions = [
  "Watt (W) — unité de puissance.",
  "Kilowatt (kW) — 1 000 watts.",
  "Kilowattheure (kWh) — énergie consommée par une puissance d’un kilowatt utilisée pendant une heure."
]
demarche = [
  "Convertis la puissance en kilowatts : 1 000 W = 1 kW.",
  "Multiplie la puissance en kW par la durée en heures : 1 kW × 1 h = 1 kWh.",
  "Pour 500 W pendant 2 h, convertis d’abord : 500 W = 0,5 kW.",
  "Calcule 0,5 kW × 2 h = 1 kWh."
]
exercice = "Un appareil fictif de 500 W fonctionne pendant 2 heures à cette puissance. Quelle énergie cela représente-t-il ?"
aide = "500 W correspond à 0,5 kW. Multiplie 0,5 par 2 heures."
correction = [
  "500 W = 0,5 kW.",
  "0,5 kW × 2 h = 1 kWh.",
  "L’exemple suppose une puissance constante ; un appareil réel peut fonctionner par cycles et consommer autrement."
]
a_retenir = [
  "Le watt et le kilowatt décrivent une puissance ; le kilowattheure décrit une énergie.",
  "1 kW pendant 1 h correspond à 1 kWh.",
  "Le coût dépend aussi du tarif appliqué et des autres éléments de la facture ; aucun prix actuel n’est donné ici."
]
transferer = "Pour comprendre une étiquette d’énergie, compare la puissance indiquée et la durée d’utilisation. Pour ta consommation réelle, utilise la mesure du compteur et la facture de ton fournisseur, dont les tarifs et conditions peuvent changer."
revue_le = "2026-10-07"
intervalle_revue_jours = 180

