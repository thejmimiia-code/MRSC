  "Compare avec une source officielle ou indépendante pertinente, en gardant le contexte.",
  "Si la réponse ne se vérifie pas, signale le doute ou ne la reprends pas comme certaine. Ne colle pas de données personnelles ou confidentielles dans un outil non approuvé."
]
exercice = "L’IA répond : « 72 % des habitants de la ville ont choisi ce projet », mais ne donne ni source, ni date, ni définition du mot « habitants ». Quelles questions faut-il résoudre avant de répéter ce chiffre ?"
aide = "Demande : qui a mesuré, quand, sur quelle population et comment ?"
correction = [
  "Il faut identifier la source, la date, la méthode de mesure et le nombre de personnes interrogées.",
  "Il faut clarifier si le chiffre porte sur tous les habitants, les personnes inscrites ou uniquement les personnes qui ont répondu.",
  "Sans ces éléments, le chiffre n’est pas vérifié et ne doit pas être présenté comme une certitude."
]
a_retenir = [
  "Une formulation convaincante n’est pas une preuve.",
  "Vérifie la source directement, la date, les définitions et la méthode.",
  "Protège les données personnelles et confidentielles quand tu utilises un outil."
]
transferer = "La méthode s’applique aux chiffres, citations, résumés, images et conseils produits par un outil d’IA. Pour une décision médicale, juridique, financière ou professionnelle importante, demande un avis humain qualifié et consulte des sources adaptées."
revue_le = "2026-10-07"
intervalle_revue_jours = 180

