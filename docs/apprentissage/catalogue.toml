[[fiche]]
id = "numerique-verifier-demande"
titre = "Vérifier une demande urgente ou inhabituelle"
matiere = "Numérique et sécurité"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 2
minutes = 10
resume = "Faire une pause et vérifier l’identité, le contexte et la demande par un canal indépendant."
objectif = "Réagir à un courriel, SMS, appel, QR code ou message privé sans céder à la pression."
situation = "Un appelant qui dit être de ta banque affirme qu’un paiement suspect vient d’avoir lieu. Il demande ton code reçu par SMS et te presse de transférer l’argent vers un « compte sécurisé »."
analogie_titre = "Comme rappeler l’accueil avec un numéro déjà vérifié"
analogie = "Dans un immeuble, on n’ouvre pas uniquement parce qu’une voix à l’interphone dit connaître le gardien. On peut raccrocher puis appeler l’accueil au numéro déjà affiché dans ses contacts fiables. Pour une demande numérique, choisis toi-même le canal de vérification."
limite_analogie = "Un faux appel peut utiliser un numéro affiché qui semble officiel, des informations personnelles vraies ou une voix familière. Même un message bien écrit peut être frauduleux. L’apparence et le numéro ne suffisent pas à authentifier une demande."
notions = [
  "Hameçonnage — message, appel ou page qui cherche à obtenir des données, de l’argent ou l’accès à un compte.",
  "Usurpation — personne qui se fait passer pour un proche, une banque, une administration, un fournisseur ou un service d’assistance.",
  "Canal indépendant — numéro, application, site ou contact connu, choisi sans reprendre ceux fournis par la sollicitation douteuse."
]
demarche = [
  "Mets fin à l’échange sans scanner le QR code, ouvrir le lien ni installer de logiciel à la demande de l’inconnu.",
  "Vérifie l’identité par une coordonnée fiable déjà enregistrée : numéro au dos de la carte bancaire, application habituelle, site saisi toi-même ou proche joint sur son ancien numéro.",
  "Vérifie le contexte : attendais-tu cet appel, ce colis, cette facture ou cette offre ? Confirme auprès de l’organisme ou du fournisseur à partir d’un canal distinct.",
  "Examine la demande : ne donne jamais sous pression un mot de passe, un code de validation ou l’accès à distance ; une banque ne demande pas de déplacer l’argent vers un compte sûr.",
  "Si tu ne peux pas vérifier, ne décide pas pendant l’échange. Note les faits et demande l’avis d’un proche ou d’un service officiel."
]
exercice = "Un faux support technique t’appelle après une alerte sur ton ordinateur. Il demande d’installer un outil et de partager ton écran. Quelle suite d’actions est la plus sûre ?"
aide = "Le numéro affiché et le vocabulaire professionnel ne sont pas des preuves. Cherche un moyen de contacter le fabricant ou le service depuis un document ou un site déjà connu."
correction = [
  "Ne donne pas l’accès à distance, les mots de passe ou les codes ; ne paie pas pendant l’appel.",
  "Raccroche, puis contacte le service par un canal que tu connaissais déjà. Une alerte peut aussi être vérifiée en ouvrant toi-même l’application ou le site officiel.",
  "Si un accès a déjà été donné, déconnecte l’appareil d’Internet si c’est possible sans risque, conserve les éléments utiles et demande rapidement de l’aide à une personne compétente ou à 17Cyber."
]
a_retenir = [
  "Une sollicitation peut arriver par courriel, SMS, téléphone, QR code, réseau social ou petite annonce.",
  "Le prétexte peut être une urgence familiale ou professionnelle, un faux conseiller ou support, une livraison, un achat, un emploi, un placement ou une administration.",
  "Les données volées, les messages très soignés et les contenus générés peuvent rendre l’imitation plus personnalisée ; toutes les fraudes ne reposent pas sur l’IA.",
  "Vérifie toujours l’identité, le contexte et la demande avec un moyen indépendant avant de cliquer, transmettre, payer ou installer."
]
transferer = "Cette méthode vaut même si la technique change ou si l’appelant connaît déjà ton nom et des détails exacts. La liste de prétextes est illustrative, jamais complète : les vérifications par canal connu restent utiles pour les fraudes actuelles et futures."
revue_le = "2026-10-07"
intervalle_revue_jours = 90

