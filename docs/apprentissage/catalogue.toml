[[fiche]]
id = "numerique-formuler-recherche"
titre = "Formuler une recherche sur le Web"
matiere = "Numérique et information"
matiere_id = "numerique"
domaine = "numerique-ia"
niveau = 1
horizon_contenu = "Premiers repères pour choisir des mots de recherche et affiner une requête ; aucun moteur précis n’est privilégié"
statut_editorial = "Prototype à relire"
note_statut_editorial = "Brouillon de littératie numérique sur la formulation d’une recherche. Faire vérifier les conseils pour plusieurs moteurs et leurs évolutions par une personne compétente en information et en numérique. Les syntaxes de recherche varient ; la fiche ne demande aucune donnée personnelle et ne promet pas un classement neutre ou complet des résultats. Sources, droits, accessibilité et essais apprenants restent à contrôler."
minutes = 8
resume = "Choisir quelques mots utiles, observer les résultats et préciser la requête sans partager d’information personnelle."
objectif = "Transformer une question fictive en requête de recherche courte, puis l’affiner à partir des résultats obtenus."
situation = "Tu cherches des horaires fictifs pour un atelier gratuit de réparation de vélos dans une ville-exemple. Quels mots décrivent l’activité et l’information recherchée ? Comment éviter d’ajouter ton adresse ou ton nom ?"
analogie_titre = "Comme demander un renseignement avec les mots importants"
analogie = "Au guichet, nommer l’activité, le lieu et l’information voulue aide à orienter la question. Une requête Web utilise aussi des termes qui décrivent le besoin, puis peut être affinée selon les résultats."
limite_analogie = "Un moteur de recherche ne pose pas de questions comme une personne et ses résultats dépendent de ses outils, de son index et parfois de réglages. La première page n’est pas forcément la meilleure réponse ni une liste complète."
notions = [
  "Requête — mots ou expression saisis pour chercher une information.",
  "Mot-clé — terme important qui décrit le sujet, le lieu ou le type de réponse recherché.",
  "Affiner — ajouter ou remplacer des termes pour rendre une recherche plus précise.",
  "Résultat — page, document ou autre élément proposé par un moteur ; sa présence ne garantit pas sa pertinence.",
  "Donnée personnelle — information qui se rapporte à une personne ; elle n’est généralement pas nécessaire pour formuler une recherche d’information générale."
]
demarche = [
  "Écris la question en langage courant pour clarifier ce que tu veux savoir.",
  "Garde deux ou trois mots qui décrivent le sujet et le type d’information attendu, par exemple activité, horaires, atelier.",
  "Ajoute un lieu seulement s’il est nécessaire et ne saisis pas ton nom, ton adresse personnelle, un code ou une donnée sensible.",
  "Observe les premiers résultats : leur titre, leur émetteur, leur date et leur portée.",
  "Si la requête est trop large, ajoute un terme précis ; si elle ne donne rien, remplace un mot ou enlève une précision.",
  "Vérifie l’information sur la page d’origine et auprès d’une source adaptée ; la position dans les résultats ne prouve pas la qualité."
]
exercice = "Pour l’atelier fictif de réparation de vélos, propose une requête de quatre à six mots qui cherche les horaires et le lieu. Puis indique un mot que tu pourrais ajouter pour préciser la recherche et une donnée personnelle à ne pas inclure."
aide = "Tu peux commencer par « atelier réparation vélo horaires » puis ajouter une ville fictive ou le nom d’un organisme si cette précision est utile."
correction = [
  "Requête possible : « atelier réparation vélo horaires ville-exemple ».",
  "On peut préciser « gratuit » si ce critère est utile, ou le nom d’un lieu public si on le connaît.",
  "Il n’est pas nécessaire d’ajouter un nom, une adresse personnelle, un numéro de téléphone ou un code secret. Il faut ensuite vérifier la date et l’émetteur de la page trouvée."
]
a_retenir = [
  "Une requête claire décrit le besoin avec quelques mots-clés utiles.",
  "On peut l’affiner en ajoutant, remplaçant ou retirant un terme.",
  "L’ordre des résultats ne prouve ni leur exactitude ni leur indépendance.",
  "Ne partage pas une donnée personnelle quand elle n’est pas nécessaire à la recherche.",
  "Les opérateurs et filtres changent selon les moteurs ; cette fiche ne promet pas une syntaxe universelle."
]
transferer = "Cette démarche peut aider à chercher un horaire, une ressource de cours ou une page institutionnelle. Pour une question importante, vérifie la page d’origine, sa date, son territoire et son émetteur au lieu de reprendre seulement l’extrait affiché dans les résultats."
revue_le = "2026-10-11"
intervalle_revue_jours = 90

