<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="titre-embleme">
  <title id="titre-embleme">Emblème du M.R.S.C. : quatre arcs de couleur — vert, or, ardoise et encre — qui s'ouvrent sur un joyau de verre facetté, au-dessus du sigle M.R.S.C.</title>
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset="0.68" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#e2ebf6"/>
    </linearGradient>
    <radialGradient id="lueur-verte" cx="0.18" cy="0.08" r="0.6">
      <stop offset="0" stop-color="#8cc45a" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#8cc45a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lueur-bleue" cx="0.84" cy="0.16" r="0.6">
      <stop offset="0" stop-color="#2958a2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2958a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc-vert" x1="0.1" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#4d8426"/>
      <stop offset="0.5" stop-color="#7cba46"/>
      <stop offset="1" stop-color="#bfe494"/>
    </linearGradient>
    <linearGradient id="arc-or" x1="0.1" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#bd7a11"/>
      <stop offset="0.5" stop-color="#e7a126"/>
      <stop offset="1" stop-color="#fad892"/>
    </linearGradient>
    <linearGradient id="arc-ardoise" x1="0.1" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#6d7987"/>
      <stop offset="0.5" stop-color="#98a4b2"/>
      <stop offset="1" stop-color="#d7dee6"/>
    </linearGradient>
    <linearGradient id="arc-encre" x1="0.1" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#1b2128"/>
      <stop offset="0.5" stop-color="#333b45"/>
      <stop offset="1" stop-color="#6d7783"/>
    </linearGradient>
    <linearGradient id="joyau-haut" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#b6d8ec"/>
    </linearGradient>
    <linearGradient id="joyau-bas" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#9ec8e2"/>
      <stop offset="1" stop-color="#5b8fb7"/>
    </linearGradient>
    <linearGradient id="sigle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39424e"/>
      <stop offset="0.42" stop-color="#1e242c"/>
      <stop offset="0.58" stop-color="#2b333d"/>
      <stop offset="0.78" stop-color="#4a5561"/>
      <stop offset="1" stop-color="#171d24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" fill="url(#ciel)"/>
  <rect width="1200" height="660" fill="url(#lueur-verte)"/>
  <rect width="1200" height="660" fill="url(#lueur-bleue)"/>

  <g transform="translate(85 -6)">
    <g fill="none" stroke-linecap="round">
      <path d="M 210.1 351.6 A 240 240 0 0 1 639.1 212.2" stroke="url(#arc-vert)" stroke-width="24"/>
      <path d="M 250.1 353.0 A 200 200 0 0 1 607.6 236.9" stroke="url(#arc-or)" stroke-width="24"/>
      <path d="M 290.1 354.4 A 160 160 0 0 1 576.1 261.5" stroke="url(#arc-ardoise)" stroke-width="24"/>
      <path d="M 330.1 355.8 A 120 120 0 0 1 544.6 286.1" stroke="url(#arc-encre)" stroke-width="24"/>
    </g>

    <ellipse cx="678" cy="398" rx="118" ry="17" fill="#2958a2" opacity="0.08"/>
    <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.6" stroke-linejoin="round">
      <polygon points="680,180 830,286 680,300" fill="url(#joyau-haut)"/>
      <polygon points="680,180 680,300 540,286" fill="#dcefFA"/>
      <polygon points="530,286 680,300 660,390" fill="url(#joyau-bas)"/>
      <polygon points="680,300 830,286 700,392" fill="#8fbdd9"/>
      <polygon points="680,300 700,392 660,390" fill="#6ea3c8"/>
      <polygon points="530,286 660,390 600,360" fill="#a8cfe7" opacity="0.75"/>
      <polygon points="830,286 700,392 790,356" fill="#7fb0d3" opacity="0.7"/>
    </g>
    <path d="M 530 286 L 680 180 L 830 286" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.6"/>
    <path d="M 530 286 L 660 390 L 700 392 L 830 286" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M 680 180 L 680 300" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4"/>
  </g>

  <text x="600" y="604" text-anchor="middle" fill="url(#sigle)" font-family="Georgia, 'Times New Roman', serif" font-size="176" font-weight="700" letter-spacing="10">M.R.S.C</text>
</svg>
